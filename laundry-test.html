<script type="module">
import * as THREE from 'three';
import { HDRLoader }                from './vendor/three/examples/jsm/loaders/HDRLoader.js';
import { RoundedBoxGeometry }       from './vendor/three/examples/jsm/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from './vendor/three/examples/jsm/lights/RectAreaLightUniformsLib.js';
import { EffectComposer }           from './vendor/three/examples/jsm/postprocessing/EffectComposer.js';
import { RenderPass }               from './vendor/three/examples/jsm/postprocessing/RenderPass.js';
import { UnrealBloomPass }          from './vendor/three/examples/jsm/postprocessing/UnrealBloomPass.js';
import { OutputPass }               from './vendor/three/examples/jsm/postprocessing/OutputPass.js';
RectAreaLightUniformsLib.init();

/* ====================================================================== */
/* Renderer + Scene + Camera                                              */
/* ====================================================================== */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.68;        /* Kumamoto 11 AM clear sky — bright but contained */
renderer.outputColorSpace = THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0e10);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.05, 50);
camera.position.set(2.40, 1.55, 2.30);
camera.lookAt(0.90, 0.85, 1.50);

/* ====================================================================== */
/* Inline OrbitControls — Mac-trackpad phantom-zoom guard                 */
/* ====================================================================== */
class OrbitControls {
  constructor(cam, el) {
    this.cam = cam; this.el = el;
    this.target = new THREE.Vector3(0.90, 0.85, 1.50);
    // radius=0 makes the constructor's _update() recompute spherical from the
    // current camera.position - target offset, preserving the camera.position
    // set above. With the default radius=1, _update() would overwrite
    // camera.position with target + (0,1,0).
    this.spherical = new THREE.Spherical(0, 0, 0);
    this.minDistance = 0.40; this.maxDistance = 8.0;
    this.minPolar = 0.10; this.maxPolar = Math.PI * 0.49;
    this._dragging = false; this._lastMouseupAt = 0;
    this._x0 = 0; this._y0 = 0;
    this._update();
    el.addEventListener('mousedown', e => this._down(e));
    el.addEventListener('wheel', e => this._wheel(e), { passive: false });
    el.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('mousemove', e => this._move(e));
    window.addEventListener('mouseup', () => this._up());
    /* Touch */
    el.addEventListener('touchstart', e => this._tdown(e), { passive: false });
    el.addEventListener('touchmove',  e => this._tmove(e), { passive: false });
    el.addEventListener('touchend',   () => this._tup());
  }
  _down(e) { this._dragging = true; this._x0 = e.clientX; this._y0 = e.clientY; }
  _up()    { this._dragging = false; this._lastMouseupAt = performance.now(); }
  _move(e) {
    if (!this._dragging) return;
    const dx = e.clientX - this._x0, dy = e.clientY - this._y0;
    this._x0 = e.clientX; this._y0 = e.clientY;
    this.spherical.theta -= dx * 0.005;
    this.spherical.phi   -= dy * 0.005;
    this.spherical.phi = Math.max(this.minPolar, Math.min(this.maxPolar, this.spherical.phi));
    this._update();
  }
  _wheel(e) {
    /* Block wheel during drag and 400 ms post-mouseup (Mac trackpad guard) */
    if (this._dragging) return;
    if (performance.now() - this._lastMouseupAt < 400) return;
    e.preventDefault();
    const f = Math.exp(e.deltaY * 0.0015);
    this.spherical.radius *= f;
    this.spherical.radius = Math.max(this.minDistance, Math.min(this.maxDistance, this.spherical.radius));
    this._update();
  }
  _tdown(e) { if (e.touches.length === 1) { this._dragging = true; this._x0 = e.touches[0].clientX; this._y0 = e.touches[0].clientY; } }
  _tmove(e) {
    if (!this._dragging || e.touches.length !== 1) return;
    e.preventDefault();
    const dx = e.touches[0].clientX - this._x0, dy = e.touches[0].clientY - this._y0;
    this._x0 = e.touches[0].clientX; this._y0 = e.touches[0].clientY;
    this.spherical.theta -= dx * 0.006;
    this.spherical.phi   -= dy * 0.006;
    this.spherical.phi = Math.max(this.minPolar, Math.min(this.maxPolar, this.spherical.phi));
    this._update();
  }
  _tup() { this._dragging = false; this._lastMouseupAt = performance.now(); }
  _update() {
    const offset = new THREE.Vector3().subVectors(this.cam.position, this.target);
    if (this.spherical.radius === 0) {
      this.spherical.setFromVector3(offset);
    } else {
      offset.setFromSpherical(this.spherical);
    }
    this.cam.position.copy(this.target).add(offset);
    this.cam.lookAt(this.target);
  }
}
const controls = new OrbitControls(camera, renderer.domElement);
if (document.documentElement.classList.contains('journey-mode')) {
  // Entry view (matches qa-34): stand at SW doorway corner at eye height,
  // gaze toward NE corner where the washer + frosted window sit.
  // Slight downward tilt (target y < camera y) so the full washer reads.
  camera.position.set(0.45, 1.55, 0.45);
  controls.target.set(1.50, 1.30, 2.40);
  controls.spherical.radius = 0;
  controls._update();
}

/* ====================================================================== */
/* HDRI for IBL — kloppenheim puresky, filtered through PMREM for          */
/* sharper / mip-mapped reflections (matches kitchen-test setup).         */
/* ====================================================================== */
const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();

new HDRLoader().load('ozu-test/hdri/kloppenheim_06_puresky_2k.hdr', (hdr) => {
  const envMap = pmrem.fromEquirectangular(hdr).texture;
  scene.environment = envMap;
  /* Kumamoto, sunny spring, 11:00 AM JST — sun azimuth ≈ 160° (SSE),
   * elevation ≈ 60°. Window is on +Z (north wall). Sun is on the OPPOSITE
   * side of the building — never enters this window. We rotate the HDRI
   * so its bright clear-sky zone sits over the south-southeast direction
   * (sun source), and the cooler diffuse sky portion faces the north
   * window. envIntensity slightly lower than before — the washer was
   * picking up too much IBL specular at 0.65. */
  scene.environmentIntensity = 0.60;
  /* Yaw so the HDRI sun direction lands at world-space azimuth 160°.
   * kloppenheim_06's sun sits roughly at equirect U≈0.65; a yaw of
   * +0.8 rad (about +46°) brings it to the SSE direction. */
  scene.environmentRotation = new THREE.Euler(0, 0.80, 0);
  hdr.dispose();
});

/* ====================================================================== */
/* Lights — match kitchen-test patterns: hemi fill, big window RectArea + */
/* directional sun for shadows, multiple ceiling downlights, emissive    */
/* sky proxy outside the window.                                          */
/* ====================================================================== */

/* Hemisphere — Kumamoto 11 AM clear-spring sky bias: COOL pale-blue sky
 * (clear day), warm pine-floor bounce from below. Strong enough that the
 * room interior reads bright without the window light. */
scene.add(new THREE.HemisphereLight(0xc8d6e8, 0xa89878, 0.55));

/* ====================================================================== */
/* Texture helpers                                                         */
/* ====================================================================== */
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}

/* Rounded box — wraps RoundedBoxGeometry with a sensible default radius
   that scales with the smallest dimension so we never over-round small parts. */
function roundedBox(w, h, d, radiusOpt = null, segments = 4) {
  const minDim = Math.min(w, h, d);
  const r = radiusOpt !== null
    ? Math.min(radiusOpt, minDim * 0.49)
    : Math.min(0.004, minDim * 0.30);
  return new RoundedBoxGeometry(w, h, d, segments, r);
}

function texFromCanvas(canvas, opts = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  if (opts.repeat) t.repeat.set(opts.repeat[0], opts.repeat[1]);
  t.anisotropy = MAX_ANISO;
  return t;
}

function cloneTex(tex, rx, ry, ox = 0, oy = 0) {
  const c = tex.clone();
  c.needsUpdate = true;
  c.repeat.set(rx, ry);
  c.offset.set(ox, oy);
  c.anisotropy = MAX_ANISO;
  return c;
}

/* === Poly Haven photo PBR — reuse kitchen-test's downloaded textures === */
const phLoader = new THREE.TextureLoader();
function phLoad(path, sRGB) {
  const t = phLoader.load(path);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = sRGB ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  t.anisotropy = MAX_ANISO;
  return t;
}
const phWoodDiff = phLoad('kitchen-test/textures/laminate_floor_02_diff.jpg',  true);
const phWoodNor  = phLoad('kitchen-test/textures/laminate_floor_02_nor_gl.jpg', false);
const phWoodArm  = phLoad('kitchen-test/textures/laminate_floor_02_arm.jpg',    false);

/* Sobel-based normal generator from a luminance canvas */
function deriveNormalFromCanvas(canvas, strength = 1.0) {
  const w = canvas.width, h = canvas.height;
  const ctx2 = canvas.getContext('2d');
  const src = ctx2.getImageData(0, 0, w, h).data;
  const dst = new Uint8ClampedArray(w * h * 4);
  const lum = (i) => 0.299 * src[i] + 0.587 * src[i + 1] + 0.114 * src[i + 2];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const xL = (x - 1 + w) % w, xR = (x + 1) % w;
      const yU = (y - 1 + h) % h, yD = (y + 1) % h;
      const dx = (lum((y * w + xR) * 4) - lum((y * w + xL) * 4)) * strength;
      const dy = (lum((yD * w + x) * 4) - lum((yU * w + x) * 4)) * strength;
      const nx = -dx, ny = -dy, nz = 255;
      const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
      dst[i]     = (nx / len) * 127 + 128;
      dst[i + 1] = (ny / len) * 127 + 128;
      dst[i + 2] = (nz / len) * 127 + 128;
      dst[i + 3] = 255;
    }
  }
  const out = makeCanvas(w, h);
  out.getContext('2d').putImageData(new ImageData(dst, w, h), 0, 0);
  const t = new THREE.CanvasTexture(out);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.NoColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}

/* Taupe paint — warm grey-brown, faint stipple */
const paintCanvas = (() => {
  const c = makeCanvas(256, 256);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#9b948c';
  ctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1500; i++) {
    const x = Math.random() * 256, y = Math.random() * 256;
    const v = 140 + Math.random() * 30;
    ctx.fillStyle = `rgba(${v},${v - 6},${v - 12},0.06)`;
    ctx.fillRect(x, y, 1, 1);
  }
  return c;
})();
const paintNormalTex = deriveNormalFromCanvas(paintCanvas, 0.6);

/* === Drum interior — hexagonal hole pattern derived as a normal map.
   Real drum-type washer drums have ~3 mm punched holes in a hex grid; baking
   a normal-only representation lets light catch every hole without geometry. */
const drumHoleCanvas = (() => {
  const c = makeCanvas(512, 512);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#aab0b8';        /* base brushed-stainless grey */
  ctx.fillRect(0, 0, 512, 512);
  const r = 9;                       /* hole radius (px) */
  const dx = 26, dy = 22;            /* hex grid spacing */
  for (let row = 0; row < 512 / dy + 1; row++) {
    const offset = (row % 2) * (dx / 2);
    for (let col = 0; col < 512 / dx + 1; col++) {
      const x = col * dx + offset;
      const y = row * dy;
      /* dark spot = "hole" → normal map will read as a deep dimple */
      const grad = ctx.createRadialGradient(x, y, 0, x, y, r);
      grad.addColorStop(0,   '#202428');
      grad.addColorStop(0.7, '#404750');
      grad.addColorStop(1,   '#aab0b8');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    }
  }
  return c;
})();
const drumHoleNormalTex = deriveNormalFromCanvas(drumHoleCanvas, 2.0);

/* === SHARP logo — small canvas-rendered text, blue on transparent === */
const sharpLogoCanvas = (() => {
  const c = makeCanvas(256, 64);
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, 256, 64);
  ctx.fillStyle = '#1f3da6';        /* Sharp brand blue */
  ctx.font = 'bold 38px -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('SHARP', 128, 34);
  return c;
})();

/* Brick — cool grey-white blocks with white mortar */
const brickCanvas = (() => {
  const c = makeCanvas(512, 512);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#e3e1dc';      /* mortar */
  ctx.fillRect(0, 0, 512, 512);
  const bw = 64, bh = 28, mortar = 4;
  for (let row = 0; row < 512 / bh; row++) {
    const offset = (row % 2) * (bw / 2);
    for (let col = -1; col <= 512 / bw; col++) {
      const x = col * bw + offset;
      const y = row * bh;
      const tone = 138 + Math.floor(Math.random() * 30);
      const r = tone, g = tone - 3, b = tone - 8;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(x + mortar / 2, y + mortar / 2, bw - mortar, bh - mortar);
      /* Speckle on each brick */
      for (let i = 0; i < 14; i++) {
        const sx = x + mortar / 2 + Math.random() * (bw - mortar);
        const sy = y + mortar / 2 + Math.random() * (bh - mortar);
        const v  = tone - 20 + Math.random() * 30;
        ctx.fillStyle = `rgba(${v},${v - 4},${v - 8},0.4)`;
        ctx.fillRect(sx, sy, 1, 1);
      }
    }
  }
  return c;
})();
const brickNormalTex = deriveNormalFromCanvas(brickCanvas, 1.5);

/* (Floor uses Poly Haven photo PBR — see phWoodDiff/Nor/Arm above.) */

/* ====================================================================== */
/* Materials                                                               */
/* ====================================================================== */
const matWall = new THREE.MeshPhysicalMaterial({
  map: texFromCanvas(paintCanvas, { repeat: [2, 2] }),
  normalMap: cloneTex(paintNormalTex, 2, 2),
  normalScale: new THREE.Vector2(0.20, 0.20),
  roughness: 0.95, metalness: 0.0, envMapIntensity: 0.35,
});

const matBrick = new THREE.MeshPhysicalMaterial({
  map: texFromCanvas(brickCanvas, { repeat: [2.0, 4.0] }),
  normalMap: cloneTex(brickNormalTex, 2.0, 4.0),
  normalScale: new THREE.Vector2(0.5, 0.5),
  roughness: 0.85, metalness: 0.05, envMapIntensity: 0.4,
});

/* Floor — Poly Haven laminate_floor_02 (light oak), full PBR with ARM packed */
const matFloor = (() => {
  const map    = cloneTex(phWoodDiff, 2.0, 2.5);
  const normal = cloneTex(phWoodNor,  2.0, 2.5);
  const arm    = cloneTex(phWoodArm,  2.0, 2.5);
  return new THREE.MeshPhysicalMaterial({
    map, normalMap: normal,
    normalScale: new THREE.Vector2(0.5, 0.5),
    roughnessMap: arm, metalnessMap: arm,
    color: 0xffffff,
    roughness: 1.0, metalness: 1.0,
    clearcoat: 0.10, clearcoatRoughness: 0.50,
    envMapIntensity: 0.50,
  });
})();

const matCeiling = new THREE.MeshStandardMaterial({
  color: 0xeeeae3, roughness: 0.92, metalness: 0.0,
});

/* === Per-surface LIGHTMAPS baked on A6000 GPU 1 (Cycles "Combined":
   Direct + Indirect + Diffuse + AO). These encode the full path-traced
   lighting solution including color bleeding from the brick wall onto
   the floor and walls — replaces the prior AO maps (lightmap subsumes AO).
   See laundry-test/bake/bake_room_lightmap.py. */
const aoLoader = new THREE.TextureLoader();

function loadLightmap(slug, opts = {}) {
  const tex = aoLoader.load(`laundry-test/textures/lightmap/${slug}.png`);
  tex.colorSpace = THREE.SRGBColorSpace;     /* color, NOT data */
  tex.channel = opts.channel ?? 0;            /* default uv0; pass 1 for custom uv1 overrides */
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.anisotropy = MAX_ANISO;
  const rx = opts.flipU ? -1 : 1;
  const ry = opts.flipV ? -1 : 1;
  tex.repeat.set(rx, ry);
  tex.offset.set(opts.flipU ? 1 : 0, opts.flipV ? 1 : 0);
  return tex;
}

/* Floor — PlaneGeometry rotation reverses UV.y vs the bake.
   With a lightmap the runtime envMap matters less — pre-baked GI dominates. */
matFloor.lightMap = loadLightmap('floor', { flipV: true });
matFloor.lightMapIntensity = 1.0;
matFloor.envMapIntensity = 0.20;       /* dampen IBL — lightmap is doing the work */
matFloor.needsUpdate = true;

/* Door-wall (south) */
const matDoorWall = matWall.clone();
matDoorWall.lightMap = loadLightmap('door_wall');
matDoorWall.lightMapIntensity = 1.0;
matDoorWall.envMapIntensity = 0.15;
matDoorWall.needsUpdate = true;

/* Bath-wall (west) */
const matBathWall = matWall.clone();
matBathWall.lightMap = loadLightmap('bath_wall', { flipU: true });
matBathWall.lightMapIntensity = 1.0;
matBathWall.envMapIntensity = 0.15;
matBathWall.needsUpdate = true;

/* Vanity-wall (east, brick) */
const matVanityWall = matBrick.clone();
matVanityWall.lightMap = loadLightmap('vanity_wall', { flipU: true });
matVanityWall.lightMapIntensity = 1.0;
matVanityWall.envMapIntensity = 0.20;
matVanityWall.needsUpdate = true;

/* Ceiling — lightmap on the -Y face only (the only one visible from inside).
   Bake mapping: UV(0,0)=(x=0, z=0), UV(1,1)=(x=ROOM_W, z=ROOM_D).
   Uses channel 1 so the per-mesh uv1 override is what gets sampled. */
const matCeilingLight = matCeiling.clone();
matCeilingLight.lightMap = loadLightmap('ceiling', { channel: 1 });
matCeilingLight.lightMapIntensity = 1.0;
matCeilingLight.needsUpdate = true;

/* Window-wall — single lightmap, four box fragments share it via per-mesh
   uv1 override. Bake mapping: UV.U=(ROOM_W-x)/ROOM_W (mirrored X),
   UV.V=y/ROOM_H. The window cutout sits at U[(ROOM_W-WIN_X1)/ROOM_W .. (ROOM_W-WIN_X0)/ROOM_W],
   V[WIN_Y0/ROOM_H .. WIN_Y1/ROOM_H] and is rendered black in the bake.
   channel: 1 routes lightMap sampling through uv1 (set by setLightmapUV1). */
const matWindowWall = matWall.clone();
matWindowWall.lightMap = loadLightmap('window_wall', { channel: 1 });
matWindowWall.lightMapIntensity = 1.0;
matWindowWall.envMapIntensity = 0.15;
matWindowWall.needsUpdate = true;

/* Washing-machine palette — Kumamoto 11 AM rule: cool diffuse window light

 * cabinet should read MATTE, slightly cool, NOT highlight-blown. Chrome

const matWasherWhite = new THREE.MeshPhysicalMaterial({

  clearcoat: 0.25, clearcoatRoughness: 0.30,
  envMapIntensity: 0.35,
});
const matWasherWhiteSoft = new THREE.MeshPhysicalMaterial({

  envMapIntensity: 0.25,
});
const matWasherChrome = new THREE.MeshPhysicalMaterial({
  color: 0xc8ccd2, roughness: 0.30, metalness: 1.0,
  clearcoat: 0.10, clearcoatRoughness: 0.25,
  envMapIntensity: 0.45,
});
const matWasherDoorGlass = new THREE.MeshPhysicalMaterial({
  color: 0x1d2024, roughness: 0.10, metalness: 0.10,
  transmission: 0.30, ior: 1.50, thickness: 0.02,
  clearcoat: 1.0, clearcoatRoughness: 0.04,
  envMapIntensity: 0.9,

const matWasherDrumDark = new THREE.MeshPhysicalMaterial({
  color: 0x36393f, roughness: 0.45, metalness: 0.85,
  /* Procedural hex-hole normal map — gives the perforated drum look without geometry */
  normalMap: cloneTex(drumHoleNormalTex, 6, 2),
  normalScale: new THREE.Vector2(0.8, 0.8),

/* SHARP logo material — uses canvas-rendered text texture with alpha */
const matWasherLogoText = new THREE.MeshBasicMaterial({
  map: texFromCanvas(sharpLogoCanvas, { repeat: [1, 1] }),
  transparent: true, alphaTest: 0.4,
});
const matWasherAgitator = new THREE.MeshPhysicalMaterial({
  color: 0x3a3d42, roughness: 0.50, metalness: 0.35,
  clearcoat: 0.25, clearcoatRoughness: 0.20,
});
const matWasherBlack = new THREE.MeshPhysicalMaterial({
  color: 0x0e0f12, roughness: 0.45, metalness: 0.25,
  clearcoat: 0.5, clearcoatRoughness: 0.20,
});
const matWasherLogo = new THREE.MeshStandardMaterial({
  color: 0x1f3da6, roughness: 0.60, metalness: 0.0,
});

/* ====================================================================== */
/* Room — 1.80 W (E-W) × 2.70 D (N-S) × 2.50 H                            */
/* ====================================================================== */
const ROOM_W = 1.80;
const ROOM_D = 2.70;
const ROOM_H = 2.50;
const WALL_T = 0.05;

/* Window on window-wall (north). Per laundry-a-1.webp the actual window is the
 * 横すべり 06003 (600 × 300 mm) called out in room-map.md — small horizontal
 * landscape pane, sill at FL+1500, head at FL+1800, centred on the wall.
 *
 * The defining visual feature in the photo is the DEEP reveal: the window sits
 * back inside a 10 cm-deep white-painted pocket so you see four white inner
 * faces (sill / head / jambs) framing the glass, plus a thin painted casing
 * sitting ~1.5 cm proud of the inside wall surface. We model that by
 * thickening the north wall locally (WIN_DEPTH) — the lightmap UV1 override
 * stays correct because the -Z face position is unchanged. */
const WIN_X0 = 0.60, WIN_X1 = 1.20;
const WIN_Y0 = 1.50, WIN_Y1 = 1.80;
const WIN_DEPTH = 0.10;

function wallBox(x0, x1, y0, y1, z0, z1, mat) {
  const m = new THREE.Mesh(
    new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0),
    mat
  );
  m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}

/* Override a BoxGeometry's uv1 channel so a single face — picked by its
   outward normal — receives the lightmap with custom world→UV mapping.
   All other face vertices clamp to (-1,-1) so the texture wraps to its
   edge (ClampToEdgeWrapping), which contains the wall's diffuse colour. */
function setLightmapUV1(mesh, faceAxis, faceSign, worldToUv) {
  const pos = mesh.geometry.attributes.position;
  const norm = mesh.geometry.attributes.normal;
  const uv1 = new Float32Array(pos.count * 2);
  const cx = mesh.position.x, cy = mesh.position.y, cz = mesh.position.z;
  for (let i = 0; i < pos.count; i++) {
    const n = (faceAxis === 'x' ? norm.getX(i)
             : faceAxis === 'y' ? norm.getY(i)
             :                    norm.getZ(i));
    if (n * faceSign > 0.5) {
      const wx = pos.getX(i) + cx;
      const wy = pos.getY(i) + cy;
      const wz = pos.getZ(i) + cz;
      const [u, v] = worldToUv(wx, wy, wz);
      uv1[i * 2]     = u;
      uv1[i * 2 + 1] = v;
    } else {
      uv1[i * 2]     = -1;
      uv1[i * 2 + 1] = -1;
    }
  }
  mesh.geometry.setAttribute('uv1', new THREE.BufferAttribute(uv1, 2));
}

/* Floor */
{
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(ROOM_W, ROOM_D + 0.4),
    matFloor
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(ROOM_W / 2, 0, ROOM_D / 2 - 0.2);
  floor.receiveShadow = true;
  scene.add(floor);
}

/* Ceiling — lightmap on the -Y face (visible from the room) */
{
  const ceil = new THREE.Mesh(
    new THREE.BoxGeometry(ROOM_W + WALL_T * 2, WALL_T, ROOM_D),
    matCeilingLight
  );
  ceil.position.set(ROOM_W / 2, ROOM_H + WALL_T / 2, ROOM_D / 2);
  ceil.receiveShadow = true; ceil.castShadow = true;
  setLightmapUV1(ceil, 'y', -1, (x, y, z) => [x / ROOM_W, z / ROOM_D]);
  scene.add(ceil);
}

/* Bath-wall (west) — taupe paint with baked AO */
scene.add(wallBox(-WALL_T, 0, 0, ROOM_H, 0, ROOM_D, matBathWall));

/* Door-wall (south) — taupe paint with baked AO */
scene.add(wallBox(0, ROOM_W, 0, ROOM_H, -WALL_T, 0, matDoorWall));

/* Vanity-wall (east) — BRICK accent with baked AO */
scene.add(wallBox(ROOM_W, ROOM_W + WALL_T, 0, ROOM_H, 0, ROOM_D, matVanityWall));

/* Window-wall (north, z = ROOM_D..ROOM_D+WIN_DEPTH) — 4 fragments around the
   cutout, all sharing matWindowWall + window_wall.png lightmap. Per-mesh
   uv1 override maps each fragment's -Z face to its sub-region of the bake.
   The wall is locally 0.10 m thick here so the window opening has a real
   recess; the lightmap UVs only care about the -Z face at z=ROOM_D so the
   thicker wall doesn't break the bake mapping. */
const NX0 = 0, NX1 = ROOM_W;
const NZ0 = ROOM_D, NZ1 = ROOM_D + WIN_DEPTH;
const winWallUv = (x, y, z) => [(ROOM_W - x) / ROOM_W, y / ROOM_H];
const winFragments = [
  wallBox(NX0,    NX1,    0,      WIN_Y0,  NZ0, NZ1, matWindowWall),  /* below */
  wallBox(NX0,    NX1,    WIN_Y1, ROOM_H,  NZ0, NZ1, matWindowWall),  /* above */
  wallBox(NX0,    WIN_X0, WIN_Y0, WIN_Y1,  NZ0, NZ1, matWindowWall),  /* left jamb */
  wallBox(WIN_X1, NX1,    WIN_Y0, WIN_Y1,  NZ0, NZ1, matWindowWall),  /* right jamb */
];
for (const f of winFragments) {
  setLightmapUV1(f, 'z', -1, winWallUv);
  scene.add(f);
}

/* Recessed window: deep white pocket + frosted glass at the back + white
   painted casing trim on the inside wall face (~1.5 cm proud). Per a-1 /
   c-15: pure white reveal, no chrome frame, slight sill ledge.

   Coord layout (z axis goes from inside room toward outside):
     NZ0 = ROOM_D                = inside wall face   (where casing sits)
     NZ0..NZ1 = 10 cm reveal pocket
     NZ1 - 0.005                 = glass plane (just inside outer face)
*/
const matReveal = new THREE.MeshPhysicalMaterial({
  color: 0xfafaf6, roughness: 0.55, metalness: 0,
  clearcoat: 0.25, clearcoatRoughness: 0.40,
  envMapIntensity: 0.55,
});
/* Procedural micro-pebble noise for frosted glass — small low-frequency
 * variation in BOTH roughness (so the surface scatters unevenly the way
 * real 縦すべり obscure-pattern glass does) and normal (faint, so the
 * sky bounce gets perturbed slightly). Codrops 2025-03-13 pattern. */
const frostNoiseCanvas = (() => {
  const c = makeCanvas(256, 256);
  const ctx = c.getContext('2d');
  /* Base mid-grey roughness around 0.78, with low-frequency blobs */
  const img = ctx.createImageData(256, 256);
  for (let y = 0; y < 256; y++) {
    for (let x = 0; x < 256; x++) {
      /* 3-octave value noise via cheap sum of cosines */
      const n =
        0.50 + 0.30 * Math.sin(x * 0.05 + y * 0.07) * Math.cos(x * 0.03 - y * 0.04)
             + 0.18 * Math.sin(x * 0.18 + y * 0.13)
             + 0.08 * Math.sin(x * 0.42 + y * 0.31);
      const v = Math.max(0.55, Math.min(0.92, n));
      const i = (y * 256 + x) * 4;
      const g = Math.round(v * 255);
      img.data[i] = g; img.data[i + 1] = g; img.data[i + 2] = g; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  return c;
})();
const frostRoughnessTex = texFromCanvas(frostNoiseCanvas);
frostRoughnessTex.colorSpace = THREE.NoColorSpace;
const frostNormalTex = deriveNormalFromCanvas(frostNoiseCanvas, 0.10);

const matGlassFrosted = new THREE.MeshPhysicalMaterial({
  /* Frosted bathroom glass — true-frosted band (0.65–0.85) but at the
   * LOW end so the sky behind reads bright through the pane instead of
   * murky. Per Kumamoto 11 AM rule: cool attenuation tint, not warm. */
  color: 0xf4f7fa, roughness: 0.62, metalness: 0,
  roughnessMap: frostRoughnessTex,
  normalMap: frostNormalTex,
  normalScale: new THREE.Vector2(0.06, 0.06),
  transmission: 1.0, ior: 1.50, thickness: 0.005,
  attenuationColor: new THREE.Color(0xeef2f8),
  attenuationDistance: 0.10,
  envMapIntensity: 2.5,
});
{
  const winCx = (WIN_X0 + WIN_X1) / 2;
  const winCy = (WIN_Y0 + WIN_Y1) / 2;
  const winW  = WIN_X1 - WIN_X0;
  const winH  = WIN_Y1 - WIN_Y0;

  /* === Four reveal faces inside the cutout (sill, head, jambs) === */
  /* Sill (faces +Y into the pocket) */
  const sill = new THREE.Mesh(new THREE.PlaneGeometry(winW, WIN_DEPTH), matReveal);
  sill.rotation.x = -Math.PI / 2;
  sill.position.set(winCx, WIN_Y0, (NZ0 + NZ1) / 2);
  sill.receiveShadow = true;
  scene.add(sill);

  /* Head (faces -Y) */
  const head = new THREE.Mesh(new THREE.PlaneGeometry(winW, WIN_DEPTH), matReveal);
  head.rotation.x = Math.PI / 2;
  head.position.set(winCx, WIN_Y1, (NZ0 + NZ1) / 2);
  head.receiveShadow = true;
  scene.add(head);

  /* Left jamb (faces +X) */
  const leftJamb = new THREE.Mesh(new THREE.PlaneGeometry(WIN_DEPTH, winH), matReveal);
  leftJamb.rotation.y = Math.PI / 2;
  leftJamb.position.set(WIN_X0, winCy, (NZ0 + NZ1) / 2);
  leftJamb.receiveShadow = true;
  scene.add(leftJamb);

  /* Right jamb (faces -X) */
  const rightJamb = new THREE.Mesh(new THREE.PlaneGeometry(WIN_DEPTH, winH), matReveal);
  rightJamb.rotation.y = -Math.PI / 2;
  rightJamb.position.set(WIN_X1, winCy, (NZ0 + NZ1) / 2);
  rightJamb.receiveShadow = true;
  scene.add(rightJamb);

  /* === Frosted glass — flush with the outer face of the reveal === */
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(winW, winH), matGlassFrosted);
  glass.position.set(winCx, winCy, NZ1 - 0.005);
  glass.rotation.y = Math.PI;
  scene.add(glass);

  /* === White casing trim on the inside wall face — 2 cm wide × 1.5 cm proud ===
     Picture-frame border that visually anchors the opening in the wall plane. */
  const casW = 0.025, casD = 0.015;
  const casZc = NZ0 - casD / 2;
  const casings = [
    /* head trim: top of opening + casW above */
    [winW + casW * 2, casW, casD, winCx, WIN_Y1 + casW / 2, casZc],
    /* sill trim: bottom of opening + casW below */
    [winW + casW * 2, casW, casD, winCx, WIN_Y0 - casW / 2, casZc],
    /* left jamb trim */
    [casW, winH, casD, WIN_X0 - casW / 2, winCy, casZc],
    /* right jamb trim */
    [casW, winH, casD, WIN_X1 + casW / 2, winCy, casZc],
  ];
  for (const [w, h, d, x, y, z] of casings) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matReveal);
    m.position.set(x, y, z);
    m.castShadow = true; m.receiveShadow = true;
    scene.add(m);
  }

  /* Sill ledge — slight projecting shelf at the bottom, ~1 cm proud of the
     inside wall face (visible bottom ledge in a-1). */
  const ledge = new THREE.Mesh(
    new THREE.BoxGeometry(winW + casW * 2, 0.012, 0.030),
    matReveal
  );
  ledge.position.set(winCx, WIN_Y0 - casW - 0.006, NZ0 - 0.015);
  ledge.castShadow = true; ledge.receiveShadow = true;
  scene.add(ledge);
}

/* Daylight rig — Kumamoto, sunny spring, 11:00 AM JST (CLAUDE.md rule).
 * Sun is at azimuth ≈ 160°, elevation ≈ 60°. The window is on the +Z
 * (NORTH) wall, opposite the sun — so a north-facing frosted window in
 * this configuration gets NO direct sun, only cool diffuse sky.
 * Two pieces, NOT three:
 *   1. SKY PROXY  — bright COOL pale-blue panel outside the window so the
 *      frosted glass reads as "looking at clear spring sky".
 *   2. RECTAREA   — cool-blue area light at the window plane (the ONLY
 *      window contributor; no DirectionalLight through a north window).
 *
 * Cast shadows inside the room come from the ambient bounce + the dim
 * ceiling spots, NOT a fake "sun through the north window".  */
{
  const winCx = (WIN_X0 + WIN_X1) / 2;
  const winCy = (WIN_Y0 + WIN_Y1) / 2;
  const winW = WIN_X1 - WIN_X0;
  const winH = WIN_Y1 - WIN_Y0;

  /* 1. Sky proxy — true HDR-bright (raw color > 1.0) so the frosted glass
   *    reads as "looking at the sky" instead of "a wall with a tile on
   *    it". MeshBasicMaterial with toneMapped:false bypasses the shader-
   *    side ACES so the HDR value reaches the composer; OutputPass then
   *    tonemaps for display. Bloom threshold 1.0 then picks up the
   *    overflow as a soft halo around the window. Cool pale-blue per the
   *    Kumamoto 11 AM rule. */
  const skyMat = new THREE.MeshBasicMaterial({
    color: 0xeaf2ff,
    toneMapped: false,
  });
  skyMat.color.multiplyScalar(2.4);     /* lift above bloom threshold without over-driving */
  const sky = new THREE.Mesh(
    new THREE.PlaneGeometry(winW * 1.8, winH * 1.8),
    skyMat
  );
  sky.position.set(winCx, winCy, NZ1 + 0.30);
  sky.rotation.y = Math.PI;
  scene.add(sky);

  /* 2. RectAreaLight — diffuse sky-coloured area fill at the window plane.
   *    Cool-tinted (no direct sun through a north window per Kumamoto rule)
   *    but strong enough to be felt across the room. RectAreaLight CAN'T
   *    cast shadows in WebGL three.js — that's what piece 3 is for. */
  const winLight = new THREE.RectAreaLight(0xdde6f0, 22.0, winW, winH);
  winLight.position.set(winCx, winCy, NZ1 - 0.005);
  winLight.lookAt(winCx, winCy, NZ0 - 5);
  scene.add(winLight);

  /* 3. Window "skylight" DirectionalLight — its job is to give the room
   *    cast shadows that ground geometry (washer, fixtures) to the floor.
   *    PHYSICAL MODEL: the bright cool sky outside the north window is
   *    a directional bright source from the camera's POV — it dominates
   *    where shadows fall, even though no direct sun ray enters. We
   *    model that with a DirectionalLight at the window position, COOL
   *    colour (sky, not sun), wide shadow radius (frosted glass scatters
   *    rays so edges should be soft), and low intensity (frosted glass
   *    drops the directional contribution; the RectArea handles the
   *    main fill). */
  const winSky = new THREE.DirectionalLight(0xe0e8f4, 0.95);
  winSky.position.set(winCx, winCy + 0.6, NZ1 + 1.5);
  winSky.target.position.set(winCx - 0.2, 0.30, 0.80);
  winSky.castShadow = true;
  winSky.shadow.mapSize.set(2048, 2048);
  winSky.shadow.camera.near = 0.5;
  winSky.shadow.camera.far  = 9;
  winSky.shadow.camera.left   = -2.5;
  winSky.shadow.camera.right  =  2.5;
  winSky.shadow.camera.top    =  2.5;
  winSky.shadow.camera.bottom = -1.5;
  winSky.shadow.bias       = -0.00015;
  winSky.shadow.normalBias =  0.025;
  winSky.shadow.radius     =  10;   /* very soft — frosted-glass scatter */
  scene.add(winSky, winSky.target);
}

/* Ceiling downlights — kept as visible fixtures, but their contribution is
 * deliberately low (0.7 vs old 3.0). In the laundry-c-10 photo the daylight
 * is the dominant light and the recessed downlights barely register against
 * the wall. Cranking these up washes out the window's daylight read. */
{
  const downColor = 0xffe1b0;
  const positions = [
    [0.45, ROOM_H - 0.001, 0.70],
    [0.90, ROOM_H - 0.001, 1.55],
    [1.35, ROOM_H - 0.001, 0.70],
  ];
  for (const [x, y, z] of positions) {
    const sl = new THREE.SpotLight(downColor, 0.7, 4.5, Math.PI / 4.2, 0.6, 1.6);
    sl.position.set(x, y, z);
    sl.target.position.set(x, 0, z);
    sl.castShadow = true;
    sl.shadow.mapSize.set(1024, 1024);
    sl.shadow.bias = -0.0008;
    sl.shadow.normalBias = 0.01;
    scene.add(sl, sl.target);

    /* Visible ceiling fixture (thin emissive disc) — softer glow so the
     * fixture reads as "fixture exists" without faking a strong on-light. */
    const fix = new THREE.Mesh(
      new THREE.CylinderGeometry(0.055, 0.055, 0.006, 24),
      new THREE.MeshStandardMaterial({
        color: 0xfff5e0, emissive: 0xffe1a8, emissiveIntensity: 0.45,
        roughness: 0.4, metalness: 0.0,
      })
    );
    fix.position.set(x, ROOM_H - 0.003, z);
    scene.add(fix);
  }
}

/* ====================================================================== */
/* Washing machine — Japanese top-loader (per laundry-c-1.webp / c-3.webp).
 * Generic dims roughly matching Panasonic NA-FA8H / Hitachi BW-V80F class:
 *   W 600 mm × D 600 mm × H 950 mm (without lid raised).
 * Sits in the north alcove against the vanity-wall (east). Back of unit
 * (+X face) flush against the brick. User reaches DOWN through a flat lid
 * on top; a sloped control-panel strip runs along the back-top edge.    */
/* ====================================================================== */
const WASHER = {
  w: 0.60, d: 0.60, h: 0.95,
  /* Back face flush against vanity-wall (x = ROOM_W); centred 5 cm from north */
  cx: ROOM_W - 0.60 / 2,
  cz: ROOM_D - 0.60 / 2 - 0.05,
};

function makeWashingMachine(cx, cy, cz, w, d, h) {
  /* Top-loader. Local axes:
   *   +X = back (against vanity-wall) ;  -X = front (faces user)
   *   +Y = up
   *   +Z = north                       ;  -Z = south
   * Body is a flat-topped white box. A sloped control-panel strip runs along
   * the back-top edge (+X end), tilted forward so labels face the user. The
   * rest of the top face is a square hinged LID with a slim shadow recess
   * around its perimeter. */
  const g = new THREE.Group();

  /* === Body === */
  const body = new THREE.Mesh(
    new RoundedBoxGeometry(d, h, w, 5, 0.018),
    matWasherWhite
  );
  body.position.set(0, h / 2, 0);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  /* NOTE: the prior drum-type AO bake at laundry-test/textures/ao/washer_front.png
   * doesn't apply to a top-loader (front face has no door/agitator/hatch any
   * more). bake_washer_ao.py needs re-authoring around top-face occluders —
   * tracked in task #8. Until then the body just relies on PBR + global GI. */

  /* === Control-panel strip — sloped, runs along the back-top edge === */
  const PANEL_D = 0.140;     /* strip depth in local x (away from user) */
  const PANEL_H = 0.075;     /* raised height above the body top */
  const PANEL_TILT = 0.18;   /* radians forward-tilt around z-axis */
  const panelW_local = w - 0.020;
  {
    const panelGroup = new THREE.Group();

    const slab = new THREE.Mesh(
      roundedBox(PANEL_D, PANEL_H, panelW_local, 0.006, 3),
      matWasherWhiteSoft
    );
    slab.castShadow = true; slab.receiveShadow = true;
    panelGroup.add(slab);

    /* Front bezel — thin grey strip so the panel reads as its own module */
    const bezel = new THREE.Mesh(
      new THREE.BoxGeometry(0.001, PANEL_H - 0.012, panelW_local - 0.020),
      new THREE.MeshStandardMaterial({ color: 0xb8b9bb, roughness: 0.6 })
    );
    bezel.position.set(-PANEL_D / 2 - 0.0005, 0, 0);
    panelGroup.add(bezel);

    /* Display — slim blue-tinted rectangle on the left */
    const display = new THREE.Mesh(
      new THREE.BoxGeometry(0.002, 0.022, 0.085),
      new THREE.MeshStandardMaterial({
        color: 0xc8d8e8, emissive: 0x4a6a8a, emissiveIntensity: 0.55,
        roughness: 0.4, metalness: 0.0,
      })
    );
    display.position.set(-PANEL_D / 2 - 0.001, 0.010, -panelW_local / 2 + 0.085);
    panelGroup.add(display);

    /* Chrome selector dial on the right */
    const dial = new THREE.Mesh(
      new THREE.CylinderGeometry(0.022, 0.022, 0.012, 28),
      matWasherChrome
    );
    dial.rotation.z = Math.PI / 2;
    dial.position.set(-PANEL_D / 2 - 0.006, 0.008, panelW_local / 2 - 0.080);
    panelGroup.add(dial);

    /* Row of 4 warm-LED status indicator dots below the display */
    const matLED = new THREE.MeshStandardMaterial({
      color: 0xffd070, emissive: 0xffb850, emissiveIntensity: 0.45,
      roughness: 0.45, metalness: 0,
    });
    for (let i = 0; i < 4; i++) {
      const t = i / 3;
      const dot = new THREE.Mesh(
        new THREE.CylinderGeometry(0.005, 0.005, 0.0015, 16),
        matLED
      );
      dot.rotation.z = Math.PI / 2;
      dot.position.set(-PANEL_D / 2 - 0.001, -0.018,
        -panelW_local / 2 + 0.055 + t * 0.060);
      panelGroup.add(dot);
    }

    /* 3 chrome push-buttons on the bottom-right */
    for (let i = 0; i < 3; i++) {
      const t = i / 2;
      const btn = new THREE.Mesh(
        new THREE.CylinderGeometry(0.010, 0.010, 0.0035, 20),
        matWasherChrome
      );
      btn.rotation.z = Math.PI / 2;
      btn.position.set(-PANEL_D / 2 - 0.002, -0.020,
        panelW_local / 2 - 0.190 + t * 0.060);
      panelGroup.add(btn);
    }

    panelGroup.position.set(d / 2 - PANEL_D / 2 - 0.010, h + PANEL_H / 2 - 0.003, 0);
    panelGroup.rotation.z = -PANEL_TILT;
    g.add(panelGroup);
  }

  /* === Top lid — flat square panel, slight inset from body perimeter === */
  const LID_INSET = 0.012;
  const lidD = d - PANEL_D - LID_INSET * 2 - 0.004;
  const lidW = w - LID_INSET * 2;
  const lidCx = -d / 2 + LID_INSET + lidD / 2;
  {
    const lid = new THREE.Mesh(
      roundedBox(lidD, 0.010, lidW, 0.002, 2),
      matWasherWhite
    );
    lid.position.set(lidCx, h + 0.005, 0);
    lid.castShadow = true; lid.receiveShadow = true;
    g.add(lid);

    /* Thin shadow gap strips around the lid perimeter — reads as a recess */
    const matSeam = new THREE.MeshStandardMaterial({ color: 0xb0b1b3, roughness: 0.85 });
    const seamW = 0.0025;
    const seams = [
      [lidD + seamW * 2, seamW, lidCx, -lidW / 2 - seamW / 2],
      [lidD + seamW * 2, seamW, lidCx, +lidW / 2 + seamW / 2],
      [seamW, lidW, lidCx - lidD / 2 - seamW / 2, 0],
      [seamW, lidW, lidCx + lidD / 2 + seamW / 2, 0],
    ];
    for (const [sx, sz, px, pz] of seams) {
      const seam = new THREE.Mesh(
        new THREE.BoxGeometry(sx, 0.001, sz),
        matSeam
      );
      seam.position.set(px, h + 0.002, pz);
      g.add(seam);
    }

    /* Lid finger pull — small chrome lip at the front edge of the lid */
    const pullMat = new THREE.MeshPhysicalMaterial({
      color: 0xd8dadd, roughness: 0.30, metalness: 0.85, clearcoat: 0.3,
    });
    const pull = new THREE.Mesh(
      new THREE.BoxGeometry(0.016, 0.005, 0.080),
      pullMat
    );
    pull.position.set(lidCx - lidD / 2 + 0.012, h + 0.012, 0);
    g.add(pull);
  }

  /* === Brand label — generic placeholder text plate on the upper-front
       face. Photo evidence is not yet brand-specific enough to identify the
       exact maker; until then the existing canvas-text texture stands in. */
  {
    const logo = new THREE.Mesh(
      new THREE.PlaneGeometry(0.085, 0.020),
      matWasherLogoText
    );
    logo.rotation.y = -Math.PI / 2;          /* face -X (into room) */
    logo.position.set(-d / 2 - 0.001, h - 0.060, -w / 2 + 0.080);
    g.add(logo);
  }

  /* === Vertical cabinet seam lines on the front-corner edges === */
  {
    const matSeam = new THREE.MeshStandardMaterial({ color: 0xb8b9bb, roughness: 0.6 });
    for (const sz of [-w / 2 + 0.001, +w / 2 - 0.001]) {
      const seam = new THREE.Mesh(
        new THREE.BoxGeometry(0.001, h - 0.060, 0.001),
        matSeam
      );
      seam.position.set(-d / 2 + 0.001, h / 2, sz);
      g.add(seam);
    }
  }

  /* === 4 leveling feet at bottom corners === */
  {
    const matFoot = new THREE.MeshStandardMaterial({ color: 0x1a1a1c, roughness: 0.85 });
    const fr = 0.020, fh = 0.014;
    for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
      const foot = new THREE.Mesh(
        new THREE.CylinderGeometry(fr, fr, fh, 18),
        matFoot
      );
      foot.position.set(
        sx * (d / 2 - 0.040),
        fh / 2,
        sz * (w / 2 - 0.040)
      );
      foot.castShadow = true; foot.receiveShadow = true;
      g.add(foot);
    }
  }

  g.position.set(cx, cy, cz);
  return g;
}

const washer = makeWashingMachine(WASHER.cx, 0, WASHER.cz, WASHER.w, WASHER.d, WASHER.h);
scene.add(washer);

/* ====================================================================== */
/* Hotspots                                                                */
/* ====================================================================== */
const PRODUCTS = {
  'washer-001': {
    name: 'Japanese top-loading washing machine',
    meta: 'class: full-auto top-loader · ~8 kg capacity',
    spec: [
      ['Body width',     '600 mm'],
      ['Depth',          '600 mm'],
      ['Body height',    '950 mm (excluding raised lid)'],
      ['Configuration',  'top-loader · hinged lid · back-edge control panel'],
      ['Brand',          'TBD — photo evidence not yet brand-specific'],
    ],
    refUrl: '#',
    /* World position for the dot — just above the control panel front edge */
    pos: [WASHER.cx - WASHER.d / 2 + 0.140, WASHER.h + 0.05, WASHER.cz],
  },
};

const hotspotsLayer = document.getElementById('hotspots-layer');
const hotspots = [];
for (const [id, p] of Object.entries(PRODUCTS)) {
  const btn = document.createElement('button');
  btn.className = 'hotspot';
  btn.setAttribute('data-id', id);
  btn.innerHTML = '<span class="hotspot__dot" aria-hidden="true"></span>';
  btn.addEventListener('click', () => openPopover(id));
  hotspotsLayer.appendChild(btn);
  hotspots.push({ id, btn, world: new THREE.Vector3().fromArray(p.pos) });
}

const popover = document.getElementById('popover');
const popoverScrim = document.getElementById('popover-scrim');
const pvName = document.getElementById('pv-name');
const pvMeta = document.getElementById('pv-meta');
const pvSpec = document.getElementById('pv-spec');
const pvRef  = document.getElementById('pv-ref');
const pvClose = document.getElementById('pv-close');

function openPopover(id) {
  const p = PRODUCTS[id];
  if (!p) return;
  _lastFocus = document.activeElement;
  pvName.textContent = p.name;
  pvMeta.textContent = p.meta;
  pvSpec.innerHTML = '';
  for (const [k, v] of p.spec) {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    pvSpec.append(dt, dd);
  }
  pvRef.href = p.refUrl;
  popover.classList.add('open');
  popoverScrim.classList.add('open');
  document.addEventListener('keydown', _popoverKeyHandler);
  setTimeout(() => { if (pvClose && pvClose.focus) pvClose.focus(); }, 0);
}
function closePopover() {
  popover.classList.remove('open');
  popoverScrim.classList.remove('open');
  document.removeEventListener('keydown', _popoverKeyHandler);
  if (_lastFocus && _lastFocus.focus) _lastFocus.focus();
  _lastFocus = null;
}
let _lastFocus = null;
function _popoverKeyHandler(e) {
  if (e.key === 'Escape') { e.preventDefault(); closePopover(); return; }
  if (e.key !== 'Tab') return;
  const focusables = popover.querySelectorAll('button, a[href]');
  if (!focusables.length) return;
  const first = focusables[0], last = focusables[focusables.length - 1];
  if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
  else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
}
pvClose.addEventListener('click', closePopover);
popoverScrim.addEventListener('click', closePopover);

/* ====================================================================== */
/* Render loop                                                             */
/* ====================================================================== */
function projectHotspots() {
  for (const h of hotspots) {
    const v = h.world.clone().project(camera);
    const x = (v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
    const visible = v.z < 1 && v.x > -1 && v.x < 1 && v.y > -1 && v.y < 1;
    h.btn.style.transform = `translate(${x - 22}px, ${y - 22}px)`;
    h.btn.style.display = visible ? 'inline-flex' : 'none';
  }
}

/* ====================================================================== */
/* Postprocessing — subtle UnrealBloom on the bright frosted window for   */
/* the "backlit glow" Agent 4 called out (May 2026 research). OutputPass  */
/* reads renderer.toneMapping / .toneMappingExposure, so we KEEP those on */
/* the renderer (already set above) — same pattern as kitchen-test.html.  */
/* ====================================================================== */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
/* Bloom — threshold tuned so only the bright sky-through-glass and emissive
 * ceiling discs trigger it. Slightly punchier than kitchen-test's 0.14/1.05
 * because the backlit-frosted-window read is THE goal here. */
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  /* strength */ 0.16,
  /* radius   */ 0.70,
  /* threshold*/ 1.00      /* above all non-emissive specular peaks — sky-proxy + LEDs trigger */
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function tick() {
  composer.render();
  projectHotspots();
  requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.setSize(window.innerWidth, window.innerHeight);
});
</script>
