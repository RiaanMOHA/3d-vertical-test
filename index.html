<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0f1115" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ozu" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
<title>3D projects</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --card-hover: #22262f;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.25);
    --text: #f5f5f7;
    --muted: rgba(245,245,247,0.55);
  }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    min-height: 100svh;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.4;
    color: var(--text);
    overscroll-behavior: none;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    padding:
      calc(32px + env(safe-area-inset-top))
      calc(32px + env(safe-area-inset-right))
      calc(32px + env(safe-area-inset-bottom))
      calc(32px + env(safe-area-inset-left));
  }
  .wrap { width: 100%; max-width: 640px; }
  h1 { font-size: 14px; font-weight: 500; letter-spacing: 0.02em; color: var(--muted); margin: 0 0 24px; }
  .grid { display: grid; gap: 14px; grid-template-columns: 1fr; }
  @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  .card {
    display: flex; flex-direction: column; justify-content: space-between;
    min-height: 200px;
    padding: 22px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .card:hover { background: var(--card-hover); border-color: var(--border-hover); transform: translateY(-2px); }
  .card:active { background: var(--card-hover); border-color: var(--border-hover); transform: scale(0.99); }
  .card-name { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .card-meta { font-size: 12px; letter-spacing: 0.02em; color: var(--muted); }
  .card-arrow { font-size: 18px; color: var(--muted); }
  .card:hover .card-arrow,
  .card:active .card-arrow { color: var(--text); }
  .card-row { display: flex; justify-content: space-between; align-items: center; }
  .footnote { margin-top: 28px; font-size: 12px; color: var(--muted); letter-spacing: 0.02em; }
  .card:focus-visible {
    outline: 2px solid #0A84FF;
    outline-offset: 4px;
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card:hover, .card:active { transition: none; transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>3D projects</h1>
    <div class="grid">
      <a class="card" href="ozu-test.html">
        <div class="card-row"><div class="card-meta">house</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">ozu-1</div></div>
      </a>
      <a class="card" href="value-add-3d-journey.html">
        <div class="card-row"><div class="card-meta">tour</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">value-add journey</div></div>
      </a>
      <a class="card" href="value-add-project.html">
        <div class="card-row"><div class="card-meta">project</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">value-add-project</div></div>
      </a>
      <a class="card" href="kitchen-test.html">
        <div class="card-row"><div class="card-meta">room</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">kitchen</div></div>
      </a>
      <a class="card" href="living-dining-test.html">
        <div class="card-row"><div class="card-meta">room</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">living + dining</div></div>
      </a>
      <a class="card" href="laundry-test.html">
        <div class="card-row"><div class="card-meta">room</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">laundry</div></div>
      </a>
      <a class="card" href="stairs-test.html">
        <div class="card-row"><div class="card-meta">feature</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">stairs</div></div>
      </a>
      <a class="card" href="bbq-test.html">
        <div class="card-row"><div class="card-meta">feature</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">bbq</div></div>
      </a>
      <a class="card" href="test.html">
        <div class="card-row"><div class="card-meta">sandbox</div><div class="card-arrow">&rarr;</div></div>
        <div><div class="card-name">test</div></div>
      </a>
    </div>
    <div class="footnote">tap a project to open its 3D scene</div>
  </div>
</body>
</html>
