    window.addEventListener('unhandledrejection', function(e){
      show('promise error: ' + (e.reason && e.reason.stack ? e.reason.stack : e.reason));
    });
    window.__moduleStarted = false;
    setTimeout(function(){
      if (!window.__moduleStarted) {
        show(
          'the 3D module never started.\n' +
          'this usually means one of:\n' +
          '  • browser too old (no module / importmap support)\n' +
          '  • mime-type problem (see browser console: press F12 → Console)\n' +
          '  • importmap parse error\n\n' +
          'press F12, click "Console" tab, copy any red text and paste it back.'
        );
        if (lb) lb.textContent = 'module did not start';
      }
    }, 4000);

    envScene.add(cube);

function seedRng(seed) {
  let s = (seed | 0) || 1;
  return () => {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

/* Rounded box helper — uses RoundedBoxGeometry with a sensible default radius
   that scales with the smallest dimension so we never over-round small parts. */
function roundedBox(w, h, d, radiusOpt = null, segments = 4) {
  const minDim = Math.min(w, h, d);
  const r = radiusOpt !== null
    ? Math.min(radiusOpt, minDim * 0.49)
    : Math.min(0.004, minDim * 0.30);
  return new RoundedBoxGeometry(w, h, d, segments, r);
}

/* Derive a tangent-space normal map from a luminance canvas via Sobel.
   strength: how steep the gradient is (1 = subtle, 4 = aggressive).
   Returns a CanvasTexture in linear color space. */
function deriveNormalFromCanvas(canvas, strength = 2.5) {
  const w = canvas.width, h = canvas.height;
  const sctx = canvas.getContext('2d');
  const src = sctx.getImageData(0, 0, w, h).data;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const dctx = out.getContext('2d');
  const dst = dctx.createImageData(w, h);

  /* Pre-compute luminance buffer */
  const lum = new Float32Array(w * h);
  for (let i = 0, p = 0; i < src.length; i += 4, p++) {
    lum[p] = (0.299 * src[i] + 0.587 * src[i+1] + 0.114 * src[i+2]) / 255;
  }

  const ix = (x, y) => Math.max(0, Math.min(w - 1, x)) + Math.max(0, Math.min(h - 1, y)) * w;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      /* Sobel */
      const gx =
        -lum[ix(x-1, y-1)] - 2*lum[ix(x-1, y)] - lum[ix(x-1, y+1)]
        +lum[ix(x+1, y-1)] + 2*lum[ix(x+1, y)] + lum[ix(x+1, y+1)];
      const gy =
        -lum[ix(x-1, y-1)] - 2*lum[ix(x, y-1)] - lum[ix(x+1, y-1)]
        +lum[ix(x-1, y+1)] + 2*lum[ix(x, y+1)] + lum[ix(x+1, y+1)];
      let nx = -gx * strength;
      let ny =  gy * strength;
      let nz = 1.0;
      const len = Math.sqrt(nx*nx + ny*ny + nz*nz) || 1;
      nx /= len; ny /= len; nz /= len;
      const i = (x + y * w) * 4;
      dst.data[i]   = (nx * 0.5 + 0.5) * 255 | 0;
      dst.data[i+1] = (ny * 0.5 + 0.5) * 255 | 0;
      dst.data[i+2] = (nz * 0.5 + 0.5) * 255 | 0;
      dst.data[i+3] = 255;
    }
  }
  dctx.putImageData(dst, 0, 0);
  const tex = new THREE.CanvasTexture(out);
  tex.colorSpace = THREE.NoColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.anisotropy = MAX_ANISO;
  tex.needsUpdate = true;
  return tex;
}

/* Light oak wood grain — horizontal streaks + occasional knot */
function makeWoodTexture(w = 2048, h = 1024, seed = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rng = seedRng(seed);

  /* Base gradient (subtle vertical band) */
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0,   '#d6b886');
  grad.addColorStop(0.5, '#caa873');
  grad.addColorStop(1,   '#bf9d68');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  /* Long horizontal grain streaks */
  for (let i = 0; i < 1400; i++) {
    const y = rng() * h;
    const len = 200 + rng() * (w * 0.9);
    const x = -100 + rng() * w;
    const a = rng() * 0.28;
    const r = 80 + rng() * 30 | 0;
    const g = 50 + rng() * 25 | 0;
    const b = 22 + rng() * 18 | 0;
    ctx.strokeStyle = `rgba(${r},${g},${b},${a})`;
    ctx.lineWidth = 0.4 + rng() * 1.6;
    ctx.beginPath();
    let cx = x, cy = y;
    ctx.moveTo(cx, cy);
    const segs = 8;
    for (let s = 0; s < segs; s++) {
      cx += len / segs;
      cy += (rng() - 0.5) * 1.4;
      ctx.lineTo(cx, cy);
    }
    ctx.stroke();
  }

  /* Knots and arches */
  for (let i = 0; i < 5; i++) {
    const x = rng() * w, y = rng() * h;
    const rOuter = 8 + rng() * 30;
    const g2 = ctx.createRadialGradient(x, y, 0, x, y, rOuter);
    g2.addColorStop(0,   'rgba(60, 35, 12, 0.85)');
    g2.addColorStop(0.5, 'rgba(90, 55, 25, 0.35)');
    g2.addColorStop(1,   'rgba(90, 55, 25, 0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(x, y, rOuter, 0, Math.PI * 2); ctx.fill();
  }

  /* Subtle warm highlight pass */
  for (let i = 0; i < 200; i++) {
    const x = rng() * w, y = rng() * h;
    const r = 30 + rng() * 80;
    const g3 = ctx.createRadialGradient(x, y, 0, x, y, r);
    g3.addColorStop(0, 'rgba(255, 230, 180, 0.05)');
    g3.addColorStop(1, 'rgba(255, 230, 180, 0)');
    ctx.fillStyle = g3;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  }

  return c;
}

/* Roughness map derived from wood: where it's darker, slightly rougher */
function deriveRoughnessFromWood(canvas) {
  const w = canvas.width, h = canvas.height;
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const sctx = canvas.getContext('2d');
  const dctx = out.getContext('2d');
  const src = sctx.getImageData(0, 0, w, h);
  const dst = dctx.createImageData(w, h);
  for (let i = 0; i < src.data.length; i += 4) {
    /* darker = rougher (dark grain absorbs more), so invert luminance */
    const lum = 0.299 * src.data[i] + 0.587 * src.data[i+1] + 0.114 * src.data[i+2];
    const r = Math.max(120, 220 - (lum - 130) * 0.6) | 0;
    dst.data[i] = dst.data[i+1] = dst.data[i+2] = r;
    dst.data[i+3] = 255;
  }
  dctx.putImageData(dst, 0, 0);
  return out;
}

/* Engineered-stone counter — warm cream with subtle veining + speckle */
function makeStoneTexture(w = 1024, h = 1024, seed = 11) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rng = seedRng(seed);

  ctx.fillStyle = '#efeae0';
  ctx.fillRect(0, 0, w, h);

  /* Soft cloud variation */
  for (let i = 0; i < 60; i++) {
    const x = rng() * w, y = rng() * h;
    const r = 60 + rng() * 200;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const base = 230 + (rng() - 0.5) * 25;
    g.addColorStop(0, `rgba(${base},${base-5},${base-15}, ${0.15 + rng()*0.2})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }

  /* Faint veins */
  for (let i = 0; i < 12; i++) {
    ctx.strokeStyle = `rgba(170, 160, 140, ${0.08 + rng() * 0.12})`;
    ctx.lineWidth = 0.6 + rng() * 1.2;
    ctx.beginPath();
    let x = rng() * w, y = rng() * h;
    ctx.moveTo(x, y);
    for (let j = 0; j < 40; j++) {
      x += -50 + rng() * 100;
      y += -25 + rng() * 50;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  /* Speckle */
  for (let i = 0; i < 4000; i++) {
    const x = rng() * w, y = rng() * h;
    const v = 90 + rng() * 110 | 0;
    ctx.fillStyle = `rgba(${v},${v-10},${v-22}, ${rng() * 0.18})`;
    ctx.fillRect(x, y, 1, 1);
  }
  return c;
}

/* Polished concrete floor — light warm grey with subtle splotches */
function makeConcreteTexture(w = 1024, h = 1024, seed = 7) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rng = seedRng(seed);

  ctx.fillStyle = '#d8d2c6';
  ctx.fillRect(0, 0, w, h);

  /* Big lighter / darker patches */
  for (let i = 0; i < 80; i++) {
    const x = rng() * w, y = rng() * h;
    const r = 40 + rng() * 180;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    const dark = rng() < 0.5;
    if (dark) {
      g.addColorStop(0, `rgba(180, 175, 165, ${0.18 + rng()*0.18})`);
    } else {
      g.addColorStop(0, `rgba(245, 240, 232, ${0.10 + rng()*0.12})`);
    }
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }

  /* Salt speckle */
  for (let i = 0; i < 22000; i++) {
    const x = rng() * w, y = rng() * h;
    const v = 200 + rng() * 50 | 0;
    ctx.fillStyle = `rgba(${v},${v-3},${v-12}, ${rng() * 0.4})`;
    ctx.fillRect(x, y, 1, 1);
  }
  return c;
}

/* Stainless dot embossing — used as bumpmap on sink basin */
function makeStainlessDotBump(w = 512, h = 512) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#7f7f7f';
  ctx.fillRect(0, 0, w, h);
  /* Hex-ish dot grid */
  ctx.fillStyle = '#a0a0a0';
  for (let y = 0; y < h; y += 12) {
    const off = ((y / 12) | 0) % 2 === 0 ? 0 : 6;
    for (let x = off; x < w; x += 12) {
      ctx.beginPath(); ctx.arc(x, y, 1.6, 0, Math.PI * 2); ctx.fill();
    }
  }
  /* Brushed horizontal streaks */
  const rng = seedRng(99);
  for (let i = 0; i < 600; i++) {
    const y = rng() * h;
    const len = 60 + rng() * 200;
    const x = rng() * w;
    ctx.strokeStyle = `rgba(180,180,180, ${rng() * 0.28})`;
    ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  }
  return c;
}

/* Brushed-stainless map for hood/cabinet caps */
function makeBrushedStainless(w = 1024, h = 256, seed = 17) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rng = seedRng(seed);
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0,   '#c8ccd2');
  grad.addColorStop(0.5, '#b6bac0');
  grad.addColorStop(1,   '#c8ccd2');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 4500; i++) {
    const y = rng() * h;
    const len = 80 + rng() * 350;
    const x = -50 + rng() * w;
    const lum = 100 + rng() * 110 | 0;
    ctx.strokeStyle = `rgba(${lum},${lum},${lum}, ${rng() * 0.35})`;
    ctx.lineWidth = 0.4 + rng() * 0.4;
    ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + len, y); ctx.stroke();
  }
  return c;
}

/* Stone backsplash — large-format warm grey */
function makeBacksplashTexture(w = 1024, h = 512, seed = 23) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  const rng = seedRng(seed);
  ctx.fillStyle = '#d9d0bf';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 250; i++) {
    const x = rng() * w, y = rng() * h;
    const r = 30 + rng() * 100;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(${190+rng()*30|0},${175+rng()*30|0},${150+rng()*30|0}, ${rng()*0.25})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  }
  for (let i = 0; i < 8000; i++) {
    const x = rng() * w, y = rng() * h;
    const v = 130 + rng() * 100 | 0;
    ctx.fillStyle = `rgba(${v},${v-8},${v-22}, ${rng()*0.25})`;
    ctx.fillRect(x, y, 1, 1);

  ctx.strokeStyle = 'rgba(110,100,82,0.18)';
  ctx.lineWidth = 1.2;
  for (let y = h * 0.5; y < h; y += h * 0.5) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();

  return c;
}

/* Microwave door grill — fine perforated mesh */
function makeMicrowaveGrillTexture(w = 256, h = 256) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#1f1f1f';
  for (let y = 4; y < h; y += 6) {
    for (let x = 4; x < w; x += 6) {
      ctx.fillRect(x, y, 2, 2);
    }
  }
  return c;
}

/* Convert a canvas-backed albedo into a CanvasTexture with our defaults */
function texFromCanvas(canvas, { repeat = [1, 1], colorSpace = THREE.SRGBColorSpace } = {}) {
  const t = new THREE.CanvasTexture(canvas);
  t.colorSpace = colorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = MAX_ANISO;
  t.repeat.set(repeat[0], repeat[1]);
  t.needsUpdate = true;
  return t;
}

/* Helper: clone a texture with per-instance offset/repeat (so panels can vary
   without sharing transform state on the underlying GPU texture). */
function cloneTex(tex, repeatX, repeatY, offsetX = 0, offsetY = 0) {
  const t = tex.clone();
  t.needsUpdate = true;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(repeatX, repeatY);
  t.offset.set(offsetX, offsetY);
  t.anisotropy = MAX_ANISO;
  return t;
}

/* === AO maps baked on A6000 GPU 1 (Cycles + OptiX, see kitchen-test/bake/) ===

   appliance/cabinet occluders, applies them as `aoMap` on per-surface clones
   of the shared wall material. */
const aoLoader = new THREE.TextureLoader();
function loadAOTex(slug, opts = {}) {
  const tex = aoLoader.load(`kitchen-test/textures/ao/${slug}.png`);
  tex.colorSpace = THREE.NoColorSpace;
  tex.channel = 0;                                   /* sample uv0 (the standard UV) */
  tex.wrapS = THREE.ClampToEdgeWrapping;
  tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  const rx = opts.flipU ? -1 : 1;
  const ry = opts.flipV ? -1 : 1;
  tex.repeat.set(rx, ry);
  tex.offset.set(opts.flipU ? 1 : 0, opts.flipV ? 1 : 0);
  return tex;
}

/* ====================================================================== */
/* Layout constants                                                        */
/* ====================================================================== */
const TOE_H = 0.10;          // toe-kick recess height
const TOE_INSET = 0.05;      // toe-kick depth inset from cabinet front
const BASE_TOP_Y = 0.85;     // top of cabinet body
const COUNTER_T = 0.030;     // counter top thickness
const COUNTER_TOP_Y = BASE_TOP_Y + COUNTER_T;  // 0.88
const COUNTER_FRONT_Z = 0.65;
const COUNTER_BACK_Z = -0.01;
const CABINET_FRONT_Z = 0.62;
const CABINET_BACK_Z = 0.0;
const WALL_CAB_BOTTOM_Y = 1.50;
const WALL_CAB_TOP_Y = 2.20;
const WALL_CAB_FRONT_Z = 0.375;
const ABS_CAP_T = 0.012;     // top edge stainless cap thickness

/* ====================================================================== */
/* Generic cabinet builders                                                */
/* ====================================================================== */
const SEAM = 0.005;

/* Drawer cabinet module:
   x0 .. x0+w wide. Body at z=[CABINET_BACK_Z, CABINET_FRONT_Z]
   front face is split into N stacked drawers; ABS cap strip across the top of each.
*/
function makeBaseCabinet(x0, w, drawerCount = 3, materialSeed = 1) {
  const g = new THREE.Group();
  const x1 = x0 + w;
  const cx = (x0 + x1) / 2;
  const bodyDepth = CABINET_FRONT_Z - CABINET_BACK_Z;

  /* Toe-kick: stainless plinth, recessed by TOE_INSET */
  const toe = new THREE.Mesh(
    roundedBox(w - SEAM, TOE_H, bodyDepth - TOE_INSET, 0.003, 3),
    matPlinth
  );
  toe.position.set(cx, TOE_H / 2, (CABINET_BACK_Z + CABINET_FRONT_Z) / 2 - TOE_INSET / 2);
  toe.castShadow = true; toe.receiveShadow = true;
  g.add(toe);

  /* Cabinet body box — stainless, slightly shallower than drawer-front plane to avoid z-fighting */
  const bodyD = bodyDepth - 0.012;
  const body = new THREE.Mesh(
    roundedBox(w - SEAM, BASE_TOP_Y - TOE_H, bodyD, 0.003, 3),
    matStainlessBrushed
  );
  body.position.set(cx, (TOE_H + BASE_TOP_Y) / 2, CABINET_BACK_Z + bodyD / 2);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  const drawerYStart = TOE_H;
  const drawerStack = BASE_TOP_Y - TOE_H;            // 0.75
  const dh = drawerStack / drawerCount;

  for (let i = 0; i < drawerCount; i++) {
    const yBot = drawerYStart + i * dh;
    const yTop = yBot + dh;

    const woodMat = makeWoodMaterial({
      repeatX: w / 1.4,
      repeatY: dh / 0.6,
      offsetX: (materialSeed * 0.13 + i * 0.07) % 1,
      offsetY: (materialSeed * 0.21 + i * 0.11) % 1,
    });

    const drawer = new THREE.Mesh(
      roundedBox(w - SEAM, dh - SEAM, 0.022, 0.002, 3),
      woodMat
    );
    drawer.position.set(cx, (yBot + yTop) / 2, CABINET_FRONT_Z + 0.011);
    drawer.castShadow = true; drawer.receiveShadow = true;
    g.add(drawer);

    /* STEDIA-style top edge ABS cap = the handle */
    const cap = new THREE.Mesh(
      roundedBox(w - SEAM - 0.01, ABS_CAP_T, 0.018, 0.002, 3),
      matStainlessBrushed
    );
    cap.position.set(cx, yTop - ABS_CAP_T / 2 - 0.001, CABINET_FRONT_Z + 0.018);
    cap.castShadow = true;
    g.add(cap);

    /* Subtle dark seam line between drawers */
    if (i < drawerCount - 1) {
      const seam = new THREE.Mesh(
        new THREE.BoxGeometry(w - SEAM, 0.003, 0.002),
        new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.6 })
      );
      seam.position.set(cx, yTop, CABINET_FRONT_Z + 0.024);
      g.add(seam);
    }
  }

  /* End caps (vertical seams between cabinet modules) */
  const sideMat = matStainlessBrushed;
  const leftSide = new THREE.Mesh(
    new THREE.BoxGeometry(0.004, BASE_TOP_Y - TOE_H, 0.022),
    sideMat
  );
  leftSide.position.set(x0, (TOE_H + BASE_TOP_Y) / 2, CABINET_FRONT_Z + 0.011);
  g.add(leftSide);
  const rightSide = leftSide.clone();
  rightSide.position.x = x1;
  g.add(rightSide);

  return g;
}

/* Wall cabinet module (37.5cm deep) — closed door style with horizontal grain */
function makeWallCabinet(x0, w, materialSeed = 1) {
  const g = new THREE.Group();
  const x1 = x0 + w;
  const cx = (x0 + x1) / 2;
  const cy = (WALL_CAB_BOTTOM_Y + WALL_CAB_TOP_Y) / 2;
  const cz = WALL_CAB_FRONT_Z / 2;
  const ch = WALL_CAB_TOP_Y - WALL_CAB_BOTTOM_Y;

  /* Body shell (visible bottom + sides) */
  const body = new THREE.Mesh(
    roundedBox(w - SEAM, ch, WALL_CAB_FRONT_Z, 0.004, 3),
    matStainlessBrushed
  );
  body.position.set(cx, cy, cz);
  body.castShadow = true; body.receiveShadow = true;
  g.add(body);

  /* Door panel split into 2 horizontal panels */
  const door1Mat = makeWoodMaterial({
    repeatX: w / 1.4, repeatY: ch / 1.4,
    offsetX: (materialSeed * 0.17) % 1,
    offsetY: (materialSeed * 0.29) % 1,
  });
  const door = new THREE.Mesh(
    roundedBox(w - SEAM, ch - 0.005, 0.022, 0.0025, 3),
    door1Mat
  );
  door.position.set(cx, cy, WALL_CAB_FRONT_Z + 0.011);
  door.castShadow = true; door.receiveShadow = true;
  g.add(door);

  /* Bottom edge cap (handle strip) */
  const bottomCap = new THREE.Mesh(
    roundedBox(w - SEAM - 0.01, ABS_CAP_T, 0.018, 0.002, 3),
    matStainlessBrushed
  );
  bottomCap.position.set(cx, WALL_CAB_BOTTOM_Y + ABS_CAP_T / 2 + 0.001, WALL_CAB_FRONT_Z + 0.018);
  g.add(bottomCap);

  return g;
}

/* ====================================================================== */
/* Counter top + backsplash                                                */
/* ====================================================================== */
function makeCounterRun(xStart, xEnd, opts = {}) {
  const g = new THREE.Group();
  const w = xEnd - xStart;
  const d = COUNTER_FRONT_Z - COUNTER_BACK_Z;
  const cx = (xStart + xEnd) / 2;
  const cz = (COUNTER_BACK_Z + COUNTER_FRONT_Z) / 2;

  function roundedRectOnTarget(target, rectW, rectH, r, ox = 0, oy = 0) {
    const sx = rectW / 2, sy = rectH / 2;
    target.moveTo(ox - sx + r, oy - sy);
    target.lineTo(ox + sx - r, oy - sy);
    target.quadraticCurveTo(ox + sx, oy - sy, ox + sx, oy - sy + r);
    target.lineTo(ox + sx, oy + sy - r);
    target.quadraticCurveTo(ox + sx, oy + sy, ox + sx - r, oy + sy);
    target.lineTo(ox - sx + r, oy + sy);
    target.quadraticCurveTo(ox - sx, oy + sy, ox - sx, oy + sy - r);
    target.lineTo(ox - sx, oy - sy + r);
    target.quadraticCurveTo(ox - sx, oy - sy, ox - sx + r, oy - sy);
  }

  /* Counter top — ExtrudeGeometry with optional sink/cooktop cutouts.
     Modelled in local XY (counter footprint), rotated so extrusion goes +Y. */
  const outer = new THREE.Shape();
  roundedRectOnTarget(outer, w, d, 0.004);

  if (opts.cutouts) {
    for (const c of opts.cutouts) {
      const hole = new THREE.Path();
      roundedRectOnTarget(hole, c.w, c.d, c.r, c.x - cx, c.z - cz);
      outer.holes.push(hole);
    }
  }

  const counterGeom = new THREE.ExtrudeGeometry(outer, {
    depth: COUNTER_T,
    bevelEnabled: true,
    bevelSize: 0.003,
    bevelThickness: 0.002,
    bevelSegments: 3,
    curveSegments: 24,
  });
  const counter = new THREE.Mesh(counterGeom, matCounter);
  counter.rotation.x = -Math.PI / 2;
  /* After rotation.x = -π/2: extrusion +Z becomes +Y. Position bottom of slab at BASE_TOP_Y. */
  counter.position.set(cx, BASE_TOP_Y, cz);
  counter.castShadow = true; counter.receiveShadow = true;
  g.add(counter);

  /* Backsplash */
  if (!opts.noBacksplash) {
    const backsplash = new THREE.Mesh(
      new THREE.BoxGeometry(w, WALL_CAB_BOTTOM_Y - COUNTER_TOP_Y, 0.012),
      matBacksplash
    );
    backsplash.position.set(cx, (COUNTER_TOP_Y + WALL_CAB_BOTTOM_Y) / 2, 0.006);
    backsplash.castShadow = false; backsplash.receiveShadow = true;
    g.add(backsplash);
  }

  return g;
}

/* ====================================================================== */
/* Sink (Cleanup STEDIA SK super-silent)                                  */
/* ====================================================================== */
function makeSink(xCenter) {
  const g = new THREE.Group();

  const sinkW = 0.78;          // 820 mm exterior, 760 mm interior usable
  const sinkD = 0.46;
  const sinkH = 0.18;          // depth of basin
  const sinkX0 = xCenter - sinkW / 2;
  const sinkX1 = xCenter + sinkW / 2;
  const sinkZ0 = 0.07;
  const sinkZ1 = sinkZ0 + sinkD;
  const lipThick = 0.006;
  const wallT = 0.006;
  const cornerR = 0.030;       // STEDIA-style 30 mm inside corner radius
  const innerY = COUNTER_TOP_Y - sinkH;

  /* Helper: traces a rounded rectangle into a Shape/Path centred on (0,0) */
  function roundedRect(target, w, h, r) {
    const sx = w / 2, sy = h / 2;
    target.moveTo(-sx + r, -sy);
    target.lineTo(sx - r, -sy);
    target.quadraticCurveTo(sx, -sy, sx, -sy + r);
    target.lineTo(sx, sy - r);
    target.quadraticCurveTo(sx, sy, sx - r, sy);
    target.lineTo(-sx + r, sy);
    target.quadraticCurveTo(-sx, sy, -sx, sy - r);
    target.lineTo(-sx, -sy + r);
    target.quadraticCurveTo(-sx, -sy, -sx + r, -sy);
  }

  /* Walls: extrude a rounded-rectangular FRAME (outer rect + inner rect hole)
     downward from the counter line. This gives smooth wall-to-wall corners. */
  const outer = new THREE.Shape();
  roundedRect(outer, sinkW, sinkD, cornerR);
  const inner = new THREE.Path();
  roundedRect(inner, sinkW - wallT * 2, sinkD - wallT * 2, Math.max(0.001, cornerR - wallT));
  outer.holes.push(inner);

  const wallGeom = new THREE.ExtrudeGeometry(outer, {
    depth: sinkH,
    bevelEnabled: true,
    bevelSize: 0.004,
    bevelThickness: 0.003,
    bevelSegments: 4,
    curveSegments: 32,
  });
  const wall = new THREE.Mesh(wallGeom, matStainlessSink);
  wall.rotation.x = Math.PI / 2;
  /* After rotation.x = +π/2, the +Z extrude becomes -Y, but we want walls to drop
     from counter level downward. So: position the wall with its TOP at COUNTER_TOP_Y. */
  wall.position.set(xCenter, COUNTER_TOP_Y, (sinkZ0 + sinkZ1) / 2);
  wall.castShadow = true; wall.receiveShadow = true;
  g.add(wall);

  /* Drain location — back-center of basin (centred on X, near the back wall on Z),
     per sink-3 / sink-4 STEDIA reference photos. */
  const drainWorldX = xCenter;
  const drainWorldZ = sinkZ1 - 0.10;
  const drainHoleR = 0.028;          // 56 mm strainer hole
  const drainStrainerR = 0.040;      // 80 mm chrome ring around it

  /* Convert world drain position to bottom-plate local shape coordinates.
     Bottom plate origin = (xCenter, innerY+0.002, sinkZcenter). After rotation.x = -π/2,
     shape's local +Y maps to world -Z. So:
       shapeX = drainX - origin.x
       shapeY = -(drainZ - origin.z)
  */
  const sinkZcenter = (sinkZ0 + sinkZ1) / 2;
  const drainShapeX = drainWorldX - xCenter;
  const drainShapeY = -(drainWorldZ - sinkZcenter);

  /* Bottom plate — rounded rectangle WITH a circular hole at the drain location */
  const bottomShape = new THREE.Shape();
  const bottomR = Math.max(0.005, cornerR - wallT - 0.005);
  roundedRect(bottomShape, sinkW - wallT * 2 - 0.002, sinkD - wallT * 2 - 0.002, bottomR);
  const drainCutout = new THREE.Path();
  drainCutout.absarc(drainShapeX, drainShapeY, drainHoleR, 0, Math.PI * 2, false);
  bottomShape.holes.push(drainCutout);

  const bottomGeom = new THREE.ExtrudeGeometry(bottomShape, {
    depth: 0.004,
    bevelEnabled: true,
    bevelSize: 0.010,
    bevelThickness: 0.006,
    bevelSegments: 5,
    curveSegments: 48,
  });
  const bottom = new THREE.Mesh(bottomGeom, matStainlessSink);
  bottom.rotation.x = -Math.PI / 2;
  bottom.position.set(xCenter, innerY + 0.002, sinkZcenter);
  bottom.receiveShadow = true; bottom.castShadow = true;
  g.add(bottom);

  /* The basin wall's beveled top edge IS the lip — sits flush in the counter cutout. */

  /* === STEDIA flow channel (導流槽) ===
     Right-triangle raised shelf in the back-left corner of the basin, two
     legs flush against the back + left basin walls, hypotenuse forming the
     visible diagonal interior wall. Brushed stainless, ~4.5 cm tall plateau.
     Per sink-1 / sink-3 / sink-4 STEDIA reference photos. */
  {
    const fcShape = new THREE.Shape();
    const fcW = (sinkW - wallT * 2) * 0.40;   /* back leg length (along back wall) */
    const fcD = (sinkD - wallT * 2) * 0.55;   /* left leg length (along left wall) */
    /* CCW shape: back-left corner → forward into basin → right along back wall.
       After rotation.x = -π/2, shape +X → world +X (right),
       shape -Y → world +Z (forward into basin). */
    fcShape.moveTo(0, 0);
    fcShape.lineTo(0, -fcD);
    fcShape.lineTo(fcW, 0);
    fcShape.lineTo(0, 0);
    const fcGeom = new THREE.ExtrudeGeometry(fcShape, {
      depth: 0.045,                /* plateau height = 4.5 cm above basin floor */
      bevelEnabled: true,
      bevelSize: 0.003,
      bevelThickness: 0.002,
      bevelSegments: 3,
      curveSegments: 8,
    });
    const fc = new THREE.Mesh(fcGeom, matStainlessSink);
    fc.rotation.x = -Math.PI / 2;
    fc.position.set(
      xCenter - (sinkW - wallT * 2) / 2,   /* x = left inner edge */
      innerY + 0.006,                       /* sits on bottom plate (top at innerY+0.006) */
      sinkZ0 + wallT                        /* z = back inner edge */
    );
    fc.castShadow = true; fc.receiveShadow = true;
    g.add(fc);
  }

  /* Strainer ring — chrome rim that sits on the basin floor around the hole */
  const strainerRing = new THREE.Mesh(
    new THREE.RingGeometry(drainHoleR + 0.002, drainStrainerR, 64),
    new THREE.MeshPhysicalMaterial({
      color: 0xc8ccd2, roughness: 0.20, metalness: 0.95,
      clearcoat: 0.5, clearcoatRoughness: 0.1, side: THREE.DoubleSide,
    })
  );
  strainerRing.rotation.x = -Math.PI / 2;
  strainerRing.position.set(drainWorldX, innerY + 0.0065, drainWorldZ);
  g.add(strainerRing);

  /* Drain pipe stub — visible looking down through the hole */
  const drainPipe = new THREE.Mesh(
    new THREE.CylinderGeometry(drainHoleR - 0.001, drainHoleR - 0.001, 0.05, 48, 1, true),
    new THREE.MeshPhysicalMaterial({
      color: 0x1a1a1c, roughness: 0.55, metalness: 0.4, side: THREE.DoubleSide,
    })
  );
  drainPipe.position.set(drainWorldX, innerY - 0.020, drainWorldZ);
  g.add(drainPipe);

  /* Drain bottom plate — sealed bottom of the visible drain pipe */
  const drainBottom = new THREE.Mesh(
    new THREE.CircleGeometry(drainHoleR - 0.001, 48),
    new THREE.MeshStandardMaterial({ color: 0x070708, roughness: 0.9 })
  );
  drainBottom.rotation.x = -Math.PI / 2;
  drainBottom.position.set(drainWorldX, innerY - 0.045, drainWorldZ);
  g.add(drainBottom);

  /* Strainer crosshair grate (3 chrome bars across the opening) */
  for (let i = 0; i < 3; i++) {
    const rib = new THREE.Mesh(
      new THREE.BoxGeometry(drainHoleR * 2 + 0.004, 0.0035, 0.005),
      new THREE.MeshPhysicalMaterial({ color: 0xc8ccd2, roughness: 0.22, metalness: 0.95 })
    );
    rib.position.set(drainWorldX, innerY + 0.005, drainWorldZ);
    rib.rotation.y = (i / 3) * Math.PI;
    g.add(rib);
  }

  /* Wire-rack rails — two parallel chrome rails spanning FRONT-TO-BACK on
     the right side of the basin top, in the back portion. Basket hooks over
     them. Per sink-1 / sink-3 STEDIA reference. */
  const railY = COUNTER_TOP_Y - 0.005;
  const railLen = 0.22;
  const railXc = xCenter + (sinkW / 2) - 0.085;   /* 8.5 cm in from right basin wall */
  const railZc = sinkZ0 + 0.025 + railLen / 2;     /* back portion of basin */
  const railGap = 0.060;                            /* spacing between the two rails */
  for (const dx of [-railGap / 2, +railGap / 2]) {
    const rail = new THREE.Mesh(
      new THREE.CylinderGeometry(0.0025, 0.0025, railLen, 12),
      matChrome
    );
    rail.rotation.x = Math.PI / 2;                  /* cylinder along Z axis */
    rail.position.set(railXc + dx, railY, railZc);
    g.add(rail);
  }

  /* Wire basket sitting on the rails — chrome wire grid hangs at back-right
     of basin. Long axis (Z = depth) along the rails. */
  {
    const basketG = new THREE.Group();
    const bW = 0.075;            /* X width (fits between the two rails) */
    const bD = 0.180;            /* Z depth (along rails) */
    const bH = 0.075;            /* drop below counter */
    const bx0 = -bW / 2, bx1 = bW / 2;
    const bz0 = -bD / 2, bz1 = bD / 2;
    const wireR = 0.0018;

    /* 4 vertical posts */
    for (const [x, z] of [[bx0, bz0], [bx1, bz0], [bx0, bz1], [bx1, bz1]]) {
      const post = new THREE.Mesh(
        new THREE.CylinderGeometry(wireR, wireR, bH, 8),
        matChrome
      );
      post.position.set(x, bH / 2, z);
      basketG.add(post);
    }
    /* Top + bottom rim wires (4 each side) */
    for (const y of [0.001, bH - 0.001]) {
      for (const z of [bz0, bz1]) {
        const w = new THREE.Mesh(
          new THREE.CylinderGeometry(wireR, wireR, bW, 8),
          matChrome
        );
        w.rotation.z = Math.PI / 2;
        w.position.set(0, y, z);
        basketG.add(w);
      }
      for (const x of [bx0, bx1]) {
        const w = new THREE.Mesh(
          new THREE.CylinderGeometry(wireR, wireR, bD, 8),
          matChrome
        );
        w.rotation.x = Math.PI / 2;
        w.position.set(x, y, 0);
        basketG.add(w);
      }
    }
    /* Bottom mesh — 7 cross wires along Z */
    for (let i = 0; i < 7; i++) {
      const t = (i + 0.5) / 7;
      const w = new THREE.Mesh(
        new THREE.CylinderGeometry(wireR, wireR, bW, 8),
        matChrome
      );
      w.rotation.z = Math.PI / 2;
      w.position.set(0, 0.002, bz0 + t * bD);
      basketG.add(w);
    }
    basketG.position.set(railXc, railY - bH + 0.005, railZc);
    g.add(basketG);
  }

  return g;
}

/* ====================================================================== */
/* Faucet — chrome pull-out, arc spout, side handle                       */
/* ====================================================================== */
function makeFaucet(xCenter, zBack) {
  const g = new THREE.Group();
  const baseY = COUNTER_TOP_Y + 0.012;

  /* Base puck on counter (deck mount) — chrome flange */
  const base = new THREE.Mesh(
    new THREE.CylinderGeometry(0.030, 0.034, 0.014, 48),
    matChrome
  );
  base.position.set(xCenter, COUNTER_TOP_Y + 0.007, zBack);
  base.castShadow = true; base.receiveShadow = true;
  g.add(base);

  /* Goose-neck curve: rises straight up from the base, smooth 90° arc forward
     at the top, horizontal spout extending forward into the basin, then bends
     down at the end so the aerator points straight down at the water target.
     Z increases TOWARD the user (sink front). */
  const FZ = 1;     // forward = +Z (into sink)
  const c0 = baseY;
  const NECK_H = 0.230;
  const ARC_R  = 0.090;
  const REACH  = 0.270;   // total forward reach of spout
  const DOWNTURN = 0.085; // descent at end

  const curve = new THREE.CatmullRomCurve3([
    new THREE.Vector3(xCenter, c0,                    zBack),
    new THREE.Vector3(xCenter, c0 + 0.060,            zBack),
    new THREE.Vector3(xCenter, c0 + 0.150,            zBack),
    new THREE.Vector3(xCenter, c0 + NECK_H,           zBack),
    new THREE.Vector3(xCenter, c0 + NECK_H + ARC_R*0.8, zBack + ARC_R * 0.3 * FZ),
    new THREE.Vector3(xCenter, c0 + NECK_H + ARC_R,   zBack + ARC_R * FZ),
    new THREE.Vector3(xCenter, c0 + NECK_H + ARC_R,   zBack + (REACH - 0.04) * FZ),
    new THREE.Vector3(xCenter, c0 + NECK_H + ARC_R - DOWNTURN * 0.55, zBack + (REACH - 0.005) * FZ),
    new THREE.Vector3(xCenter, c0 + NECK_H + ARC_R - DOWNTURN, zBack + REACH * FZ),
  ], false, 'catmullrom', 0.4);

  /* High-tessellation tube — smooth as silk */
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 192, 0.0165, 32, false),
    matChrome
  );
  tube.castShadow = true; tube.receiveShadow = true;
  g.add(tube);

  /* Aerator at the spout end, pointing along the curve's end tangent (down) */
  const tipPos = curve.getPointAt(1);
  const tipTan = curve.getTangentAt(1).normalize();
  const aerator = new THREE.Mesh(
    new THREE.CylinderGeometry(0.0215, 0.0215, 0.026, 36),
    matChrome
  );
  const up = new THREE.Vector3(0, 1, 0);
  const q = new THREE.Quaternion().setFromUnitVectors(up, tipTan);
  aerator.quaternion.copy(q);
  aerator.position.copy(tipPos);
  /* Push the aerator a touch forward along the tangent so it visually attaches */
  aerator.position.add(tipTan.clone().multiplyScalar(0.005));
  aerator.castShadow = true;
  g.add(aerator);

  /* Aerator outlet — slightly darker disc at the very end (looking at the screen) */
  const outlet = new THREE.Mesh(
    new THREE.CircleGeometry(0.0195, 36),
    new THREE.MeshPhysicalMaterial({ color: 0x6a6e74, roughness: 0.55, metalness: 0.6 })
  );
  outlet.quaternion.copy(q);
  /* The circle's normal is +Z by default; we want it facing along tipTan.
     Easier: position it just past the aerator end and set its rotation from tangent. */
  const outletPos = tipPos.clone().add(tipTan.clone().multiplyScalar(0.013));
  outlet.position.copy(outletPos);
  /* Make the disc face along the tangent direction */
  const zAxis = new THREE.Vector3(0, 0, 1);
  const outletQ = new THREE.Quaternion().setFromUnitVectors(zAxis, tipTan);
  outlet.quaternion.copy(outletQ);
  g.add(outlet);

  /* Single side lever — collar buries into the faucet body so it visually
     attaches without a gap. Lever origin sits 4 mm INSIDE the tube surface;
     the collar's inner edge protrudes from there outward. Rotations apply
     around the lever origin (which is buried inside the body), so the lever's
     entire travel pivots around the attachment point. */
  {
    const FAUCET_R = 0.0165;     // tube radius at the neck
    const lever = new THREE.Group();

    /* Pivot collar — short fat cylinder, length 18 mm, axis along lever-local +X.
       Inner end at local x=0 (= lever origin = inside tube). Outer end at x=0.018. */
    const collar = new THREE.Mesh(
      new THREE.CylinderGeometry(0.022, 0.022, 0.022, 36),
      matChrome
    );
    collar.rotation.z = Math.PI / 2;
    collar.position.set(0.011, 0, 0);
    lever.add(collar);

    /* Lever shaft — tapering cylinder starts where collar ends */
    const shaft = new THREE.Mesh(
      new THREE.CylinderGeometry(0.0090, 0.0078, 0.090, 28),
      matChrome
    );
    shaft.rotation.z = Math.PI / 2;
    shaft.position.set(0.022 + 0.045, 0, 0);
    lever.add(shaft);

    /* Rounded tip */
    const tip = new THREE.Mesh(
      new THREE.SphereGeometry(0.0105, 24, 18),
      matChrome
    );
    tip.position.set(0.022 + 0.090 + 0.005, 0, 0);
    lever.add(tip);

    /* Anchor the lever group at the faucet body's right surface — actually 4 mm
       inside, so the collar's inner half is buried and there's no visible gap. */
    lever.position.set(xCenter + FAUCET_R - 0.004, baseY + 0.045, zBack);
    lever.rotation.y = 0.18;
    lever.rotation.z = THREE.MathUtils.degToRad(18);
    g.add(lever);
  }

  return g;
}

/* ====================================================================== */
/* Cooktop — 3-burner gas hob (per ozu-test/interior-images/kitchen/d/    */
/* kitchen-d-19.webp): dark charcoal enamel top, 3 burners with cast-iron */
/* 4-prong grates, chrome burner caps, black grease-catcher across back. */
/* ====================================================================== */
function makeCooktop(xCenter) {
  const g = new THREE.Group();
  const ctW = 0.59;     /* 59 cm wide unit (typical Japanese 3-burner) */
  const ctD = 0.52;     /* 52 cm deep */
  const ctZ0 = 0.07;
  const ctZ1 = ctZ0 + ctD;
  const topY = COUNTER_TOP_Y + 0.008;       /* top surface 8 mm above counter */
  const ctZc = (ctZ0 + ctZ1) / 2;

  /* Materials (local — kept simple, conservative reflectance) */
  const matEnamel = new THREE.MeshPhysicalMaterial({
    color: 0x2e3036, roughness: 0.55, metalness: 0.45,
    clearcoat: 0.25, clearcoatRoughness: 0.30,
    envMapIntensity: 0.6,
  });
  const matCastIron = new THREE.MeshStandardMaterial({
    color: 0x1a1a1c, roughness: 0.85, metalness: 0.30,
  });
  const matBurnerHead = new THREE.MeshStandardMaterial({
    color: 0x2a2a2e, roughness: 0.65, metalness: 0.50,
  });
  const matVent = new THREE.MeshStandardMaterial({
    color: 0x101012, roughness: 0.95, metalness: 0.10,
  });

  /* Top plate — dark charcoal enamel inset into counter */
  const top = new THREE.Mesh(
    roundedBox(ctW, 0.012, ctD, 0.004, 3),
    matEnamel
  );
  top.position.set(xCenter, topY, ctZc);
  top.castShadow = false; top.receiveShadow = true;
  g.add(top);

  /* === High-res AO map baked on A6000 GPU 1 (Cycles + OptiX, see
     kitchen-test/bake/bake_cooktop_ao.py) — captures contact shadows under
     each burner cap, around the grate prongs, and behind the vent slats.
     Wired via uv1 channel on the top plate only. */
  {
    const aoTex = aoLoader.load('kitchen-test/textures/ao/cooktop_top.png');
    aoTex.colorSpace = THREE.NoColorSpace;
    aoTex.wrapS = THREE.ClampToEdgeWrapping;
    aoTex.wrapT = THREE.ClampToEdgeWrapping;
    aoTex.magFilter = THREE.LinearFilter;
    aoTex.minFilter = THREE.LinearMipmapLinearFilter;
    matEnamel.aoMap = aoTex;
    matEnamel.aoMapIntensity = 1.0;
    matEnamel.needsUpdate = true;

    /* Override uv1 on the top plate so the AO map samples by local (x, z). */
    const pos = top.geometry.attributes.position;
    const uv1 = new Float32Array(pos.count * 2);
    for (let i = 0; i < pos.count; i++) {
      const lx = pos.getX(i);
      const lz = pos.getZ(i);
      uv1[i * 2]     = (lx + ctW / 2) / ctW;
      uv1[i * 2 + 1] = (lz + ctD / 2) / ctD;
    }
    top.geometry.setAttribute('uv1', new THREE.BufferAttribute(uv1, 2));
  }

  /* Stainless trim frame (4 sides) around the inset */
  const trimT = 0.012;
  const rimY = topY - 0.001;
  const trims = [
    /* back  */ [ctW + trimT * 2, 0.006, trimT, xCenter, rimY, ctZ0 - trimT / 2],
    /* front */ [ctW + trimT * 2, 0.006, trimT, xCenter, rimY, ctZ1 + trimT / 2],
    /* left  */ [trimT, 0.006, ctD, xCenter - ctW / 2 - trimT / 2, rimY, ctZc],
    /* right */ [trimT, 0.006, ctD, xCenter + ctW / 2 + trimT / 2, rimY, ctZc],
  ];
  for (const [w, h, d, x, y, z] of trims) {
    const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matStainlessBrushed);
    m.position.set(x, y, z);
    m.receiveShadow = true;
    g.add(m);
  }

  /* Back grease-catcher — perforated black mesh strip running across the back.
     Built as a recessed dark base + a row of slim horizontal slats for the
     perforated look. */
  const ventW = ctW * 0.92;
  const ventD = 0.055;
  const ventZ = ctZ0 + ventD / 2 + 0.014;
  {
    /* Recessed dark base */
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(ventW, 0.004, ventD),
      matVent
    );
    base.position.set(xCenter, topY + 0.001, ventZ);
    g.add(base);
    /* 9 slim slats forming the perforated grille */
    const slatGap = ventD / 11;
    for (let i = 0; i < 9; i++) {
      const slat = new THREE.Mesh(
        new THREE.BoxGeometry(ventW * 0.96, 0.0035, slatGap * 0.55),
        matStainlessBrushed
      );
      const slatZ = ventZ - ventD / 2 + slatGap * (i + 1);
      slat.position.set(xCenter, topY + 0.0035, slatZ);
      g.add(slat);
    }
  }

  /* === 3 burners === Per kitchen-d-19.webp:
     - bigger at FRONT-LEFT
     - smaller at BACK-CENTER
     - medium at FRONT-RIGHT */
  const burners = [
    { dx: -0.165, dz: +0.075, gr: 0.085, hr: 0.030 },   /* front-left, biggest */
    { dx:  0.000, dz: -0.115, gr: 0.067, hr: 0.024 },   /* back-center, smallest */
    { dx: +0.150, dz: +0.045, gr: 0.075, hr: 0.027 },   /* front-right, medium */
  ];

  for (const b of burners) {
    const bx = xCenter + b.dx;
    const bz = ctZc + b.dz;

    /* Recessed well — slightly darker ring on the enamel top */
    const well = new THREE.Mesh(
      new THREE.RingGeometry(b.hr + 0.005, b.gr * 0.95, 40),
      new THREE.MeshStandardMaterial({
        color: 0x1a1c20, roughness: 0.85, metalness: 0.25, side: THREE.DoubleSide
      })
    );
    well.rotation.x = -Math.PI / 2;
    well.position.set(bx, topY + 0.0065, bz);
    g.add(well);

    /* Chrome burner cap — short cylinder rising from the well */
    const cap = new THREE.Mesh(
      new THREE.CylinderGeometry(b.hr, b.hr, 0.012, 32),
      matChrome
    );
    cap.position.set(bx, topY + 0.013, bz);
    g.add(cap);

    /* Burner head dome on top of cap — slightly smaller, darker */
    const head = new THREE.Mesh(
      new THREE.CylinderGeometry(b.hr * 0.85, b.hr * 0.85, 0.008, 24),
      matBurnerHead
    );
    head.position.set(bx, topY + 0.022, bz);
    g.add(head);

    /* Spark igniter — 2 chrome pins offset from center, one taller */
    {
      const pin1 = new THREE.Mesh(
        new THREE.CylinderGeometry(0.0022, 0.0022, 0.014, 12),
        matChrome
      );
      pin1.position.set(bx + 0.004, topY + 0.030, bz);
      g.add(pin1);
      const pin2 = new THREE.Mesh(
        new THREE.CylinderGeometry(0.0022, 0.0022, 0.010, 12),
        matChrome
      );
      pin2.position.set(bx - 0.004, topY + 0.028, bz);
      g.add(pin2);
    }

    /* Drilled gas-outlet holes around the perimeter of the burner head — 8
       small dark dots at radius hr*0.7, sitting just below the head's top
       surface to read as drilled apertures. */
    {
      const holeR = b.hr * 0.05;
      const ringR = b.hr * 0.70;
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        const hole = new THREE.Mesh(
          new THREE.CylinderGeometry(holeR, holeR, 0.002, 10),
          matVent
        );
        hole.position.set(
          bx + Math.cos(ang) * ringR,
          topY + 0.0265,
          bz + Math.sin(ang) * ringR
        );
        g.add(hole);
      }
    }

    /* Cast-iron 4-prong grate — 4 flat bars radiating from centre, raised
       above the top plate so pans can sit on them. Each prong: ~3 mm wide,
       1.5 cm tall, length = burner radius. */
    const prongLen = b.gr;
    const prongW = 0.012;
    const prongH = 0.018;
    const prongY = topY + 0.022;
    const angles = [0, Math.PI / 2, Math.PI, 3 * Math.PI / 2];
    for (const a of angles) {
      const prong = new THREE.Mesh(
        new THREE.BoxGeometry(prongLen, prongH, prongW),
        matCastIron
      );
      /* Build prong along +X by default; rotate around Y to point in direction `a`.
         Translate so the inner end starts ~hr from centre. */
      prong.position.set(
        bx + Math.cos(a) * (b.hr + prongLen / 2 - 0.005),
        prongY,
        bz + Math.sin(a) * (b.hr + prongLen / 2 - 0.005)
      );
      prong.rotation.y = -a;
      prong.castShadow = true; prong.receiveShadow = true;
      g.add(prong);
    }

    /* Inner ring connecting prongs at burner edge — gives the grate a finished look */
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(b.hr + 0.002, 0.003, 8, 32),
      matCastIron
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.set(bx, prongY + 0.005, bz);
    g.add(ring);
  }

  /* === Front control knobs — 3 round knobs on the front face of the cooktop
     unit, accessible by reaching down. One knob per burner. */
  {
    const matKnobBody = new THREE.MeshPhysicalMaterial({
      color: 0x202024, roughness: 0.45, metalness: 0.55,
      clearcoat: 0.30, clearcoatRoughness: 0.20,
      envMapIntensity: 0.55,
    });
    const matKnobMark = new THREE.MeshStandardMaterial({
      color: 0xeeeae3, roughness: 0.6, metalness: 0.0,
    });
    const knobR = 0.018;
    const knobL = 0.018;
    const knobY = COUNTER_TOP_Y - 0.025;
    const knobXs = [xCenter - 0.16, xCenter, xCenter + 0.16];
    for (const kx of knobXs) {
      const body = new THREE.Mesh(
        new THREE.CylinderGeometry(knobR, knobR, knobL, 32),
        matKnobBody
      );
      body.rotation.x = Math.PI / 2;
      body.position.set(kx, knobY, ctZ1 + trimT + knobL / 2);
      g.add(body);
      /* Position-indicator dash on the front face of the knob */
      const mark = new THREE.Mesh(
        new THREE.BoxGeometry(0.002, knobR * 0.7, 0.002),
        matKnobMark
      );
      mark.position.set(kx, knobY + knobR * 0.5, ctZ1 + trimT + knobL + 0.001);
      g.add(mark);
    }
  }

  /* === Brand label — small white plate on the back-right area of the top */
  {
    const matLabel = new THREE.MeshStandardMaterial({
      color: 0xf2f0ec, roughness: 0.7, metalness: 0.0,
    });
    const label = new THREE.Mesh(
      new THREE.BoxGeometry(0.10, 0.0008, 0.025),
      matLabel
    );
    label.position.set(xCenter + ctW / 2 - 0.075, topY + 0.0070, ctZ0 + 0.075);
    g.add(label);
  }

  /* === Screw heads at the 4 corners of the stainless trim frame */
  {
    const matScrew = new THREE.MeshStandardMaterial({
      color: 0x303236, roughness: 0.55, metalness: 0.7,
    });
    const sR = 0.0028;

  return g;
}

/* Fridge — Panasonic NR-E45RY3L-S, 600 × 648 × 1850                       */
/* ====================================================================== */
function makeFridge(xCenter) {
  const g = new THREE.Group();
  const fW = 0.600;
  const fD = 0.648;
  const fH = 1.850;
  const fX0 = xCenter - fW / 2;
  const fZ0 = 0;

  /* Body shell — single back+sides box (won't be visible from front anyway) */
  const shell = new THREE.Mesh(
    roundedBox(fW, fH, fD, 0.004, 4),
    new THREE.MeshPhysicalMaterial({ color: 0xa6a9ae, roughness: 0.5, metalness: 0.7, envMapIntensity: 1.0 })
  );
  shell.position.set(xCenter, fH / 2, fZ0 + fD / 2);
  shell.castShadow = true; shell.receiveShadow = true;
  g.add(shell);

  /* Black recessed seam plinth at very bottom */
  const plinth = new THREE.Mesh(
    new THREE.BoxGeometry(fW + 0.002, 0.045, 0.012),
    fridgePanelMats.fridgePlinth
  );
  plinth.position.set(xCenter, 0.022, fZ0 + fD + 0.001);
  g.add(plinth);

  /* Panel layout (front face only):
     - Top: y=0.93..1.85 — main fridge door (lightest, near-mirror)
     - Upper drawers split: y=0.74..0.93, two halves (chilled / ice)
     - Mid: y=0.36..0.74 — vegetable drawer
     - Bottom: y=0.04..0.36 — lower freezer (darkest)
     Seams ≈ 5 mm dark recess between panels.
  */
  const SEAM_Y = 0.005;

  function frontPanel(yBot, yTop, mat, splitHalves = false) {
    const h = (yTop - yBot) - SEAM_Y;
    const cy = (yBot + yTop) / 2;
    if (splitHalves) {
      const halfW = (fW / 2) - SEAM_Y * 0.5;
      const left = new THREE.Mesh(
        roundedBox(halfW, h, 0.018, 0.0018, 3),
        mat
      );
      left.position.set(xCenter - fW / 4 - SEAM_Y * 0.25, cy, fZ0 + fD + 0.009);
      left.castShadow = true; left.receiveShadow = true;
      g.add(left);
      const right = left.clone();
      right.position.x = xCenter + fW / 4 + SEAM_Y * 0.25;
      g.add(right);
    } else {
      const m = new THREE.Mesh(
        roundedBox(fW - SEAM_Y, h, 0.018, 0.0018, 3),
        mat
      );
      m.position.set(xCenter, cy, fZ0 + fD + 0.009);
      m.castShadow = true; m.receiveShadow = true;
      g.add(m);
    }
  }

  frontPanel(0.93, 1.85, fridgePanelMats.topLight, false);          // top fridge door
  frontPanel(0.74, 0.93, fridgePanelMats.upperMid, true);            // split chilled / ice
  frontPanel(0.36, 0.74, fridgePanelMats.midDrawer, false);          // vegetable
  frontPanel(0.04, 0.36, fridgePanelMats.bottomDeep, false);         // lower freezer

  /* Subtle handle recess line under top door (where fingers tuck in) */
  const handleRecess = new THREE.Mesh(
    new THREE.BoxGeometry(fW * 0.85, 0.020, 0.014),
    new THREE.MeshStandardMaterial({ color: 0x33363a, roughness: 0.55, metalness: 0.5 })
  );
  handleRecess.position.set(xCenter, 0.92, fZ0 + fD + 0.014);
  g.add(handleRecess);

  /* Door pocket for left-opening (right-side handle hint) */
  const handleBar = new THREE.Mesh(
    new THREE.BoxGeometry(0.012, 0.18, 0.014),
    new THREE.MeshStandardMaterial({ color: 0x9099a0, roughness: 0.30, metalness: 0.85 })
  );
  handleBar.position.set(xCenter + fW / 2 - 0.030, 1.50, fZ0 + fD + 0.014);
  g.add(handleBar);

  /* Drawer pull recesses on each lower panel */
  for (const y of [0.74 - 0.025, 0.36 - 0.025]) {
    const pull = new THREE.Mesh(
      new THREE.BoxGeometry(fW * 0.85, 0.012, 0.010),
      new THREE.MeshStandardMaterial({ color: 0x2a2c30, roughness: 0.55, metalness: 0.4 })
    );
    pull.position.set(xCenter, y, fZ0 + fD + 0.012);
    g.add(pull);
  }

  /* Top brand plate */
  const brandPlate = new THREE.Mesh(
    new THREE.PlaneGeometry(0.10, 0.012),
    new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.55 })
  );
  brandPlate.position.set(xCenter, 1.78, fZ0 + fD + 0.0185);
  g.add(brandPlate);

  return g;
}

  const dialMid = new THREE.Mesh(

  );
  dialMid.rotation.x = Math.PI / 2;
  dialMid.position.set(panelX0 + panelW / 2 + 0.005, yBase + mH * 0.55, zFront + 0.006);
  g.add(dialMid);

  const dialBig = new THREE.Mesh(
    new THREE.CylinderGeometry(0.022, 0.022, 0.008, 24),

  );
  dialBig.rotation.x = Math.PI / 2;
  dialBig.position.set(panelX0 + panelW / 2 + 0.005, yBase + mH * 0.32, zFront + 0.006);

  g.add(dialBigRim);

  /* SHARP logo in copper, bottom-left of door */

/* ====================================================================== */
/* Postprocessing — Render → GTAO → Bloom → SMAA → Output                 */
/* ====================================================================== */
const renderTarget = new THREE.WebGLRenderTarget(
  window.innerWidth, window.innerHeight,
  { type: THREE.HalfFloatType, samples: 4 }
);
const composer = new EffectComposer(renderer, renderTarget);
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(window.innerWidth, window.innerHeight);

const renderPass = new RenderPass(scene, camera);
composer.addPass(renderPass);

/* GTAO — ground-truth ambient occlusion for contact shadows in tight corners */
const gtao = new GTAOPass(scene, camera, window.innerWidth, window.innerHeight);
gtao.output = GTAOPass.OUTPUT.Default;
gtao.updateGtaoMaterial({
  radius: 0.25,
  distanceExponent: 1.0,
  thickness: 0.10,
  scale: 1.0,
  samples: 16,
  distanceFallOff: 1.0,
});
composer.addPass(gtao);

/* Bloom — only true emissives (LCD, ceiling fixtures, sky proxy) — no specular pickup */
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.14,   // strength
  0.50,   // radius
  1.05    // threshold (above non-HDR specular peaks)
);
composer.addPass(bloom);

/* SMAA — subpixel-morphological antialiasing on top of MSAA target */
const smaa = new SMAAPass(window.innerWidth, window.innerHeight);
composer.addPass(smaa);

/* Output — applies tone mapping (ACESFilmic) + sRGB encode */
const outputPass = new OutputPass();
composer.addPass(outputPass);

/* ====================================================================== */
/* Hotspot system (reused from earlier kitchen-test)                       */
/* ====================================================================== */
const hotspotsLayer = document.getElementById('hotspots-layer');
const popover       = document.getElementById('popover');
const scrim         = document.getElementById('scrim');
const titleEl       = document.getElementById('popover-title');
const subtitleEl    = document.getElementById('popover-subtitle');
const specsEl       = document.getElementById('popover-specs');
const buyEl         = document.getElementById('popover-buy');
const closeEl       = popover.querySelector('.close');
const arrowEl       = popover.querySelector('.arrow');

const hotspots = [];

function createHotspot(id, product) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'hotspot';
  btn.dataset.id = id;
  btn.setAttribute('aria-label', `Product details for ${product.name}`);
  btn.innerHTML = '<span class="hotspot__dot" aria-hidden="true"></span>';
  const worldPos = new THREE.Vector3(
    product.hotspotPosition.x,
    product.hotspotPosition.y,
    product.hotspotPosition.z,
  );
  btn.addEventListener('click', () => openPopover(id, btn));
  hotspotsLayer.appendChild(btn);
  return { id, product, btn, worldPos };
}

for (const [id, p] of Object.entries(PRODUCTS)) {
  hotspots.push(createHotspot(id, p));
}

function projectToScreen(worldPos) {
  const v = worldPos.clone().project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * window.innerWidth,
    y: (-v.y * 0.5 + 0.5) * window.innerHeight,
    visible: v.z < 1,
  };
}

function updateHotspotPositions() {
  for (const h of hotspots) {
    const s = projectToScreen(h.worldPos);
    if (s.visible) {
      h.btn.style.transform = `translate(${s.x - 22}px, ${s.y - 22}px)`;
      h.btn.style.visibility = '';
    } else {
      h.btn.style.visibility = 'hidden';
    }
  }
}

let openHotspot = null;

function openPopover(id, originBtn) {
  const product = PRODUCTS[id];
  if (!product) return;
  titleEl.textContent = product.name;
  subtitleEl.textContent = product.subtitle || '';
  specsEl.innerHTML = '';
  for (const [k, v] of (product.specs || [])) {
    const li = document.createElement('li');
    const ks = document.createElement('span'); ks.className = 'k'; ks.textContent = k;
    const vs = document.createElement('span'); vs.className = 'v'; vs.textContent = v;
    li.appendChild(ks); li.appendChild(vs);
    specsEl.appendChild(li);
  }
  if (product.buyUrl) {
    buyEl.href = product.buyUrl;
    buyEl.textContent = product.buyLabel || 'View product';
    buyEl.style.display = '';
  } else {
    buyEl.style.display = 'none';
  }
  openHotspot = { id, originBtn };
  scrim.hidden = false;
  popover.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    popover.classList.add('open');
    scrim.classList.add('open');
    updatePopoverPosition();
    closeEl.focus();
  }));
}

function closePopover() {
  if (!openHotspot) return;
  const origin = openHotspot.originBtn;
  popover.classList.remove('open');
  scrim.classList.remove('open');
  popover.classList.remove('flip-down');
  setTimeout(() => {
    popover.hidden = true;
    scrim.hidden = true;
    if (origin) origin.focus();
  }, 250);
  openHotspot = null;
}

function updatePopoverPosition() {
  if (!openHotspot) return;
  if (window.innerWidth < 768) {
    arrowEl.style.display = 'none';
    popover.style.left = ''; popover.style.top = '';
    return;
  }
  arrowEl.style.display = '';
  const h = hotspots.find(x => x.id === openHotspot.id);
  if (!h) return;
  const s = projectToScreen(h.worldPos);
  const popW = popover.offsetWidth;
  const popH = popover.offsetHeight;
  const margin = 16, gap = 14;
  let placeAbove = true;
  let top = s.y - popH - gap;
  if (top < margin) { placeAbove = false; top = s.y + gap; }
  let left = s.x - popW / 2;
  if (left < margin) left = margin;
  if (left + popW > window.innerWidth - margin) left = window.innerWidth - margin - popW;
  popover.style.left = `${left}px`;
  popover.style.top  = `${top}px`;
  popover.classList.toggle('flip-down', !placeAbove);
  const arrowX = Math.max(16, Math.min(popW - 16, s.x - left));
  arrowEl.style.left = `${arrowX - 8}px`;
}

closeEl.addEventListener('click', closePopover);
scrim.addEventListener('click', closePopover);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && openHotspot) { closePopover(); return; }
  if (e.key === 'Tab' && openHotspot) {
    const focusables = popover.querySelectorAll('button, a[href]:not([style*="display: none"])');
    if (focusables.length <= 1) { e.preventDefault(); return; }
    const first = focusables[0], last = focusables[focusables.length - 1];
    if (e.shiftKey && document.activeElement === first) { last.focus(); e.preventDefault(); }
    else if (!e.shiftKey && document.activeElement === last) { first.focus(); e.preventDefault(); }
  }
});
window.addEventListener('resize', () => {
  if (openHotspot) updatePopoverPosition();
});

/* ====================================================================== */
/* OrbitControls (inline — Mac trackpad guard preserved)                  */
/* ====================================================================== */
class OrbitControls {
  constructor(cam, dom) {
    this.cam = cam; this.dom = dom;
    this.target = new THREE.Vector3(2.25, 1.0, 0.5);
    this.sph = new THREE.Spherical();
    this._updateSph();
    this._down = false; this._pan = false;
    this._last = { x: 0, y: 0 };
    dom.addEventListener('mousedown', e => this._onDown(e));
    window.addEventListener('mousemove', e => this._onMove(e));
    window.addEventListener('mouseup',   e => this._onUp(e));
    dom.addEventListener('wheel',     e => this._onWheel(e), { passive: false });
    dom.addEventListener('contextmenu', e => e.preventDefault());
    let lastTouch = null;
    dom.addEventListener('touchstart', e => {
      if (e.touches.length === 1) { lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY }; }
    }, { passive: true });
    dom.addEventListener('touchmove', e => {
      if (e.touches.length === 1 && lastTouch) {
        const dx = e.touches[0].clientX - lastTouch.x;
        const dy = e.touches[0].clientY - lastTouch.y;
        lastTouch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        this.sph.theta -= dx * 0.005;
        this.sph.phi   -= dy * 0.005;
        this.sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, this.sph.phi));
        this.update();
      }
    }, { passive: true });
    dom.addEventListener('touchend', () => { lastTouch = null; });
  }
  _updateSph() {
    const off = new THREE.Vector3().copy(this.cam.position).sub(this.target);
    this.sph.setFromVector3(off);
  }
  _onDown(e) {
    this._down = true;
    this._pan = e.shiftKey || e.button === 2;
    this._last.x = e.clientX; this._last.y = e.clientY;
  }
  _onMove(e) {
    if (!this._down) return;
    const dx = e.clientX - this._last.x;
    const dy = e.clientY - this._last.y;
    this._last.x = e.clientX; this._last.y = e.clientY;
    if (this._pan) {
      const scale = this.sph.radius * 0.002;
      const right = new THREE.Vector3();
      this.cam.getWorldDirection(right);
      right.cross(this.cam.up).normalize();
      const up = new THREE.Vector3(0, 1, 0);
      this.target.addScaledVector(right, -dx * scale);
      this.target.addScaledVector(up, dy * scale);
    } else {
      this.sph.theta -= dx * 0.005;
      this.sph.phi   -= dy * 0.005;
      this.sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, this.sph.phi));
    }
    this.update();
  }
  _onUp() { this._down = false; this._pan = false; this._lastUp = performance.now(); }
  _onWheel(e) {
    e.preventDefault();
    if (this._down) return;
    if (this._lastUp && (performance.now() - this._lastUp) < 400) return;
    const factor = Math.pow(0.95, -e.deltaY * 0.01);
    this.sph.radius = Math.max(1.2, Math.min(20, this.sph.radius * factor));
    this.update();
  }
  update() {
    const off = new THREE.Vector3().setFromSpherical(this.sph);
    this.cam.position.copy(this.target).add(off);
    this.cam.lookAt(this.target);
  }
}
const orbit = new OrbitControls(camera, renderer.domElement);
if (document.documentElement.classList.contains('journey-mode')) {
  orbit.target.setY(camera.position.y);   // raise target to eye height
  orbit._updateSph();                     // recompute cached spherical from new (level) offset
}
orbit.update();

/* ====================================================================== */
/* Debug — alt-click to log world coords                                   */
/* ====================================================================== */
const HINT_BASE = 'click a dot · drag to orbit · wheel to zoom · alt-click any surface to log world coords';
const hintEl = document.getElementById('hint');
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
let downX = 0, downY = 0, dragMoved = false;
renderer.domElement.addEventListener('pointerdown', (e) => {
  downX = e.clientX; downY = e.clientY; dragMoved = false;
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 4) dragMoved = true;
});
renderer.domElement.addEventListener('pointerup', (e) => {
  if (dragMoved) return;
  if (!(e.altKey || e.metaKey)) return;
  ndc.x =  (e.clientX / window.innerWidth)  * 2 - 1;
  ndc.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(scene.children, true);
  if (!hits.length) return;
  const p = hits[0].point;
  const txt = `world: { x: ${p.x.toFixed(3)}, y: ${p.y.toFixed(3)}, z: ${p.z.toFixed(3)} }`;
  console.log(txt);
  hintEl.textContent = txt + '  (logged to console)';
  clearTimeout(hintEl._t);
  hintEl._t = setTimeout(() => { hintEl.textContent = HINT_BASE; }, 4000);
});

/* ====================================================================== */
/* Resize + render loop                                                    */
/* ====================================================================== */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.setSize(window.innerWidth, window.innerHeight);
  gtao.setSize(window.innerWidth, window.innerHeight);
  smaa.setSize(window.innerWidth, window.innerHeight);
});

let _firstFrameDone = false;
function tick() {
  updateHotspotPositions();
  if (openHotspot) updatePopoverPosition();
  composer.render();
  if (!_firstFrameDone) {
    _firstFrameDone = true;
    if (_loadbox) _loadbox.style.display = 'none';
    step('first frame');
  }
  requestAnimationFrame(tick);
}
tick();
</script>
