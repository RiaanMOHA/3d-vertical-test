      const F1_DOORS = [
        { axis: 'X', c: 4.50, a: 0.75, b: 1.35, mat: doorMat },          // kitchen ↔ laundry
        { axis: 'Z', c: 1.80, a: 5.50, b: 6.10, mat: closetDoorMat, type: 'bi-fold' },  // laundry ↔ washroom (white folding/accordion door)
        { axis: 'X', c: 5.40, a: 2.70, b: 3.30, mat: doorMat },          // corridor ↔ bath (door x in bath x-range [1.80, 3.60])
        { axis: 'X', c: 5.40, a: 3.80, b: 4.40, mat: doorMat },          // corridor ↔ toilet-1-f
      ];
      for (const d of F1_DOORS) addDoor(d.axis, d.c, d.a, d.b, 0, F1H, d.mat, d.type);

      // Custom genkan front door — two-tone steel (charcoal upper / dark brown lower) with
      // a vertical glass slit, chrome grip pull, brushed kickplate, and mail slot. Replaces
      // the generic single-panel addDoor that this entry would have produced.
      {
        const FD_X0 = 4.95, FD_X1 = 5.85, FD_Z = D, FD_W = FD_X1 - FD_X0;
        const FD_DT = 0.04, FD_H = 2.0;
        const FD_MID_X = (FD_X0 + FD_X1) / 2;
        // Materials
        const matSteelDark   = new THREE.MeshStandardMaterial({ color: 0x363636, roughness: 0.55, metalness: 0.35 });
        const matWoodLower   = new THREE.MeshStandardMaterial({ color: 0x6a4a2e, roughness: 0.55 });
        const matFrontSlit   = new THREE.MeshPhysicalMaterial({ color: 0xeaf0f4, roughness: 0.10, metalness: 0.0, transmission: 0.85, thickness: 0.005, ior: 1.52 });
        const matChromePull  = new THREE.MeshStandardMaterial({ color: 0xc8cdd2, roughness: 0.18, metalness: 0.9 });
        const matKick        = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.35, metalness: 0.4 });
        const matMailSlot    = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.5, metalness: 0.5 });
        // Door split: vertical glass slit near the right (handle) edge. Main panel left of slit, narrow panel right.
        const splitY = 1.0;            // horizontal two-tone split height
        const slitW  = 0.08;           // glass slit width
        const slitInset = 0.18;        // distance from right edge to slit center
        const slitX = FD_X1 - slitInset;
        const mainW  = (slitX - slitW / 2) - FD_X0;
        const rightW = FD_X1 - (slitX + slitW / 2);
        // Main panel — brown bottom + charcoal top
        const lowerMain = new THREE.Mesh(new THREE.BoxGeometry(mainW, splitY, FD_DT), matWoodLower);
        lowerMain.position.set(FD_X0 + mainW / 2, splitY / 2, FD_Z);
        S.group.add(lowerMain);
        const upperMain = new THREE.Mesh(new THREE.BoxGeometry(mainW, FD_H - splitY, FD_DT), matSteelDark);
        upperMain.position.set(FD_X0 + mainW / 2, (splitY + FD_H) / 2, FD_Z);
        S.group.add(upperMain);
        // Vertical glass slit
        const slit = new THREE.Mesh(new THREE.BoxGeometry(slitW, FD_H, FD_DT * 0.5), matFrontSlit);
        slit.position.set(slitX, FD_H / 2, FD_Z);
        S.group.add(slit);
        // Right narrow panel — same two-tone split
        if (rightW > 0.001) {
          const rightLower = new THREE.Mesh(new THREE.BoxGeometry(rightW, splitY, FD_DT), matWoodLower);
          rightLower.position.set(slitX + slitW / 2 + rightW / 2, splitY / 2, FD_Z);
          S.group.add(rightLower);
          const rightUpper = new THREE.Mesh(new THREE.BoxGeometry(rightW, FD_H - splitY, FD_DT), matSteelDark);
          rightUpper.position.set(slitX + slitW / 2 + rightW / 2, (splitY + FD_H) / 2, FD_Z);
          S.group.add(rightUpper);
        }
        // Vertical chrome grip pull on the exterior face, near the left (hinge-side) edge
        const gripX = FD_X0 + 0.12;
        const gripCenterY = 1.0;
        const gripLen = 0.85;
        const gripBar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, gripLen, 12), matChromePull);
        gripBar.position.set(gripX, gripCenterY, FD_Z + FD_DT / 2 + 0.045);
        S.group.add(gripBar);
        const mountGeom = new THREE.BoxGeometry(0.03, 0.03, 0.045);
        for (const dy of [-1, +1]) {
          const mount = new THREE.Mesh(mountGeom, matChromePull);
          mount.position.set(gripX, gripCenterY + dy * (gripLen / 2 - 0.015), FD_Z + FD_DT / 2 + 0.0225);
          S.group.add(mount);
        }
        // Brushed metal kickplate at the bottom (exterior side)
        const kickplate = new THREE.Mesh(
          new THREE.BoxGeometry(FD_W - 0.02, 0.20, 0.005),
          matKick
        );
        kickplate.position.set(FD_MID_X, 0.11, FD_Z + FD_DT / 2 + 0.003);
        S.group.add(kickplate);
        // Mail slot (yūbinguchi) at chest height, between grip pull and glass slit
        const slot = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.04, FD_DT * 0.6), matMailSlot);
        slot.position.set(FD_X0 + 0.32, 1.15, FD_Z);
        S.group.add(slot);
        // Transom panel above door — wallMat cream filling y=[FD_H, F1H]
        const transomH = F1H - FD_H;
        if (transomH > 0.001) {
          const transom = new THREE.Mesh(new THREE.BoxGeometry(FD_W, transomH, WT), wallMat);
          transom.position.set(FD_MID_X, FD_H + transomH / 2, FD_Z);
          S.group.add(transom);
        }
        // Architrave (door casing) — matches the trim added to every other door
        const casW = 0.07, casD = 0.012;
        for (const sign of [-1, +1]) {
          const off = sign * (WT / 2 + casD / 2);
          for (const edge of [FD_X0 - casW / 2, FD_X1 + casW / 2]) {
            const jamb = new THREE.Mesh(new THREE.BoxGeometry(casW, FD_H + casW, casD), trimMat);
            jamb.position.set(edge, (FD_H + casW) / 2, FD_Z + off);
            S.group.add(jamb);
          }
          const head = new THREE.Mesh(new THREE.BoxGeometry(FD_W + 2 * casW, casW, casD), trimMat);
          head.position.set(FD_MID_X, FD_H + casW / 2, FD_Z + off);
          S.group.add(head);
        }
      }

      const F2_DOORS = [
        // Bedroom closet bi-folds (in central column) — render with center seam + finger pulls
        { axis: 'Z', c: 2.70, a: 1.20, b: 1.80, mat: closetDoorMat, type: 'bi-fold' },    // room-3 ↔ closet_a
        { axis: 'Z', c: 3.60, a: 2.10, b: 2.70, mat: closetDoorMat, type: 'bi-fold' },    // room-4 ↔ closet_b
        { axis: 'Z', c: 2.70, a: 5.10, b: 5.70, mat: closetDoorMat, type: 'bi-fold' },    // room-2 ↔ closet
        { axis: 'Z', c: 3.60, a: 4.65, b: 5.25, mat: closetDoorMat, type: 'bi-fold' },    // room-1 ↔ closet
        // Bedroom + toilet entrance doors (from corridor) — hinged
        { axis: 'X', c: 3.60, a: 1.55, b: 2.15, mat: doorMat },          // room-3 entrance
        { axis: 'X', c: 3.60, a: 4.50, b: 5.20, mat: doorMat },          // room-4 entrance
        { axis: 'X', c: 4.50, a: 1.10, b: 1.70, mat: doorMat },          // room-2 entrance
        { axis: 'X', c: 4.50, a: 3.80, b: 4.40, mat: doorMat },          // room-1 entrance
        { axis: 'X', c: 5.85, a: 2.85, b: 3.45, mat: doorMat },          // 2F toilet entrance
      ];
      for (const d of F2_DOORS) addDoor(d.axis, d.c, d.a, d.b, F1H, F2H, d.mat, d.type);

      // ───────────────── BASEBOARDS (巾木) + CROWN MOLDING (回り縁) ─────────────────
      // Universal in JP residential interiors. Thin painted strips along floor + ceiling
      // perimeter inside each room. Door gaps are punched out from the door list so the
      // trim doesn't clip with door panels.
      function _subtractRanges(a, b, cuts) {
        let segs = [[a, b]];
        for (const [c0, c1] of cuts) {
          const next = [];
          for (const [s0, s1] of segs) {
            if (c1 <= s0 || c0 >= s1) { next.push([s0, s1]); continue; }
            if (c0 > s0) next.push([s0, c0]);
            if (c1 < s1) next.push([c1, s1]);
          }
          segs = next;
        }
        return segs;
      }
      function addRoomTrim(x0, z0, x1, z1, yFloor, ceilH, doorList) {
        const baseH = 0.07, crownH = 0.05, trimD = 0.012;
        const inset = WT / 2 + trimD / 2;
        const ix0 = x0 + WT / 2, ix1 = x1 - WT / 2;
        const iz0 = z0 + WT / 2, iz1 = z1 - WT / 2;
        for (const isCeil of [false, true]) {
          const h = isCeil ? crownH : baseH;
          const yMid = isCeil ? (yFloor + ceilH - h / 2) : (yFloor + h / 2);
          // Crown bridges across doorways (transom is solid wall above door panel);
          // baseboard cuts at doors (door panel sits on the floor).
          // South / north sides: walls along X at z=z0 / z=z1 (door axis 'X')
          for (const [zEdge, sign] of [[z0, +1], [z1, -1]]) {
            const cuts = isCeil ? [] : doorList
              .filter(d => d.axis === 'X' && Math.abs(d.c - zEdge) < 0.05)
              .map(d => [d.a, d.b]);
            const segs = _subtractRanges(ix0, ix1, cuts);
            const stripZ = zEdge + sign * inset;
            for (const [a, b] of segs) {
              if (b - a < 0.001) continue;
              const m = new THREE.Mesh(new THREE.BoxGeometry(b - a, h, trimD), trimMat);
              m.position.set((a + b) / 2, yMid, stripZ);
              S.group.add(m);
            }
          }
          // West / east sides: walls along Z at x=x0 / x=x1 (door axis 'Z')
          for (const [xEdge, sign] of [[x0, +1], [x1, -1]]) {
            const cuts = isCeil ? [] : doorList
              .filter(d => d.axis === 'Z' && Math.abs(d.c - xEdge) < 0.05)
              .map(d => [d.a, d.b]);
            const segs = _subtractRanges(iz0, iz1, cuts);
            const stripX = xEdge + sign * inset;
            for (const [a, b] of segs) {
              if (b - a < 0.001) continue;
              const m = new THREE.Mesh(new THREE.BoxGeometry(trimD, h, b - a), trimMat);
              m.position.set(stripX, yMid, (a + b) / 2);
              S.group.add(m);
            }
          }
        }
      }
      // 4 bedrooms — clean rectangles handled by addRoomTrim.
      addRoomTrim(0,    4.50, 2.70, D,    F1H, F2H, F2_DOORS);  // room-2
      addRoomTrim(3.60, 4.50, W,    D,    F1H, F2H, F2_DOORS);  // room-1
      addRoomTrim(0,    0,    2.70, 3.60, F1H, F2H, F2_DOORS);  // room-3
      addRoomTrim(3.60, 0,    W,    3.60, F1H, F2H, F2_DOORS);  // room-4

      // Per-wall trim helper for L-shape rooms (LDK + 1F corridor). axis='X' = wall runs
      // along x at z=c; 'Z' = wall runs along z at x=c. sign = +1 if trim sits on the +c
      // side of the wall, -1 on the -c side.
      function addWallTrim(axis, c, a, b, sign, yFloor, ceilH, cuts) {
        const baseH = 0.07, crownH = 0.05, trimD = 0.012;
        const stripC = c + sign * (WT / 2 + trimD / 2);
        const segs = _subtractRanges(a, b, cuts || []);
        for (const isCeil of [false, true]) {
          const h = isCeil ? crownH : baseH;
          const yMid = isCeil ? (yFloor + ceilH - h / 2) : (yFloor + h / 2);
          for (const [s0, s1] of segs) {
            if (s1 - s0 < 0.001) continue;
            const dimX = axis === 'X' ? (s1 - s0) : trimD;
            const dimZ = axis === 'X' ? trimD : (s1 - s0);
            const px = axis === 'X' ? (s0 + s1) / 2 : stripC;
            const pz = axis === 'X' ? stripC : (s0 + s1) / 2;
            const m = new THREE.Mesh(new THREE.BoxGeometry(dimX, h, dimZ), trimMat);
            m.position.set(px, yMid, pz);
            S.group.add(m);
          }
        }
      }

      // LDK perimeter — outer walls + stair-shaft inner edges + north interior wall
      // (kitchen↔laundry door + LDK↔corridor archway cut out).
      addWallTrim('X', 0,    0,    W,    +1, 0, F1H, []);
      addWallTrim('Z', 0,    0,    4.50, +1, 0, F1H, []);
      addWallTrim('Z', W,    0,    2.90, -1, 0, F1H, []);
      addWallTrim('X', 2.90, 5.40, W,    -1, 0, F1H, []);
      addWallTrim('Z', 5.40, 2.90, 4.50, -1, 0, F1H, []);
      addWallTrim('X', 4.50, 0,    W,    -1, 0, F1H, [[0.75, 1.35], [5.40, 6.10]]);

      // 1F corridor perimeter (x=4.50..W, z=4.50..6.30).
      addWallTrim('X', 4.50, 4.50, W,    +1, 0, F1H, [[5.40, 6.10]]);
      addWallTrim('X', 6.30, 4.50, W,    -1, 0, F1H, [[5.10, 5.80]]);
      addWallTrim('Z', W,    4.50, 6.30, -1, 0, F1H, []);
      addWallTrim('Z', 4.50, 5.40, 5.65, +1, 0, F1H, []);

      // ───────────────── 2F WALL PAINT (taupe-grey overlay) ─────────────────
      // All 2F walls (bedrooms + corridor + toilet) get a taupe-grey paint overlay on
      // the interior face. Door panels (y=[0, 2.0]) and window glass (y=[w.y0, w.y1])
      // are 2D-cut from the paint so transom / sill / lintel solid-wall regions remain
      // painted. Paint Y range sits between the baseboard (yFloor..yFloor+0.07) and
      // crown (yFloor+ceilH-0.05..yFloor+ceilH) bands.
      const bedroomPaintMat = new THREE.MeshStandardMaterial({
        color: 0xafa299, roughness: 0.95,
        polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
      });
      function addWallPaint2F(axis, c, a, b, sign, yFloor, ceilH, doors, windows) {
        const paintD = 0.005;
        const stripC = c + sign * (WT / 2 + paintD / 2);
        const paintYLow = yFloor + 0.07;
        const paintYHigh = yFloor + ceilH - 0.05;
        const DH = 2.0;
        // Build the set of Y boundaries from openings so we can paint each band separately.
        const yBounds = new Set([paintYLow, paintYHigh]);
        if ((doors || []).length) { yBounds.add(yFloor); yBounds.add(yFloor + DH); }
        for (const w of (windows || [])) {
          yBounds.add(yFloor + w.y0);
          yBounds.add(yFloor + w.y1);
        }
        const ys = [...yBounds]
          .filter(y => y >= paintYLow - 1e-6 && y <= paintYHigh + 1e-6)
          .sort((p, q) => p - q);
        for (let i = 0; i < ys.length - 1; i++) {
          const yLow = ys[i], yHigh = ys[i + 1];
          if (yHigh - yLow < 0.001) continue;
          const yC = (yLow + yHigh) / 2;
          const cuts = [];
          for (const d of (doors || [])) {
            if (yLow < yFloor + DH - 1e-6 && yHigh > yFloor + 1e-6) cuts.push([d.a, d.b]);
          }
          for (const w of (windows || [])) {
            if (yLow < yFloor + w.y1 - 1e-6 && yHigh > yFloor + w.y0 + 1e-6) cuts.push([w.a, w.b]);
          }
          const segs = _subtractRanges(a, b, cuts);
          for (const [s0, s1] of segs) {
            if (s1 - s0 < 0.001) continue;
            const dimX = axis === 'X' ? (s1 - s0) : paintD;
            const dimZ = axis === 'X' ? paintD : (s1 - s0);
            const m = new THREE.Mesh(new THREE.BoxGeometry(dimX, yHigh - yLow, dimZ), bedroomPaintMat);
            const px = axis === 'X' ? (s0 + s1) / 2 : stripC;
            const pz = axis === 'X' ? stripC : (s0 + s1) / 2;
            m.position.set(px, yC, pz);
            S.group.add(m);
          }
        }
      }
      function addRoomPaint2F(x0, z0, x1, z1, yFloor, ceilH, doorList, gapsBySide) {
        const ix0 = x0 + WT / 2, ix1 = x1 - WT / 2;
        const iz0 = z0 + WT / 2, iz1 = z1 - WT / 2;
        const filterDoors = (axis, c) => doorList.filter(d => d.axis === axis && Math.abs(d.c - c) < 0.05);
        // South + north (walls along X)
        addWallPaint2F('X', z0, ix0, ix1, +1, yFloor, ceilH, filterDoors('X', z0), gapsBySide.south);
        addWallPaint2F('X', z1, ix0, ix1, -1, yFloor, ceilH, filterDoors('X', z1), gapsBySide.north);
        // West + east (walls along Z)
        addWallPaint2F('Z', x0, iz0, iz1, +1, yFloor, ceilH, filterDoors('Z', x0), gapsBySide.west);
        addWallPaint2F('Z', x1, iz0, iz1, -1, yFloor, ceilH, filterDoors('Z', x1), gapsBySide.east);
      }
      // 4 bedrooms — clean rectangles with windows on outer walls.
      addRoomPaint2F(0,    4.50, 2.70, D,    F1H, F2H, F2_DOORS, { north: [F2_WIN_FRONT[0]], west: [F2_WIN_LEFT[1]] });   // room-2
      addRoomPaint2F(3.60, 4.50, W,    D,    F1H, F2H, F2_DOORS, { north: [F2_WIN_FRONT[2]], east: [F2_WIN_RIGHT[1]] });  // room-1
      addRoomPaint2F(0,    0,    2.70, 3.60, F1H, F2H, F2_DOORS, { south: [F2_WIN_BACK[0]],  west: [F2_WIN_LEFT[0]] });   // room-3
      addRoomPaint2F(3.60, 0,    W,    3.60, F1H, F2H, F2_DOORS, { south: [F2_WIN_BACK[1]],  east: [F2_WIN_RIGHT[0]] });  // room-4

      // 2F toilet — clean rectangle with one front window.
      addRoomPaint2F(2.70, 5.85, 3.60, D, F1H, F2H, F2_DOORS, { north: [F2_WIN_FRONT[1]] });

      // 2F corridor — L-shape, painted per visible wall (skip the open stair-shaft edge).
      const filterF2 = (axis, c) => F2_DOORS.filter(d => d.axis === axis && Math.abs(d.c - c) < 0.05);
      // Main strip (x=2.70..4.725, z=3.60..4.50)
      addWallPaint2F('X', 3.60, 2.70, 4.725, +1, F1H, F2H, filterF2('X', 3.60), []);
      addWallPaint2F('X', 4.50, 3.60, 4.725, -1, F1H, F2H, filterF2('X', 4.50), []);
      addWallPaint2F('Z', 2.70, 3.60, 4.50,  +1, F1H, F2H, [], []);
      // North arm (x=2.70..3.60, z=4.50..5.85)
      addWallPaint2F('X', 5.85, 2.70, 3.60,  -1, F1H, F2H, filterF2('X', 5.85), []);
      addWallPaint2F('Z', 2.70, 4.50, 5.85,  +1, F1H, F2H, filterF2('Z', 2.70), []);
      addWallPaint2F('Z', 3.60, 4.50, 5.85,  -1, F1H, F2H, filterF2('Z', 3.60), []);

      // ───────────────── STAIR SHAFT WALL PAINT (taupe-grey) ─────────────────
      // Photos stairs-1..27 show warm taupe-grey paint throughout the L-shape stair shaft —
      // not the global cream wallMat. Reuses bedroomPaintMat (0xafa299) since the hue matches.
      // 1F lower-flight + winder zone (z=2.90..4.50, full 1F height):
      addWallPaint2F('Z', 5.40, 2.90, 4.50, +1, 0, F1H, [], []);     // east face: corridor partition, paint faces stair
      addWallPaint2F('Z', W,    2.90, 4.50, -1, 0, F1H, [], []);     // west face: exterior wall, paint faces stair
      addWallPaint2F('X', 4.50, 5.40, W,    -1, 0, F1H, [], []);     // north face: laundry/storage partition
      // 2F upper-flight open shaft (z=3.60..4.50, 2F height — no 2F floor here so the shaft is open):
      addWallPaint2F('Z', 4.725, 3.60, 4.50, +1, F1H, F2H, [], []);  // east face: 2F corridor partition
      addWallPaint2F('Z', W,     3.60, 4.50, -1, F1H, F2H, [], []);  // west face: exterior, 2F portion
      addWallPaint2F('X', 4.50,  4.725, W,   -1, F1H, F2H, [], []);  // north face: room-1 partition

      // ───────────────── GENKAN DETAIL (Phase 3) ─────────────────
      // Genkan zone: x=4.50..6.30, z=6.30..D=7.20. Front door at x=4.95..5.85, z=D.
      {
        // Doormat — dark charcoal rectangle just inside the front door, on the sunk genkan tile.
        const matDoormat = new THREE.MeshStandardMaterial({ color: 0x3a3530, roughness: 0.95 });
        const doormat = new THREE.Mesh(new THREE.BoxGeometry(0.90, 0.012, 0.55), matDoormat);
        doormat.position.set(5.40, -0.15 + 0.011, D - 0.32);
        S.group.add(doormat);

        // Shoe storage cabinet (玄関収納) — full-height white bi-fold along the west wall.
        // Blueprint annotation: L=2550 (2.55 m). Spans from corridor's south end (z=4.65)
        // through the genkan to the front wall (z=7.20). 3 bi-fold pairs (6 panels total).
        const cab = { x0: 5.85, x1: 6.20, z0: 4.65, z1: 7.20, y0: 0.05, y1: 2.40 };
        const matCabBody = new THREE.MeshStandardMaterial({ color: 0xf5f3ee, roughness: 0.6 });
        const cabBody = new THREE.Mesh(
          new THREE.BoxGeometry(cab.x1 - cab.x0, cab.y1 - cab.y0, cab.z1 - cab.z0),
          matCabBody
        );
        cabBody.position.set((cab.x0 + cab.x1) / 2, (cab.y0 + cab.y1) / 2, (cab.z0 + cab.z1) / 2);
        S.group.add(cabBody);
        const seamMatGen = new THREE.MeshStandardMaterial({ color: 0xc8bdaf, roughness: 0.7 });
        const PAIR_COUNT = 3;
        const PAIR_LEN = (cab.z1 - cab.z0) / PAIR_COUNT;   // 0.85 m each
        for (let i = 0; i < PAIR_COUNT; i++) {
          const pairCenterZ = cab.z0 + (i + 0.5) * PAIR_LEN;
          // Center fold-seam (where the two panels of a bi-fold pair meet)
          const fold = new THREE.Mesh(
            new THREE.BoxGeometry(0.008, (cab.y1 - cab.y0) * 0.98, 0.012),
            seamMatGen
          );
          fold.position.set(cab.x0 - 0.002, (cab.y0 + cab.y1) / 2, pairCenterZ);
          S.group.add(fold);
          // Two finger-pulls flanking the fold seam
          for (const off of [-0.20, 0.20]) {
            const pull = new THREE.Mesh(new THREE.BoxGeometry(0.010, 0.14, 0.012), doorHandleMat);
            pull.position.set(cab.x0 - 0.008, cab.y1 - 0.40, pairCenterZ + off);
            S.group.add(pull);
          }
          // Section divider between this pair and the next (skip after the last pair)
          if (i < PAIR_COUNT - 1) {
            const dividerZ = cab.z0 + (i + 1) * PAIR_LEN;
            const divider = new THREE.Mesh(
              new THREE.BoxGeometry(0.010, (cab.y1 - cab.y0) * 0.99, 0.018),
              seamMatGen
            );
            divider.position.set(cab.x0 - 0.001, (cab.y0 + cab.y1) / 2, dividerZ);
            S.group.add(divider);
          }
        }

        // Genkan ceiling downlight — single recessed white fixture in the genkan ceiling.
        // Visible in corridor-1/b/corridor-1-b-10 as a round LED face above the entry.
        {
          const matDownlight = new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: 0.7 });
          const matDownlightFace = new THREE.MeshStandardMaterial({
            color: 0xfff4d4, emissive: 0xfff4d4, emissiveIntensity: 0.85
          });
          const dlY = F1H - 0.06;       // just below the genkan ceiling
          const dlX = 5.40, dlZ = 6.70; // centered in the genkan zone
          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.020, 20), matDownlight);
          body.position.set(dlX, dlY, dlZ);
          S.group.add(body);
          const face = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.005, 20), matDownlightFace);
          face.position.set(dlX, dlY - 0.011, dlZ);
          S.group.add(face);
        }

        // 3-hook coat rack on entry-wall (z=D), west of front door (real-world west).
        const rackX0 = 5.92, rackX1 = 6.27, rackY = 1.65, rackZ = D - 0.06;
        const matRackBase = new THREE.MeshStandardMaterial({ color: 0xe8e0d2, roughness: 0.85 });
        const rackBase = new THREE.Mesh(
          new THREE.BoxGeometry(rackX1 - rackX0, 0.10, 0.025),
          matRackBase
        );
        rackBase.position.set((rackX0 + rackX1) / 2, rackY, rackZ);
        S.group.add(rackBase);
        const matHook = new THREE.MeshStandardMaterial({ color: 0x2a2520, metalness: 0.3, roughness: 0.5 });
        for (const frac of [0.15, 0.50, 0.85]) {
          const hookX = rackX0 + (rackX1 - rackX0) * frac;
          const hook = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.10, 0.05), matHook);
          hook.position.set(hookX, rackY - 0.025, rackZ - 0.04);
          S.group.add(hook);
        }
      }

      // ───────────────── L-SHAPE STAIR (13 risers: 5 lower + 2 winders + 6 upper) ─────────────────
      // Per blueprint and stairs/room-map.md. Materials match the photos: light maple wood
      // treads + risers + stringer, white-painted wall-mounted handrail, brushed-chrome
      // brackets, white elbow at the L-bend, two parallel dark inlay strips on each nosing.
      const TOTAL_RISERS = 13;
      const RISE = F1H / TOTAL_RISERS;            // 0.192 m
      const TREAD_T = 0.04;
      const NOSING = 0.025;
      const treadMat = new THREE.MeshStandardMaterial({ color: 0xe6cca3, roughness: 0.7 });
      const riserMat = new THREE.MeshStandardMaterial({ color: 0xe0c498, roughness: 0.75 });
      // Carriage + stringer share the tread wood. Photos (stairs-10/13/17/21/27) show one uniform
      // light-maple tone across treads, risers, side panel, and soffit — only the riser face reads
      // a hair darker because it's lit edge-on. Carriage ≈ riserMat (less direct light on undersides);
      // stringer slightly between tread and riser (catches light from multiple angles).
      const carriageMat = new THREE.MeshStandardMaterial({ color: 0xe0c498, roughness: 0.85 });
      const stringerMat = new THREE.MeshStandardMaterial({ color: 0xe2c89e, roughness: 0.7 });
      // Handrail is smooth matte cream/ivory paint — NO visible wood grain. Confirmed across
      // stairs-4, 5, 7, 8, 9, 10, 12, 13, 19, 20, 22, 25 (paint reads uniform; in same frames
      // the wood treads show clear grain figure but the rail does not).
      const handrailMat = new THREE.MeshStandardMaterial({ color: 0xfaf6ee, roughness: 0.55 });
      const handrailBracketMat = new THREE.MeshStandardMaterial({ color: 0xc4c6c8, metalness: 0.7, roughness: 0.3 });
      const nosingMat = new THREE.MeshStandardMaterial({ color: 0x3a2a1a, roughness: 0.6 });

      // Helper: 2 parallel dark inlay grooves on the front edge of a tread (the anti-slip strips
      // visible in stairs-10, stairs-17, stairs-27). Strips are inset 12 mm and 25 mm from the
      // nosing edge, run along the tread's long axis, and stand 3 mm proud of the tread surface.
      function addNosingStrips(yTop, axis, longCenter, longLen, frontEdge, frontDir) {
        // axis 'X' = strips run along x (tread's nosing is parallel to x); frontDir = ±1 sign in z
        // axis 'Z' = strips run along z; frontDir = ±1 sign in x
        const stripT = 0.003, stripW = 0.005, margin = 0.04;
        const offsets = [0.012, 0.025];
        for (const off of offsets) {
          const dimX = axis === 'X' ? (longLen - 2 * margin) : stripW;
          const dimZ = axis === 'X' ? stripW : (longLen - 2 * margin);
          const m = new THREE.Mesh(new THREE.BoxGeometry(dimX, stripT, dimZ), nosingMat);
          const px = axis === 'X' ? longCenter : frontEdge - frontDir * off;
          const pz = axis === 'X' ? frontEdge - frontDir * off : longCenter;
          m.position.set(px, yTop + stripT / 2 - 0.0005, pz);
          S.group.add(m);
        }
      }

      // ── LOWER FLIGHT — 5 risers, climbing +z along the west wall ──
      // Tread depth 0.225 m per blueprint annotation 踏面225. Lower flight occupies the
      // south portion of the 1F shaft; winders fill z=[4.025, 4.50] (0.475 m N–S).
      const LX0 = 5.40, LX1 = W, LXc = (LX0 + LX1) / 2, LW = LX1 - LX0;
      const LZ0 = 2.90;
      const TREAD_LO = 0.225;
      const LZ1 = LZ0 + 5 * TREAD_LO;             // 4.025
      for (let i = 0; i < 5; i++) {
        const yTop = (i + 1) * RISE;
        const z0 = LZ0 + i * TREAD_LO;
        const z1 = z0 + TREAD_LO;
        const tDepth = TREAD_LO + NOSING;
        const tread = new THREE.Mesh(new THREE.BoxGeometry(LW, TREAD_T, tDepth), treadMat);
        tread.position.set(LXc, yTop - TREAD_T / 2, (z0 - NOSING + z1) / 2);
        S.group.add(tread);
        const riser = new THREE.Mesh(new THREE.BoxGeometry(LW, RISE, 0.02), riserMat);
        riser.position.set(LXc, yTop - RISE / 2, z0);
        S.group.add(riser);
        addNosingStrips(yTop, 'X', LXc, LW, z0 - NOSING, -1);
      }
      // Lower flight diagonal soffit wedge (smooth underside).
      {
        const lowerTopY = 5 * RISE - TREAD_T;
        const sh = new THREE.Shape();
        sh.moveTo(LZ0 - NOSING, 0);
        sh.lineTo(LZ1, 0);
        sh.lineTo(LZ1, lowerTopY);
        sh.closePath();
        const geom = new THREE.ExtrudeGeometry(sh, { depth: LW, bevelEnabled: false });
        const wedge = new THREE.Mesh(geom, carriageMat);
        wedge.rotation.y = -Math.PI / 2;
        wedge.position.set(LX0, 0, 0);
        S.group.add(wedge);
      }
      // Lower flight stringer — visible side board on the corridor (LX0) side.
      {
        const ST_T = 0.03;
        const sh = new THREE.Shape();
        sh.moveTo(LZ0 - NOSING, 0);
        sh.lineTo(LZ1, 0);
        sh.lineTo(LZ1, 5 * RISE + 0.05);
        sh.lineTo(LZ0 - NOSING, RISE + 0.05);
        sh.closePath();
        const geom = new THREE.ExtrudeGeometry(sh, { depth: ST_T, bevelEnabled: false });
        const stringer = new THREE.Mesh(geom, stringerMat);
        stringer.rotation.y = -Math.PI / 2;
        stringer.position.set(LX0 - ST_T, 0, 0);
        S.group.add(stringer);
      }

      // ── WINDERS — 2 triangular treads at the L-bend, x=[5.40, W], z=[4.025, 4.50] ──
      // Diagonal split from inside corner (LX0, 4.50) to outside corner (LX1, LZ1=4.025).
      // Winder 6 = SW triangle (climber enters from south); winder 7 = NE triangle (climber
      // exits east into the upper flight). Each climbs 1 RISE.
      const WZ0 = LZ1, WZ1 = 4.50;
      const winderTris = [
        // Winder 6: vertices in CCW order, top y at 6*RISE
        { yTop: 6 * RISE, pts: [[LX0, WZ0], [LX1, WZ0], [LX0, WZ1]] },
        // Winder 7: vertices in CCW order, top y at 7*RISE
        { yTop: 7 * RISE, pts: [[LX1, WZ0], [LX1, WZ1], [LX0, WZ1]] },
      ];
      for (const w of winderTris) {
        const sh = new THREE.Shape();
        sh.moveTo(w.pts[0][0], w.pts[0][1]);
        for (let k = 1; k < w.pts.length; k++) sh.lineTo(w.pts[k][0], w.pts[k][1]);
        sh.closePath();
        const geom = new THREE.ExtrudeGeometry(sh, { depth: TREAD_T, bevelEnabled: false });
        const tread = new THREE.Mesh(geom, treadMat);
        tread.rotation.x = Math.PI / 2;             // shape (px, py) → world (px, _, py)
        tread.position.y = w.yTop;
        S.group.add(tread);
      }
      // Winder risers — winder 6's front face (at z=WZ0=4.025) is the riser climber sees
      // when stepping from lower flight's top tread onto winder 6.
      {
        const winder6Riser = new THREE.Mesh(new THREE.BoxGeometry(LW, RISE, 0.02), riserMat);
        winder6Riser.position.set(LXc, 6 * RISE - RISE / 2, WZ0);
        S.group.add(winder6Riser);
      }
      // Winder 7 riser — vertical strip along the W6/W7 diagonal joint (from outside corner
      // (LX1, WZ0) to inside corner (LX0, WZ1)). Visible in stairs-14, 15, 17 between the two
      // triangular treads.
      {
        const dx = LX0 - LX1, dz = WZ1 - WZ0;
        const w7RiserLen = Math.sqrt(dx * dx + dz * dz);
        const w7Riser = new THREE.Mesh(new THREE.BoxGeometry(w7RiserLen, RISE, 0.02), riserMat);
        w7Riser.rotation.y = Math.atan2(dz, dx);     // rotate so length aligns with diagonal
        w7Riser.position.set((LX0 + LX1) / 2, 7 * RISE - RISE / 2, (WZ0 + WZ1) / 2);
        S.group.add(w7Riser);
      }
      // Winder soffit — extruded triangle for each winder, mirrored vertically below the tread.
      {
        for (const w of winderTris) {
          const sh = new THREE.Shape();
          sh.moveTo(w.pts[0][0], w.pts[0][1]);
          for (let k = 1; k < w.pts.length; k++) sh.lineTo(w.pts[k][0], w.pts[k][1]);
          sh.closePath();
          const soffit = new THREE.Mesh(
            new THREE.ExtrudeGeometry(sh, { depth: w.yTop - TREAD_T, bevelEnabled: false }),
            carriageMat
          );
          soffit.rotation.x = Math.PI / 2;
          soffit.position.y = w.yTop - TREAD_T;
          S.group.add(soffit);
        }
      }

      // ── UPPER FLIGHT — 6 risers, climbing -x along the north wall ──
      // Tread depth 0.2625 m fills the full 2F shaft width (1.575 m / 6). Upper flight starts
      // at y=7*RISE (after winder 7) and tops out at y=13*RISE = F1H.
      const UX1 = W;
      const UPPER_RUN = 1.575;
      const UX0 = UX1 - UPPER_RUN;       // 4.725
      const TREAD_UP = UPPER_RUN / 6;
      const UZ0 = 3.60, UZ1 = 4.50, UZc = (UZ0 + UZ1) / 2, UD = UZ1 - UZ0;
      for (let i = 0; i < 6; i++) {
        const yTop = 7 * RISE + (i + 1) * RISE;
        const x1 = UX1 - i * TREAD_UP;
        const x0 = x1 - TREAD_UP;
        const tDepth = TREAD_UP + NOSING;
        const tread = new THREE.Mesh(new THREE.BoxGeometry(tDepth, TREAD_T, UD), treadMat);
        tread.position.set((x0 + x1 + NOSING) / 2, yTop - TREAD_T / 2, UZc);
        S.group.add(tread);
        const riser = new THREE.Mesh(new THREE.BoxGeometry(0.02, RISE, UD), riserMat);
        riser.position.set(x1, yTop - RISE / 2, UZc);
        S.group.add(riser);
        addNosingStrips(yTop, 'Z', UZc, UD, x1 + NOSING, +1);
      }
      // Upper flight diagonal soffit wedge.
      {
        const upperBottomY = 7 * RISE;
        const upperTopY = 13 * RISE - TREAD_T;
        const sh = new THREE.Shape();
        sh.moveTo(W + NOSING, upperBottomY);
        sh.lineTo(UX0, upperBottomY);
        sh.lineTo(UX0, upperTopY);
        sh.closePath();
        const geom = new THREE.ExtrudeGeometry(sh, { depth: UD, bevelEnabled: false });
        const wedge = new THREE.Mesh(geom, carriageMat);
        wedge.position.set(0, 0, UZ0);
        S.group.add(wedge);
      }
      // Upper flight stringer.
      {
        const ST_T = 0.03;
        const upperBottomY = 7 * RISE;
        // Top edge runs along the line through the tread tops + 5cm overhang. East end sits 5cm
        // above step 8 (8*RISE), west end 5cm above step 13 (13*RISE = F1H). The previous
        // `stringerTopCap = 2.40` left a 15cm gap below step 13 and broke the slope continuity.
        const sh = new THREE.Shape();
        sh.moveTo(W + NOSING, upperBottomY);
        sh.lineTo(UX0, upperBottomY);
        sh.lineTo(UX0, 13 * RISE + 0.05);
        sh.lineTo(W + NOSING, 8 * RISE + 0.05);
        sh.closePath();
        const geom = new THREE.ExtrudeGeometry(sh, { depth: ST_T, bevelEnabled: false });
        const stringer = new THREE.Mesh(geom, stringerMat);
        stringer.position.set(0, 0, UZ0);
        S.group.add(stringer);
      }

      // ── HANDRAILS — white-painted, wall-mounted with brushed-chrome brackets ──
      // Lower flight rail: along the west wall (x=W), inset 0.05 m. Climbs from y=0.85 to
      // y=5*RISE+0.85 over z=[LZ0, LZ1]. Brushed-chrome brackets at 5%/50%/95% of length.
      {
        const HR_R = 0.025, HR_INSET = 0.05;
        const sZ = LZ0, eZ = LZ1;
        const sY = 0.85, eY = 5 * RISE + 0.85;
        const dz = eZ - sZ, dy = eY - sY;
        const len = Math.sqrt(dz * dz + dy * dy);
        const rail = new THREE.Mesh(new THREE.CylinderGeometry(HR_R, HR_R, len, 16), handrailMat);
        rail.rotation.x = Math.atan2(dz, dy);
        rail.position.set(LX1 - HR_INSET, (sY + eY) / 2, (sZ + eZ) / 2);
        S.group.add(rail);
        for (const t of [0.05, 0.5, 0.95]) {
          const z = sZ + t * dz, y = sY + t * dy;
          const BR_R = 0.012, ESC_R = 0.022, ESC_T = 0.004;
          const bracket = new THREE.Mesh(new THREE.CylinderGeometry(BR_R, BR_R, 0.04, 12), handrailBracketMat);
          bracket.rotation.z = Math.PI / 2;
          // Bracket sits flush against the rail's underside — its top tangent meets the rail's
          // bottom tangent (no visible gap, no overlap). Bracket centerline = rail.y - HR_R - BR_R.
          bracket.position.set(LX1 - HR_INSET / 2, y - HR_R - BR_R, z);
          // Escutcheon: flat chrome disc flush against the wall (visible in stairs-25).
          const esc = new THREE.Mesh(new THREE.CylinderGeometry(ESC_R, ESC_R, ESC_T, 16), handrailBracketMat);
          esc.rotation.z = Math.PI / 2;
          esc.position.set(LX1 - ESC_T / 2, y - HR_R - BR_R, z);
          S.group.add(esc);
          S.group.add(bracket);
        }
        // Stub returns to wall at each end
        for (const [stubY, stubZ] of [[sY, sZ], [eY, eZ]]) {
          const stub = new THREE.Mesh(new THREE.CylinderGeometry(HR_R, HR_R, HR_INSET, 16), handrailMat);
          stub.rotation.z = Math.PI / 2;
          stub.position.set(LX1 - HR_INSET / 2, stubY, stubZ);
          S.group.add(stub);
        }
      }
      // Winder rail — short curved-feel section running along the west wall through the winder
      // zone, climbing from 5*RISE+0.85 to 7*RISE+0.85.
      {
        const HR_R = 0.025, HR_INSET = 0.05;
        const sZ = LZ1, eZ = WZ1;
        const sY = 5 * RISE + 0.85, eY = 7 * RISE + 0.85;
        const dz = eZ - sZ, dy = eY - sY;
        const len = Math.sqrt(dz * dz + dy * dy);
        const rail = new THREE.Mesh(new THREE.CylinderGeometry(HR_R, HR_R, len, 16), handrailMat);
        rail.rotation.x = Math.atan2(dz, dy);
        rail.position.set(LX1 - HR_INSET, (sY + eY) / 2, (sZ + eZ) / 2);
        S.group.add(rail);
        // Brushed-chrome cuff/ferrule at the L-bend — photos 6, 7, 12, 13 show a clean mitre
        // joint with a small chrome ring at the meeting point, NOT a painted-ball elbow.
        const cuff = new THREE.Mesh(
          new THREE.TorusGeometry(0.030, 0.005, 8, 20),
          handrailBracketMat
        );
        cuff.rotation.x = Math.PI / 2;
        cuff.position.set(LX1 - HR_INSET, eY, eZ);
        S.group.add(cuff);
      }
      // Upper flight rail: runs along the north wall (z=UZ1=4.50), climbing from 7*RISE+0.85
      // to 13*RISE+0.85 over x=[UX1, UX0].
      {
        const HR_R = 0.025, HR_INSET = 0.05;
        const sX = UX1, eX = UX0;
        const sY = 7 * RISE + 0.85, eY = 13 * RISE + 0.85;
        const dx = eX - sX, dy = eY - sY;
        const len = Math.sqrt(dx * dx + dy * dy);
        const railZ = UZ1 - HR_INSET;
        const rail = new THREE.Mesh(new THREE.CylinderGeometry(HR_R, HR_R, len, 16), handrailMat);
        rail.rotation.z = Math.atan2(-dx, dy);
        rail.position.set((sX + eX) / 2, (sY + eY) / 2, railZ);
        S.group.add(rail);
        for (const t of [0.05, 0.5, 0.95]) {
          const x = sX + t * dx, y = sY + t * dy;
          const BR_R = 0.012, ESC_R = 0.022, ESC_T = 0.004;
          const bracket = new THREE.Mesh(new THREE.CylinderGeometry(BR_R, BR_R, 0.04, 12), handrailBracketMat);
          bracket.rotation.x = Math.PI / 2;
          bracket.position.set(x, y - HR_R - BR_R, railZ + HR_INSET / 2);
          const esc = new THREE.Mesh(new THREE.CylinderGeometry(ESC_R, ESC_R, ESC_T, 16), handrailBracketMat);
          esc.rotation.x = Math.PI / 2;
          esc.position.set(x, y - HR_R - BR_R, UZ1 - ESC_T / 2);
          S.group.add(esc);
          S.group.add(bracket);
        }
        // Stub returns at each end
        for (const [stubX, stubY] of [[sX, sY], [eX, eY]]) {
          const stub = new THREE.Mesh(new THREE.CylinderGeometry(HR_R, HR_R, HR_INSET, 16), handrailMat);
          stub.rotation.x = Math.PI / 2;
          stub.position.set(stubX, stubY, railZ + HR_INSET / 2);
          S.group.add(stub);
        }
      }

      // ───────────────── 2F top-of-stair parapet (Phase 5, safety guard) ─────────────────
      // The 2F stair shaft (x=4.725..W, z=3.60..4.50) opens through a hole in the 2F floor
      // down to the 1F LDK. Its south edge at z=3.60 needs a 1.10 m guard wall; without it
      // the upper landing has an open drop. The matching parapet is documented in
      // blueprints/global-coords.md (stairs 2F, south-wall = parapet, half-height).
      {
        // Parapet body is taupe-grey — matches the stair shaft walls, NOT cream/white. Photos
        // 1, 2, 3, 21 show a uniform taupe surface from floor to cap rail. Same hue as
        // bedroomPaintMat (0xafa299) used for the bedrooms + stair shaft paint overlay.
        const parapetMat = new THREE.MeshStandardMaterial({ color: 0xafa299, roughness: 0.95 });
        // Cap is white-painted (stairs-1, 2, 21) — distinct white reveal on top of the taupe body.
        const capMat = new THREE.MeshStandardMaterial({ color: 0xf5f0e8, roughness: 0.7 });
        const parapetH = 1.10;
        const parapetT = 0.06;
        const parapetX0 = UX0;            // 4.725
        const parapetX1 = W;              // 6.30
        const parapetZ = UZ0;             // 3.60
        const parapet = new THREE.Mesh(
          new THREE.BoxGeometry(parapetX1 - parapetX0, parapetH, parapetT),
          parapetMat
        );
        parapet.position.set((parapetX0 + parapetX1) / 2, F1H + parapetH / 2, parapetZ + parapetT / 2);
        S.group.add(parapet);
        // Wood-stained handrail cap on top of the parapet
        const cap = new THREE.Mesh(
          new THREE.BoxGeometry(parapetX1 - parapetX0, 0.04, 0.10),
          capMat
        );
        cap.position.set((parapetX0 + parapetX1) / 2, F1H + parapetH + 0.02, parapetZ + 0.05);
        S.group.add(cap);
      }

      // ───────────────── FURNITURE PLACEHOLDERS ─────────────────
      // Simple AABB placeholders for fixtures and furniture.
      const matKitchen    = new THREE.MeshStandardMaterial({ color: 0xe0ddd5, roughness: 0.55 });
      const matSofa       = new THREE.MeshStandardMaterial({ color: 0x6a7782, roughness: 0.85 });
      const matCabinet    = new THREE.MeshStandardMaterial({ color: 0xf0ece4, roughness: 0.55 });    // raised-panel cream cabinets
      const matCounterTop = new THREE.MeshStandardMaterial({ color: 0x4a3526, roughness: 0.50 });    // dark wood counter
      const matTVScreen   = new THREE.MeshStandardMaterial({ color: 0x121212, roughness: 0.30 });    // black screen
      function furn(x1, z1, x2, z2, y1, y2, mat) {
        if (x2 <= x1 || z2 <= z1 || y2 <= y1) return;
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(x2 - x1, y2 - y1, z2 - z1),
          mat
        );
        m.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
        S.group.add(m);
      }

      // 1F wet-room fixtures (washroom, laundry, toilet-1-f) — see dedicated block after LDK
      // 1F LDK — layout per living-dining/room-map.md (sofa SW half, dining NE half)
      // Kitchen counter pass-through: 2-piece (base cabinet + counter-top with overhang)
      furn(0,    2.40, 2.55, 2.70, 0.00, 0.78, matCabinet);     // base cabinet (kitchen-side, L=2.55m, depth 0.30m)
      furn(0,    2.25, 2.55, 2.95, 0.78, 0.87, matCounterTop);  // counter-top (depth 0.70m, 0.05m overhang each way)

      // ── Kitchen detail pass — sink + faucet + cooktop + range hood + fridge + upper cabinets + backsplash ──
      {
        const matStainless = new THREE.MeshStandardMaterial({ color: 0xc8c8c8, roughness: 0.32, metalness: 0.7 });
        const matCooktop   = new THREE.MeshStandardMaterial({ color: 0x121214, roughness: 0.20, metalness: 0.2 });
        const matBurner    = new THREE.MeshStandardMaterial({ color: 0x2a2a2c, roughness: 0.55, metalness: 0.3 });
        const matFridge    = new THREE.MeshStandardMaterial({ color: 0xf2f2ee, roughness: 0.45, metalness: 0.05 });
        const matChromeKit = new THREE.MeshStandardMaterial({ color: 0xc8cdd2, roughness: 0.18, metalness: 0.9 });
        // Procedural subway-tile texture — 2 tiles wide × 2 rows tall canvas in running-bond
        // layout, tileable both directions. Physical cycle = 0.300 m × 0.150 m
        // (one tile = 150 mm × 75 mm, grout = 3 px on a 256 px tile = ~2 mm).
        const subwayCanvas = document.createElement('canvas');
        subwayCanvas.width = 512; subwayCanvas.height = 128;
        const sctx = subwayCanvas.getContext('2d');
        sctx.fillStyle = '#cbc5b8';                                     // grout (warm pale grey)
        sctx.fillRect(0, 0, 512, 128);
        sctx.fillStyle = '#f3efe6';                                     // tile face (off-white)
        const G = 3;
        sctx.fillRect(G,         G,        256 - 2 * G, 64 - 2 * G);   // row A, tile 1
        sctx.fillRect(256 + G,   G,        256 - 2 * G, 64 - 2 * G);   // row A, tile 2
        sctx.fillRect(128 + G,   64 + G,   256 - 2 * G, 64 - 2 * G);   // row B, centred tile (offset by 128)
        sctx.fillRect(0,         64 + G,   128 - G,     64 - 2 * G);   // row B, left half-tile
        sctx.fillRect(384 + G,   64 + G,   128 - G,     64 - 2 * G);   // row B, right half-tile
        const subwayBaseTex = new THREE.CanvasTexture(subwayCanvas);
        subwayBaseTex.wrapS = subwayBaseTex.wrapT = THREE.RepeatWrapping;
        subwayBaseTex.anisotropy = 8;
        // Sink basin — recessed steel pan inset into the counter at the east end (x=[0.30, 0.90])
        const sinkX0 = 0.30, sinkX1 = 0.90, sinkZ0 = 2.45, sinkZ1 = 2.65;
        const sinkDepth = 0.18;
        const sinkLip = 0.012;
        // Lip ring on the counter top
        for (const [a, b, c, d, ax] of [
          [sinkX0 - sinkLip, sinkZ0 - sinkLip, sinkX0,            sinkZ1 + sinkLip, 'X'],
          [sinkX1,           sinkZ0 - sinkLip, sinkX1 + sinkLip,  sinkZ1 + sinkLip, 'X'],
          [sinkX0,           sinkZ0 - sinkLip, sinkX1,            sinkZ0,           'X'],
          [sinkX0,           sinkZ1,           sinkX1,            sinkZ1 + sinkLip, 'X'],
        ]) {
          furn(a, b, c, d, 0.86, 0.875, matStainless);
        }
        // Sink walls (4 sides) + bottom
        const sinkBottomY = 0.87 - sinkDepth;
        // bottom
        furn(sinkX0, sinkZ0, sinkX1, sinkZ1, sinkBottomY, sinkBottomY + 0.005, matStainless);
        // 4 walls — thin vertical strips
        furn(sinkX0,         sinkZ0, sinkX0 + 0.005, sinkZ1, sinkBottomY, 0.87, matStainless); // west wall
        furn(sinkX1 - 0.005, sinkZ0, sinkX1,         sinkZ1, sinkBottomY, 0.87, matStainless); // east wall
        furn(sinkX0, sinkZ0,         sinkX1, sinkZ0 + 0.005, sinkBottomY, 0.87, matStainless); // south wall
        furn(sinkX0, sinkZ1 - 0.005, sinkX1, sinkZ1,         sinkBottomY, 0.87, matStainless); // north wall
        // Faucet — chrome riser + arc spout, behind sink
        const faucetX = (sinkX0 + sinkX1) / 2;
        const faucetZ = sinkZ1 + 0.02;
        const faucetRiser = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, 0.20, 12), matChromeKit);
        faucetRiser.position.set(faucetX, 0.97, faucetZ);
        S.group.add(faucetRiser);
        const faucetArm = new THREE.Mesh(new THREE.CylinderGeometry(0.011, 0.011, 0.22, 12), matChromeKit);
        faucetArm.rotation.set(Math.PI / 2, 0, 0);
        faucetArm.position.set(faucetX, 1.07, faucetZ - 0.11);
        S.group.add(faucetArm);
        const faucetSpout = new THREE.Mesh(new THREE.CylinderGeometry(0.010, 0.010, 0.06, 12), matChromeKit);
        faucetSpout.position.set(faucetX, 1.04, sinkZ1 - 0.07);
        S.group.add(faucetSpout);
        const faucetHandle = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.025, 0.025), matChromeKit);
        faucetHandle.position.set(faucetX + 0.06, 0.99, faucetZ);
        S.group.add(faucetHandle);
        // Cooktop — flat IH on the west side of the counter
        const cookX0 = 1.50, cookX1 = 2.20, cookZ0 = 2.45, cookZ1 = 2.65;
        furn(cookX0, cookZ0, cookX1, cookZ1, 0.870, 0.882, matCooktop);
        // 3 burner ring indicators
        const burnerYs = [(cookZ0 + cookZ1) / 2];
        for (const [bx, bz, br] of [
          [cookX0 + 0.18, burnerYs[0], 0.075],
          [cookX0 + 0.40, burnerYs[0] - 0.04, 0.060],
          [cookX0 + 0.55, burnerYs[0] + 0.03, 0.055],
        ]) {
          const ring = new THREE.Mesh(new THREE.CylinderGeometry(br, br, 0.001, 28), matBurner);
          ring.position.set(bx, 0.883, bz);
          S.group.add(ring);
        }
        // Range hood (canopy + duct) — hanging above cooktop
        const hoodX0 = cookX0 - 0.05, hoodX1 = cookX1 + 0.05;
        const hoodZ0 = 2.35, hoodZ1 = 2.85;
        furn(hoodX0, hoodZ0, hoodX1, hoodZ1, 1.85, 2.05, matStainless);
        // Slim front skirt
        furn(hoodX0, hoodZ0, hoodX1, hoodZ0 + 0.04, 1.78, 1.85, matStainless);
        // Duct stub up to ceiling
        const ductMid = (hoodX0 + hoodX1) / 2;
        furn(ductMid - 0.10, 2.45, ductMid + 0.10, 2.65, 2.05, F1H, matStainless);
        // Fridge — tall white box in the NE corner against the back wall (z=4.50)
        const frX0 = 2.05, frX1 = 2.55, frZ0 = 3.85, frZ1 = 4.45;
        furn(frX0, frZ0, frX1, frZ1, 0.00, 1.85, matFridge);
        // Fridge door split — vertical chrome handle
        furn(frX1 - 0.02, frZ0 + 0.05, frX1 - 0.005, frZ1 - 0.05, 1.10, 1.60, matChromeKit);
        // Subtle door seam (top freezer / bottom fridge)
        furn(frX0, frZ0 - 0.001, frX1, frZ0 + 0.002, 1.20, 1.205, matStainless);
        // Upper cabinets along the back wall (z=4.50), at chest-to-overhead height. Skip the
        // door gap (kitchen↔laundry at x=[0.75, 1.35]) and the fridge alcove (x>2.05).
        for (const [a, b] of [[0.10, 0.70], [1.40, 2.00]]) {
          furn(a, 4.40, b, 4.49, 1.55, 2.30, matCabinet);
          // Thin pull on each cabinet door bottom
          furn(a + 0.03, 4.39, a + 0.18, 4.40, 1.60, 1.62, matChromeKit);
          furn(b - 0.18, 4.39, b - 0.03, 4.40, 1.60, 1.62, matChromeKit);
        }
        // Subway-tile backsplash on the back wall (z=4.50), between counter level and the
        // upper cabinet bottom. One textured plate per segment, with per-segment texture
        // clones so repeat counts scale with segment width. Skipped at the door gap.
        for (const [a, b] of [[0, 0.75], [1.35, 2.55]]) {
          const w = b - a, h = 1.55 - 0.87;
          const tex = subwayBaseTex.clone();
          tex.needsUpdate = true;
          tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
          tex.repeat.set(w / 0.300, h / 0.150);
          const mat = new THREE.MeshStandardMaterial({ map: tex, roughness: 0.30 });
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.005), mat);
          m.position.set((a + b) / 2, (0.87 + 1.55) / 2, 4.4975);
          S.group.add(m);
        }
      }
      furn(2.40, 2.80, 3.80, 4.10, 0.00, 0.74, matKitchen);     // dining table — NE half near counter end
      furn(4.00, 0.20, 5.80, 1.10, 0.00, 0.80, matSofa);        // sofa — SW half (large x, small z), faces north toward TV
      furn(4.30, 1.40, 5.50, 2.20, 0.00, 0.40, matKitchen);     // coffee table — in front of sofa
      furn(3.80, 4.10, 5.40, 4.50, 0.00, 0.50, matKitchen);     // TV console — against kitchen-wall, aligned with new sofa centre
      furn(4.30, 4.07, 4.90, 4.10, 0.55, 1.05, matTVScreen);    // TV screen on south face of console (0.60w × 0.50h)
      // LDK east wall — brick accent (overlay on inside face of x=0 wall, z=0..2.40 LDK zone)
      // Window gap matches F1_WIN_LEFT[0] (lower casement at z=1.20..1.46).
      const matBrick   = new THREE.MeshStandardMaterial({ color: 0x9a9a96, roughness: 0.95 });
      const matACUnit  = new THREE.MeshStandardMaterial({ color: 0xe8e6df, roughness: 0.55 });
      const matCurtain = new THREE.MeshStandardMaterial({ color: 0xeee5d2, roughness: 0.95 });
      const brickXc = WT / 2 + 0.01;     // just inside the east wall's inner face
      const brickT  = 0.015;
      for (const [z0, z1] of [[0, 1.20], [1.46, 2.40]]) {
        const len = z1 - z0;
        const m = new THREE.Mesh(new THREE.BoxGeometry(brickT, F1H, len), matBrick);
        m.position.set(brickXc, F1H / 2, (z0 + z1) / 2);
        S.group.add(m);
      }
      // AC unit on brick-wall — body + recessed front grille + bottom vent slit
      const acBody = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.26, 0.85), matACUnit);
      acBody.position.set(0.18, 2.13, 1.95);
      S.group.add(acBody);
      const matACGrille = new THREE.MeshStandardMaterial({ color: 0xd4d0c5, roughness: 0.65 });
      const acGrille = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.18, 0.78), matACGrille);
      acGrille.position.set(0.22, 2.13, 1.95);     // slightly forward, recessed look
      S.group.add(acGrille);
      const matACVent = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.8 });
      const acVent = new THREE.Mesh(new THREE.BoxGeometry(0.21, 0.02, 0.80), matACVent);
      acVent.position.set(0.18, 1.99, 1.95);       // bottom vent slit
      S.group.add(acVent);
      // Curtain in front of LDK east casement — 4 vertical fabric strips with alternating fold offsets
      {
        const stripCount = 4;
        const totalSpan = 0.46;
        const stripDepth = totalSpan / stripCount;
        for (let i = 0; i < stripCount; i++) {
          const zCenter = 1.10 + (i + 0.5) * stripDepth;
          const xOffset = (i % 2) * 0.02;          // alternate forward/back for fold illusion
          const strip = new THREE.Mesh(
            new THREE.BoxGeometry(0.05, 1.15, stripDepth - 0.015),
            matCurtain
          );
          strip.position.set(brickXc + 0.06 + xOffset, 1.375, zCenter);
          S.group.add(strip);
        }
      }
      // Chandelier-style pendants (1 over dining table, 1 over sofa) — sphere + thin cord to ceiling
      const matPendant = new THREE.MeshStandardMaterial({ color: 0xf0dca0, roughness: 0.4, metalness: 0.3, emissive: 0xffe7c0, emissiveIntensity: 0.85 });
      const matCord    = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6 });
      function pendant(x, sphereY, z) {
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.18, 14, 10), matPendant);
        sphere.position.set(x, sphereY, z);
        S.group.add(sphere);
        // cord runs from top of sphere to ceiling
        const cordTop = F1H, cordBot = sphereY + 0.18;
        const cordH = cordTop - cordBot;
        if (cordH > 0.001) {
          const cord = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, cordH, 6), matCord);
          cord.position.set(x, (cordTop + cordBot) / 2, z);
          S.group.add(cord);
        }
      }
      pendant(3.10, 1.55, 3.45);  // dining (above new dining table position)
      pendant(4.90, 1.80, 1.80);  // living area (above coffee table)
      // Antique clock — east of corridor archway on the small wall stub
      furn(6.10, 4.42, 6.25, 4.48, 1.40, 1.80, matBrick);

      // Rounded-silhouette toilet builder (replaces the 3-stacked-boxes placeholder).
      // xc = bowl/tank x centre; zTankBack = back face of the tank (against the wall);
      // yBase = floor level. TOTO/INAX-style elongated bowl + tank-attached hand-wash basin.
      function addRoundedToilet(xc, zTankBack, yBase) {
        const bowlW = 0.36, bowlD = 0.55, bowlH = 0.40;
        const tankW = 0.36, tankD = 0.20, tankH = 0.45, tankOverlap = 0.05;
        const lidT = 0.02;
        const basinR = 0.10, basinH = 0.07;
        const tankCenterZ = zTankBack - tankD / 2;
        const bowlBackZ = zTankBack - tankD + tankOverlap;
        const bowlCenterZ = bowlBackZ - bowlD / 2;
        // Bowl — slightly tapered cylinder, scaled to oval cross-section
        const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.45, bowlH, 24), matToilet);
        bowl.scale.set(bowlW, 1, bowlD);
        bowl.position.set(xc, yBase + bowlH / 2, bowlCenterZ);
        S.group.add(bowl);
        // Closed lid — thin oval disc on top of bowl
        const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, lidT, 24), matToilet);
        lid.scale.set(bowlW * 0.95, 1, bowlD * 0.95);
        lid.position.set(xc, yBase + bowlH + lidT / 2, bowlCenterZ);
        S.group.add(lid);
        // Tank — rectangular box behind bowl
        const tank = new THREE.Mesh(new THREE.BoxGeometry(tankW, tankH, tankD), matToilet);
        tank.position.set(xc, yBase + bowlH + tankH / 2, tankCenterZ);
        S.group.add(tank);
        // Hand-wash basin atop tank — small cylinder
        const basin = new THREE.Mesh(new THREE.CylinderGeometry(basinR, basinR, basinH, 16), matToilet);
        basin.position.set(xc, yBase + bowlH + tankH + basinH / 2, tankCenterZ);
        S.group.add(basin);
      }

      // ─── 1F wet rooms — washroom, laundry, toilet-1-f ───
      // Per interior-images/<room>/room-map.md and blueprints/global-coords.md
      {
        const matBath      = new THREE.MeshStandardMaterial({ color: 0xeeeae3, roughness: 0.4 });
        const matBathDark  = new THREE.MeshStandardMaterial({ color: 0x4a3a30, roughness: 0.7 });
        const matChrome    = new THREE.MeshStandardMaterial({ color: 0xb8bbc0, metalness: 0.7, roughness: 0.25 });
        const matWasher    = new THREE.MeshStandardMaterial({ color: 0xf2f0eb, roughness: 0.55 });
        const matVanityTop = new THREE.MeshStandardMaterial({ color: 0xeeeae3, roughness: 0.5 });
        const matBasin     = new THREE.MeshStandardMaterial({ color: 0xfafaf6, roughness: 0.35 });

        // ── WASHROOM (UB) — code x=1.80..3.60, z=5.40..7.20 ──
        // bath-wall=N(z=7.20 ext), entry-wall=E(x=1.80 to laundry), side-wall=S(z=5.40), end-wall=W(x=3.60 to toilet)
        // Bathtub: long axis E-W along bath-wall, head W (under tap on end-wall), foot E
        furn(1.90, 6.30, 3.50, 7.13, 0.00, 0.55, matBath);          // bathtub shell
        furn(1.85, 7.13, 3.55, 7.15, 0.55, 2.10, matBathDark);      // dark wood-pattern accent strip on bath-wall above tub
        furn(3.45, 6.55, 3.55, 6.75, 0.60, 0.80, matChrome);        // bathtub tap on end-wall
        furn(2.40, 7.11, 2.45, 7.13, 0.80, 1.90, matChrome);        // shower bar on bath-wall
        furn(2.30, 7.05, 2.55, 7.13, 1.85, 1.95, matChrome);        // shower head
        furn(2.20, 5.42, 3.20, 5.45, 1.10, 1.13, matChrome);        // towel rail on side-wall

        // ── LAUNDRY (洗面所) — code x=0..1.80, z=4.50..7.20 ──
        // vanity-wall=E(x=0 ext, brick), bath-wall=W(x=1.80 to washroom), door-wall=S(z=4.50), window-wall=N(z=7.20 ext)
        // (laundry vanity-wall brick removed — photos show plain taupe paint, not brick)
        // Washing machine alcove against vanity-wall, north portion (corner-vanity-window NE)
        furn(0.07, 6.45, 0.67, 7.10, 0.00, 0.95, matWasher);        // washer body
        furn(0.10, 6.48, 0.65, 7.07, 0.95, 1.00, matChrome);        // washer top panel
        // Vanity sink against vanity-wall, south portion (corner-door-vanity SE)
        furn(0.07, 4.60, 0.57, 5.10, 0.00, 0.85, matVanityTop);     // vanity cabinet
        furn(0.07, 4.60, 0.57, 5.10, 0.85, 0.90, matVanityTop);     // countertop
        furn(0.17, 4.75, 0.47, 5.00, 0.90, 0.95, matBasin);         // round basin (approximated)
        furn(0.07, 4.83, 0.13, 4.92, 0.95, 1.15, matChrome);        // faucet
        furn(0.07, 4.80, 0.12, 4.90, 1.55, 1.65, matBath);          // sconce light above vanity

        // ── TOILET-1-F (1F WC) — code x=3.60..4.50, z=5.40..7.20 ──
        // toilet-wall=N(z=7.20 ext), door-wall=S(z=5.40), brick-wall=E(x=3.60 to washroom), side-wall=W(x=4.50)
        furn(3.65, 5.40, 3.67, 7.20, 0.00, 2.50, matBrick);         // brick accent on brick-wall (full)
        addRoundedToilet(4.05, 7.10, 0);                            // bowl + lid + tank + hand-wash basin
        furn(3.67, 6.20, 3.72, 6.30, 0.65, 0.75, matChrome);        // toilet-paper holder on brick-wall
      }

      // 2F rooms
      const FB = F1H;
      // ─── 2F room-4 (寝室) — 6 帖, 2.7×3.6m, code x=3.60..6.30, z=0..3.60 ───
      // Furniture per interior-images/room-4/room-map.md
      {
        const matIron         = new THREE.MeshStandardMaterial({ color: 0x1a1715, metalness: 0.3, roughness: 0.6 });
        const matBedding      = new THREE.MeshStandardMaterial({ color: 0xeeeae0, roughness: 0.95 });
        const matAccentPillow = new THREE.MeshStandardMaterial({ color: 0x6b7e8a, roughness: 0.9 });
        const matWoodLight    = new THREE.MeshStandardMaterial({ color: 0xc8a878, roughness: 0.75 });
        const matWoodDark     = new THREE.MeshStandardMaterial({ color: 0x4a3526, roughness: 0.7 });
        const matBlackMetal   = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, metalness: 0.4, roughness: 0.5 });

        // Iron-frame bed (running N-S along closet-wall side, head N, foot S)
        const bX0 = 4.40, bX1 = 5.40, bZ0 = 0.60, bZ1 = 2.60;
        furn(bX0,      bZ1-0.05, bX1,      bZ1,      FB,        FB + 1.00, matIron);          // headboard
        furn(bX0,      bZ0,      bX1,      bZ0+0.05, FB,        FB + 0.60, matIron);          // footboard
        furn(bX0,      bZ0,      bX0+0.04, bZ1,      FB + 0.20, FB + 0.30, matIron);          // E side rail
        furn(bX1-0.04, bZ0,      bX1,      bZ1,      FB + 0.20, FB + 0.30, matIron);          // W side rail

        const F1_CEIL_UNDER = F1H - CEIL_T;
        addCeilingLight(4.95, 5.85,  F2_CEIL_UNDER);   // room-1
        addCeilingLight(1.35, 5.85,  F2_CEIL_UNDER);   // room-2
        addCeilingLight(1.35, 1.80,  F2_CEIL_UNDER);   // room-3
        addCeilingLight(4.95, 1.80,  F2_CEIL_UNDER);   // room-4
        addCeilingLight(3.15, 6.525, F2_CEIL_UNDER);   // 2F toilet
        addCeilingLight(1.27, 3.30,  F1_CEIL_UNDER);   // kitchen overhead
      }
      // Range-hood task light — thin emissive panel on the hood underside.
      {
        const matHoodTask = new THREE.MeshStandardMaterial({ color: 0xfff8e7, emissive: 0xffeec4, emissiveIntensity: 1.6 });
        const panel = new THREE.Mesh(new THREE.BoxGeometry(0.60, 0.005, 0.30), matHoodTask);
        panel.position.set(1.85, 1.847, 2.60);
        S.group.add(panel);
      }

      // Daylight from the LDK back-wall windows — 2 PointLights just inside the openings,
      // facing into the room, give a soft warm glow that approximates a RectAreaLight
      // (the proper one needs RectAreaLightUniformsLib which isn't inlined on r128).
      const ldkWinKey = new THREE.PointLight(0xfff4e0, 0.7, 8.0, 1.5);
      ldkWinKey.position.set(1.0, 1.0, 0.40);  // garden door 16020 (1.6 × 2.0)
      S.group.add(ldkWinKey);
      const ldkWinFill = new THREE.PointLight(0xfff4e0, 0.4, 6.0, 1.5);
      ldkWinFill.position.set(4.0, 1.45, 0.40); // secondary 16009 (1.6 × 0.9)
      S.group.add(ldkWinFill);
      // ground plane (so orbit-from-below has a backdrop)
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(40, 40),
        new THREE.MeshStandardMaterial({ color: 0x7a7a6a, roughness: 1 })
      );
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = -FLOOR_T - 0.001;
      S.group.add(ground);
    }
  });

  // ---------- OZU-TEST ROOM-1 SCENE (migrated from room-1-3d v4) ----------
  // 2.7 × 2.7 × 2.5 room with sliding window, closet, doorway, AC, frosted window,
  // bed, desk, shelf with X-bracing, chair, 4 pendant lights, openable door.
  registerScene('room-1', {
    orbitPos: new THREE.Vector3(6.5, 4.5, 6.5),
    orbitTarget: new THREE.Vector3(1.35, 1.0, 1.35),
    fpStart: new THREE.Vector3(0.5, 1.6, 0.5),
    fpYaw: -Math.PI / 4,
    bg: 0x1a1b1f,
    fov: 32,
    noFirstPerson: true,
    rooms: [],
    build: function(S) {
      const RW = 2.70, RD = 2.70, RH = 2.50;
      const WT_R = 0.02, FEAT = 0.04, BIAS = 0.003, FRAME_T = 0.07;
      const COL = {
        floor: 0xd4b896, ceiling: 0xf5f0e8, wall: 0xc8c2b8,
        ironDark: 0x1a1715, mattress: 0xf5eedd, deskWood: 0x8b4513,
        chairSeat: 0x6e4628, blackMet: 0x1a1a1a,
        pendantWood: 0xc78845, pendantShade: 0xf0dfb8, doorway: 0x2a2a2a,
      };
      function box(w, h, d, cx, cy, cz, color, extra = {}) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({
            color, roughness: extra.roughness ?? 0.9, metalness: extra.metalness ?? 0,
            emissive: extra.emissive ?? 0x000000, emissiveIntensity: extra.emissiveIntensity ?? 0,
          })
        );
        m.position.set(cx, cy, cz);
        S.group.add(m);
        return m;
      }
      function aabb(r, color, extra) {
        return box(r.x2-r.x1, r.y2-r.y1, r.z2-r.z1,
                   (r.x1+r.x2)/2, (r.y1+r.y2)/2, (r.z1+r.z2)/2, color, extra);
      }
      function feat(axis, innerCoord, inward, dims, mat) {
        const aLen = dims.a2 - dims.a1, bLen = dims.b2 - dims.b1;
        const aC = (dims.a1+dims.a2)/2, bC = (dims.b1+dims.b2)/2;
        // Place the feat so its inner face (closest to wall) sits BIAS away
        // from the wall surface; the rest of FEAT thickness extends INTO the
        // room. Old version centred the box on innerCoord+BIAS, so half the
        // box (FEAT/2 = 20 mm) intersected the wall slab → checkerboard
        // z-fighting band at door/window/closet heights on WebGPU.
        const c = innerCoord + inward * (BIAS + FEAT / 2);
        const m = (mat instanceof THREE.Material)
          ? mat : new THREE.MeshStandardMaterial({ color: mat, roughness: 0.9 });
        let mesh;
        if (axis === 'x') {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(FEAT, bLen, aLen), m);
          mesh.position.set(c, bC, aC);
        } else {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(aLen, bLen, FEAT), m);
          mesh.position.set(aC, bC, c);
        }
        S.group.add(mesh);
      }
      function winFrame(axis, innerCoord, inward, a1, a2, b1, b2, mat) {
        const t = FRAME_T;
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a2+t, b1: b2,   b2: b2+t }, mat);
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a2+t, b1: b1-t, b2: b1   }, mat);
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a1,   b1: b1,   b2: b2   }, mat);
        feat(axis, innerCoord, inward, { a1: a2,   a2: a2+t, b1: b1,   b2: b2   }, mat);
      }

      // PBR texture loader (recovered from v4 — assets at ozu-test/room-1-textures/).
      // Each call clones textures so each material has its own UV repeat.
      function pbrMatR1(slug, repU, repV, extras = {}) {
        const loader = new THREE.TextureLoader();
        const base = `ozu-test/room-1-textures/${slug}/${slug}`;
        const map = loader.load(`${base}_diff.jpg`);
        map.colorSpace = THREE.SRGBColorSpace;
        const normalMap = loader.load(`${base}_nor_gl.jpg`);
        const roughnessMap = loader.load(`${base}_rough.jpg`);
        const aniso = renderer.capabilities.getMaxAnisotropy();
        for (const t of [map, normalMap, roughnessMap]) {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repU, repV);
          t.anisotropy = aniso;
        }
        return new THREE.MeshStandardMaterial({ map, normalMap, roughnessMap, ...extras });
      }
      // Cloth shader — adds a subtle fresnel-edge "sheen" to fabric materials
      // (pillows, sheet, curtains). r128 has no native sheen; we inject a
      // simple fresnel highlight via onBeforeCompile. Keep strength low —
      // pillows in the room-1 photos are plain smooth fabric, not velvet.
      function applyClothShader(material, sheenColor = 0xfff8ee, sheenStrength = 0.15) {
        const sc = new THREE.Color(sheenColor);
        material.onBeforeCompile = (shader) => {
          shader.uniforms.sheenColor = { value: sc };
          shader.uniforms.sheenStrength = { value: sheenStrength };
          shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>',
              '#include <common>\nuniform vec3 sheenColor;\nuniform float sheenStrength;')
            .replace('#include <output_fragment>',
              'float NoV = max(dot(normalize(vNormal), normalize(vViewPosition)), 0.0);\n' +
              'float fresnel = pow(1.0 - NoV, 4.0);\n' +
              'gl_FragColor.rgb += sheenColor * sheenStrength * fresnel;\n' +
              '#include <output_fragment>');
        };
      }
      // Procedural fabric-weave normal map — tiny analytic plain-weave so
      // pillows / sheet / curtains / lamp shades catch directional light as
      // woven cloth rather than flat plastic. Threads alternate horizontal /
      // vertical in a checkerboard. Scale per-mesh via texture.repeat.
      const fabricNormalTex = (() => {
        const N = 64, cell = 8, half = cell / 2;
        const k = (Math.PI / 2) / half;
        const cvs = document.createElement('canvas');
        cvs.width = N; cvs.height = N;
        const ctx = cvs.getContext('2d');
        const img = ctx.createImageData(N, N);
        for (let y = 0; y < N; y++) {
          for (let x = 0; x < N; x++) {
            const tx = x % cell, ty = y % cell;
            const cellRow = Math.floor(y / cell), cellCol = Math.floor(x / cell);
            const isH = (cellRow + cellCol) % 2 === 0;
            let dhx = 0, dhy = 0;
            if (isH) dhy = -Math.sin((ty - half) * k) * k;
            else     dhx = -Math.sin((tx - half) * k) * k;
            const nx = -dhx, ny = -dhy, nz = 1.0;
            const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
            const i = (y * N + x) * 4;
            img.data[i]     = Math.round((nx / len * 0.5 + 0.5) * 255);
            img.data[i + 1] = Math.round((ny / len * 0.5 + 0.5) * 255);
            img.data[i + 2] = Math.round((nz / len * 0.5 + 0.5) * 255);
            img.data[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(cvs);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
      })();
      function applyFabricWeave(material, repeatU, repeatV, scale = 0.25) {
        const t = fabricNormalTex.clone();
        t.needsUpdate = true;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeatU, repeatV);
        material.normalMap = t;
        material.normalScale = new THREE.Vector2(scale, scale);
        material.needsUpdate = true;
      }
      const matFloorR1 = pbrMatR1('wood_floor',           RW / 1.7, RD / 1.7, { roughness: 0.7 });
      // Whitewashed-plank ceiling — built with plankTex so we get plank seam
      // lines + grain at a pale base colour. Tinting the brown wood_floor map
      // by white can't actually lighten it, hence the procedural texture.
      // Weathered whitewashed plank ceiling — wider shade variance, stronger
      // grain, occasional darker (weathered) plank, and knots.
      const ceilTexR1 = (() => {
        const cvs = document.createElement('canvas');
        cvs.width = 1024; cvs.height = 1024;
        const ctx = cvs.getContext('2d');
        ctx.fillStyle = '#e8dfcf';
        ctx.fillRect(0, 0, 1024, 1024);
        let s = 13;
        const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
        const planks = 9, ph = 1024 / planks;
        for (let i = 0; i < planks; i++) {
          const weather = rnd() < 0.25;
          const shade = weather ? -55 : (rnd() - 0.5) * 26;
          const r = Math.max(0, (232 + shade) | 0);
          const g = Math.max(0, (223 + shade) | 0);
          const b = Math.max(0, (207 + shade) | 0);
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          ctx.fillRect(0, i * ph, 1024, ph);
          ctx.fillStyle = 'rgba(45,30,18,0.55)';
          ctx.fillRect(0, i * ph, 1024, 2);
          ctx.lineWidth = 1;
          for (let j = 0; j < 80; j++) {
            ctx.strokeStyle = `rgba(60,40,22,${0.10 + rnd() * 0.10})`;
            const y = i * ph + rnd() * ph;
            const x1 = rnd() * 1024;
            const x2 = x1 + 60 + rnd() * 220;
            ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y + (rnd() - 0.5) * 3); ctx.stroke();
          }
          const nKnots = (rnd() * 3) | 0;
          for (let k = 0; k < nKnots; k++) {
            const kx = rnd() * 1024;
            const ky = i * ph + ph * (0.3 + rnd() * 0.4);
            const kr = 7 + rnd() * 12;
            const g1 = ctx.createRadialGradient(kx, ky, 0, kx, ky, kr);
            g1.addColorStop(0, 'rgba(60,38,20,0.85)');
            g1.addColorStop(0.6, 'rgba(75,52,28,0.4)');
            g1.addColorStop(1, 'rgba(90,65,40,0)');
            ctx.fillStyle = g1;
            ctx.beginPath(); ctx.ellipse(kx, ky, kr, kr * 0.65, 0, 0, Math.PI * 2); ctx.fill();
          }
        }
        const tex = new THREE.CanvasTexture(cvs);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        // Procedural plank has high-frequency noise (knots, grain, color
        // variation). Mipmapping that on WebGPU produces visible moiré /
        // speckle on the ceiling's top face. Skip mipmaps; sample full-res.
        tex.generateMipmaps = false;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
        return tex;
      })();
      ceilTexR1.repeat.set(1.5, 1.5);
      ceilTexR1.anisotropy = renderer.capabilities.getMaxAnisotropy();
      const matCeilR1 = new THREE.MeshStandardMaterial({ map: ceilTexR1, roughness: 0.85 });
      // Smooth painted walls — neutral cool grey, matches the real photos
      // in interior-images/room-1/. Walls stay on MeshBasicMaterial with
      // toneMapped:false so the LITERAL paint colour `#afa299` is rendered
      // exactly, with no light-direction tint.
      //
      // Corner darkening is added via per-wall AO maps, baked offline by
      // ozu-test/bake/bake_room1_ao.py (Blender Cycles, OptiX on the A6000).
      // Each AO map is a grayscale image where 1.0 = no occlusion (wall
      // middle stays at full paint colour) and lower = corner/edge contact
      // darkening. material.color × material.map gives `#afa299 × ao` per
      // pixel, so middles read as exactly the paint colour and corners
      // darken naturally — without any runtime lighting cost.
      const wallPaintArgs = { color: 0xafa299, toneMapped: false };
      const matWall_x0 = new THREE.MeshBasicMaterial(wallPaintArgs);
      const matWall_xW = new THREE.MeshBasicMaterial(wallPaintArgs);
      const matWall_z0 = new THREE.MeshBasicMaterial(wallPaintArgs);
      const matWall_zD = new THREE.MeshBasicMaterial(wallPaintArgs);
      // Load the four wall AO maps. `NoColorSpace` because AO is linear
      // data, not sRGB image data.
      (function attachWallAO() {
        const aoLoader = new THREE.TextureLoader();
        const maxAniso = renderer.capabilities.getMaxAnisotropy();
        const load = (slug) => {
          const tex = aoLoader.load(`ozu-test/room-1-textures/wall_ao/${slug}.png`);
          tex.colorSpace   = THREE.NoColorSpace;
          tex.anisotropy   = maxAniso;
          // No mipmaps. WebGPU's mipmap filtering produces visible checkerboard
          // quantization at low LODs on AO maps with smooth gradients (the
          // dark-vignette → white-centre gradient banded into ~10 cm blocks at
          // distance). Linear-only sampling preserves the gradient.
          tex.generateMipmaps = false;
          tex.minFilter    = THREE.LinearFilter;
          tex.magFilter    = THREE.LinearFilter;
          tex.wrapS = THREE.ClampToEdgeWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          return tex;
        };
        matWall_x0.map = load('wall_x0');
        matWall_xW.map = load('wall_xW');
        matWall_z0.map = load('wall_z0');
        matWall_zD.map = load('wall_zD');
      })();
      // Real refractive glass — MeshPhysicalMaterial with transmission picks up
      // the room's environment map and gives proper specular highlights.
      const matGlassR1 = new THREE.MeshPhysicalMaterial({
        color: 0xeaf2f6, transparent: true, opacity: 1.0,
        transmission: 1.0, ior: 1.52, thickness: 0.02,
        roughness: 0.04, metalness: 0.0,
      });
      // Frosted privacy glass — three.js r184's MeshPhysicalMaterial blurs
      // transmitted geometry by sampling the transmissionMap based on the
      // material's roughness, so we get true "etched glass" diffusion instead
      // of the previous near-opaque translucent panel. Roughness 0.65 is the
      // moderate sweet spot between "still transparent" (was rejected as too
      // clear) and 1.0 + thickness 0.25 (was rejected as a heavy fog).
      const matFrosted = new THREE.MeshPhysicalMaterial({
        color: 0xf2efe8,
        transparent: true,
        transmission: 1.0,
        roughness: 0.65,
        thickness: 0.04,
        ior: 1.52,
        metalness: 0.0,
        attenuationColor: 0xffffff,
        attenuationDistance: 1.5,
      });
      const matCloset  = new THREE.MeshStandardMaterial({ color: 0xf2ece4, roughness: 0.7 });
      const matFrameR1 = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.6 });
      const matHandle  = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.7, roughness: 0.3 });
      const matSeam    = new THREE.MeshStandardMaterial({ color: 0xbababa });

      // floor + ceiling
      const floor = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.02, RD), matFloorR1);
      floor.position.set(RW/2, -0.01, RD/2); S.group.add(floor);
      const ceil = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.02, RD), matCeilR1);
      ceil.position.set(RW/2, RH + 0.01, RD/2); S.group.add(ceil);

      // 4 walls. Window-wall (wB, x=W) and ac-wall (wD, z=D) are single meshes
      // built from a Shape with a window-shaped hole — no segment seams.
      //
      // Each wall mesh has its UV attribute overridden so the AO texture
      // wraps in world-aligned coordinates that match the bake script's
      // parametric layout (see ozu-test/bake/bake_room1_ao.py). Default
      // UVs from BoxGeometry / ShapeGeometry don't match. Without this
      // override the AO would still appear, just rotated or flipped.
      // For BoxGeometry walls, the "thickness side" faces (top, bottom,
      // ±depth-edge) get DEGENERATE UVs from a single-axis formula (one
      // constant axis). On WebGPU that causes undefined mipmap derivatives →
      // checkerboard / pixelated artifacts on exterior wall surfaces.
      // Pass `mainAxis` ('x'|'y'|'z') so only faces whose normal aligns with
      // that axis get the proper formula; other faces sample the AO centre.
      function setUVsByLocal(geometry, uvFn, mainAxis) {
        const pos = geometry.attributes.position;
        const norm = geometry.attributes.normal;
        const uvs = new Float32Array(pos.count * 2);
        const axisIdx = { x: 0, y: 1, z: 2 }[mainAxis];
        for (let i = 0; i < pos.count; i++) {
          const onMain = (axisIdx === undefined || !norm) ||
            Math.abs([norm.getX(i), norm.getY(i), norm.getZ(i)][axisIdx]) > 0.5;
          if (onMain) {
            const out = uvFn(pos.getX(i), pos.getY(i), pos.getZ(i));
            uvs[i*2 + 0] = out[0];
            uvs[i*2 + 1] = out[1];
          } else {
            uvs[i*2 + 0] = 0.5;
            uvs[i*2 + 1] = 0.5;
          }
        }
        geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      }
      const wA = new THREE.Mesh(new THREE.BoxGeometry(WT_R, RH, RD), matWall_x0);
      wA.position.set(-WT_R/2, RH/2, RD/2); S.group.add(wA);
      // wA inside+outside (±x normal) get the AO map; top/bottom/±z faces
      // sample (0.5, 0.5) — the AO map's bright centre.
      setUVsByLocal(wA.geometry, (lx, ly, lz) => [
        0.5 + ly / RH,
        0.5 + lz / RD,
      ], 'x');
      const wC = new THREE.Mesh(new THREE.BoxGeometry(RW, RH, WT_R), matWall_z0);
      wC.position.set(RW/2, RH/2, -WT_R/2); S.group.add(wC);
      // wC inside+outside (±z normal) only.
      setUVsByLocal(wC.geometry, (lx, ly, lz) => [
        0.5 + lx / RW,
        0.5 + ly / RH,
      ], 'z');
      // Helper: build a flat wall plane with a rectangular hole cut out.
      // Returns a ShapeGeometry sized wallW × wallH with the hole at (hx1,hy1)-(hx2,hy2).
      function wallShapeWithHole(wallW, wallH, hx1, hy1, hx2, hy2) {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0);
        shape.lineTo(wallW, 0);
        shape.lineTo(wallW, wallH);
        shape.lineTo(0, wallH);
        shape.lineTo(0, 0);
        const path = new THREE.Path();
        path.moveTo(hx1, hy1);
        path.lineTo(hx2, hy1);
        path.lineTo(hx2, hy2);
        path.lineTo(hx1, hy2);
        path.lineTo(hx1, hy1);
        shape.holes.push(path);
        return new THREE.ShapeGeometry(shape);
      }
      // Make the segmented walls double-sided so the user can see them from
      // outside the room too (since these are flat single-mesh planes, not boxes).
      matWall_xW.side = THREE.DoubleSide;
      matWall_zD.side = THREE.DoubleSide;
      // window-wall: hole at sliding window z=[0.405, 1.595], y=[0.85, 1.75]
      // ShapeGeometry on (x, y) plane, normal +z; rotate -90° around y so x→z and normal→-x.
      const wB = new THREE.Mesh(wallShapeWithHole(RD, RH, 0.405, 0.85, 1.595, 1.75), matWall_xW);
      wB.rotation.y = -Math.PI/2;
      wB.position.set(RW, 0, 0);
      S.group.add(wB);
      // wB ShapeGeometry default UVs are RAW shape coords (0..RD, 0..RH), not
      // normalized 0..1 — this caused tiled stripes on WebGPU. Normalize.
      setUVsByLocal(wB.geometry, (lx, ly, lz) => [lx / RD, ly / RH]);
