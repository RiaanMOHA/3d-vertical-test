      }

      // Phase 3 — furniture.
      // Cloth-shader + fabric-weave helpers (local-scoped clones of room-1's).
      function applyClothShader(material, sheenColor = 0xfff8ee, sheenStrength = 0.15) {
        const sc = new THREE.Color(sheenColor);
        material.onBeforeCompile = (shader) => {
          shader.uniforms.sheenColor = { value: sc };
          shader.uniforms.sheenStrength = { value: sheenStrength };
          shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>',
              '#include <common>\nuniform vec3 sheenColor;\nuniform float sheenStrength;')
            .replace('#include <output_fragment>',
              'float NoV = max(dot(normalize(vNormal), normalize(vViewPosition)), 0.0);\n' +
              'float fresnel = pow(1.0 - NoV, 4.0);\n' +
              'gl_FragColor.rgb += sheenColor * sheenStrength * fresnel;\n' +
              '#include <output_fragment>');
        };
      }
      const fabricNormalTex = (() => {
        const N = 64, cell = 8, half = cell / 2;
        const k = Math.PI / cell;
        const cvs = document.createElement('canvas');
        cvs.width = N; cvs.height = N;
        const ctx = cvs.getContext('2d');
        const img = ctx.createImageData(N, N);
        for (let y = 0; y < N; y++) {
          for (let x = 0; x < N; x++) {
            const tx = x % cell, ty = y % cell;
            const cellRow = Math.floor(y / cell), cellCol = Math.floor(x / cell);
            const isH = (cellRow + cellCol) % 2 === 0;
            let dhx = 0, dhy = 0;
            if (isH) dhy = -Math.sin((ty - half) * k) * k;
            else     dhx = -Math.sin((tx - half) * k) * k;
            const nx = -dhx, ny = -dhy, nz = 1.0;
            const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
            const i = (y * N + x) * 4;
            img.data[i]     = Math.round((nx / len * 0.5 + 0.5) * 255);
            img.data[i + 1] = Math.round((ny / len * 0.5 + 0.5) * 255);
            img.data[i + 2] = Math.round((nz / len * 0.5 + 0.5) * 255);
            img.data[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(cvs);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return tex;
      })();
      function applyFabricWeave(material, repeatU, repeatV, scale = 0.25) {
        const t = fabricNormalTex.clone();
        t.needsUpdate = true;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeatU, repeatV);
        material.normalMap = t;
        material.normalScale = new THREE.Vector2(scale, scale);
        material.needsUpdate = true;
      }

      // ============================================================
      // Curtains on window-wall (x=RW)
      // ============================================================
      // 2 cream blackout drape columns at z=0.36 and z=1.64, gathered with
      // tieback rings + an inner white sheer covering the window opening only.
      {
        const matCurt = new THREE.MeshStandardMaterial({ color: 0xddd2c0, roughness: 1 });
        const matBand = new THREE.MeshStandardMaterial({ color: 0xc7bba2, roughness: 0.95 });
        applyClothShader(matCurt);
        applyFabricWeave(matCurt, 8, 24, 0.30);
        function flutedColumn(rTop, rBot, height, ridges, depth) {
          const geom = new THREE.CylinderGeometry(rTop, rBot, height, 64, 1, false);
          const pos = geom.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), z = pos.getZ(i);
            const r = Math.hypot(x, z);
            if (r < 1e-6) continue;
            const theta = Math.atan2(z, x);
            const jitter = 0.85 + 0.15 * Math.sin(ridges * theta * 1.5 + 1.7);
            const valley = (1 - Math.cos(ridges * theta)) * 0.5 * jitter;
            const newR = r - depth * valley;
            pos.setX(i, x * newR / r);
            pos.setZ(i, z * newR / r);
          }
          pos.needsUpdate = true;
          geom.computeVertexNormals();
          return geom;
        }
        const cTop = 1.85, cX = RW - 0.10;
        function bunch(zPos, yBot, yTie) {
          const fullH = cTop - yBot;
          const col = new THREE.Mesh(flutedColumn(0.058, 0.080, fullH, 8, 0.025), matCurt);
          col.position.set(cX, (cTop + yBot) / 2, zPos);
          S.group.add(col);
          const band = new THREE.Mesh(new THREE.TorusGeometry(0.098, 0.012, 10, 28), matBand);
          band.position.set(cX, yTie, zPos);
          band.rotation.y = Math.PI / 2;
          S.group.add(band);
        }
        // Both bunches hem at the floor — no furniture intersects the columns.
        bunch(0.36, 0.10, 1.55);
        bunch(1.64, 0.10, 1.30);
        // Inner white sheer covering only the window opening (z=0.405..1.595, y=0.85..1.75)
        {
          const matSheer = new THREE.MeshStandardMaterial({
            color: 0xfafaf4, transparent: true, opacity: 0.55,
            roughness: 1.0, side: THREE.DoubleSide, depthWrite: false,
          });
          applyClothShader(matSheer, 0xffffff, 0.08);
          applyFabricWeave(matSheer, 18, 28, 0.10);
          const sheerY0 = 0.80, sheerY1 = 1.85;
          const sheerZ0 = 0.405, sheerZ1 = 1.595;
          const sheerGeom = new THREE.PlaneGeometry(sheerZ1 - sheerZ0, sheerY1 - sheerY0, 32, 4);
          const pos = sheerGeom.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const lx = pos.getX(i);
            const t = (lx + (sheerZ1 - sheerZ0) / 2) / (sheerZ1 - sheerZ0);
            pos.setZ(i, Math.sin(t * Math.PI * 16) * 0.006 + Math.sin(t * Math.PI * 5.3 + 1.4) * 0.003);
          }
          pos.needsUpdate = true;
          sheerGeom.computeVertexNormals();
          const sheer = new THREE.Mesh(sheerGeom, matSheer);
          sheer.rotation.y = -Math.PI / 2;
          sheer.position.set(RW - 0.14, (sheerY0 + sheerY1) / 2, (sheerZ0 + sheerZ1) / 2);
          sheer.castShadow = false;
          sheer.receiveShadow = false;
          S.group.add(sheer);
        }
      }

      // ============================================================
      // Bed (white iron frame, head in corner of window-wall × ac-wall)
      // ============================================================
      // Long axis along +x. Head against window-wall (high-x edge of frame
      // at bX1≈2.65), foot toward closet-wall (low-x edge at bX0≈0.65).
      // Long side of bed against ac-wall (high-z edge at bZ1≈2.65); 1 m
      // bed width spans z=[1.65, 2.65]. Mattress 0.20 m thick, frame
      // 0.30 m above floor.
      //
      // bX0 < bX1 is preserved so RoundedBoxGeometry widths stay positive;
      // bX1 is the HEAD end (taller posts, decorative tulip bars), bX0 is
      // the FOOT end (shorter posts).
      const bX0 = 0.65, bX1 = 2.65;
      const bZ0 = 1.65, bZ1 = 2.65;
      const FRAME_Y_BOT = 0.30, MAT_TOP = 0.50;
      const mBox = { x1: bX0, x2: bX1, z1: bZ0, z2: bZ1 };
      {
        // Bed iron: Cycles-baked white_iron PBR (painted white iron with
        // subtle brushed grain + paint mottling). metalness 0.25 keeps the
        // painted appearance (lower than raw metal). Unique to room-2 — the
        // only sandbox with white iron bed.
        const matIron = pbrFromBase('ozu-test/room-1-textures/bed/white_iron/white_iron', 1, 1, { metalness: 0.25 });
        // Mattress: Cycles-baked cream_cotton PBR (tight cream cotton weave).
        // Shared across all 4 room sandboxes.
        const matMattress = pbrFromBase('ozu-test/room-1-textures/mattress/cream_cotton/cream_cotton', 2, 2);
        // Mattress (BoxGeometry with rounded edges).
        const mattress = new THREE.Mesh(
          new RoundedBoxGeometry(bX1 - bX0, MAT_TOP - FRAME_Y_BOT, bZ1 - bZ0, 2, 0.015),
          matMattress
        );
        mattress.position.set((bX0 + bX1) / 2, (FRAME_Y_BOT + MAT_TOP) / 2, (bZ0 + bZ1) / 2);
        S.group.add(mattress);
        // 4 corner posts with ball-cap finials.
        const postR = 0.022;
        function cornerPost(cx, cz, topY, capR = 0.038) {
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(postR, postR, topY, 18),
            matIron
          );
          post.position.set(cx, topY / 2, cz);
          S.group.add(post);
          const cap = new THREE.Mesh(new THREE.SphereGeometry(capR, 16, 12), matIron);
          cap.position.set(cx, topY + capR * 0.7, cz);
          S.group.add(cap);
        }
        // Headboard posts (taller, decorative side) at bX1 ≈ 2.65 (against window-wall).
        cornerPost(bX1, bZ0, 1.10);
        cornerPost(bX1, bZ1, 1.10);
        // Footboard posts (shorter) at bX0 ≈ 0.65 (toward closet-wall).
        cornerPost(bX0, bZ0, 0.75);
        cornerPost(bX0, bZ1, 0.75);
        // Headboard rails: 3 horizontal bars connecting the 2 head posts at bX1.
        const railR = 0.012;
        function railZ(yPos, x = bX1) {
          const rail = new THREE.Mesh(
            new THREE.CylinderGeometry(railR, railR, bZ1 - bZ0, 14),
            matIron
          );
          rail.rotation.x = Math.PI / 2;
          rail.position.set(x, yPos, (bZ0 + bZ1) / 2);
          S.group.add(rail);
        }
        railZ(0.32);   // bottom rail (just above mattress base)
        railZ(0.85);   // middle rail
        railZ(1.05);   // top rail (just below ball caps)
        // 5 decorative tulip bars between middle and top rails on the headboard (at bX1).
        // Approximated as thin vertical cylinders with a small sphere "flower" at top.
        for (let i = 0; i < 5; i++) {
          const tz = bZ0 + (bZ1 - bZ0) * (0.18 + 0.16 * i);
          const stem = new THREE.Mesh(
            new THREE.CylinderGeometry(0.006, 0.006, 0.20, 10),
            matIron
          );
          stem.position.set(bX1, 0.95, tz);
          S.group.add(stem);
          const flower = new THREE.Mesh(new THREE.SphereGeometry(0.016, 10, 8), matIron);
          flower.position.set(bX1, 1.04, tz);
          S.group.add(flower);
        }
        // Footboard rails: 2 horizontal bars connecting the 2 foot posts at bX0.
        railZ(0.32, bX0);
        railZ(0.70, bX0);
        // Side rails (long sides of the bed frame) — 2 horizontal bars under the mattress.
        {
          const sideR = 0.014;
          for (const zPos of [bZ0, bZ1]) {
            const sr = new THREE.Mesh(
              new THREE.CylinderGeometry(sideR, sideR, bX1 - bX0, 14),
              matIron
            );
            sr.rotation.z = Math.PI / 2;
            sr.position.set((bX0 + bX1) / 2, 0.32, zPos);
            S.group.add(sr);
          }
        }
        // Sheet — PlaneGeometry covering exact mattress footprint, displaced
        // with multi-octave noise for wrinkles. MeshPhysicalMaterial native sheen.
        {
          function noise2(x, z) {
            let v = 0, amp = 1, total = 0;
            for (let o = 0; o < 4; o++) {
              const fx = x * (2 ** o) * 3.7, fz = z * (2 ** o) * 3.1;
              v += amp * Math.sin(fx + 1.3) * Math.cos(fz + 2.1);
              total += amp; amp *= 0.5;
            }
            return v / total;
          }
          const sheetMat = new THREE.MeshPhysicalMaterial({
            color: 0xf3eedf, roughness: 0.95,
            sheen: 1.0, sheenColor: new THREE.Color(0xfff4dc), sheenRoughness: 0.55,
          });
          const sheetW = bX1 - bX0, sheetD = bZ1 - bZ0;
          const sheetGeom = new THREE.PlaneGeometry(sheetW, sheetD, 96, 48);
          const pos = sheetGeom.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const lx = pos.getX(i), lz = pos.getY(i);
            pos.setZ(i, noise2(lx, lz) * 0.008);
          }
          pos.needsUpdate = true;
          sheetGeom.computeVertexNormals();
          // Clone uv → uv2 for aoMap support (Phase 4 bedding bake).
          sheetGeom.setAttribute('uv2', new THREE.BufferAttribute(
            new Float32Array(sheetGeom.attributes.uv.array), 2
          ));
          const sheet = new THREE.Mesh(sheetGeom, sheetMat);
          sheet.rotation.x = -Math.PI / 2;
          sheet.position.set((bX0 + bX1) / 2, MAT_TOP + 0.005, (bZ0 + bZ1) / 2);
          S.group.add(sheet);
        }
        // Decorative dusty-rose velour pillow at the FOOT end (per photo).
        {
          const matRose = new THREE.MeshPhysicalMaterial({
            color: 0xc4a39c, roughness: 0.9,
            sheen: 1.0, sheenColor: new THREE.Color(0xe8c4be), sheenRoughness: 0.40,
          });
          const cushion = new THREE.Mesh(
            new RoundedBoxGeometry(0.40, 0.12, 0.42, 6, 0.040),
            matRose
          );
          cushion.position.set(bX0 + 0.30, MAT_TOP + 0.06 + 0.005, (bZ0 + bZ1) / 2);
          S.group.add(cushion);
        }
      }

      // ============================================================
      // Desk + chair right next to shelf on entrance-wall, facing ac-wall
      // ============================================================
      // Desk long side flush with entrance-wall (z=0), drawer on +z face.
      // Light-maple tapered legs (4). Chair: tan leather, 5-spoke caster base.
      {
        const dX0 = 0.90, dX1 = 2.10, dZ0 = 0.00, dZ1 = 0.45;
        const dTopY = 0.72, dTopT = 0.025;
        const matDeskTop = new THREE.MeshPhysicalMaterial({
          color: 0xf2efe6,
          roughness: 0.48,
          metalness: 0.0,
          clearcoat: 0.08,
          clearcoatRoughness: 0.2,
          reflectivity: 0.25,
        });
        const matDeskLeg = new THREE.MeshPhysicalMaterial({
          color: 0xd9b88e,
          roughness: 0.64,
          metalness: 0.0,
          clearcoat: 0.05,
          clearcoatRoughness: 0.35,
        });
        const matChair   = new THREE.MeshPhysicalMaterial({
          color: 0xa05b34,
          roughness: 0.52,
          metalness: 0.0,
          sheen: 0.45,
          sheenColor: new THREE.Color(0xe6a07e),
          sheenRoughness: 0.58,
          clearcoat: 0.08,
          clearcoatRoughness: 0.25,
          reflectivity: 0.22,
        });
        const matChairLeg = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.5 });
        // Desk top.
        const topW = dX1 - dX0, topD = dZ1 - dZ0;
        const top = new THREE.Mesh(
          new RoundedBoxGeometry(topW, dTopT, topD, 2, 0.006),
          matDeskTop
        );
        top.position.set((dX0 + dX1) / 2, dTopY - dTopT / 2, (dZ0 + dZ1) / 2);
        S.group.add(top);
        // 4 tapered legs (cylinders with rTop slightly smaller).
        const legH = dTopY - dTopT;
        for (const [lx, lz] of [
          [dX0 + 0.04, dZ0 + 0.04],
          [dX1 - 0.04, dZ0 + 0.04],
          [dX0 + 0.04, dZ1 - 0.04],
          [dX1 - 0.04, dZ1 - 0.04],
        ]) {
          const leg = new THREE.Mesh(
            new THREE.CylinderGeometry(0.014, 0.020, legH, 14),
            matDeskLeg
          );
          leg.position.set(lx, legH / 2, lz);
          S.group.add(leg);
        }
        // Small drawer in the front face (under desk top, on +z face).
        {
          const drwY = dTopY - dTopT - 0.045;
          const drwFace = new THREE.Mesh(
            new THREE.BoxGeometry(topW * 0.55, 0.07, 0.005),
            matDeskTop
          );
          drwFace.position.set((dX0 + dX1) / 2, drwY, dZ1 + 0.001);
          S.group.add(drwFace);
          // Drawer pull (thin chrome bar).
          const pull = new THREE.Mesh(
            new THREE.BoxGeometry(0.090, 0.010, 0.005),
            matHandleR2
          );
          pull.position.set((dX0 + dX1) / 2, drwY, dZ1 + 0.005);
          S.group.add(pull);
        }
        // Chair — tan leather seat + back, 5-spoke caster base.
        {
          const cX = (dX0 + dX1) / 2;  // chair center in front of desk
          const cZ = dZ1 + 0.10; // keep the chair close to the shelf
          // Seat
          const seatY = 0.46;
          const seat = new THREE.Mesh(
            new RoundedBoxGeometry(0.46, 0.06, 0.46, 4, 0.020),
            matChair
          );
          seat.position.set(cX, seatY, cZ);
          S.group.add(seat);
          // Back — tilted backward by ~10°.
          {
            const back = new THREE.Group();
            const backMesh = new THREE.Mesh(
              new RoundedBoxGeometry(0.42, 0.50, 0.06, 4, 0.020),
              matChair
            );
            backMesh.position.set(0, 0.27, 0);
            back.add(backMesh);
            back.position.set(cX, seatY + 0.03, cZ + 0.20);
            back.rotation.x = Math.PI / 16;  // ~11° backward tilt
            S.group.add(back);
          }
          // Central post (gas cylinder).
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(0.024, 0.028, seatY - 0.10, 16),
            matChairLeg
          );
          post.position.set(cX, (seatY - 0.10) / 2 + 0.10, cZ);
          S.group.add(post);
          // 5-spoke base.
          const baseHubY = 0.08;
          const hub = new THREE.Mesh(
            new THREE.CylinderGeometry(0.040, 0.040, 0.030, 16),
            matChairLeg
          );
          hub.position.set(cX, baseHubY, cZ);
          S.group.add(hub);
          for (let i = 0; i < 5; i++) {
            const ang = (i / 5) * Math.PI * 2;
            const spoke = new THREE.Mesh(
              new THREE.BoxGeometry(0.26, 0.022, 0.020),
              matChairLeg
            );
            spoke.position.set(cX + Math.cos(ang) * 0.13, baseHubY, cZ + Math.sin(ang) * 0.13);
            spoke.rotation.y = -ang;
            S.group.add(spoke);
            // Caster wheel at spoke tip.
            const caster = new THREE.Mesh(new THREE.SphereGeometry(0.022, 12, 8), matChairLeg);
            caster.position.set(cX + Math.cos(ang) * 0.26, 0.022, cZ + Math.sin(ang) * 0.26);
            S.group.add(caster);
          }
        }
      }

      // ============================================================
      // Tall grey-blue hutch (a.k.a. the shelf) at corner of
      // entrance-wall × window-wall, facing toward ac-wall (+z)
      // ============================================================
      // Cabinet base (lower) + open shelves (upper) + arched top.
      // Footprint: x=[1.30, 1.90] (0.60 m wide, flush against window-wall),
      // z=[0.00, 0.40] (0.40 m deep, BACK against entrance-wall at z=0).
      // Full height 1.95 m (under crown molding). Front (doors + open
      // shelves + knobs) FACES +z toward the ac-wall — opposite of the
      // original orientation. The `+ cabT/2` / `+ 0.006` offsets below
      // bias the bottom/top/shelves toward the back (low-z) so their
      // FRONT edge sits flush with hZ1 = the user-facing face.
      {
        const hX0 = 2.10, hX1 = 2.65, hZ0 = 0.00, hZ1 = 0.40;
        const hBaseY = 0.95;   // top of cabinet base
        const hTopY  = 1.95;   // top of arch
        // Painted grey-blue PBR maps baked offline on the A6000 via
        // ozu-test/bake/bake_room2_hutch.py. Adds brush-stroke micro-relief,
        // paint mottling, and AO at seams (the box() helpers below still use
        // the old flat color because they create their own materials inline —
        // we override matHutch only for the components that take it directly).
        const matHutch = (() => {
          const loader = new THREE.TextureLoader();
          const base = 'ozu-test/room-2-textures/hutch/painted/painted';
          const map = loader.load(`${base}_albedo.png`);
          map.colorSpace = THREE.SRGBColorSpace;
          const normalMap = loader.load(`${base}_normal.png`);
          const roughnessMap = loader.load(`${base}_roughness.png`);
          const aoMap = loader.load(`${base}_ao.png`);
          const aniso = renderer.capabilities.getMaxAnisotropy();
          for (const t of [map, normalMap, roughnessMap, aoMap]) {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(1, 1);
            t.anisotropy = aniso;
          }
          return new THREE.MeshStandardMaterial({
            map, normalMap, roughnessMap, aoMap,
            aoMapIntensity: 1.0,
          });
        })();
        const matHutchBack = new THREE.MeshStandardMaterial({ color: 0xd8d3ca, roughness: 0.80, metalness: 0.0 });
        const matKnob = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.3 });
        const hW = hX1 - hX0, hD = hZ1 - hZ0;
        const cabT = 0.015;
        // Helper: solid box that reuses the SHARED matHutch PBR material
        // (instead of creating a fresh flat-color material per box() call).
        const hutchBox = (w, h, d, cx, cy, cz) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matHutch);
          m.position.set(cx, cy, cz);
          S.group.add(m);
          return m;
        };
        // Cabinet base — 2 doors on the front (+z face, toward ac-wall)
        // + side panels + back panel at -z (against entrance-wall) + top counter.
        hutchBox(cabT, hBaseY, hD, hX0 + cabT/2, hBaseY/2, (hZ0 + hZ1)/2);
        hutchBox(cabT, hBaseY, hD, hX1 - cabT/2, hBaseY/2, (hZ0 + hZ1)/2);
        hutchBox(hW, hBaseY, cabT, (hX0 + hX1)/2, hBaseY/2, hZ0 + cabT/2);
        hutchBox(hW - 2*cabT, cabT, hD - cabT, (hX0 + hX1)/2, cabT/2, (hZ0 + hZ1)/2 + cabT/2);
        hutchBox(hW + 0.020, cabT * 2, hD + 0.012, (hX0 + hX1)/2, hBaseY + cabT, (hZ0 + hZ1)/2 + 0.006);
        // 2 cabinet doors on the front face (high-z, toward ac-wall).
        const doorH = hBaseY - 0.04, doorY = 0.02 + doorH/2;
        const doorW = (hW - 3*cabT) / 2;
        for (let i = 0; i < 2; i++) {
          const dcx = hX0 + cabT + doorW * (i + 0.5) + cabT * i;
          hutchBox(doorW, doorH, cabT, dcx, doorY, hZ1 - cabT/2 - 0.001);
          const knob = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 10), matKnob);
          knob.position.set(i === 0 ? dcx + doorW/2 - 0.05 : dcx - doorW/2 + 0.05, doorY, hZ1 + 0.001);
          S.group.add(knob);
        }
        // Open shelves above the counter.
        const shelfTopY = hTopY - 0.10;
        const shelfBotY = hBaseY + 0.03;
        const nShelves = 4;
        hutchBox(cabT, shelfTopY - shelfBotY, hD - cabT, hX0 + cabT/2, (shelfBotY + shelfTopY)/2, (hZ0 + hZ1)/2 + cabT/2);
        hutchBox(cabT, shelfTopY - shelfBotY, hD - cabT, hX1 - cabT/2, (shelfBotY + shelfTopY)/2, (hZ0 + hZ1)/2 + cabT/2);
        // Beadboard back panel uses the lighter matHutchBack material.
        {
          const back = new THREE.Mesh(
            new THREE.BoxGeometry(hW - 2*cabT, shelfTopY - shelfBotY, cabT),
            matHutchBack
          );
          back.position.set((hX0 + hX1)/2, (shelfBotY + shelfTopY)/2, hZ0 + cabT/2);
          S.group.add(back);
        }
        for (let i = 0; i < nShelves; i++) {
          const sy = shelfBotY + (shelfTopY - shelfBotY) * (i / (nShelves - 1));
          hutchBox(hW - 2*cabT, 0.012, hD - cabT, (hX0 + hX1)/2, sy, (hZ0 + hZ1)/2 + cabT/2);
        }
        // Arch top approximation.
        hutchBox(hW + 0.020, 0.045, hD + 0.012, (hX0 + hX1)/2, shelfTopY + 0.022, (hZ0 + hZ1)/2 + 0.006);
        hutchBox(hW - 0.10, 0.045, hD + 0.008, (hX0 + hX1)/2, shelfTopY + 0.065, (hZ0 + hZ1)/2 + 0.004);
        hutchBox(hW - 0.20, 0.040, hD + 0.006, (hX0 + hX1)/2, shelfTopY + 0.100, (hZ0 + hZ1)/2 + 0.003);
      }

      // ============================================================
      // AC unit (ac-wall, z=RD, near corner-ac-closet)
      // ============================================================
      // Toshiba split-system body — high on the wall (y≈1.95-2.20),
      // positioned near corner-ac-closet (x=[0.20, 1.00]) — see room-map.md
      // ("wall-mounted AC unit (Toshiba): high on ac-wall, near corner-ac-closet").
      {
        const acX0 = 0.20, acX1 = 1.00, acY0 = 1.95, acY1 = 2.20;
        // AC body: Cycles-baked abs_plastic PBR (smooth white ABS with subtle
        // injection-mold micro-grain). Shared across all 4 rooms.
        const matAC = pbrFromBase('ozu-test/room-1-textures/ac/abs/abs', 1, 1);
        const matACDark = new THREE.MeshStandardMaterial({ color: 0x9a9a92, roughness: 0.7 });
        // Main body.
        feat('z', RD, -1, { a1: acX0, a2: acX1, b1: acY0, b2: acY1 }, matAC);
        // Bottom louver flap (slightly proud, darker).
        feat('z', RD, -1, { a1: acX0 + 0.04, a2: acX1 - 0.04, b1: acY0 - 0.012, b2: acY0 + 0.005 }, matACDark);
        // Vent slit (thin dark line at the bottom of the front face).
        const slit = new THREE.Mesh(new THREE.BoxGeometry(acX1 - acX0 - 0.10, 0.006, 0.004), matACDark);
        slit.position.set((acX0 + acX1)/2, acY0 + 0.025, RD - BIAS - FEAT - 0.022);
        S.group.add(slit);
        // AC remote-holder panel below the AC (small white slab on the wall).
        feat('z', RD, -1, { a1: (acX0 + acX1)/2 - 0.04, a2: (acX0 + acX1)/2 + 0.04, b1: 1.40, b2: 1.55 }, matAC);
      }

      // ============================================================
      // Coat rack on entrance-wall (z=0), past the door (latch side)
      // ============================================================
      // Dark wood plank backing with 3 black metal hooks.
      {
        const crX = 1.30, crY = 1.55, crW = 0.40;
        const matWood = new THREE.MeshStandardMaterial({ color: 0x5e4630, roughness: 0.7 });
        const matHook = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.3 });
        // Plank backing — proud of the wall by 12 mm.
        feat('z', 0, +1, { a1: crX, a2: crX + crW, b1: crY - 0.06, b2: crY + 0.06 }, matWood);
        // 3 hooks.
        for (let i = 0; i < 3; i++) {
          const hx = crX + (i + 0.5) * (crW / 3);
          const stem = new THREE.Mesh(
            new THREE.CylinderGeometry(0.005, 0.005, 0.06, 10),
            matHook
          );
          stem.rotation.x = Math.PI / 2;
          stem.position.set(hx, crY, FEAT + BIAS + 0.030);
          S.group.add(stem);
          const cap = new THREE.Mesh(new THREE.SphereGeometry(0.010, 10, 8), matHook);
          cap.position.set(hx, crY, FEAT + BIAS + 0.060);
          S.group.add(cap);
        }
      }

      // ============================================================
      // AC remote panel + light switch on entrance-wall (latch side, x>door)
      // ============================================================
      {
        const matPanel = new THREE.MeshStandardMaterial({ color: 0xf5f4ef, roughness: 0.55 });
        // AC remote (vertical white panel).
        feat('z', 0, +1, { a1: 2.10, a2: 2.18, b1: 1.10, b2: 1.30 }, matPanel);
        // Light switch (smaller, square).
        feat('z', 0, +1, { a1: 2.25, a2: 2.31, b1: 1.15, b2: 1.22 }, matPanel);
      }

      // ============================================================
      // Ceiling spotlight fixture (4 dark cone shades on wood + crossbar)
      // ============================================================
      // Mounted at room center, crossbar arms along x and z (+ shape).
      // PBR maps baked by bake_room2_spotlight_wood.py (A6000 Cycles).
      {
        const cX = RW / 2, cZ = RD / 2, ceilY = RH - 0.015;
        const matWood = pbrFromBase(
          'ozu-test/room-2-textures/spotlight/wood/wood', 1, 1,
        );
        const matBlack = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
        const matBulb = new THREE.MeshStandardMaterial({
          color: 0xfff4e0, emissive: 0xfff4e0, emissiveIntensity: 1.2,
        });
        const matChain = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.7, roughness: 0.4 });
        const armLen = 0.50;
        // Crossbar — 2 perpendicular boxes (+ shape), wood color.
        const arm1 = new THREE.Mesh(new THREE.BoxGeometry(armLen, 0.04, 0.06), matWood);
        arm1.position.set(cX, ceilY - 0.05, cZ);
        S.group.add(arm1);
        const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, armLen), matWood);
        arm2.position.set(cX, ceilY - 0.05, cZ);
        S.group.add(arm2);
        // Central hub (cylinder + small box).
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.08, 16), matBlack);
        hub.position.set(cX, ceilY - 0.10, cZ);
        S.group.add(hub);
        // 4 cone shades at the ends of the 4 arms.
        const lampMaterial = pbrFromBase(
          'ozu-test/room-2-textures/spotlight/shade/shade', 1, 1,
          { metalness: 0.10, emissive: 0x1a1410, emissiveIntensity: 0.0 },
        );
        const bulbMaterial = matBulb;
        const lampPointLights = [];
        const shadeOffsets = [
          [ armLen/2 - 0.05, 0],
          [-armLen/2 + 0.05, 0],
          [0,  armLen/2 - 0.05],
          [0, -armLen/2 + 0.05],
        ];
        for (const [ox, oz] of shadeOffsets) {
          const sx = cX + ox, sz = cZ + oz;
          const shadeY = ceilY - 0.18;
          const shade = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.080, 0.12, 18, 1, true),
            lampMaterial
          );
          shade.position.set(sx, shadeY, sz);
          S.group.add(shade);
          // Emissive bulb sphere visible from below.
          const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 14, 10), bulbMaterial);
          bulb.position.set(sx, shadeY - 0.04, sz);
          S.group.add(bulb);
          // PointLight per shade.
          const pl = new THREE.PointLight(0xffb16e, 0, 0, 2);
          pl.position.set(sx, shadeY - 0.05, sz);
          S.group.add(pl);
          lampPointLights.push(pl);
        }
        // Pull-chain hanging from hub.
        const chain = new THREE.Mesh(
          new THREE.CylinderGeometry(0.002, 0.002, 0.40, 6),
          matChain
        );
        chain.position.set(cX + 0.04, ceilY - 0.30, cZ);
        S.group.add(chain);
        // Expose for the lights toggle (mirrors room-1's S.lampMaterial pattern).
        S.lampMaterial = lampMaterial;
        S.bulbMaterial = bulbMaterial;
        S.lampOnIntensity = 1.0;
        S.bulbOnIntensity = 1.5;
        S.lampPointOnIntensity = 1.2;
        S.lampPointLights = lampPointLights;
        S.lampsOn = true;
      }

      // ============================================================
      // Phase 5 — Lighting rig
      // ============================================================
      // Window-wall faces NORTH per room-map.md compass orientation, so at
      // 11 AM JST in Kumamoto (sun azimuth 160° / elevation 60°) there is
      // NO direct sun streaming through the window — only diffuse bright sky.
      // Per CLAUDE.md interior-render daylight rule for north-facing windows:
      // cool palette (~5500–5800 K-equivalent rendered cool because indirect),
      // soft-scatter shadows, no god-ray cone.
      {
        // 1. Ambient base — keeps the deepest shadows from going black.
        S.group.add(new THREE.AmbientLight(0xffffff, 0.25));
        // 2. Hemisphere sky/ground bounce — pale-blue sky and warm-floor bounce
        //    to fill the room evenly.
        const hemi = new THREE.HemisphereLight(0xc8d6e8, 0xa89878, 0.35);
        hemi.position.set(RW / 2, RH + 2, RD / 2);
        S.group.add(hemi);
        // 3. Window DirectionalLight — positioned OUTSIDE the window-wall,
        //    aimed into the room. COOL-tinted, low intensity (~1.0), wide
        //    shadow.radius for soft frosted-scatter look. This is the
        //    shadow-caster; without it the room reads as a render preview.
        const dirWin = new THREE.DirectionalLight(0xe0e8f4, 1.0);
        dirWin.position.set(RW + 2.2, 1.80, RD / 2);
        dirWin.target.position.set(RW / 2, 1.0, RD / 2);
        S.group.add(dirWin.target);
        dirWin.castShadow = true;
        dirWin.shadow.mapSize.set(4096, 4096);
        dirWin.shadow.camera.left   = -3;
        dirWin.shadow.camera.right  =  3;
        dirWin.shadow.camera.top    =  3;
        dirWin.shadow.camera.bottom = -3;
        dirWin.shadow.camera.near   = 0.1;
        dirWin.shadow.camera.far    = 12;
        dirWin.shadow.bias          = -0.0005;
        dirWin.shadow.normalBias    = 0.02;
        dirWin.shadow.radius        = 8;   // wider than typical → soft scatter
        S.group.add(dirWin);
        // 4. RectAreaLight at the window plane — diffuse area-fill, cool.
        const rectW = 1.595 - 0.405;
        const rectH = 1.75 - 0.85;
        const rectL = new THREE.RectAreaLight(0xc8d6e8, 5.5, rectW, rectH);
        rectL.position.set(RW + 0.05, (0.85 + 1.75) / 2, (0.405 + 1.595) / 2);
        rectL.lookAt(RW / 2, (0.85 + 1.75) / 2, (0.405 + 1.595) / 2);
        S.group.add(rectL);
        // 5. Fill DirectionalLight from the OPPOSITE wall — fills the dark
        //    closet-side corners. Near-neutral, very slightly cool.
        const dirFill = new THREE.DirectionalLight(0xede8df, 0.22);
        dirFill.position.set(-1.5, 1.6, RD / 2);
        dirFill.target.position.set(RW / 2, 1.0, RD / 2);
        S.group.add(dirFill.target);
        S.group.add(dirFill);
        // 6. Frosted privacy window contributes a small cool DirectionalLight
        //    from outside ac-wall, low intensity, cool tint.
        const dirFrost = new THREE.DirectionalLight(0xdde6f0, 0.45);
        dirFrost.position.set((0.30 + 0.56) / 2, (0.95 + 1.80) / 2, RD + 1.5);
        dirFrost.target.position.set((0.30 + 0.56) / 2, 1.0, RD - 1.0);
        S.group.add(dirFrost.target);
        S.group.add(dirFrost);

        // 7. Shadow / receiveShadow setup on all furniture meshes.
        //    Walls + ceiling are excluded to avoid the "X-ray box from
        //    outside" effect — same trick room-1 uses.
        S.group.traverse((obj) => {
          if (!obj.isMesh) return;
          const m = obj.material;
          // Glass/frosted should not cast shadows (refractive).
          if (m && (m.isMeshPhysicalMaterial && m.transmission > 0)) {
            obj.castShadow = false;
            obj.receiveShadow = false;
            return;
          }
          // Walls (MeshBasicMaterial) don't participate at all.
          if (m && m.isMeshBasicMaterial) {
            obj.castShadow = false;
            obj.receiveShadow = false;
            return;
          }
          obj.castShadow = true;
          obj.receiveShadow = true;
        });
        // Ceiling explicit override (it's MeshStandardMaterial, not Basic) —
        // ceiling should also be excluded from shadow casting for the same reason.
        ceil.castShadow = false;
        ceil.receiveShadow = false;
      }
    },
  });

  // ---------- OZU-TEST ROOM-3 SCENE ----------
  // 2.7 × 3.6 × 2.5 standalone sandbox (6 帖, SE 2F, 洋室1).
  // Key differences from room-1/room-2:
  //   - LONGER room (3.6 m N-S vs 2.7 m square)
  //   - AC + large sliding window share the same wall (window-wall, S)
  //   - No closet — freestanding dark-wood + black-metal shelving unit instead
  //   - No desk, no chair
  //   - Iron-frame bed with DARK iron rails + DARK WOOD HEADBOARD INSET
  //   - GREY accent pillow (not pink, not grey-velour)
  //   - Rattan/woven pendant ceiling light (single shade, not 4-spot cluster)
  //   - 3-camera sweep (not 4) — corner-closet-window (SW) is INTENTIONALLY
  //     skipped, NOT a missing photo set. The bed-head sits in the SW corner
  //     against window-wall + closet-wall and physically blocks tripod
  //     placement there. Only 3 corner-* folders exist on disk for room-3:
  //     corner-frosted-window, corner-closet-entrance, corner-entrance-frosted.
  //     Don't add a 4th chip / viewpoint for the absent corner.
  // Window-wall faces SOUTH at 11 AM JST → direct warm sun streams in.
  registerScene('room-3', {
    orbitPos: new THREE.Vector3(6.5, 4.5, 7.5),
    orbitTarget: new THREE.Vector3(1.35, 1.0, 1.80),
    fpStart: new THREE.Vector3(0.5, 1.6, 0.5),
    fpYaw: -Math.PI / 4,
    bg: 0x1a1b1f,
    fov: 32,
    noFirstPerson: true,
    rooms: [],
    build: function(S) {
      const RW = 2.70, RD = 3.60, RH = 2.50;
      const WT_R = 0.02, FEAT = 0.04, BIAS = 0.003, FRAME_T = 0.07;
      // Wall mapping:
      //   x=0   → closet-wall (long wall, no cutouts; shelving stands here)
      //   x=RW  → frosted-wall (long wall, narrow vertical privacy window)
      //   z=0   → entrance-wall (short wall, hinged door + coat rack)
      //   z=RD  → window-wall (short wall, AC + large sliding window 引違 15009)
      // Corners (alphabetical):
      //   corner-closet-entrance   = (x=0,  z=0)   NW
      //   corner-closet-window     = (x=0,  z=RD)  SW   ← skipped sweep (bed blocks)
      //   corner-entrance-frosted  = (x=RW, z=0)   NE
      //   corner-frosted-window    = (x=RW, z=RD)  SE
      const COL = {
        floor: 0xd4b896, ceiling: 0xf5f0e8, wall: 0xafa299,
        doorway: 0x2a2a2a, frame: 0xffffff,
        ironDark: 0x1a1715, woodDark: 0x6e3f1f,
      };
      function box(w, h, d, cx, cy, cz, color, extra = {}) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({
            color, roughness: extra.roughness ?? 0.9, metalness: extra.metalness ?? 0,
          })
        );
        m.position.set(cx, cy, cz);
        S.group.add(m);
        return m;
      }
      function feat(axis, innerCoord, inward, dims, mat) {
        const aLen = dims.a2 - dims.a1, bLen = dims.b2 - dims.b1;
        const aC = (dims.a1+dims.a2)/2, bC = (dims.b1+dims.b2)/2;
        const c = innerCoord + inward * (BIAS + FEAT / 2);
        const m = (mat instanceof THREE.Material)
          ? mat : new THREE.MeshStandardMaterial({ color: mat, roughness: 0.9 });
        let mesh;
        if (axis === 'x') {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(FEAT, bLen, aLen), m);
          mesh.position.set(c, bC, aC);
        } else {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(aLen, bLen, FEAT), m);
          mesh.position.set(aC, bC, c);
        }
        S.group.add(mesh);
        return mesh;
      }
      function winFrame(axis, innerCoord, inward, a1, a2, b1, b2, mat) {
        const t = FRAME_T;
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a2+t, b1: b2,   b2: b2+t }, mat);
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a2+t, b1: b1-t, b2: b1   }, mat);
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a1,   b1: b1,   b2: b2   }, mat);
        feat(axis, innerCoord, inward, { a1: a2,   a2: a2+t, b1: b1,   b2: b2   }, mat);
      }
      function pbrMatR3(slug, repU, repV, extras = {}) {
        const loader = new THREE.TextureLoader();
        const base = (slug === 'wood_floor')
          ? `ozu-test/room-1-textures/${slug}/${slug}`
          : `ozu-test/room-3-textures/${slug}/${slug}`;
        const map = loader.load(`${base}_diff.jpg`);
        map.colorSpace = THREE.SRGBColorSpace;
        const normalMap = loader.load(`${base}_nor_gl.jpg`);
        const roughnessMap = loader.load(`${base}_rough.jpg`);
        const aniso = renderer.capabilities.getMaxAnisotropy();
        for (const t of [map, normalMap, roughnessMap]) {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repU, repV);
          t.anisotropy = aniso;
        }
        return new THREE.MeshStandardMaterial({ map, normalMap, roughnessMap, ...extras });
      }
      // pbrFromBase — for Cycles-baked materials (4 PNGs per material).
      function pbrFromBase(base, repU, repV, extras = {}) {
        const loader = new THREE.TextureLoader();
        const map = loader.load(`${base}_albedo.png`);
        map.colorSpace = THREE.SRGBColorSpace;
        const normalMap = loader.load(`${base}_normal.png`);
        const roughnessMap = loader.load(`${base}_roughness.png`);
        const aoMap = loader.load(`${base}_ao.png`);
        const aniso = renderer.capabilities.getMaxAnisotropy();
        for (const t of [map, normalMap, roughnessMap, aoMap]) {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repU, repV);
          t.anisotropy = aniso;
        }
        return new THREE.MeshStandardMaterial({
          map, normalMap, roughnessMap, aoMap, aoMapIntensity: 1.0, ...extras,
        });
      }
      // Light-colored woodgrain laminate ceiling — per-room PBR bake (see
      // bake_room3_ceiling_woodgrain.py). Source: ceiling-woodgrain.jpg
      // (WD-061). 5 planks per 1 m tile; RW/1.0 × RD/1.0 = ~20 cm planks.
      const matFloorR3 = pbrMatR3('wood_floor', RW / 1.7, RD / 1.7, { roughness: 0.7 });
      const matCeilR3  = pbrFromBase(
        'ozu-test/room-3-textures/ceiling/woodgrain_laminate/woodgrain_laminate',

      );
      const wallPaintArgs = { color: COL.wall, toneMapped: false };
      const matWall_x0 = new THREE.MeshBasicMaterial(wallPaintArgs);  // closet-wall
      const matWall_xW = new THREE.MeshBasicMaterial(wallPaintArgs);  // frosted-wall
      const matWall_z0 = new THREE.MeshBasicMaterial(wallPaintArgs);  // entrance-wall
      const matWall_zD = new THREE.MeshBasicMaterial(wallPaintArgs);  // window-wall
      (function attachWallAO() {
        const aoLoader = new THREE.TextureLoader();

      const matFrameR3  = new THREE.MeshStandardMaterial({ color: COL.frame, roughness: 0.6 });
      const matHandleR3 = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, metalness: 0.95, roughness: 0.20 });

      // ---- floor + ceiling ----
      const floor = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.02, RD), matFloorR3);
      floor.position.set(RW/2, -0.01, RD/2); S.group.add(floor);
      const ceil = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.02, RD), matCeilR3);

      // ---- Walls ----
      function setUVsByLocal(geometry, uvFn, mainAxis) {
        const pos = geometry.attributes.position;
        const norm = geometry.attributes.normal;
        const uvs = new Float32Array(pos.count * 2);
        const axisIdx = { x: 0, y: 1, z: 2 }[mainAxis];
        for (let i = 0; i < pos.count; i++) {
          const onMain = (axisIdx === undefined || !norm) ||
            Math.abs([norm.getX(i), norm.getY(i), norm.getZ(i)][axisIdx]) > 0.5;
          if (onMain) {
            const out = uvFn(pos.getX(i), pos.getY(i), pos.getZ(i));
            uvs[i*2 + 0] = out[0];
            uvs[i*2 + 1] = out[1];
          } else {
            uvs[i*2 + 0] = 0.5;
            uvs[i*2 + 1] = 0.5;
          }
        }
        geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      }
      function wallShapeWithHole(wallW, wallH, hx1, hy1, hx2, hy2) {
        const shape = new THREE.Shape();

        shape.lineTo(0, wallH); shape.lineTo(0, 0);
        const path = new THREE.Path();
        path.moveTo(hx1, hy1); path.lineTo(hx2, hy1); path.lineTo(hx2, hy2);
        path.lineTo(hx1, hy2); path.lineTo(hx1, hy1);
        shape.holes.push(path);
        return new THREE.ShapeGeometry(shape);
      }
      // closet-wall (x=0) — long wall, no cutouts
      const wA = new THREE.Mesh(new THREE.BoxGeometry(WT_R, RH, RD), matWall_x0);
      wA.position.set(-WT_R/2, RH/2, RD/2); S.group.add(wA);
      setUVsByLocal(wA.geometry, (lx, ly, lz) => [ 0.5 + ly / RH, 0.5 + lz / RD ], 'x');
      // entrance-wall (z=0) — short wall, door is an occluder not a hole
      const wC = new THREE.Mesh(new THREE.BoxGeometry(RW, RH, WT_R), matWall_z0);
      wC.position.set(RW/2, RH/2, -WT_R/2); S.group.add(wC);
      setUVsByLocal(wC.geometry, (lx, ly, lz) => [ 0.5 + lx / RW, 0.5 + ly / RH ], 'z');
      // frosted-wall (x=RW) — long wall, narrow vertical privacy window cutout
      matWall_xW.side = THREE.DoubleSide;
      // hole at z=[-1, -0.5], y=[0.95, 1.80] (outside the wall)
      const wB = new THREE.Mesh(wallShapeWithHole(RD, RH, -1, 0.95, -0.5, 1.80), matWall_xW);
      wB.rotation.y = -Math.PI/2;
      wB.position.set(RW, 0, 0);
      S.group.add(wB);
      setUVsByLocal(wB.geometry, (lx, ly, lz) => [lx / RD, ly / RH]);
      // window-wall (z=RD) — short wall, large 引違 15009 sliding window cutout
      matWall_zD.side = THREE.DoubleSide;
      // hole at x=[0.60, 2.10] (1.50 m wide), y=[0.85, 1.75]
      const wD = new THREE.Mesh(wallShapeWithHole(RW, RH, 0.60, 0.85, 2.10, 1.75), matWall_zD);
      wD.position.set(0, 0, RD);
      S.group.add(wD);
      setUVsByLocal(wD.geometry, (lx, ly, lz) => [ lx / RW, ly / RH ]);

      // ---- Trim: baseboards + crown molding ----
      const ZF = 0.001;
      const bbH = 0.05, bbD = 0.01, bbColor = 0xf2f0eb, bbX = { roughness: 0.7 };
      box(bbD, bbH, RD, bbD/2 + ZF,        bbH/2, RD/2, bbColor, bbX);
      box(bbD, bbH, RD, RW - bbD/2 - ZF,   bbH/2, RD/2, bbColor, bbX);
      box(RW,  bbH, bbD, RW/2, bbH/2, bbD/2 + ZF,      bbColor, bbX);
      box(RW,  bbH, bbD, RW/2, bbH/2, RD - bbD/2 - ZF, bbColor, bbX);
      const cmH = 0.06, cmD = 0.02, cmColor = 0xffffff, cmY = RH - cmH/2;
      box(cmD, cmH, RD, cmD/2 + ZF,        cmY, RD/2, cmColor, bbX);
      box(cmD, cmH, RD, RW - cmD/2 - ZF,   cmY, RD/2, cmColor, bbX);
      box(RW,  cmH, cmD, RW/2, cmY, cmD/2 + ZF,      cmColor, bbX);
      box(RW,  cmH, cmD, RW/2, cmY, RD - cmD/2 - ZF, cmColor, bbX);

      // ---- Large sliding window (window-wall, z=RD) ----
      feat('z', RD, -1, { a1: 0.60, a2: 2.10, b1: 0.85, b2: 1.75 }, matGlassR3);
      winFrame('z', RD, -1, 0.60, 2.10, 0.85, 1.75, matFrameR3);
      // Central vertical mullion at x = 1.35.
      feat('z', RD, -1, { a1: 1.33, a2: 1.37, b1: 0.85, b2: 1.75 }, matFrameR3);
      // Chrome lever handle on mullion's room-facing face.
      {
        const lever = new THREE.Mesh(new THREE.BoxGeometry(0.070, 0.018, 0.012), matHandleR3);
        lever.position.set(1.35 - 0.04, 1.20, RD - BIAS - FEAT - 0.006);
        S.group.add(lever);
        const stem = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.010, 0.012), matHandleR3);
        stem.position.set(1.35, 1.20, RD - BIAS - FEAT - 0.006);
        S.group.add(stem);
      }
      // Cream curtains flanking the window — 2 fluted bunches with tieback rings.
      function applyClothShader(material, sheenColor = 0xfff8ee, sheenStrength = 0.15) {
        const sc = new THREE.Color(sheenColor);
        material.onBeforeCompile = (shader) => {
          shader.uniforms.sheenColor = { value: sc };
          shader.uniforms.sheenStrength = { value: sheenStrength };
          shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>',
              '#include <common>\nuniform vec3 sheenColor;\nuniform float sheenStrength;')
            .replace('#include <output_fragment>',
              'float NoV = max(dot(normalize(vNormal), normalize(vViewPosition)), 0.0);\n' +
              'float fresnel = pow(1.0 - NoV, 4.0);\n' +
              'gl_FragColor.rgb += sheenColor * sheenStrength * fresnel;\n' +
              '#include <output_fragment>');
        };
      }
      {
        const matCurt = new THREE.MeshStandardMaterial({ color: 0xddd2c0, roughness: 1 });
        const matBand = new THREE.MeshStandardMaterial({ color: 0xc7bba2, roughness: 0.95 });
        applyClothShader(matCurt);
        function flutedColumn(rTop, rBot, height, ridges, depth) {
          const geom = new THREE.CylinderGeometry(rTop, rBot, height, 64, 1, false);
          const pos = geom.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), z = pos.getZ(i);
            const r = Math.hypot(x, z);
            if (r < 1e-6) continue;
            const theta = Math.atan2(z, x);
            const jitter = 0.85 + 0.15 * Math.sin(ridges * theta * 1.5 + 1.7);
            const valley = (1 - Math.cos(ridges * theta)) * 0.5 * jitter;
            const newR = r - depth * valley;
            pos.setX(i, x * newR / r);
            pos.setZ(i, z * newR / r);
          }
          pos.needsUpdate = true;
          geom.computeVertexNormals();
          return geom;
        }
        const cTop = 1.85, cZ = RD - 0.10;
        function bunch(xPos, yBot, yTie) {
          const fullH = cTop - yBot;
          const col = new THREE.Mesh(flutedColumn(0.058, 0.080, fullH, 8, 0.025), matCurt);
          col.position.set(xPos, (cTop + yBot) / 2, cZ);
          S.group.add(col);
          const band = new THREE.Mesh(new THREE.TorusGeometry(0.098, 0.012, 10, 28), matBand);
          band.position.set(xPos, yTie, cZ);

        bunch(2.15, 0.10, 1.30);

      // ---- Narrow vertical frosted privacy window (ac-wall, z=RD) ----
      feat('z', RD, -1, { a1: 1.70, a2: 1.96, b1: 1.80, b2: 2.05 }, matFrostedR3);
      winFrame('z', RD, -1, 1.70, 1.96, 1.80, 2.05, matFrameR3);

      // ---- Entrance door (entrance-wall, z=0) ----
      // Centered-ish, x=[0.95, 1.75], hinge on -x side.
      const dX0 = 0.95, dX1 = 1.75;
      feat('z', 0, +1, { a1: dX0 + 0.005, a2: dX1 - 0.005, b1: 0.005, b2: 1.995 }, COL.doorway);
      const cD2 = 0.005, cW2 = 0.020, cZ2 = cD2/2 + BIAS;
      box(dX1 - dX0 + cW2 * 2, cW2, cD2, (dX0 + dX1)/2, 2.0 + cW2/2, cZ2, 0xfafafa, { roughness: 0.55 });
      box(cW2, 2.0 + cW2, cD2, dX0 - cW2/2,        (2.0 + cW2)/2, cZ2, 0xfafafa, { roughness: 0.55 });
      box(cW2, 2.0 + cW2, cD2, dX1 + cW2/2,        (2.0 + cW2)/2, cZ2, 0xfafafa, { roughness: 0.55 });
      // Door panel.
      box(dX1 - dX0, 2.0, 0.04, (dX0 + dX1)/2, 1.0, 0.025, 0xffffff, { roughness: 0.55 });
      // Hinges on -x side.
      {
        const matHinge = new THREE.MeshStandardMaterial({ color: 0xa8a8a8, metalness: 1.0, roughness: 0.30 });
        const hingeGeom = new THREE.CylinderGeometry(0.012, 0.012, 0.07, 14);

      {

        feat('z', 0, +1, { a1: 0.30, a2: 0.38, b1: 1.10, b2: 1.30 }, matPanel);  // AC remote
        feat('z', 0, +1, { a1: 0.45, a2: 0.51, b1: 1.15, b2: 1.22 }, matPanel);  // switch

      {
        const acX0 = 0.20, acX1 = 0.90, acY0 = 1.85, acY1 = 2.10;

        const matACDark = new THREE.MeshStandardMaterial({ color: 0x9a9a92, roughness: 0.7 });
        feat('z', RD, -1, { a1: acX0, a2: acX1, b1: acY0, b2: acY1 }, matAC);
        feat('z', RD, -1, { a1: acX0 + 0.04, a2: acX1 - 0.04, b1: acY0 - 0.012, b2: acY0 + 0.005 }, matACDark);
        const slit = new THREE.Mesh(new THREE.BoxGeometry(acX1 - acX0 - 0.10, 0.006, 0.004), matACDark);

        // AC remote-holder panel below.
        feat('z', RD, -1, { a1: (acX0 + acX1)/2 - 0.04, a2: (acX0 + acX1)/2 + 0.04, b1: 1.40, b2: 1.55 }, matAC);
      }

      // ============================================================
      // Bed (iron frame with DARK iron + DARK WOOD HEADBOARD INSET)
      // ============================================================
      // Long axis along z, head at z=RD (touching window-wall area), foot at
      // z=RD-2.0 = 1.60. Width 1.00 m along the closet-wall side, close to the

      const bX0 = 0.30, bX1 = 1.30, bZ0 = 1.65, bZ1 = RD;
      const FRAME_Y_BOT = 0.30, MAT_TOP = 0.50;
      {
        // Bed iron: Cycles-baked black_iron PBR (originally baked for the
        // shelf in this room). Shared with room-1 and room-4 beds.
        const matIron = pbrFromBase('ozu-test/room-3-textures/shelf/black_iron/black_iron', 1, 1, { metalness: 0.4 });
        const matWoodInset = new THREE.MeshStandardMaterial({ color: COL.woodDark, roughness: 0.7 });
        // Mattress: Cycles-baked cream_cotton PBR (shared across 4 rooms).
        const matMattress = pbrFromBase('ozu-test/room-1-textures/mattress/cream_cotton/cream_cotton', 2, 2);
        // Mattress.
        const mattress = new THREE.Mesh(
          new RoundedBoxGeometry(bX1 - bX0, MAT_TOP - FRAME_Y_BOT, bZ1 - bZ0, 2, 0.015),

        mattress.position.set((bX0 + bX1)/2, (FRAME_Y_BOT + MAT_TOP)/2, (bZ0 + bZ1)/2);
        S.group.add(mattress);
        // 4 corner posts (DARK iron, NO ball-cap finials — simpler industrial look).
        const postR = 0.020;
        function cornerPost(cx, cz, topY) {
          const p = new THREE.Mesh(

        // Head end posts (taller, at z=bZ1).

        cornerPost(bX0, bZ0, 0.65);
        cornerPost(bX1, bZ0, 0.65);
        // Headboard rails (dark iron pipes).
        const railR = 0.010;
        function railX(yPos, z = bZ1) {

            new THREE.CylinderGeometry(railR, railR, bX1 - bX0, 12),

        railX(0.55, bZ0);
        // 5 vertical bars on the footboard between mid + bottom rails.

        // Sheet — wrinkled cotton, exact mattress footprint.
        {
          function noise2(x, z) {
            let v = 0, amp = 1, total = 0;
            for (let o = 0; o < 4; o++) {
              const fx = x * (2 ** o) * 3.7, fz = z * (2 ** o) * 3.1;
              v += amp * Math.sin(fx + 1.3) * Math.cos(fz + 2.1);

          const sheet = new THREE.Mesh(sheetGeom, sheetMat);
          sheet.rotation.x = -Math.PI / 2;

        // Grey accent pillow at head end (z near bZ1).
        {
          const matGrey = new THREE.MeshPhysicalMaterial({

            new RoundedBoxGeometry(0.55, 0.10, 0.32, 6, 0.030),
            matGrey
          );
          pillow.position.set((bX0 + bX1)/2, MAT_TOP + 0.055, bZ1 - 0.30);
          S.group.add(pillow);
        }
      }

      // ============================================================
      // Dark-wood + black-metal freestanding shelving (right of desk)
      // ============================================================
      // 3-tier industrial-style shelving. Dark stained pine shelves on a
      // black iron frame. Positioned flush with the entrance-wall to the
      // right of the desk.
      {
        const shX0 = 2.30, shX1 = 2.65, shZ0 = 0.05, shZ1 = 0.40, shY1 = 1.55;
        // PBR maps baked offline via ozu-test/bake/bake_room3_shelf.py.
        const pbrFromBase = (base, repU, repV, extras = {}) => {
          const loader = new THREE.TextureLoader();
          const map = loader.load(`${base}_albedo.png`);
          map.colorSpace = THREE.SRGBColorSpace;
          const normalMap = loader.load(`${base}_normal.png`);
          const roughnessMap = loader.load(`${base}_roughness.png`);
          const aoMap = loader.load(`${base}_ao.png`);
          const aniso = renderer.capabilities.getMaxAnisotropy();
          for (const t of [map, normalMap, roughnessMap, aoMap]) {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(repU, repV);
            t.anisotropy = aniso;
          }
          return new THREE.MeshStandardMaterial({
            map, normalMap, roughnessMap, aoMap, aoMapIntensity: 1.0, ...extras,
          });
        };
        const matWood = pbrFromBase('ozu-test/room-3-textures/shelf/dark_wood/dark_wood', 1, 1);
        const matIron = pbrFromBase('ozu-test/room-3-textures/shelf/black_iron/black_iron', 1, 1, { metalness: 0.6 });
        const postT = 0.020;
        for (const [px, pz] of [[shX0, shZ0],[shX1, shZ0],[shX0, shZ1],[shX1, shZ1]]) {
          const post = new THREE.Mesh(new THREE.BoxGeometry(postT, shY1, postT), matIron);
          post.position.set(px, shY1/2, pz);
          S.group.add(post);
        }
        const shelfT = 0.025;
        for (const sy of [0.05, 0.55, 1.05, shY1 - 0.025]) {
          const sh = new THREE.Mesh(
            new THREE.BoxGeometry(shX1 - shX0 + 0.020, shelfT, shZ1 - shZ0 + 0.012),

      // ============================================================
      // Corner cabinet on entrance-wall + closet-wall
      // ============================================================
      // Slim storage cabinet placed in the entrance-wall corner.
      {
        const cX0 = 0.05, cX1 = 0.45, cZ0 = 0.00, cZ1 = 0.40, cY = 0.90;
        const matCabinet = new THREE.MeshStandardMaterial({ color: 0xd1c3b5, roughness: 0.55 });
        const cabinet = new THREE.Mesh(

      // ============================================================
      // Desk and chair on entrance-wall
      // ============================================================
      // Desk flush with the entrance-wall, with the chair facing the wall.
      {
        const dX0 = 1.80, dX1 = 2.40, dZ0 = 0.00, dZ1 = 0.45, dY = 0.72;
        const matDeskTop = new THREE.MeshStandardMaterial({ color: 0x7d593f, roughness: 0.55 });

        for (const [lx, lz] of [[dX0 + 0.05, dZ0 + 0.05], [dX1 - 0.05, dZ0 + 0.05], [dX0 + 0.05, dZ1 - 0.05], [dX1 - 0.05, dZ1 - 0.05]]) {

        const matChairLeg = new THREE.MeshStandardMaterial({ color: 0x161616, roughness: 0.4, metalness: 0.6 });
        const cX = (dX0 + dX1) / 2;

        const seat = new THREE.Mesh(new THREE.BoxGeometry(0.44, 0.06, 0.44), matChairSeat);

        back.position.set(cX, 0.67, cZ + 0.24);
        S.group.add(back);
        for (const [lx, lz] of [[cX - 0.18, cZ], [cX + 0.18, cZ]]) {

          leg.position.set(lx, 0.16, lz);
          leg.rotation.x = Math.PI / 2;
          S.group.add(leg);

      }

      // Clothing hook at the closet-wall end of the window-wall corner.
      {
        const hookX = 0.03, hookZ = RD - 0.45, hookY = 1.45;
        const matHook = new THREE.MeshStandardMaterial({ color: 0x2c2c2c, roughness: 0.35, metalness: 0.7 });
        const hook = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.01, 0.20, 12), matHook);
        hook.position.set(hookX, hookY, hookZ);
        hook.rotation.z = Math.PI / 2;
        S.group.add(hook);
        const peg = new THREE.Mesh(new THREE.SphereGeometry(0.02, 12, 8), matHook);
        peg.position.set(hookX + 0.09, hookY, hookZ);
        S.group.add(peg);

      // ============================================================
      // Rattan/woven pendant ceiling light
      // ============================================================
      // Centered on ceiling. Cylindrical rattan shade, single warm bulb,
      // brass+wood hub.
      // PBR maps baked by bake_room3_rattan.py (A6000 Cycles).
      {
        const cX = RW/2, cZ = RD/2, ceilY = RH - 0.015;
        const matRattan = pbrFromBase(
          'ozu-test/room-3-textures/rattan_pendant/rattan/rattan', 3, 2,
        );
        const matBrass = pbrFromBase(
          'ozu-test/room-3-textures/rattan_pendant/brass/brass', 1, 1,

        );
        const matBulb = new THREE.MeshStandardMaterial({
          color: 0xfff4e0, emissive: 0xfff4e0, emissiveIntensity: 1.5,
        });
        const matCord = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.6 });
        // Ceiling cup.
        const cup = new THREE.Mesh(
          new THREE.CylinderGeometry(0.045, 0.055, 0.02, 14),
          matBrass
        );
        cup.position.set(cX, ceilY - 0.01, cZ);
        S.group.add(cup);
        // Cord (dropping down).
        const cordH = 0.30;
        const cord = new THREE.Mesh(
          new THREE.CylinderGeometry(0.004, 0.004, cordH, 8),
          matCord
        );
        cord.position.set(cX, ceilY - 0.02 - cordH/2, cZ);
        S.group.add(cord);
        // Rattan cylindrical shade.
        const shadeH = 0.30, shadeR = 0.16;
        const shade = new THREE.Mesh(
          new THREE.CylinderGeometry(shadeR, shadeR, shadeH, 24, 1, true),
          matRattan
        );
        shade.position.set(cX, ceilY - 0.02 - cordH - shadeH/2, cZ);
        S.group.add(shade);
        // Bulb inside.
        const bulbY = ceilY - 0.02 - cordH - shadeH * 0.5;
        const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.040, 14, 10), matBulb);
        bulb.position.set(cX, bulbY, cZ);
        S.group.add(bulb);
        const pl = new THREE.PointLight(0xffb16e, 1.4, 0, 2);
        pl.position.set(cX, bulbY, cZ);
        S.group.add(pl);
        // Expose for Lights toggle.
        S.lampMaterial = matRattan;
        S.bulbMaterial = matBulb;
        S.lampOnIntensity = 0.4;
        S.bulbOnIntensity = 1.5;
        S.lampPointOnIntensity = 1.4;
        S.lampPointLights = [pl];
        S.lampsOn = true;
      }

      // ============================================================
      // Phase 5 — Lighting rig
      // ============================================================
      // Window-wall faces SOUTH per room-map → direct warm sun streams in at
      // 11 AM JST (Kumamoto, sunny spring). Sun azimuth ≈ 160°, elevation
      // ≈ 60°. Use the warm-direct-sun template per CLAUDE.md daylight rule.
      {
        S.group.add(new THREE.AmbientLight(0xffffff, 0.20));
        const hemi = new THREE.HemisphereLight(0xcfe0f0, 0xa89878, 0.30);
        hemi.position.set(RW/2, RH + 2, RD/2);
        S.group.add(hemi);
        // Direct sun — neutral-warm daylight, full intensity, positioned
        // OUTSIDE the window-wall (z > RD), aimed into the room.
        const dirSun = new THREE.DirectionalLight(0xf6f5ec, 3.0);
        dirSun.position.set(RW/2 + 0.6, 3.0, RD + 2.5);   // azimuth 160° offset
        dirSun.target.position.set(RW/2, 0.4, RD/2);
        S.group.add(dirSun.target);
        dirSun.castShadow = true;
        dirSun.shadow.mapSize.set(4096, 4096);
        dirSun.shadow.camera.left   = -3;
        dirSun.shadow.camera.right  =  3;
        dirSun.shadow.camera.top    =  3;
        dirSun.shadow.camera.bottom = -3;
        dirSun.shadow.camera.near   = 0.1;
        dirSun.shadow.camera.far    = 14;
        dirSun.shadow.bias          = -0.0005;
        dirSun.shadow.normalBias    = 0.02;
        dirSun.shadow.radius        = 4;
        S.group.add(dirSun);
        // RectAreaLight at the sliding-window pane for soft area-fill.
        const rectW = 2.10 - 0.60, rectH = 1.75 - 0.85;
        const rectL = new THREE.RectAreaLight(0xfff4e0, 6.0, rectW, rectH);
        rectL.position.set((0.60 + 2.10)/2, (0.85 + 1.75)/2, RD + 0.05);
        rectL.lookAt(RW/2, (0.85 + 1.75)/2, RD/2);
        S.group.add(rectL);
        // Fill DirectionalLight from opposite side (entrance-wall N direction).
        const dirFill = new THREE.DirectionalLight(0xede8df, 0.25);
        dirFill.position.set(RW/2, 1.6, -1.5);
        dirFill.target.position.set(RW/2, 1.0, RD/2);
        S.group.add(dirFill.target);
        S.group.add(dirFill);
        // Frosted-wall (east) contribution — sun past peak-east at 11 AM, but
        // through frosted glass it's diffuse. Cool-ish neutral.
        const dirFrost = new THREE.DirectionalLight(0xe6eaef, 0.5);
        dirFrost.position.set(RW + 1.5, 1.4, 0.5);
        dirFrost.target.position.set(RW/2 - 0.5, 1.0, 0.5);
        S.group.add(dirFrost.target);
        S.group.add(dirFrost);

        // Visible god-ray cone — south window with direct sun. Subtle additive.
        {
          const BEAM_LEN = 3.5;
          const beamGeom = new THREE.ConeGeometry(0.90, BEAM_LEN, 4, 1, true);
          // Vertex-colour alpha gradient — peak at ~30% length.
          const pos = beamGeom.attributes.position;
          const colors = new Float32Array(pos.count * 3);
          for (let i = 0; i < pos.count; i++) {
            const y = pos.getY(i);   // -L/2 at base, +L/2 at apex
            const t = (y + BEAM_LEN/2) / BEAM_LEN;
            const a = (Math.sin(t * Math.PI)) * 0.35;
            colors[i*3 + 0] = a; colors[i*3 + 1] = a; colors[i*3 + 2] = a;
          }
          beamGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          const beamMat = new THREE.MeshBasicMaterial({
            color: 0xfff4d6, vertexColors: true, transparent: true,
            opacity: 0.20, blending: THREE.AdditiveBlending,
            depthWrite: false, side: THREE.DoubleSide,
          });
          const beam = new THREE.Mesh(beamGeom, beamMat);
          // Orient along the sun ray direction.
          const sunDir = new THREE.Vector3().subVectors(dirSun.target.position, dirSun.position).normalize();
          beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), sunDir);
          beam.position.copy(dirSun.position).addScaledVector(sunDir, BEAM_LEN/2);
          S.group.add(beam);
        }

        // Shadow setup on furniture meshes.
        S.group.traverse((obj) => {
          if (!obj.isMesh) return;
          const m = obj.material;
          if (m && (m.isMeshPhysicalMaterial && m.transmission > 0)) {
            obj.castShadow = false;
            obj.receiveShadow = false;
            return;
          }
          if (m && m.isMeshBasicMaterial) {
            obj.castShadow = false;
            obj.receiveShadow = false;
            return;
          }
          obj.castShadow = true;
          obj.receiveShadow = true;
        });
        ceil.castShadow = false;
        ceil.receiveShadow = false;
      }
    },
  });

  // ---------- OZU-TEST ROOM-4 SCENE ----------
  // 2.7 × 3.6 × 2.5 standalone sandbox (6 帖, SW 2F, 寝室).
  // Mirror-image of room-3 (room-3 is SE; room-4 is SW). Same wall-naming
  // template (window-wall + frosted-wall + closet-wall + entrance-wall).
  // Key differences from room-3:
  //   - Closet-wall has TWO items: 4-panel WHITE bi-fold doors at N end +
  //     a dark-wood + black-metal CABINET (3 open shelves + 9-drawer grid)
  //     at S end. Different from room-3's shelving-only.
  //   - Bed orientation REVERSED: head at N (entrance-wall side),
  //     foot at S (window-wall side) — opposite of room-3.
  //   - 4-camera sweep (corner-frosted-entrance, corner-closet-entrance,
  //     corner-frosted-window, corner-closet-window) — no skipped corner.
  //   - Ceiling fixture: 4-cone spotlight cluster on wood + crossbar with
  //     central black hub + pull-chain — identical to room-2's fixture.
  //     Photo-confirmed from corner-closet-window/05 (mid-sweep frame).
  registerScene('room-4', {
    orbitPos: new THREE.Vector3(6.5, 4.5, 7.5),
    orbitTarget: new THREE.Vector3(1.35, 1.0, 1.80),
    fpStart: new THREE.Vector3(0.5, 1.6, 0.5),
    fpYaw: -Math.PI / 4,
    bg: 0x1a1b1f,
    fov: 32,
    noFirstPerson: true,
    rooms: [],
    build: function(S) {
      const RW = 2.70, RD = 3.60, RH = 2.50;
      const WT_R = 0.02, FEAT = 0.04, BIAS = 0.003, FRAME_T = 0.07;
      // Wall mapping (mirror of room-3's, closet on opposite side):
      //   x=0   → frosted-wall (long wall, narrow vertical privacy window)
      //   x=RW  → closet-wall  (long wall, bi-fold + cabinet)
      //   z=0   → entrance-wall (short wall, door + coat rack + AC remote)
      //   z=RD  → window-wall  (short wall, AC + large sliding window)
      // Corners (alphabetical):
      //   corner-closet-entrance  = (x=RW, z=0)
      //   corner-closet-window    = (x=RW, z=RD)
      //   corner-frosted-entrance = (x=0,  z=0)
      //   corner-frosted-window   = (x=0,  z=RD)
      const COL = {
        floor: 0xd4b896, ceiling: 0xf5f0e8, wall: 0xafa299,
        doorway: 0x2a2a2a, frame: 0xffffff,
        ironDark: 0x1a1715, woodDark: 0x4a2d18,
      };
      function box(w, h, d, cx, cy, cz, color, extra = {}) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({
            color, roughness: extra.roughness ?? 0.9, metalness: extra.metalness ?? 0,
          })
        );
        m.position.set(cx, cy, cz);
        S.group.add(m);
        return m;
      }
      function feat(axis, innerCoord, inward, dims, mat) {
        const aLen = dims.a2 - dims.a1, bLen = dims.b2 - dims.b1;
        const aC = (dims.a1+dims.a2)/2, bC = (dims.b1+dims.b2)/2;
        const c = innerCoord + inward * (BIAS + FEAT / 2);
        const m = (mat instanceof THREE.Material)
          ? mat : new THREE.MeshStandardMaterial({ color: mat, roughness: 0.9 });
        let mesh;
        if (axis === 'x') {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(FEAT, bLen, aLen), m);
          mesh.position.set(c, bC, aC);
        } else {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(aLen, bLen, FEAT), m);
          mesh.position.set(aC, bC, c);
        }
        S.group.add(mesh);
        return mesh;
      }
      function winFrame(axis, innerCoord, inward, a1, a2, b1, b2, mat) {
        const t = FRAME_T;
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a2+t, b1: b2,   b2: b2+t }, mat);
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a2+t, b1: b1-t, b2: b1   }, mat);
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a1,   b1: b1,   b2: b2   }, mat);
        feat(axis, innerCoord, inward, { a1: a2,   a2: a2+t, b1: b1,   b2: b2   }, mat);
      }
      function pbrMatR4(slug, repU, repV, extras = {}) {
        const loader = new THREE.TextureLoader();
        const base = (slug === 'wood_floor')
          ? `ozu-test/room-1-textures/${slug}/${slug}`
          : `ozu-test/room-4-textures/${slug}/${slug}`;
        const map = loader.load(`${base}_diff.jpg`);
        map.colorSpace = THREE.SRGBColorSpace;
        const normalMap = loader.load(`${base}_nor_gl.jpg`);
        const roughnessMap = loader.load(`${base}_rough.jpg`);
        const aniso = renderer.capabilities.getMaxAnisotropy();
        for (const t of [map, normalMap, roughnessMap]) {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repU, repV);
          t.anisotropy = aniso;
        }
        return new THREE.MeshStandardMaterial({ map, normalMap, roughnessMap, ...extras });
      }
      // pbrFromBase — for Cycles-baked materials (4 PNGs per material).
      function pbrFromBase(base, repU, repV, extras = {}) {
        const loader = new THREE.TextureLoader();
        const map = loader.load(`${base}_albedo.png`);
        map.colorSpace = THREE.SRGBColorSpace;
        const normalMap = loader.load(`${base}_normal.png`);
        const roughnessMap = loader.load(`${base}_roughness.png`);
        const aoMap = loader.load(`${base}_ao.png`);
        const aniso = renderer.capabilities.getMaxAnisotropy();
        for (const t of [map, normalMap, roughnessMap, aoMap]) {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repU, repV);
          t.anisotropy = aniso;
        }
        return new THREE.MeshStandardMaterial({
          map, normalMap, roughnessMap, aoMap, aoMapIntensity: 1.0, ...extras,
        });
      }
      // Light-colored woodgrain laminate ceiling — per-room PBR bake (see
      // bake_room4_ceiling_woodgrain.py). Source: ceiling-woodgrain.jpg
      // (WD-061). 5 planks per 1 m tile; RW/1.0 × RD/1.0 = ~20 cm planks.
      const matFloorR4 = pbrMatR4('wood_floor', RW / 1.7, RD / 1.7, { roughness: 0.7 });
      const matCeilR4  = pbrFromBase(
        'ozu-test/room-4-textures/ceiling/woodgrain_laminate/woodgrain_laminate',
        RW / 1.0, RD / 1.0,
      );
      const wallPaintArgs = { color: COL.wall, toneMapped: false };
      const matWall_x0 = new THREE.MeshBasicMaterial(wallPaintArgs);  // frosted-wall
      const matWall_xW = new THREE.MeshBasicMaterial(wallPaintArgs);  // closet-wall
      const matWall_z0 = new THREE.MeshBasicMaterial(wallPaintArgs);  // entrance-wall
      const matWall_zD = new THREE.MeshBasicMaterial(wallPaintArgs);  // window-wall
      (function attachWallAO() {
        const aoLoader = new THREE.TextureLoader();
        const maxAniso = renderer.capabilities.getMaxAnisotropy();
        const load = (slug) => {
          const tex = aoLoader.load(`ozu-test/room-4-textures/wall_ao/${slug}.png`);
          tex.colorSpace = THREE.NoColorSpace;
          tex.anisotropy = maxAniso;
          tex.generateMipmaps = false;
          tex.minFilter = THREE.LinearFilter;
          tex.magFilter = THREE.LinearFilter;
          tex.wrapS = THREE.ClampToEdgeWrapping;
          tex.wrapT = THREE.ClampToEdgeWrapping;
          return tex;
        };
        matWall_x0.map = load('wall_x0');
        matWall_xW.map = load('wall_xW');
        matWall_z0.map = load('wall_z0');
        matWall_zD.map = load('wall_zD');
      })();
      const matGlassR4 = new THREE.MeshPhysicalMaterial({
        color: 0xeaf2f6, transparent: true, opacity: 1.0,
        transmission: 1.0, ior: 1.52, thickness: 0.02,
        roughness: 0.04, metalness: 0.0,
      });
      const matFrostedR4 = new THREE.MeshPhysicalMaterial({
        color: 0xf2efe8, transparent: true,
        transmission: 1.0, roughness: 0.65, thickness: 0.04,
        ior: 1.52, metalness: 0.0,
        attenuationColor: 0xffffff, attenuationDistance: 1.5,
      });
      const matFrameR4  = new THREE.MeshStandardMaterial({ color: COL.frame, roughness: 0.6 });
      const matHandleR4 = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, metalness: 0.95, roughness: 0.20 });
      const matClosetR4 = new THREE.MeshStandardMaterial({ color: 0xf2ece4, roughness: 0.7 });
      const matSeamR4   = new THREE.MeshStandardMaterial({ color: 0xbababa });

      const floor = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.02, RD), matFloorR4);
      floor.position.set(RW/2, -0.01, RD/2); S.group.add(floor);
      const ceil = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.02, RD), matCeilR4);
      ceil.position.set(RW/2, RH + 0.01, RD/2); S.group.add(ceil);

      function setUVsByLocal(geometry, uvFn, mainAxis) {
        const pos = geometry.attributes.position;
        const norm = geometry.attributes.normal;
        const uvs = new Float32Array(pos.count * 2);
        const axisIdx = { x: 0, y: 1, z: 2 }[mainAxis];
        for (let i = 0; i < pos.count; i++) {
          const onMain = (axisIdx === undefined || !norm) ||
            Math.abs([norm.getX(i), norm.getY(i), norm.getZ(i)][axisIdx]) > 0.5;
          if (onMain) {
            const out = uvFn(pos.getX(i), pos.getY(i), pos.getZ(i));
            uvs[i*2 + 0] = out[0];
            uvs[i*2 + 1] = out[1];
          } else {
            uvs[i*2 + 0] = 0.5;
            uvs[i*2 + 1] = 0.5;
          }
        }
        geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      }
      function wallShapeWithHole(wallW, wallH, hx1, hy1, hx2, hy2) {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0); shape.lineTo(wallW, 0); shape.lineTo(wallW, wallH);
        shape.lineTo(0, wallH); shape.lineTo(0, 0);
        const path = new THREE.Path();
        path.moveTo(hx1, hy1); path.lineTo(hx2, hy1); path.lineTo(hx2, hy2);
        path.lineTo(hx1, hy2); path.lineTo(hx1, hy1);
        shape.holes.push(path);
        return new THREE.ShapeGeometry(shape);
      }
      // frosted-wall (x=0) — narrow vertical privacy window cutout
      matWall_x0.side = THREE.DoubleSide;
      const wA = new THREE.Mesh(wallShapeWithHole(RD, RH, 2.94, 0.95, 3.20, 1.80), matWall_x0);
      wA.rotation.y = Math.PI/2;
      wA.position.set(0, 0, RD);
      S.group.add(wA);
      setUVsByLocal(wA.geometry, (lx, ly, lz) => [lx / RD, ly / RH]);
      // closet-wall (x=RW) — no cutouts (bi-fold + cabinet are surface furniture)
      const wB = new THREE.Mesh(new THREE.BoxGeometry(WT_R, RH, RD), matWall_xW);
      wB.position.set(RW + WT_R/2, RH/2, RD/2); S.group.add(wB);

      // entrance-wall (z=0) — short wall, door as occluder
      const wC = new THREE.Mesh(new THREE.BoxGeometry(RW, RH, WT_R), matWall_z0);

      setUVsByLocal(wC.geometry, (lx, ly, lz) => [ 0.5 + lx / RW, 0.5 + ly / RH ], 'z');

      matWall_zD.side = THREE.DoubleSide;
      const wD = new THREE.Mesh(wallShapeWithHole(RW, RH, 0.60, 0.85, 2.10, 1.75), matWall_zD);

      const ZF = 0.001;
      const bbH = 0.05, bbD = 0.01, bbColor = 0xf2f0eb, bbX = { roughness: 0.7 };
      box(bbD, bbH, RD, bbD/2 + ZF,        bbH/2, RD/2, bbColor, bbX);
      box(bbD, bbH, RD, RW - bbD/2 - ZF,   bbH/2, RD/2, bbColor, bbX);
      box(RW,  bbH, bbD, RW/2, bbH/2, bbD/2 + ZF,      bbColor, bbX);
      box(RW,  bbH, bbD, RW/2, bbH/2, RD - bbD/2 - ZF, bbColor, bbX);
      const cmH = 0.06, cmD = 0.02, cmColor = 0xffffff, cmY = RH - cmH/2;
      box(cmD, cmH, RD, cmD/2 + ZF,        cmY, RD/2, cmColor, bbX);
      box(cmD, cmH, RD, RW - cmD/2 - ZF,   cmY, RD/2, cmColor, bbX);
      box(RW,  cmH, cmD, RW/2, cmY, cmD/2 + ZF,      cmColor, bbX);
      box(RW,  cmH, cmD, RW/2, cmY, RD - cmD/2 - ZF, cmColor, bbX);

      // ---- Sliding window (window-wall, z=RD) ----
      feat('z', RD, -1, { a1: 0.60, a2: 2.10, b1: 0.85, b2: 1.75 }, matGlassR4);
      winFrame('z', RD, -1, 0.60, 2.10, 0.85, 1.75, matFrameR4);
      feat('z', RD, -1, { a1: 1.33, a2: 1.37, b1: 0.85, b2: 1.75 }, matFrameR4);
      {
        const lever = new THREE.Mesh(new THREE.BoxGeometry(0.070, 0.018, 0.012), matHandleR4);
        lever.position.set(1.35 - 0.04, 1.20, RD - BIAS - FEAT - 0.006);
        S.group.add(lever);
        const stem = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.010, 0.012), matHandleR4);
        stem.position.set(1.35, 1.20, RD - BIAS - FEAT - 0.006);
        S.group.add(stem);
      }
      // Cream curtains.
      function applyClothShader(material, sheenColor = 0xfff8ee, sheenStrength = 0.15) {
        const sc = new THREE.Color(sheenColor);
        material.onBeforeCompile = (shader) => {
          shader.uniforms.sheenColor = { value: sc };
          shader.uniforms.sheenStrength = { value: sheenStrength };
          shader.fragmentShader = shader.fragmentShader
            .replace('#include <common>',
              '#include <common>\nuniform vec3 sheenColor;\nuniform float sheenStrength;')
            .replace('#include <output_fragment>',
              'float NoV = max(dot(normalize(vNormal), normalize(vViewPosition)), 0.0);\n' +
              'float fresnel = pow(1.0 - NoV, 4.0);\n' +
              'gl_FragColor.rgb += sheenColor * sheenStrength * fresnel;\n' +
              '#include <output_fragment>');
        };
      }
      {
        const matCurt = new THREE.MeshStandardMaterial({ color: 0xddd2c0, roughness: 1 });
        const matBand = new THREE.MeshStandardMaterial({ color: 0xc7bba2, roughness: 0.95 });
        applyClothShader(matCurt);
        function flutedColumn(rTop, rBot, height, ridges, depth) {
          const geom = new THREE.CylinderGeometry(rTop, rBot, height, 64, 1, false);
          const pos = geom.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), z = pos.getZ(i);
            const r = Math.hypot(x, z);
            if (r < 1e-6) continue;
            const theta = Math.atan2(z, x);
            const jitter = 0.85 + 0.15 * Math.sin(ridges * theta * 1.5 + 1.7);
            const valley = (1 - Math.cos(ridges * theta)) * 0.5 * jitter;
            const newR = r - depth * valley;
            pos.setX(i, x * newR / r);
            pos.setZ(i, z * newR / r);
          }
          pos.needsUpdate = true;
          geom.computeVertexNormals();
          return geom;
        }
        const cTop = 1.85, cZ = RD - 0.10;
        function bunch(xPos, yBot, yTie) {
          const fullH = cTop - yBot;
          const col = new THREE.Mesh(flutedColumn(0.058, 0.080, fullH, 8, 0.025), matCurt);
          col.position.set(xPos, (cTop + yBot) / 2, cZ);
          S.group.add(col);

          band.position.set(xPos, yTie, cZ);

      // ---- Frosted privacy window (frosted-wall, x=0) — near window-wall corner ----
      feat('x', 0, +1, { a1: 2.94, a2: 3.20, b1: 0.95, b2: 1.80 }, matFrostedR4);

      // ---- Entrance door (entrance-wall, z=0) ----

      box(cW2, 2.0 + cW2, cD2, dX1 + cW2/2,        (2.0 + cW2)/2, cZ2, 0xfafafa, { roughness: 0.55 });
      box(dX1 - dX0, 2.0, 0.04, (dX0 + dX1)/2, 1.0, 0.025, 0xffffff, { roughness: 0.55 });
      {
        const matHinge = new THREE.MeshStandardMaterial({ color: 0xa8a8a8, metalness: 1.0, roughness: 0.30 });
        const hingeGeom = new THREE.CylinderGeometry(0.012, 0.012, 0.07, 14);

          new THREE.CylinderGeometry(0.011, 0.011, 0.035, 14),
