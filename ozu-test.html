        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.010, 0.010, 0.030, 14), matCabLever);
        stem.rotation.z = Math.PI / 2;
        stem.position.set(doorFaceX + 0.017, lvY, lvZ);
        S.group.add(stem);
        // Lever bar — horizontal, parallel to door face, extends in +z toward
        // the seam (where the user's fingers naturally curl to pull the leaf).
        const leverLen = 0.090, leverThick = 0.012;
        const lever = new THREE.Mesh(
          new THREE.BoxGeometry(leverThick, leverThick, leverLen),
          matCabLever
        );
        lever.position.set(doorFaceX + 0.036, lvY - 0.003, lvZ + leverLen / 2 - 0.010);
        S.group.add(lever);
      }
      // coat hook rail on cabinet-wall, entrance-wall side (z near 0).
      // Whitewashed/distressed wood plank with two black peg hooks.
      {
        const matRail = new THREE.MeshStandardMaterial({ color: 0xe6dfd2, roughness: 0.85 });
        const matHook = new THREE.MeshStandardMaterial({ color: 0x1a1715, roughness: 0.5, metalness: 0.4 });
        const railZ = 0.30, railY = 1.70, railLen = 0.50, railH = 0.10, railT = 0.018;
        const rail = new THREE.Mesh(new THREE.BoxGeometry(railT, railH, railLen), matRail);
        rail.position.set(BIAS + railT/2, railY, railZ); S.group.add(rail);
        // 2 hook pegs sticking ~5 cm into the room.
        const pegGeom = new THREE.CylinderGeometry(0.008, 0.008, 0.05, 12);
        for (const dz of [-0.12, 0.12]) {
          const peg = new THREE.Mesh(pegGeom, matHook);
          peg.position.set(BIAS + railT + 0.025, railY - 0.01, railZ + dz);
          peg.rotation.z = Math.PI / 2; // lay along x (sticking out from wall)
          S.group.add(peg);
          // small ball cap on the end of each peg
          const cap = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), matHook);
          cap.position.set(BIAS + railT + 0.052, railY - 0.01, railZ + dz);
          S.group.add(cap);
        }
      }

      // AC unit on z=D (ac-wall) — split-system look:
      // body + bottom louver flap + recessed grille + vent slit + LED.
      // Body + flap share the Cycles-baked abs_plastic PBR material; grille +
      // slit stay flat because they're small accent details.
      {
        const acCx = 2.1, acCy = 2.27;
        const acW = 0.82, acH = 0.26, acD = 0.18;
        const acBackZ  = RD - BIAS;            // back face (against wall)
        const acFrontZ = acBackZ - acD;        // front face (into room)
        // Shared PBR material for AC body + flap. Per CLAUDE.md `box()`
        // gotcha: box() creates a fresh material per call, so we use an
        // inline acBox() helper that re-uses the shared PBR material.
        const matACPlastic = pbrFromBase('ozu-test/room-1-textures/ac/abs/abs', 1, 1);
        const acBox = (w, h, d, cx, cy, cz) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matACPlastic);
          m.position.set(cx, cy, cz);
          S.group.add(m);
          return m;
        };
        // main body — abs_plastic PBR
        acBox(acW, acH, acD, acCx, acCy, acFrontZ + acD/2);
        // bottom louver flap — abs_plastic PBR
        acBox(acW * 0.94, 0.04, acD * 0.6, acCx, acCy - acH/2 - 0.01, acFrontZ + acD * 0.45);
        // front grille (slightly recessed, slightly darker — stays flat)
        box(acW * 0.86, acH * 0.55, 0.003, acCx, acCy + 0.02, acFrontZ - 0.002,
            0xc6c3bd, { roughness: 0.7 });
        // dark vent slit just above the bottom flap (stays flat)
        box(acW * 0.92, 0.02, 0.006, acCx, acCy - acH/2 + 0.02, acFrontZ - 0.003,
            0x252525, { roughness: 0.4 });
      }
      feat('z', RD, -1, { a1: 0.30, a2: 0.56, b1: 0.9, b2: 1.9 }, matFrosted);
      winFrame('z', RD, -1, 0.30, 0.56, 0.9, 1.9, matFrameR1);
      // intercom / call panel on ac-wall — small white plate below the AC.
      {
        // Plate is matte plastic; button is a small darker push-button (kept slightly
        // glossier so the eye picks it out as the actual control).
        const matPanel = new THREE.MeshStandardMaterial({ color: 0xf2f0eb, roughness: 0.65 });
        const matBtn   = new THREE.MeshStandardMaterial({ color: 0x4d5052, roughness: 0.35 });
        const px = 1.55, py = 1.65, pz = RD - 0.004;
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.12, 0.008), matPanel);
        plate.position.set(px, py, pz); S.group.add(plate);
        const btn = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.02, 0.003), matBtn);
        btn.position.set(px, py - 0.025, pz - 0.006); S.group.add(btn);
      }

      // bed — April 22 v4: along ac-wall (z=D); head at corner-ac-window (x=W), foot at corner-ac-entrance (x=0.7)
      // Pulled back 3 cm from both walls so posts (radius 24 mm) don't poke
      // through the ac-wall and the mattress doesn't z-fight at the surface.
      // Mattress slab — mostly covered by the more elaborate matSheet (sheen
      // + displacement) further down, but the foot end + sides are visible.
      // Use shared cream_cotton PBR material directly (not via aabb/box which
      // would create a fresh material — see CLAUDE.md `box()` gotcha note).
      {
        const matMattressR1 = pbrFromBase('ozu-test/room-1-textures/mattress/cream_cotton/cream_cotton', 2, 2);
        const mr = { x1: 0.7, x2: 2.67, z1: 1.7, z2: 2.67, y1: 0.1, y2: 0.5 };
        const mat_mesh = new THREE.Mesh(
          new THREE.BoxGeometry(mr.x2 - mr.x1, mr.y2 - mr.y1, mr.z2 - mr.z1),
          matMattressR1,
        );
        mat_mesh.position.set((mr.x1+mr.x2)/2, (mr.y1+mr.y2)/2, (mr.z1+mr.z2)/2);
        S.group.add(mat_mesh);
      }
      // Pipe-style headboard / footboard, matching the photo reference at
      //   ozu-test/interior-images/room-1/corner-cabinet-window/
      //     room-1-corner-cabinet-window-08.webp
      // Cylindrical rails + bars (was square bars), end posts extend ABOVE
      // the top rail by 8 cm with two decorative collar rings + a small ball
      // cap on top. Replaces the previous separate "ball finials" block —
      // caps are now integral to the frame so they always touch the post.
      const IRON = { roughness: 0.45, metalness: 0.6 };
      // Bed iron now uses the Cycles-baked black_iron PBR (originally baked
      // for room-3's shelf). Shared across room-1, room-3, room-4 — same
      // dark-iron appearance in the photos for all three rooms.
      const ironMat = pbrFromBase('ozu-test/room-3-textures/shelf/black_iron/black_iron', 1, 1, { metalness: 0.6 });
      function pipeFrame(panel, topRail, botRail, nBars) {
        const w = panel.x2 - panel.x1, d = panel.z2 - panel.z1;
        const cx = (panel.x1 + panel.x2) / 2, cz = (panel.z1 + panel.z2) / 2;
        const isLongZ = d > w;
        const length = isLongZ ? d : w;

        // Horizontal rails — cylinders along the long axis.
        function rail(yCenter, thickness) {
          const r = thickness / 2;
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, length, 16),
            ironMat,
          );
          if (isLongZ) m.rotation.x = Math.PI / 2;
          else         m.rotation.z = Math.PI / 2;
          m.position.set(cx, yCenter, cz);
          S.group.add(m);
        }
        rail((topRail.y1 + topRail.y2) / 2, topRail.y2 - topRail.y1);
        rail((botRail.y1 + botRail.y2) / 2, botRail.y2 - botRail.y1);

        // Vertical bars + end posts. End posts are slightly thicker and rise
        // 8 cm above the top rail to host the collar bands + cap.
        const barR  = 0.020;
        const postR = 0.024;
        const barH  = topRail.y1 - botRail.y2;
        const barCy = (topRail.y1 + botRail.y2) / 2;
        const POST_RISE = 0.08;
        const postH    = barH + POST_RISE;
        const postCy   = botRail.y2 + postH / 2;
        const postTopY = botRail.y2 + postH;

        for (let i = 0; i < nBars; i++) {
          const t = nBars === 1 ? 0.5 : i / (nBars - 1);
          const isEnd = (i === 0 || i === nBars - 1);
          const r = isEnd ? postR : barR;
          const h = isEnd ? postH : barH;
          const cy = isEnd ? postCy : barCy;
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, h, 16),
            ironMat,
          );
          if (isLongZ) m.position.set(cx, cy, panel.z1 + d * t);
          else         m.position.set(panel.x1 + w * t, cy, cz);
          S.group.add(m);
        }

        // End-post detail: 2 collar bands + small ball cap on top.
        const collarR    = postR + 0.006;
        const collarTube = 0.005;
        const collarGeom = new THREE.TorusGeometry(collarR, collarTube, 8, 22);
        const capGeom    = new THREE.SphereGeometry(postR + 0.004, 16, 12);
        for (const i of [0, nBars - 1]) {
          const t = i / (nBars - 1);
          const x = isLongZ ? cx : panel.x1 + w * t;
          const z = isLongZ ? panel.z1 + d * t : cz;
          for (const yOff of [0.025, 0.050]) {
            const c = new THREE.Mesh(collarGeom, ironMat);
            c.position.set(x, postTopY - yOff, z);
            c.rotation.x = Math.PI / 2;   // torus axis aligned to +Y
            S.group.add(c);
          }
          const cap = new THREE.Mesh(capGeom, ironMat);
          // Sphere bottom sits 5 mm below post top so it reads as welded on.
          cap.position.set(x, postTopY - 0.005 + (postR + 0.004), z);
          S.group.add(cap);
        }
      }
      // Footboard — simple pipe frame, matches corner-cabinet-window-08.
      // z2 pulled back 3 cm from ac-wall so the corner post (radius 24 mm) sits inside.
      pipeFrame({ x1: 0.7,  x2: 0.75, z1: 1.7, z2: 2.67 }, { y1: 0.68, y2: 0.7 }, { y1: 0, y2: 0.02 }, 3);

      // Headboard — distinct construction from the footboard. Reference:
      //   ozu-test/interior-images/room-1/corner-ac-window/
      //     room-1-corner-ac-window-{01,02}.webp
      // Two-section design: lower half is a stained-wood inset panel between
      // bottom rail (at mattress level) and middle rail, with black bracket
      // plates hugging both side edges; upper half is a short row of vertical
      // bars between middle rail and top rail. Corner posts run full-height
      // and end in collar bands + ball cap.
      {
        // Headboard pulled back 3 cm from window-wall (x) and ac-wall (z) so the
        // corner posts (radius 24 mm) don't protrude through either wall.
        const head = { x1: 2.62, x2: 2.67, z1: 1.7, z2: 2.67 };
        const w = head.x2 - head.x1, d = head.z2 - head.z1;
        const cx = (head.x1 + head.x2) / 2, cz = (head.z1 + head.z2) / 2;
        const Y_TOP = 1.0, Y_MID = 0.85, Y_BOT = 0.50;
        const POST_R = 0.024, POST_RISE = 0.08;
        const POST_TOP_Y = Y_TOP + POST_RISE;

        // Corner posts (full height; cap zone above the top rail)
        for (const z of [head.z1, head.z2]) {
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(POST_R, POST_R, POST_TOP_Y, 16),
            ironMat,
          );
          post.position.set(cx, POST_TOP_Y / 2, z);
          S.group.add(post);
        }

        // Three horizontal rails along z (top, middle, bottom).
        function headRail(yC, thickness) {
          const r = thickness / 2;
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, d, 16),
            ironMat,
          );
          m.rotation.x = Math.PI / 2;
          m.position.set(cx, yC, cz);
          S.group.add(m);
        }
        headRail(Y_TOP, 0.02);
        headRail(Y_MID, 0.02);
        headRail(Y_BOT, 0.02);

        // Upper section: 5 short vertical bars between middle and top rails.
        const UPPER_BARS = 5;
        const barR = 0.020;
        const upperH = Y_TOP - Y_MID;
        const upperCy = (Y_TOP + Y_MID) / 2;
        for (let i = 0; i < UPPER_BARS; i++) {
          const t = (i + 0.5) / UPPER_BARS; // centred between the corner posts
          const z = head.z1 + 0.06 + (d - 0.12) * t;
          const bar = new THREE.Mesh(
            new THREE.CylinderGeometry(barR, barR, upperH, 14),
            ironMat,
          );
          bar.position.set(cx, upperCy, z);
          S.group.add(bar);
        }

        // Wood inset panel — 3 horizontal stained-wood planks between bottom
        // and middle rails. Same dark_wood texture as the desk + shelf tiers
        // so the room reads as one furniture set.
        const woodMat = pbrMatR1('dark_wood', 1.2, 0.4, { roughness: 0.65, color: 0xffd0a0 });
        const PLANK_COUNT = 3;
        const wpInset = 0.07; // pulled in from corner posts so the brackets fit between
        const wpZ1 = head.z1 + wpInset, wpZ2 = head.z2 - wpInset;
        const wpZSpan = wpZ2 - wpZ1;
        const totalH = Y_MID - Y_BOT;
        const plankH = totalH / PLANK_COUNT;
        const plankT = 0.045;
        for (let i = 0; i < PLANK_COUNT; i++) {
          const cy = Y_BOT + (i + 0.5) * plankH;
          const plank = new THREE.Mesh(
            new THREE.BoxGeometry(plankT, plankH * 0.96, wpZSpan),
            woodMat,
          );
          plank.position.set(cx, cy, cz);
          S.group.add(plank);
        }

        // Side brackets — flat black plates hugging both z edges of the wood
        // panel. Approximates the stepped industrial bracket detail visible
        // in the photo without modelling each rivet.
        const brW = 0.05, brT = 0.05;
        for (const z of [wpZ1 - brT / 2, wpZ2 + brT / 2]) {
          const br = new THREE.Mesh(
            new THREE.BoxGeometry(brW, totalH, brT),
            ironMat,
          );
          br.position.set(cx, (Y_BOT + Y_MID) / 2, z);
          S.group.add(br);
          // Three horizontal rivet bands across each bracket — approximates
          // the visible "screw" pattern on real industrial gussets.
          for (let k = 0; k < 3; k++) {
            const t = (k + 0.5) / 3;
            const ribY = Y_BOT + t * totalH;
            const rib = new THREE.Mesh(
              new THREE.BoxGeometry(brW * 1.15, 0.008, brT * 1.15),
              ironMat,
            );
            rib.position.set(cx, ribY, z);
            S.group.add(rib);
          }
        }

        // Corner-post detail: 2 collar bands + small ball cap on top.
        const collarR = POST_R + 0.006;
        const collarTube = 0.005;
        const collarGeom = new THREE.TorusGeometry(collarR, collarTube, 8, 22);
        const capGeom = new THREE.SphereGeometry(POST_R + 0.004, 16, 12);
        for (const z of [head.z1, head.z2]) {
          for (const yOff of [0.025, 0.050]) {
            const c = new THREE.Mesh(collarGeom, ironMat);
            c.position.set(cx, POST_TOP_Y - yOff, z);
            c.rotation.x = Math.PI / 2;
            S.group.add(c);
          }
          const cap = new THREE.Mesh(capGeom, ironMat);
          cap.position.set(cx, POST_TOP_Y - 0.005 + (POST_R + 0.004), z);
          S.group.add(cap);
        }
      }
      // ── BEDDING — wrinkled cotton sheet + white sleeping pillow + dark
      // velour throw cushion. Reference photos:
      //   corner-ac-entrance-{02,03,04}, corner-ac-window-{01,02,03}
      //
      // Cutting-edge runtime stack:
      //  • MeshPhysicalMaterial with native r155+ `sheen` — proper cloth
      //    edge-highlight, replaces the manual onBeforeCompile fresnel patch
      //    that used to ship for these meshes (the patch still lives at the
      //    top of this scene for curtains and is unchanged).
      //  • Wrinkled sheet built from a high-resolution PlaneGeometry with
      //    multi-octave noise displacement on the mattress-top surface and
      //    edge drape along the four sides — replaces the prior flat
      //    2.04×0.04×1.04 BoxGeometry slab.
      //  • Plush pillows / cushion built from RoundedBoxGeometry (instead
      //    of stretched SphereGeometry which read as uniform ellipsoids)
      //    with per-vertex dimples carved into the top face.
      //  • PBR maps baked offline on the A6000 via
      //    ozu-test/bake/bake_room1_bedding.py auto-load from
      //    ozu-test/room-1-textures/bedding/<part>/. If the bake hasn't run,
      //    the materials still look correct on the runtime sheen alone.
      {
        const aniso = renderer.capabilities.getMaxAnisotropy();
        const bedLoader = new THREE.TextureLoader();
        // Promise-style optional load: never errors if the file is missing
        // (bake may not have run yet). Tags textures with colorSpace + repeat
        // appropriate for the kind of map.
        function bakedTex(slug, kind, repeatU = 1, repeatV = 1) {
          return new Promise((resolve) => {
            const path = `ozu-test/room-1-textures/bedding/${slug}/${slug}_${kind}.png`;
            bedLoader.load(
              path,
              (t) => {
                t.wrapS = THREE.RepeatWrapping;
                t.wrapT = THREE.RepeatWrapping;
                t.repeat.set(repeatU, repeatV);
                t.anisotropy = aniso;
                t.colorSpace = (kind === 'albedo') ? THREE.SRGBColorSpace : THREE.NoColorSpace;
                resolve(t);
              },
              undefined,
              () => resolve(null),
            );
          });
        }
        function wireBakedMaps(mat, slug) {
          Promise.all([
            bakedTex(slug, 'albedo'),
            bakedTex(slug, 'normal'),
            bakedTex(slug, 'roughness'),
            bakedTex(slug, 'ao'),
          ]).then(([albedo, normal, rough, ao]) => {
            if (albedo) mat.map           = albedo;
            if (normal) mat.normalMap     = normal;
            if (rough)  mat.roughnessMap  = rough;
            if (ao)     mat.aoMap         = ao;
            if (albedo || normal || rough || ao) mat.needsUpdate = true;
          });
        }
        // Materials — native r184 sheen replaces the manual fresnel patch.
        const matSheet = new THREE.MeshPhysicalMaterial({
          color: 0xf8f4ec, roughness: 0.95,
          sheen: 1.0, sheenColor: new THREE.Color(0xfff8ec), sheenRoughness: 0.55,
        });
        const matPillowW = new THREE.MeshPhysicalMaterial({
          color: 0xfafaf4, roughness: 0.90,
          sheen: 1.0, sheenColor: new THREE.Color(0xfffaf0), sheenRoughness: 0.45,
        });
        // Dark grey velour throw cushion — heavy sheen, plush like cut velvet.
        // Color sampled from corner-ac-window-01 (charcoal-olive, slightly cool).
        const matCushionGrey = new THREE.MeshPhysicalMaterial({
          color: 0x3e423f, roughness: 0.95,
          sheen: 1.0, sheenColor: new THREE.Color(0xb6bdba), sheenRoughness: 0.20,
        });
        // Auto-load of baked maps is currently DISABLED for all bedding
        // pieces. The cloth-sim sheet's textures were baked against a
        // Blender-deformed mesh whose vertices land in different XZ
        // positions than the runtime procedural mesh; even with planar UVs,
        // the dark folds in the bake would smear onto flat regions of the
        // runtime mesh. The pillow/cushion textures use Blender's cube
        // unwrap which doesn't match RoundedBoxGeometry's UV layout.
        // Re-enable per-piece once we ship the GLTFLoader-backed mesh load
        // (see the import note at the top of the module). The wireBakedMaps
        // helper above is kept ready for that day.
        void wireBakedMaps;       // referenced to silence "unused" linting

        // ── Wrinkled sheet (procedural, JS-side) ──
        // Mattress AABB: x=[0.7, 2.67], y=[0.1, 0.5], z=[1.7, 2.67].
        // Sheet is a horizontal PlaneGeometry sized EXACTLY to the mattress
        // footprint — no overhang in any direction, because:
        //   • Footboard at x=0.70..0.75 blocks drape on the foot end
        //   • Headboard at x=2.62..2.67 blocks drape on the head end
        //   • Ac-wall at z=2.67 blocks drape on the wall side
        //   • Bed-frame side-rail at z=1.7 sits flush with the mattress edge
        // Wrinkles + sleeper-sag added as vertex displacement only.
        const mBox = { x1: 0.7, x2: 2.67, z1: 1.7, z2: 2.67 };
        const mTop = 0.50;
        const sheetW = mBox.x2 - mBox.x1;
        const sheetD = mBox.z2 - mBox.z1;
        const sheetGeom = new THREE.PlaneGeometry(sheetW, sheetD, 96, 48);
        sheetGeom.rotateX(-Math.PI / 2);    // flat horizontal, normal +y
        const sCx = (mBox.x1 + mBox.x2) / 2;
        const sCz = (mBox.z1 + mBox.z2) / 2;
        function noise2(x, z) {
          let n = 0, amp = 1.0, freq = 1.0;
          for (let i = 0; i < 4; i++) {
            n += Math.sin(x * freq * 2.31 + 0.7) * Math.cos(z * freq * 1.73 + 1.3) * amp;
            n += Math.sin((x * freq * 1.07 + z * freq * 1.19) + 2.1) * amp * 0.6;
            freq *= 2.0; amp *= 0.5;
          }
          return n;
        }
        const sPos = sheetGeom.attributes.position;
        for (let i = 0; i < sPos.count; i++) {
          const lx = sPos.getX(i), lz = sPos.getZ(i);
          const wx = sCx + lx, wz = sCz + lz;
          const wrinkle = noise2(wx * 9, wz * 9) * 0.010 + noise2(wx * 22, wz * 22) * 0.004;
          const cx2 = wx - 1.85, cz2 = wz - 2.18;
          const sag = -0.008 * Math.exp(-(cx2 * cx2 + cz2 * cz2) * 2.5);
          sPos.setY(i, 0.015 + wrinkle + sag);
        }
        sPos.needsUpdate = true;
        sheetGeom.computeVertexNormals();
        sheetGeom.setAttribute('uv2', new THREE.BufferAttribute(sheetGeom.attributes.uv.array, 2));
        const sheet = new THREE.Mesh(sheetGeom, matSheet);
        sheet.position.set(sCx, mTop, sCz);
        sheet.castShadow = true;
        sheet.receiveShadow = true;
        S.group.add(sheet);

        // ── White sleeping pillow (rectangular, lying flat at headboard end) ──
        // Long axis runs along z (across the bed). Dimensions ~50 cm × 35 cm,
        // ~10 cm thick. Photos: corner-ac-window-01/02 show it crumpled but
        // roughly rectangular with rounded corners.
        const wpDims = { w: 0.50, h: 0.10, d: 0.35 };
        const wpGeom = new RoundedBoxGeometry(wpDims.w, wpDims.h, wpDims.d, 6, 0.025);
        // Subtle pillow dimples on the top face — vertices with high y get
        // their y pulled down slightly in a soft dome pattern.
        const wpPos = wpGeom.attributes.position;
        for (let i = 0; i < wpPos.count; i++) {
          const py = wpPos.getY(i);
          if (py > wpDims.h / 2 - 0.001) {
            const px = wpPos.getX(i), pz = wpPos.getZ(i);
            const r2 = (px * px) / 0.07 + (pz * pz) / 0.04;
            const dimple = -0.012 * Math.exp(-r2 * 1.4) + noise2(px * 18, pz * 18) * 0.004;
            wpPos.setY(i, py + dimple);
          }
        }
        wpPos.needsUpdate = true;
        wpGeom.computeVertexNormals();
        wpGeom.setAttribute('uv2', new THREE.BufferAttribute(wpGeom.attributes.uv.array, 2));
        const wPillow = new THREE.Mesh(wpGeom, matPillowW);
        // Slot snugly against the headboard. Headboard panel is at x=2.62..2.67;
        // pillow back face sits at x = 2.62 - wp.w/2 = 2.37.
        wPillow.position.set(2.37, mTop + wpDims.h / 2 + 0.015, 2.18);
        wPillow.castShadow = true;
        wPillow.receiveShadow = true;
        S.group.add(wPillow);

        // ── Dark velour throw cushion (lying flat in front of the white pillow) ──
        // Square ~40 × 40 cm × 12 cm thick. Lying flat with its big square
        // face up, in front of the white pillow toward the foot of the bed.
        // (Earlier upright-against-pillow version clipped into the white
        // pillow and read as a "floating slab" rather than a soft cushion.)
        const cuDims = { w: 0.40, h: 0.12, d: 0.42 };
        const cuGeom = new RoundedBoxGeometry(cuDims.w, cuDims.h, cuDims.d, 6, 0.040);
        // Plush dimples on the top face (+y) so it doesn't read as a flat slab.
        const cuPos = cuGeom.attributes.position;
        for (let i = 0; i < cuPos.count; i++) {
          const py = cuPos.getY(i);
          if (py > cuDims.h / 2 - 0.001) {
            const px = cuPos.getX(i), pz = cuPos.getZ(i);
            const r2 = (px * px) / 0.08 + (pz * pz) / 0.08;
            const dimple = -0.012 * Math.exp(-r2 * 1.1) + noise2(px * 15, pz * 15) * 0.004;
            cuPos.setY(i, py + dimple);
          }
        }
        cuPos.needsUpdate = true;
        cuGeom.computeVertexNormals();
        cuGeom.setAttribute('uv2', new THREE.BufferAttribute(cuGeom.attributes.uv.array, 2));
        const cushion = new THREE.Mesh(cuGeom, matCushionGrey);
        // White pillow spans x=2.12..2.62; cushion sits IN FRONT of it
        // (toward the foot), with a slight overlap so the two read as a
        // proper bedding stack rather than two separate floating objects.
        cushion.position.set(1.98, mTop + cuDims.h / 2 + 0.015, 2.18);
        cushion.castShadow = true;
        cushion.receiveShadow = true;
        S.group.add(cushion);
      }

      // desk — against window-wall (x=W), under sliding window. Reclaimed-pine
      // plank top with slightly softened edges + slim shallow drawer with a
      // small round chrome pull. Photo references:
      //   corner-cabinet-window-{01,02,03} (top + front edge + side end-grain)
      //   corner-ac-window-02              (drawer + chrome pull)
      {
        const f = { x1: 2.1, x2: 2.7, z1: 0.4, z2: 1.4 };
        const w = f.x2 - f.x1, d = f.z2 - f.z1;
        const cx = (f.x1+f.x2)/2, cz = (f.z1+f.z2)/2;
        const topY = 0.75, topT = 0.05, legT = 0.04;
        const matDesk = pbrMatR1('dark_wood', 1.2, 0.6, { roughness: 0.65, color: 0xffd0a0 });
        // Rounded-box top so the front edge reads as a real wood plank, not
        // a perfectly sharp slab. Radius is small (8 mm) so the shape stays
        // recognisable as a desk.
        const top = new THREE.Mesh(new RoundedBoxGeometry(w, topT, d, 3, 0.008), matDesk);
        top.position.set(cx, topY - topT/2, cz); S.group.add(top);

        // Drawer — slim, runs ~70% of the desk WIDTH (along z), hung under
        // the front edge (low-x side faces the chair, so drawer face sits
        // at f.x1). The body recesses ~30 cm INTO the desk depth (x).
        // (Prior version sized the body by `d * 0.85` along x — which gave
        // an 0.85 m drawer running half a metre past the desk into the chair
        // back. Swapped to the correct axis here.)
        const drwH = 0.07, drwT = 0.018;
        const drwW = d * 0.70;                        // 0.70 m, along z
        const drwBodyDepth = w * 0.55;                // 0.33 m, along x (into desk)
        const drwY = topY - topT - drwH / 2 - 0.005;
        const drwBodyX = f.x1 + drwT + drwBodyDepth / 2;   // body just behind the face
        // Drawer body — wood box recessed into the desk depth
        const drwBody = new THREE.Mesh(
          new RoundedBoxGeometry(drwBodyDepth, drwH, drwW, 2, 0.004),
          matDesk,
        );
        drwBody.position.set(drwBodyX, drwY, cz);
        S.group.add(drwBody);
        // Drawer face — proud strip on the chair-facing side (x = f.x1)
        const drwFace = new THREE.Mesh(
          new RoundedBoxGeometry(drwT, drwH, drwW, 2, 0.005),
          matDesk,
        );
        drwFace.position.set(f.x1 + drwT / 2, drwY, cz);
        S.group.add(drwFace);
        // Round chrome pull centred on the drawer face
        const matChromePull = new THREE.MeshStandardMaterial({
          color: 0xcfcfcf, metalness: 0.95, roughness: 0.18,
        });
        const pull = new THREE.Mesh(
          new THREE.CylinderGeometry(0.012, 0.012, 0.012, 16),
          matChromePull,
        );
        pull.rotation.z = Math.PI / 2;
        pull.position.set(f.x1 - 0.006, drwY, cz);
        S.group.add(pull);

        const legH = topY - topT;
        const BMET = { roughness: 0.5, metalness: 0.6 };
        for (const lx of [f.x1 + legT/2, f.x2 - legT/2])
          for (const lz of [f.z1 + legT/2, f.z2 - legT/2])
            box(legT, legH, legT, lx, legH/2, lz, COL.blackMet, BMET);
      }

      // shelf with x-bracing — April 22 v4: at corner-entrance-window (x=W × z=0), L-shape with desk
      {
        const f = { x1: 2.1, x2: 2.7, z1: 0, z2: 0.4 };
        const w = f.x2 - f.x1, d = f.z2 - f.z1;
        const cx = (f.x1+f.x2)/2, cz = (f.z1+f.z2)/2;
        const sH = 1.3, postT = 0.03, tierT = 0.025;
        const tierYs = [0.05, 0.47, 0.89, 1.27];
        const BMET = { roughness: 0.5, metalness: 0.6 };
        for (const px of [f.x1 + postT/2, f.x2 - postT/2])
          for (const pz of [f.z1 + postT/2, f.z2 - postT/2])
            box(postT, sH, postT, px, sH/2, pz, COL.blackMet, BMET);
        const matTier = pbrMatR1('dark_wood', 0.4, 0.4, { roughness: 0.65, color: 0xffd0a0 });
        // Tier shelves sit BETWEEN the corner posts, not flush with them.
        // Previously the tier and post outer faces shared the same plane at
        // every corner, which caused per-pixel z-fighting between the wood
        // texture and the post's black metal — the user saw wood/metal
        // randomly switching at the corners. Photo reference confirms the
        // wood shelves are inset, ending at the posts' inner faces.
        const tierW = w - 2 * postT;
        const tierD = d - 2 * postT;
        for (const y of tierYs) {
          // Slightly rounded edges so each tier reads as a real plank, not a
          // perfectly sharp sheet. Small 5 mm radius keeps the shelf shape clean.
          const tier = new THREE.Mesh(new RoundedBoxGeometry(tierW, tierT, tierD, 2, 0.005), matTier);
          tier.position.set(cx, y, cz); S.group.add(tier);
        }
        function rod(start, end) {
          const dir = new THREE.Vector3().subVectors(end, start);
          const len = dir.length();
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(0.005, 0.005, len, 8),
            new THREE.MeshStandardMaterial({ color: COL.blackMet, metalness: 0.6, roughness: 0.5 })
          );
          m.position.copy(start).add(dir.clone().multiplyScalar(0.5));
          m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
          S.group.add(m);
        }
        const yLo = tierYs[0], yHi = tierYs[3];
        const xLo = f.x1 + postT/2, xHi = f.x2 - postT/2;
        for (const fz of [f.z1, f.z2]) {
          rod(new THREE.Vector3(xLo, yLo, fz), new THREE.Vector3(xHi, yHi, fz));
          rod(new THREE.Vector3(xLo, yHi, fz), new THREE.Vector3(xHi, yLo, fz));
        }
      }

      // chair — parsons / dining chair, mottled grey-leather padded shell on
      // 4 slim tapered black-metal legs. Curved padded seat + tall contoured
      // back with rounded top corners + chrome zipper detail down the centre
      // of the back. Replaces the prior office-chair-with-casters which had
      // no photo support.
      // Photo references:
      //   corner-ac-window-02            (3/4 angle: legs visible, no casters)
      //   corner-cabinet-window-01       (front: padded seat front edge curve)
      //   corner-cabinet-window-{02,03}  (back: chrome zipper down centre back)
      {
        const f = { x1: 1.95, x2: 2.4, z1: 0.7, z2: 1.15 };
        const w = f.x2 - f.x1, d = f.z2 - f.z1;
        const cx = (f.x1 + f.x2) / 2, cz = (f.z1 + f.z2) / 2;
        const seatY = 0.45, seatT = 0.08;            // padded slab thickness
        const backH = 0.50, backT = 0.07;            // padded back thickness

        // Mottled warm-grey distressed leather. PBR maps baked offline via
        // ozu-test/bake/bake_room1_chair.py — gives real grain micro-relief
        // + roughness mottling instead of the prior flat colour.
        const matLeather = (() => {
          const loader = new THREE.TextureLoader();
          const base = 'ozu-test/room-1-textures/chair/leather/leather';
          const map = loader.load(`${base}_albedo.png`);
          map.colorSpace = THREE.SRGBColorSpace;
          const normalMap = loader.load(`${base}_normal.png`);
          const roughnessMap = loader.load(`${base}_roughness.png`);
          const aoMap = loader.load(`${base}_ao.png`);
          const aniso = renderer.capabilities.getMaxAnisotropy();
          for (const t of [map, normalMap, roughnessMap, aoMap]) {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(2, 2);
            t.anisotropy = aniso;
          }
          return new THREE.MeshStandardMaterial({
            map, normalMap, roughnessMap, aoMap,
            aoMapIntensity: 1.0,
            metalness: 0.0,
          });
        })();
        const matBlackMet = new THREE.MeshStandardMaterial({
          color: 0x141414, roughness: 0.40, metalness: 0.7,
        });
        const matChrome = new THREE.MeshStandardMaterial({
          color: 0xcfcfcf, metalness: 0.95, roughness: 0.18,
        });

        // Seat — RoundedBoxGeometry so the front + side edges read as padded
        // upholstery rather than a flat slab.
        const seatW = w * 0.94, seatD = d * 0.92;
        const seat = new THREE.Mesh(
          new RoundedBoxGeometry(seatW, seatT, seatD, 4, 0.025),
          matLeather,
        );
        seat.position.set(cx, seatY - seatT / 2, cz);
        S.group.add(seat);

        // Back — contoured padded panel with rounded top corners. Tilted in a
        // group so the chrome zipper rotates with it.
        const backW = d * 0.95;
        const backGroup = new THREE.Group();
        const backPanel = new THREE.Mesh(
          new RoundedBoxGeometry(backT, backH, backW, 4, 0.04),
          matLeather,
        );
        backPanel.position.set(0, backH / 2, 0);
        backGroup.add(backPanel);
        // Chrome zipper — slim vertical strip running 90% of the back's
        // height, on the back face (visible from behind in cabinet-window-02).
        const zipper = new THREE.Mesh(
          new THREE.BoxGeometry(0.005, backH * 0.92, 0.012),
          matChrome,
        );
        zipper.position.set(-backT / 2 - 0.0025, backH / 2, 0);
        backGroup.add(zipper);
        // Position back at the f.x1 end of the chair, slight backward tilt.
        backGroup.position.set(f.x1 + 0.04 + backT / 2, seatY, cz);
        backGroup.rotation.z = 0.08;
        S.group.add(backGroup);

        // 4 slim tapered black-metal legs reaching the floor. No spider, no
        // casters. Slight inset so the leg tops sit visibly under the seat.
        const legTopR = 0.012, legBotR = 0.008;
        const legH = seatY - seatT;
        const legGeom = new THREE.CylinderGeometry(legTopR, legBotR, legH, 12);
        const insetX = 0.04, insetZ = 0.04;
        for (const [lx, lz] of [
          [f.x1 + insetX, f.z1 + insetZ],
          [f.x2 - insetX, f.z1 + insetZ],
          [f.x1 + insetX, f.z2 - insetZ],
          [f.x2 - insetX, f.z2 - insetZ],
        ]) {
          const leg = new THREE.Mesh(legGeom, matBlackMet);
          leg.position.set(lx, legH / 2, lz);
          S.group.add(leg);
        }
      }

      // pendant lights — flush-mounted 4-shade fixture on stained-wood
      // crossbar with brass collars. PBR maps baked offline on the A6000 via
      // ozu-test/bake/bake_room1_pendant.py and loaded from
      // ozu-test/room-1-textures/pendant/{wood,linen,brass}/<slug>_*.png.
      {
        const cx = 1.35, cz = 1.35, fY = 2.5;
        const barL = 0.34, barT = 0.045;            // thicker, longer crossbar arms
        const sBotY = 2.05, sDia = 0.16, sH = 0.30, sOff = 0.105;
        // PBR loader for pendant components.
        const pendantMat = (slug, repU, repV, extras = {}) => {
          const loader = new THREE.TextureLoader();
          const base = `ozu-test/room-1-textures/pendant/${slug}/${slug}`;
          const map = loader.load(`${base}_albedo.png`);
          map.colorSpace = THREE.SRGBColorSpace;
          const normalMap = loader.load(`${base}_normal.png`);
          const roughnessMap = loader.load(`${base}_roughness.png`);
          const aoMap = loader.load(`${base}_ao.png`);
          const aniso = renderer.capabilities.getMaxAnisotropy();
          for (const t of [map, normalMap, roughnessMap, aoMap]) {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(repU, repV);
            t.anisotropy = aniso;
          }
          return new THREE.MeshStandardMaterial({
            map, normalMap, roughnessMap, aoMap,
            aoMapIntensity: 1.0,
            ...extras,
          });
        };
        // Stained-pine crossbar (wood PBR). Two perpendicular boxes form +.
        const matWoodPBR = pendantMat('wood', 1, 1);
        {
          const armX = new THREE.Mesh(new THREE.BoxGeometry(barL, barT, barT), matWoodPBR);
          armX.position.set(cx, fY - barT/2, cz);
          S.group.add(armX);
          const armZ = new THREE.Mesh(new THREE.BoxGeometry(barT, barT, barL), matWoodPBR);
          armZ.position.set(cx, fY - barT/2, cz);
          S.group.add(armZ);
        }
        // Brass central hub (PBR brass).
        const matBrassPBR = pendantMat('brass', 1, 1, { metalness: 1.0 });
        {
          const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.048, 0.040, 24), matBrassPBR);
          hub.position.set(cx, fY - barT - 0.020, cz);
          S.group.add(hub);
          // Small brass cap on top of hub for additional depth.
          const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.048, 0.010, 24), matBrassPBR);
          cap.position.set(cx, fY - barT - 0.005, cz);
          S.group.add(cap);
        }
        // Linen shade material (PBR linen with woven normal+roughness +
        // visible cross-hatch in albedo). repU=1 means the bake's full
        // ~18-thread weave wraps once around the shade circumference, so
        // the chunky cross-hatch reads clearly from any viewing distance.
        // emissiveMap reuses the albedo so the shade glows woven when lights on.
        const matShade = pendantMat('linen', 1, 1, {
          side: THREE.DoubleSide,
          emissive: 0xfff0d8, emissiveIntensity: 0,
        });
        matShade.emissiveMap = matShade.map;
        const matBulb = new THREE.MeshStandardMaterial({
          color: 0xfff4dc, emissive: 0xffb16e, emissiveIntensity: 0, roughness: 1.0,
        });
        // Lights-toggle wiring — calibrated for AgX tone mapping.
        S.lampMaterial   = matShade;
        S.bulbMaterial   = matBulb;
        S.lampOnIntensity  = 0.5;
        S.lampOffIntensity = 0.18;   // baseline glow so shade interior never reads as pitch-black void
        S.bulbOnIntensity  = 1.8;
        S.lampsOn          = false;
        // Slight conical taper — wider at bottom (1.10× top) matches the
        // gently flared shape visible in the photos. Top stays at sDia/2 so
        // the cap and brass collar still fit.
        const sDiaBot = sDia * 1.10;
        // 48 radial segments (was 24) — smoother cylinder profile from
        // top-down views where each facet would otherwise read as a flat
        // band radiating from centre.
        const shadeGeom  = new THREE.CylinderGeometry(sDia/2, sDiaBot/2, sH, 48, 1, true);
        // Top cap disk — closes the cylinder top so we don't see the dark
        // interior + floor through the open top from above. Same linen
        // material as the side wall so the cap glows with the rest of the
        // shade when lights on. Slightly larger than cylinder inner radius
        // so it fully overlaps the rim with no gap.
        const shadeCapGeom = new THREE.CircleGeometry(sDia/2 + 0.001, 48);
        const bulbGeom   = new THREE.SphereGeometry(0.042, 18, 14);
        const collarGeom = new THREE.CylinderGeometry(sDia/2 + 0.006, sDia/2 + 0.006, 0.022, 48);
        S.lampPointLights = [];
        for (const dx of [-sOff, sOff])
          for (const dz of [-sOff, sOff]) {
            // Linen shade body (open both ends; cap closes the top).
            const sh = new THREE.Mesh(shadeGeom, matShade);
            sh.position.set(cx + dx, sBotY + sH/2, cz + dz);
            S.group.add(sh);
            // Linen cap at top of shade — FACING UP so its lit front face
            // is what the camera sees from above. CircleGeometry default
            // normal is +Z; rotating -π/2 around X puts the normal at +Y.
            const cap = new THREE.Mesh(shadeCapGeom, matShade);
            cap.position.set(cx + dx, sBotY + sH + 0.002, cz + dz);
            cap.rotation.x = -Math.PI / 2;   // face up
            S.group.add(cap);
            // Brass collar — positioned INSIDE the cylinder, BELOW the cap,
            // so it's hidden from straight-above views (the cap covers it).
            // Visible only from the side / below, where it's lit normally.
            // Brass with metallic=1.0 reads as pitch black from above when
            // there's no sky reflection (ceiling 5cm above blocks HDRI), so
            // hiding it from above prevents the unwanted "black ring".
            const collar = new THREE.Mesh(collarGeom, matBrassPBR);
            collar.position.set(cx + dx, sBotY + sH - 0.022, cz + dz);
            S.group.add(collar);
            // Bulb sphere — visible from below through the open bottom.
            const bulb = new THREE.Mesh(bulbGeom, matBulb);
            bulb.position.set(cx + dx, sBotY + 0.05, cz + dz);
            S.group.add(bulb);
            // PointLight per bulb.
            const pl = new THREE.PointLight(0xffb16e, 0, 0, 2);
            pl.position.set(cx + dx, sBotY + 0.05, cz + dz);
            S.group.add(pl);
            S.lampPointLights.push(pl);
          }
        S.lampPointOnIntensity = 36;
      }

      // lighting — sunlight through window-wall (x=W) casting shadows.
      // Two sources working together (Phase 2a of cutting-edge plan):
      //   • DirectionalLight as the parallel sun at infinity — provides the
      //     hard cast shadow on the floor and a directional warm key.
      //   • RectAreaLight matching the sliding-window pane (1.19 m × 0.9 m)
      //     just outside x=W — soft area-light contribution that gives a
      //     window-shaped highlight on whatever the beam actually lands on
      //     and avoids the "single point of sun" feel.
      // Directional intensity is halved (1.6 → 0.8) so the total light isn't
      // doubled when the rect light is added.
      S.group.add(new THREE.AmbientLight(0xffffff, 0.25));
      const dir1 = new THREE.DirectionalLight(0xfff4e0, 0.8);
      dir1.position.set(6.5, 4.5, 1.35);
      dir1.target.position.set(1.0, 0.6, 1.35);
      dir1.castShadow = true;
      dir1.shadow.mapSize.set(4096, 4096);
      dir1.shadow.camera.left = -3;
      dir1.shadow.camera.right = 3;
      dir1.shadow.camera.top = 3;
      dir1.shadow.camera.bottom = -3;
      dir1.shadow.camera.near = 0.1;
      dir1.shadow.camera.far = 12;
      dir1.shadow.bias = -0.0005;
      dir1.shadow.normalBias = 0.02;
      dir1.shadow.radius = 4;            // narrower than the thinnest geometry so shadows don't bleed through bedposts/mullion
      S.group.add(dir1);
      S.group.add(dir1.target);
      // Window-shaped sunbeam — RectAreaLight matched to the sliding-window
      // pane (window hole spans x=RW, z=0.405..1.595, y=0.85..1.75 → 1.19 m
      // wide × 0.90 m tall). Positioned just OUTSIDE the wall and pointed
      // toward the room interior so its surface acts as if daylight is
      // streaming in through the glass. RectAreaLight in three.js does NOT
      // cast shadows — that's intentional: the DirectionalLight above is
      // what casts the floor shadow, the rect light is the area contribution.
      {
        const rectW = 1.19, rectH = 0.90;
        const rectCx = RW + 0.05;            // 5 cm outside the window plane
        const rectCy = (0.85 + 1.75) / 2;    // window vertical centre
        const rectCz = (0.405 + 1.595) / 2;  // window horizontal centre
        const sun = new THREE.RectAreaLight(0xfff4e0, 6.0, rectW, rectH);
        sun.position.set(rectCx, rectCy, rectCz);
        // RectAreaLight emits from its +z face by default. Aim its emission
        // direction toward the room interior centre.
        sun.lookAt(rectCx - 1, rectCy, rectCz);
        S.group.add(sun);
      }
      // Visible god-ray cone — soft additive light shaft so you SEE the
      // beam in the air, not just the patch on the floor. 4-sided cone
      // (square cross-section) roughly matches the window. Vertex-colour
      // alpha gradient peaks ~30% along the length and fades to 0 at the
      // window-plane base and at the apex, so it has no hard edges.
      {
        const BEAM_LEN = 3.0;
        const beamGeom = new THREE.ConeGeometry(0.75, BEAM_LEN, 4, 1, true);
        const posAttr = beamGeom.attributes.position;
        const cols = new Float32Array(posAttr.count * 4);
        for (let i = 0; i < posAttr.count; i++) {
          const y = posAttr.getY(i);
          const t = (y + BEAM_LEN / 2) / BEAM_LEN; // 0 at base → 1 at apex
          const peak = 0.30;
          const a = t < peak ? (t / peak) : Math.max(0, 1 - (t - peak) / (1 - peak));
          cols[i * 4 + 0] = 1;
          cols[i * 4 + 1] = 1;
          cols[i * 4 + 2] = 1;
          cols[i * 4 + 3] = a;
        }
        beamGeom.setAttribute('color', new THREE.BufferAttribute(cols, 4));
        const beamMat = new THREE.MeshBasicMaterial({
          color: 0xfff4d6,
          vertexColors: true,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        const beam = new THREE.Mesh(beamGeom, beamMat);
        beam.castShadow = false;
        beam.receiveShadow = false;
        // Sun-ray direction: dir1 sits at (6.5, 4.5, 1.35) aimed at
        // (1.0, 0.6, 1.35) so rays travel (−5.5, −3.9, 0).
        const sunDir = new THREE.Vector3(1.0 - 6.5, 0.6 - 4.5, 0).normalize();
        const baseCentre = new THREE.Vector3(RW + 0.001, 1.30, 1.00);
        const centre = baseCentre.clone().addScaledVector(sunDir, BEAM_LEN / 2);
        beam.position.copy(centre);
        beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), sunDir);
        S.group.add(beam);
      }
      // Fill light from the cabinet-wall side — fills the dark corners softly
      // without doubling the cast shadow. Originally a cool 0xc8d4e8 sky-tint,
      // but that shifted the window-wall (the only face it directly hits) off
      // the #afa299 paint colour into a noticeably cooler shade. Now using a
      // near-neutral very-slightly-warm fill so all four walls render at the
      // paint colour while the fill still does its corner-lifting job.
      const fill = new THREE.DirectionalLight(0xede8df, 0.22);
      fill.position.set(-2, 3, 1.35);
      fill.target.position.set(1.35, 0.5, 1.35);
      fill.castShadow = false;
      S.group.add(fill);
      S.group.add(fill.target);
      // Enable cast/receive shadow on every mesh in the room.
      // Glass (transmission > 0) skips casting so it doesn't drop a hard
      // shadow as if it were opaque. Backdrop planes (MeshBasicMaterial) skip
      // both since they're outside the room and would otherwise block sun.
      S.group.traverse(obj => {
        if (!obj.isMesh) return;
        const isGlass = obj.material && obj.material.transmission > 0;
        const isBackdrop = obj.material && obj.material.isMeshBasicMaterial;
        obj.castShadow = !isGlass && !isBackdrop;
        obj.receiveShadow = !isBackdrop;
      });
      // Walls + ceiling do NOT participate in shadowing AT ALL.
      // They neither cast shadows nor receive them. The walls are very thin
      // (0.02 m) and were otherwise picking up shadows of interior
      // furniture and projecting them onto their outside faces — i.e. the
      // room would look like an X-ray box from outside. Floor still
      // receives shadows so the sun beam still lands on it inside.
      for (const m of [wA, wC, ceil, wB, wD]) {
        m.castShadow = false;
        m.receiveShadow = false;
      }
    }
  });

  // ---------- OZU-TEST ROOM-2 SCENE ----------
  // 2.7 × 2.7 × 2.5 standalone sandbox (4.5 帖, NE 2F, 洋室3).
  // Structural template mirrors room-1: window opposite closet, ac opposite
  // entrance. Photo-driven differences vs room-1:
  //   - bed: white iron frame, ornate ball-cap finials, 5 tulip-shape bars
  //   - decorative pillow: dusty rose / blush velour (not grey)
  //   - closet: 4-panel white bi-fold, small chrome recessed pulls (no lever)
  //   - tall hutch at corner-ac-window: grey-blue, arch-top, open shelves +
  //     2-door cabinet base with black knobs (replaces room-1's freestanding
  //     4-tier black-metal shelf)
  //   - desk: simple white melamine top + 4 tapered light-maple legs
  //   - chair: tan leather office chair, 5-spoke rolling caster base
  //   - ceiling fixture: 4 dark-cone spotlights on wood crossbar with pull-chain
  //     (replaces room-1's 4-fabric-shade pendant cluster)
  // Build proceeds in phases — Phase 2 geometry shell, Phase 3 furniture, etc.
  registerScene('room-2', {
    orbitPos: new THREE.Vector3(6.5, 4.5, 6.5),
    orbitTarget: new THREE.Vector3(1.35, 1.0, 1.35),
    fpStart: new THREE.Vector3(0.5, 1.6, 0.5),
    fpYaw: -Math.PI / 4,
    bg: 0x1a1b1f,
    fov: 32,
    noFirstPerson: true,
    rooms: [],
    build: function(S) {
      const RW = 2.70, RD = 2.70, RH = 2.50;
      const WT_R = 0.02, FEAT = 0.04, BIAS = 0.003, FRAME_T = 0.07;
      // Wall mapping (mirrors room-1 convention so the user's mental model stays consistent):
      //   x=0   → closet-wall (4-panel bi-fold, chrome recessed pulls)
      //   x=RW  → window-wall (large 2-pane sliding window 引違, cream curtains)
      //   z=0   → entrance-wall (hinged inward door, coat rack, AC remote/switch panel)
      //   z=RD  → ac-wall      (Toshiba split AC + narrow vertical frosted privacy window)
      // Corners (alphabetical pairs per chip-naming rule):
      //   corner-ac-closet      = (x=0,  z=RD)
      //   corner-ac-window      = (x=RW, z=RD)
      //   corner-closet-entrance= (x=0,  z=0)
      //   corner-entrance-window= (x=RW, z=0)
      const COL = {
        floor: 0xd4b896, ceiling: 0xf5f0e8, wall: 0x9a938c,
        doorway: 0x2a2a2a, closet: 0xffffff, frame: 0xffffff,
        // Furniture colors added in Phase 3.
      };
      function box(w, h, d, cx, cy, cz, color, extra = {}) {
        const m = new THREE.Mesh(
          new THREE.BoxGeometry(w, h, d),
          new THREE.MeshStandardMaterial({
            color, roughness: extra.roughness ?? 0.9, metalness: extra.metalness ?? 0,
          })
        );
        m.position.set(cx, cy, cz);
        S.group.add(m);
        return m;
      }
      function feat(axis, innerCoord, inward, dims, mat) {
        const aLen = dims.a2 - dims.a1, bLen = dims.b2 - dims.b1;
        const aC = (dims.a1+dims.a2)/2, bC = (dims.b1+dims.b2)/2;
        const c = innerCoord + inward * (BIAS + FEAT / 2);
        const m = (mat instanceof THREE.Material)
          ? mat : new THREE.MeshStandardMaterial({ color: mat, roughness: 0.9 });
        let mesh;
        if (axis === 'x') {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(FEAT, bLen, aLen), m);
          mesh.position.set(c, bC, aC);
        } else {
          mesh = new THREE.Mesh(new THREE.BoxGeometry(aLen, bLen, FEAT), m);
          mesh.position.set(aC, bC, c);
        }
        S.group.add(mesh);
        return mesh;
      }
      function winFrame(axis, innerCoord, inward, a1, a2, b1, b2, mat) {
        const t = FRAME_T;
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a2+t, b1: b2,   b2: b2+t }, mat);
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a2+t, b1: b1-t, b2: b1   }, mat);
        feat(axis, innerCoord, inward, { a1: a1-t, a2: a1,   b1: b1,   b2: b2   }, mat);
        feat(axis, innerCoord, inward, { a1: a2,   a2: a2+t, b1: b1,   b2: b2   }, mat);
      }
      // PBR texture loader. Floor is shared with room-1 (same maple plank in
      // both rooms per photos); Phase 4 bake will populate room-2-textures/
      // wall_ao/ for the wall corner darkening pass.
      function pbrMatR2(slug, repU, repV, extras = {}) {
        const loader = new THREE.TextureLoader();
        const base = (slug === 'wood_floor')
          ? `ozu-test/room-1-textures/${slug}/${slug}`
          : `ozu-test/room-2-textures/${slug}/${slug}`;
        const map = loader.load(`${base}_diff.jpg`);
        map.colorSpace = THREE.SRGBColorSpace;
        const normalMap = loader.load(`${base}_nor_gl.jpg`);
        const roughnessMap = loader.load(`${base}_rough.jpg`);
        const aniso = renderer.capabilities.getMaxAnisotropy();
        for (const t of [map, normalMap, roughnessMap]) {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repU, repV);
          t.anisotropy = aniso;
        }
        return new THREE.MeshStandardMaterial({ map, normalMap, roughnessMap, ...extras });
      }
      // pbrFromBase — for Cycles-baked materials (4 PNGs per material:
      // albedo / normal / roughness / ao). Pass full base path including
      // file-prefix, e.g. 'ozu-test/room-1-textures/bed/white_iron/white_iron'.
      function pbrFromBase(base, repU, repV, extras = {}) {
        const loader = new THREE.TextureLoader();
        const map = loader.load(`${base}_albedo.png`);
        map.colorSpace = THREE.SRGBColorSpace;
        const normalMap = loader.load(`${base}_normal.png`);
        const roughnessMap = loader.load(`${base}_roughness.png`);
        const aoMap = loader.load(`${base}_ao.png`);
        const aniso = renderer.capabilities.getMaxAnisotropy();
        for (const t of [map, normalMap, roughnessMap, aoMap]) {
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(repU, repV);
          t.anisotropy = aniso;
        }
        return new THREE.MeshStandardMaterial({
          map, normalMap, roughnessMap, aoMap, aoMapIntensity: 1.0, ...extras,
        });
      }
      // Light-colored woodgrain laminate ceiling — per-room PBR bake (see
      // bake_room2_ceiling_woodgrain.py). Source: ceiling-woodgrain.jpg
      // (WD-061). 5 planks per 1 m tile; RW/1.0 × RD/1.0 = ~20 cm planks.
      const matFloorR2 = pbrMatR2('wood_floor', RW / 1.7, RD / 1.7, { roughness: 0.7 });
      const matCeilR2  = pbrFromBase(
        'ozu-test/room-2-textures/ceiling/woodgrain_laminate/woodgrain_laminate',
        RW / 1.0, RD / 1.0,
      );
      // Painted walls — literal taupe-grey paint, no light-direction tinting.
      // Corner darkening is added via per-wall AO maps once Phase 4 bake runs.
      const wallPaintArgs = { color: COL.wall, toneMapped: false, roughness: 0.82, metalness: 0.0 };
      const matWall_x0 = new THREE.MeshStandardMaterial(wallPaintArgs);
      const matWall_xW = new THREE.MeshStandardMaterial(wallPaintArgs);
      const matWall_z0 = new THREE.MeshStandardMaterial(wallPaintArgs);
      const matWall_zD = new THREE.MeshStandardMaterial(wallPaintArgs);
      // Room-2 walls are flat taupe paint only; no AO maps so the color stays
      // exactly #9A938C on all wall surfaces.
      const matGlassR2 = new THREE.MeshPhysicalMaterial({
        color: 0xeaf2f6, transparent: true, opacity: 1.0,
        transmission: 1.0, ior: 1.52, thickness: 0.02,
        roughness: 0.04, metalness: 0.0,
      });
      const matFrostedR2 = new THREE.MeshPhysicalMaterial({
        color: 0xf2efe8, transparent: true,
        transmission: 1.0, roughness: 0.65, thickness: 0.04,
        ior: 1.52, metalness: 0.0,
        attenuationColor: 0xffffff, attenuationDistance: 1.5,
      });
      const matFrameR2  = new THREE.MeshStandardMaterial({ color: COL.frame, roughness: 0.6 });
      const matClosetR2 = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7 });
      const matHandleR2 = new THREE.MeshStandardMaterial({ color: 0xcfcfcf, metalness: 0.95, roughness: 0.20 });
      const matSeamR2   = new THREE.MeshStandardMaterial({ color: 0xf2f2f0, roughness: 0.8 });

      // floor + ceiling
      const floor = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.02, RD), matFloorR2);
      floor.position.set(RW/2, -0.01, RD/2); S.group.add(floor);
      const ceil = new THREE.Mesh(new THREE.BoxGeometry(RW, 0.02, RD), matCeilR2);
      ceil.position.set(RW/2, RH + 0.01, RD/2); S.group.add(ceil);

      // ---- Walls ----
      // Window-wall (x=RW) and ac-wall (z=RD) both have window cutouts → ShapeGeometry.
      // Closet-wall (x=0) and entrance-wall (z=0) are full BoxGeometry walls.
      // UV remapping matches the planned room-2 AO bake (parametric world-aligned).
      function setUVsByLocal(geometry, uvFn, mainAxis) {
        const pos = geometry.attributes.position;
        const norm = geometry.attributes.normal;
        const uvs = new Float32Array(pos.count * 2);
        const axisIdx = { x: 0, y: 1, z: 2 }[mainAxis];
        for (let i = 0; i < pos.count; i++) {
          const onMain = (axisIdx === undefined || !norm) ||
            Math.abs([norm.getX(i), norm.getY(i), norm.getZ(i)][axisIdx]) > 0.5;
          if (onMain) {
            const out = uvFn(pos.getX(i), pos.getY(i), pos.getZ(i));
            uvs[i*2 + 0] = out[0];
            uvs[i*2 + 1] = out[1];
          } else {
            uvs[i*2 + 0] = 0.5;
            uvs[i*2 + 1] = 0.5;
          }
        }
        geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
      }
      function wallShapeWithHole(wallW, wallH, hx1, hy1, hx2, hy2) {
        const shape = new THREE.Shape();
        shape.moveTo(0, 0); shape.lineTo(wallW, 0); shape.lineTo(wallW, wallH);
        shape.lineTo(0, wallH); shape.lineTo(0, 0);
        const path = new THREE.Path();
        path.moveTo(hx1, hy1); path.lineTo(hx2, hy1); path.lineTo(hx2, hy2);
        path.lineTo(hx1, hy2); path.lineTo(hx1, hy1);
        shape.holes.push(path);
        return new THREE.ShapeGeometry(shape);
      }
      // closet-wall (x=0)
      const wA = new THREE.Mesh(new THREE.BoxGeometry(WT_R, RH, RD), matWall_x0);
      wA.position.set(-WT_R/2, RH/2, RD/2); S.group.add(wA);
      setUVsByLocal(wA.geometry, (lx, ly, lz) => [ 0.5 + ly / RH, 0.5 + lz / RD ], 'x');
      // entrance-wall (z=0)
      const wC = new THREE.Mesh(new THREE.BoxGeometry(RW, RH, WT_R), matWall_z0);
      wC.position.set(RW/2, RH/2, -WT_R/2); S.group.add(wC);
      setUVsByLocal(wC.geometry, (lx, ly, lz) => [ 0.5 + lx / RW, 0.5 + ly / RH ], 'z');
      // window-wall (x=RW) with sliding-window cutout
      matWall_xW.side = THREE.DoubleSide;
      const wB = new THREE.Mesh(wallShapeWithHole(RD, RH, 0.405, 0.85, 1.595, 1.75), matWall_xW);
      wB.rotation.y = -Math.PI/2;
      wB.position.set(RW, 0, 0);
      S.group.add(wB);
      setUVsByLocal(wB.geometry, (lx, ly, lz) => [lx / RD, ly / RH]);
      // ac-wall (z=RD) with frosted-window cutout (narrow vertical privacy window)
      matWall_zD.side = THREE.DoubleSide;
      const wD = new THREE.Mesh(wallShapeWithHole(RW, RH, 0.30, 0.95, 0.56, 1.80), matWall_zD);
      wD.position.set(0, 0, RD);
      S.group.add(wD);
      setUVsByLocal(wD.geometry, (lx, ly, lz) => [ ly / RH, lx / RW ]);

      // ---- Trim: baseboards + crown molding ----
      const ZF = 0.001;
      const bbH = 0.05, bbD = 0.01, bbColor = 0xf2f0eb, bbX = { roughness: 0.7 };
      box(bbD, bbH, RD, bbD/2 + ZF,        bbH/2, RD/2, bbColor, bbX);
      box(bbD, bbH, RD, RW - bbD/2 - ZF,   bbH/2, RD/2, bbColor, bbX);
      box(RW,  bbH, bbD, RW/2, bbH/2, bbD/2 + ZF,      bbColor, bbX);
      box(RW,  bbH, bbD, RW/2, bbH/2, RD - bbD/2 - ZF, bbColor, bbX);
      const cmH = 0.06, cmD = 0.02, cmColor = 0xffffff, cmY = RH - cmH/2;
      box(cmD, cmH, RD, cmD/2 + ZF,        cmY, RD/2, cmColor, bbX);
      box(cmD, cmH, RD, RW - cmD/2 - ZF,   cmY, RD/2, cmColor, bbX);
      box(RW,  cmH, cmD, RW/2, cmY, cmD/2 + ZF,      cmColor, bbX);
      box(RW,  cmH, cmD, RW/2, cmY, RD - cmD/2 - ZF, cmColor, bbX);

      // ---- Sliding window (window-wall, x=RW) ----
      // 引違 11909 — 2-pane horizontal slider, 1.19 m wide × 0.90 m tall, sill at y=0.85.
      feat('x', RW, -1, { a1: 0.405, a2: 1.595, b1: 0.85, b2: 1.75 }, matGlassR2);
      winFrame('x', RW, -1, 0.405, 1.595, 0.85, 1.75, matFrameR2);
      // Central vertical mullion — meeting rail between the two sliding panes.
      feat('x', RW, -1, { a1: 0.98, a2: 1.02, b1: 0.85, b2: 1.75 }, matFrameR2);
      // Chrome lever handle on the mullion's room-facing face.
      {
        const lever = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.018, 0.070), matHandleR2);
        lever.position.set(RW - BIAS - FEAT - 0.006, 1.20, 0.98 - 0.04);
        S.group.add(lever);
        const stem = new THREE.Mesh(new THREE.BoxGeometry(0.012, 0.010, 0.012), matHandleR2);
        stem.position.set(RW - BIAS - FEAT - 0.006, 1.20, 0.98);

      }

      // ---- Frosted privacy window (ac-wall, z=RD) ----
      // Narrow vertical 縦すべり 02609 — 0.26 m wide × 0.85 m tall, sill at y=0.95.
      feat('z', RD, -1, { a1: 0.30, a2: 0.56, b1: 0.95, b2: 1.80 }, matFrostedR2);
      winFrame('z', RD, -1, 0.30, 0.56, 0.95, 1.80, matFrameR2);

      // ---- Entrance door (entrance-wall, z=0) ----

      feat('z', 0, +1, { a1: 0.005, a2: 0.795, b1: 0.005, b2: 1.995 }, COL.doorway);
      // Flush trim — 20 mm wide × 5 mm proud (matches room-1's residential JP style).

      box(cW2, 2.0 + cW2, cD2, -cW2/2,        (2.0 + cW2)/2, cZ2, 0xfafafa, { roughness: 0.55 });
      box(cW2, 2.0 + cW2, cD2, 0.8 + cW2/2,   (2.0 + cW2)/2, cZ2, 0xfafafa, { roughness: 0.55 });
      // Door panel — flat white slab.
      box(0.8, 2.0, 0.04, 0.4, 1.0, 0.025, 0xffffff, { roughness: 0.55 });
      // 3 chrome hinges on the door's -x edge.
      {
        const matHinge = new THREE.MeshStandardMaterial({ color: 0xa8a8a8, metalness: 1.0, roughness: 0.30 });

      // Chrome lever handle on door's +x edge (latch side), at y=1.02.

        // Cylindrical stem perpendicular to door.

      // ---- Closet bi-fold (the cabinet) at closet-wall × ac-wall corner ----
      // 4-panel bi-fold doors, full-height under the crown molding.
      // Doors occupy z=[0.00, 1.40] (1.40 m total → 4 panels × 0.35 m each),
      // flush against the ac-wall (z=RD=2.70). High-z edge sits in the
      // corner of closet-wall × ac-wall.
      // Center seam at z=2.00, 2 internal fold lines at z=1.65 and z=2.35.
      // Two small chrome recessed pulls at the center-seam-side edges, mid-height.
      {
        const cZ1 = 0.00, cZ2_ = 1.40, cY1 = 0.05, cY2 = 2.30;
        // Full bi-fold panel surface, flush against closet-wall.
        feat('x', 0, +1, { a1: cZ1, a2: cZ2_, b1: cY1, b2: cY2 }, matClosetR2);
        // Three vertical seams (thin dark slabs) — center seam slightly more
        // prominent (the meeting edge of the two bi-fold pairs).
        const seamW = 0.005;
        const seamCenter = 2.00;
        const seamFoldA  = 1.65;
        const seamFoldB  = 2.35;
        feat('x', 0, +1, { a1: seamCenter - seamW, a2: seamCenter + seamW, b1: cY1, b2: cY2 }, matSeamR2);
        feat('x', 0, +1, { a1: seamFoldA  - seamW/2, a2: seamFoldA  + seamW/2, b1: cY1, b2: cY2 }, matSeamR2);
        feat('x', 0, +1, { a1: seamFoldB  - seamW/2, a2: seamFoldB  + seamW/2, b1: cY1, b2: cY2 }, matSeamR2);
        // Chrome recessed pulls — small concave shapes on the center-seam-side
        // edges of panels 2 and 3. Modelled as flat oval pulls (BoxGeometry +
        // slight inward bias) at y=1.15.
        const pullY = 1.15, pullW = 0.05, pullH = 0.012, pullD = 0.008;
        const pullX = BIAS + FEAT - 0.001;       // sit just proud of the door face
        // Panel 2 pull — 6 cm before the center seam.
        {
          const p = new THREE.Mesh(new THREE.BoxGeometry(pullD, pullH, pullW), matHandleR2);
          p.position.set(pullX, pullY, seamCenter - 0.06);
          S.group.add(p);
        }
        // Panel 3 pull — 6 cm after the center seam.
        {
          const p = new THREE.Mesh(new THREE.BoxGeometry(pullD, pullH, pullW), matHandleR2);
          p.position.set(pullX, pullY, seamCenter + 0.06);
          S.group.add(p);
