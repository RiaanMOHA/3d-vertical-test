        );
        stem.rotation.x = Math.PI / 2;
        stem.position.set(escX, escY, doorFaceZ + 0.020);
        S.group.add(stem);
        const lever = new THREE.Mesh(new THREE.BoxGeometry(0.100, 0.013, 0.013), matHandleR4);
        lever.position.set(escX - 0.050 + 0.011, escY, doorFaceZ + 0.040);
        S.group.add(lever);
      }

      // ---- Coat rack on entrance-wall, right of door (toward closet-wall corner) ----
      {
        const crX0 = 1.95, crX1 = 2.35, crY = 1.55;
        const matWood = new THREE.MeshStandardMaterial({ color: 0xd9c79f, roughness: 0.7 });
        const matHook = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.3 });
        feat('z', 0, +1, { a1: crX0, a2: crX1, b1: crY - 0.06, b2: crY + 0.06 }, matWood);
        for (let i = 0; i < 3; i++) {

          stem.position.set(hx, crY, FEAT + BIAS + 0.030);

          cap.position.set(hx, crY, FEAT + BIAS + 0.060);

      // AC remote + light switch on entrance-wall (right side, near closet-wall corner)
      {

        feat('z', 0, +1, { a1: 2.30, a2: 2.38, b1: 1.10, b2: 1.30 }, matPanel);
        feat('z', 0, +1, { a1: 2.45, a2: 2.51, b1: 1.15, b2: 1.22 }, matPanel);

      // ---- AC unit on window-wall (z=RD), near corner-frosted-window (x=small) ----
      {

        // AC body: Cycles-baked abs_plastic PBR (smooth white ABS with subtle

        const matAC = pbrFromBase('ozu-test/room-1-textures/ac/abs/abs', 1, 1);
        const matACDark = new THREE.MeshStandardMaterial({ color: 0x9a9a92, roughness: 0.7 });
        feat('z', RD, -1, { a1: acX0, a2: acX1, b1: acY0, b2: acY1 }, matAC);
        feat('z', RD, -1, { a1: acX0 + 0.04, a2: acX1 - 0.04, b1: acY0 - 0.012, b2: acY0 + 0.005 }, matACDark);
        const slit = new THREE.Mesh(new THREE.BoxGeometry(acX1 - acX0 - 0.10, 0.006, 0.004), matACDark);
        slit.position.set((acX0 + acX1)/2, acY0 + 0.025, RD - BIAS - FEAT - 0.022);

      // ============================================================
      // Closet-wall (x=RW) — TWO items: bi-fold doors + drawer cabinet
      // ============================================================
      // N portion (z=[0.10, 1.20]): 4-panel white bi-fold doors, full-height.
      {
        const cZ1 = 0.10, cZ2 = 1.20, cY1 = 0.05, cY2 = 2.30;
        feat('x', RW, -1, { a1: cZ1, a2: cZ2, b1: cY1, b2: cY2 }, matClosetR4);
        const seamW = 0.005;
        const seamCenter = (cZ1 + cZ2) / 2;

        feat('x', RW, -1, { a1: seamFoldB  - seamW/2, a2: seamFoldB  + seamW/2, b1: cY1, b2: cY2 }, matSeamR4);
        // Small chrome recessed pulls.
        const pullY = 1.15, pullW = 0.05, pullH = 0.012, pullD = 0.008;
        const pullX = RW - BIAS - FEAT + 0.001;
        for (const dz of [-0.06, +0.06]) {

          p.position.set(pullX, pullY, seamCenter + dz);
          S.group.add(p);

      // S portion (z=[1.40, 2.50]): dark-wood + black-metal cabinet
      //   - bottom half: 3×3 = 9 drawers grid (dark wood drawer fronts + black metal frame)
      //   - top half: 3 open shelves
      //   - back panel against closet-wall, front face projects 0.40 m into room
      {
        const cX0 = RW - 0.40, cX1 = RW;
        const cZ0_ = 1.40, cZ1_ = 2.50;
        const cBaseY = 0.95;          // top of drawer section
        const cTopY  = 1.75;          // top of cabinet
        // PBR maps shared with room-3 shelf (same dark-wood + black-iron
        // industrial style). Baked via ozu-test/bake/bake_room3_shelf.py.
        const pbrFromBase = (base, repU, repV, extras = {}) => {
          const loader = new THREE.TextureLoader();
          const map = loader.load(`${base}_albedo.png`);
          map.colorSpace = THREE.SRGBColorSpace;
          const normalMap = loader.load(`${base}_normal.png`);
          const roughnessMap = loader.load(`${base}_roughness.png`);
          const aoMap = loader.load(`${base}_ao.png`);
          const aniso = renderer.capabilities.getMaxAnisotropy();
          for (const t of [map, normalMap, roughnessMap, aoMap]) {
            t.wrapS = THREE.RepeatWrapping;
            t.wrapT = THREE.RepeatWrapping;
            t.repeat.set(repU, repV);
            t.anisotropy = aniso;
          }
          return new THREE.MeshStandardMaterial({
            map, normalMap, roughnessMap, aoMap, aoMapIntensity: 1.0, ...extras,
          });
        };
        const matCabFrame = pbrFromBase('ozu-test/room-3-textures/shelf/black_iron/black_iron', 1, 1, { metalness: 0.6 });
        const matCabWood  = pbrFromBase('ozu-test/room-3-textures/shelf/dark_wood/dark_wood', 1, 1);
        const matKnob     = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.4, metalness: 0.3 });
        const cW = cX1 - cX0, cD = cZ1_ - cZ0_;
        const t = 0.018;
        // Helper: box that uses the shared matCabWood PBR material.
        const woodBox = (w, h, d, cx, cy, cz) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), matCabWood);
          m.position.set(cx, cy, cz);
          S.group.add(m);
          return m;

        // Frame: 4 corner posts.
        for (const [px, pz] of [[cX0, cZ0_], [cX1 - t, cZ0_], [cX0, cZ1_ - t], [cX1 - t, cZ1_ - t]]) {
          const post = new THREE.Mesh(new THREE.BoxGeometry(t, cTopY, t), matCabFrame);
          post.position.set(px + t/2, cTopY/2, pz + t/2);
          S.group.add(post);
        }
        // Bottom shelf (under drawer grid).
        woodBox(cW, t, cD, (cX0 + cX1)/2, t/2 + 0.01, (cZ0_ + cZ1_)/2);
        // Drawer fronts: 3×3 grid in the bottom half.
        const drwYs = [0.20, 0.50, 0.80];
        const drwZs = [cZ0_ + cD * 1/6, cZ0_ + cD * 3/6, cZ0_ + cD * 5/6];
        for (const dy of drwYs) {
          for (const dz of drwZs) {
            woodBox(0.020, 0.24, cD / 3 * 0.88, cX0 - 0.010 + 0.005, dy, dz);
            const knob = new THREE.Mesh(new THREE.SphereGeometry(0.010, 10, 8), matKnob);
            knob.position.set(cX0 - 0.015, dy, dz);
            S.group.add(knob);
          }
        }
        // 3 open shelves on top half.
        const shelfYs = [
          cBaseY + (cTopY - cBaseY) * 1/3,
          cBaseY + (cTopY - cBaseY) * 2/3,
          cBaseY + (cTopY - cBaseY) * 0.99,

        for (const sy of shelfYs) {
          woodBox(cW - 2 * t, t, cD - 2 * t, (cX0 + cX1)/2, sy, (cZ0_ + cZ1_)/2);
        }
        // Counter shelf between drawer grid and open shelves.
        woodBox(cW - t, t, cD - t, (cX0 + cX1)/2 - t/4, cBaseY + t/2, (cZ0_ + cZ1_)/2);
      }

      // ============================================================
      // Bed (DARK iron frame, head at N entrance-wall side, foot at S window-wall side)
      // ============================================================
      // Long axis along z. Head at z=0.30 (close to entrance-wall but not touching door).
      // Foot at z=2.30 (away from window-wall by ~1.30 m). Centered in x.
      const bX0 = 0.85, bX1 = 1.85, bZ0 = 0.30, bZ1 = 2.30;
      const FRAME_Y_BOT = 0.30, MAT_TOP = 0.50;
      {
        // Bed iron: Cycles-baked black_iron PBR (originally for room-3 shelf).

        const matIron = pbrFromBase('ozu-test/room-3-textures/shelf/black_iron/black_iron', 1, 1, { metalness: 0.4 });
        // Mattress: Cycles-baked cream_cotton PBR (shared across 4 rooms).
        const matMattress = pbrFromBase('ozu-test/room-1-textures/mattress/cream_cotton/cream_cotton', 2, 2);
        const mattress = new THREE.Mesh(
          new RoundedBoxGeometry(bX1 - bX0, MAT_TOP - FRAME_Y_BOT, bZ1 - bZ0, 2, 0.015),

        );
        mattress.position.set((bX0 + bX1)/2, (FRAME_Y_BOT + MAT_TOP)/2, (bZ0 + bZ1)/2);
        S.group.add(mattress);
        // Corner posts.
        const postR = 0.020;
        function cornerPost(cx, cz, topY) {
          const p = new THREE.Mesh(
            new THREE.CylinderGeometry(postR, postR, topY, 14),

          );
          p.position.set(cx, topY/2, cz);

        // Head end posts (taller) at z=bZ0 (N side).
        cornerPost(bX0, bZ0, 1.00);

        // Foot end posts (shorter) at z=bZ1 (S side).
        cornerPost(bX0, bZ1, 0.60);

        // Headboard rails (head at z=bZ0).
        const railR = 0.010;
        function railX(yPos, z) {
          const r = new THREE.Mesh(
            new THREE.CylinderGeometry(railR, railR, bX1 - bX0, 12),
            matIron

          r.rotation.z = Math.PI/2;

          S.group.add(r);

        railX(0.32, bZ0);
        railX(0.62, bZ0);
        railX(0.95, bZ0);
        // 5 vertical bars between mid + top headboard rails.
        for (let i = 0; i < 5; i++) {
          const fx = bX0 + (bX1 - bX0) * (0.16 + 0.17 * i);
          const b = new THREE.Mesh(
            new THREE.CylinderGeometry(0.006, 0.006, 0.33, 10),
            matIron
          );
          b.position.set(fx, 0.78, bZ0);
          S.group.add(b);

        // Footboard rails (z=bZ1).
        railX(0.32, bZ1);
        railX(0.55, bZ1);
        for (let i = 0; i < 5; i++) {
          const fx = bX0 + (bX1 - bX0) * (0.16 + 0.17 * i);
          const b = new THREE.Mesh(
            new THREE.CylinderGeometry(0.006, 0.006, 0.22, 10),
            matIron
          );
          b.position.set(fx, 0.44, bZ1);
          S.group.add(b);

        // Side rails.
        for (const xPos of [bX0, bX1]) {
          const sr = new THREE.Mesh(
            new THREE.CylinderGeometry(0.012, 0.012, bZ1 - bZ0, 12),
            matIron
          );
          sr.rotation.x = Math.PI/2;
          sr.position.set(xPos, 0.32, (bZ0 + bZ1)/2);
          S.group.add(sr);
        }
        // Sheet — exact mattress footprint with wrinkles.
        {
          function noise2(x, z) {
            let v = 0, amp = 1, total = 0;
            for (let o = 0; o < 4; o++) {
              const fx = x * (2 ** o) * 3.7, fz = z * (2 ** o) * 3.1;
              v += amp * Math.sin(fx + 1.3) * Math.cos(fz + 2.1);
              total += amp; amp *= 0.5;
            }
            return v / total;
          }
          const sheetMat = new THREE.MeshPhysicalMaterial({
            color: 0xf3eedf, roughness: 0.95,
            sheen: 1.0, sheenColor: new THREE.Color(0xfff4dc), sheenRoughness: 0.55,

          for (let i = 0; i < pos.count; i++) {

          pos.needsUpdate = true;
          sheetGeom.computeVertexNormals();
          sheetGeom.setAttribute('uv2', new THREE.BufferAttribute(
            new Float32Array(sheetGeom.attributes.uv.array), 2

            color: 0x5e6770, roughness: 0.92,
            sheen: 1.0, sheenColor: new THREE.Color(0x8a98a4), sheenRoughness: 0.45,
          });
          const pillow = new THREE.Mesh(
            new RoundedBoxGeometry(0.55, 0.10, 0.32, 6, 0.030),
            matGrey
          );
          pillow.position.set((bX0 + bX1)/2, MAT_TOP + 0.055, bZ0 + 0.30);
          S.group.add(pillow);
        }
      }

      // ============================================================
      // Ceiling fixture — 4-cone spotlight cluster on wood + crossbar
      // ============================================================
      // Photo-confirmed from corner-closet-window/05 (mid-sweep frame):
      // identical fixture to room-2's. Wood + crossbar (+ shape), central
      // black hub, 4 dark cone shades pointing down/outward, pull-chain.
      // PBR maps baked by bake_room4_spotlight_wood.py (A6000 Cycles).
      {
        const cX = RW / 2, cZ = RD / 2, ceilY = RH - 0.015;
        const matWood = pbrFromBase(
          'ozu-test/room-4-textures/spotlight/wood/wood', 1, 1,
        );
        const matBlack = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5 });
        const matBulb = new THREE.MeshStandardMaterial({
          color: 0xfff4e0, emissive: 0xfff4e0, emissiveIntensity: 1.2,
        });
        const matChain = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.7, roughness: 0.4 });
        const armLen = 0.50;
        // Crossbar — 2 perpendicular boxes (+ shape), wood color.
        const arm1 = new THREE.Mesh(new THREE.BoxGeometry(armLen, 0.04, 0.06), matWood);
        arm1.position.set(cX, ceilY - 0.05, cZ);
        S.group.add(arm1);
        const arm2 = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.04, armLen), matWood);
        arm2.position.set(cX, ceilY - 0.05, cZ);
        S.group.add(arm2);
        // Central hub.
        const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.08, 16), matBlack);
        hub.position.set(cX, ceilY - 0.10, cZ);
        S.group.add(hub);
        // 4 dark cone shades at the ends of the 4 arms.
        const lampMaterial = pbrFromBase(
          'ozu-test/room-4-textures/spotlight/shade/shade', 1, 1,
          { metalness: 0.10, emissive: 0x1a1410, emissiveIntensity: 0.0 },
        );
        const bulbMaterial = matBulb;
        const lampPointLights = [];
        const shadeOffsets = [
          [ armLen/2 - 0.05, 0],
          [-armLen/2 + 0.05, 0],
          [0,  armLen/2 - 0.05],
          [0, -armLen/2 + 0.05],
        ];
        for (const [ox, oz] of shadeOffsets) {
          const sx = cX + ox, sz = cZ + oz;
          const shadeY = ceilY - 0.18;
          const shade = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.080, 0.12, 18, 1, true),
            lampMaterial
          );
          shade.position.set(sx, shadeY, sz);
          S.group.add(shade);
          const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.035, 14, 10), bulbMaterial);
          bulb.position.set(sx, shadeY - 0.04, sz);
          S.group.add(bulb);
          const pl = new THREE.PointLight(0xffb16e, 0, 0, 2);
          pl.position.set(sx, shadeY - 0.05, sz);
          S.group.add(pl);
          lampPointLights.push(pl);
        }
        // Pull-chain hanging from hub.
        const chain = new THREE.Mesh(
          new THREE.CylinderGeometry(0.002, 0.002, 0.40, 6),
          matChain
        );
        chain.position.set(cX + 0.04, ceilY - 0.30, cZ);
        S.group.add(chain);
        S.lampMaterial = lampMaterial;
        S.bulbMaterial = bulbMaterial;
        S.lampOnIntensity = 1.0;
        S.bulbOnIntensity = 1.5;
        S.lampPointOnIntensity = 1.2;
        S.lampPointLights = lampPointLights;
        S.lampsOn = true;
      }

      // ============================================================
      // Phase 5 — Lighting rig (window-wall is S → direct warm sun)
      // ============================================================
      {
        S.group.add(new THREE.AmbientLight(0xffffff, 0.20));
        const hemi = new THREE.HemisphereLight(0xcfe0f0, 0xa89878, 0.30);
        hemi.position.set(RW/2, RH + 2, RD/2);
        S.group.add(hemi);
        const dirSun = new THREE.DirectionalLight(0xf6f5ec, 3.0);
        // Sun is SSE at azimuth 160° / elevation 60°. Room-4 is SW corner,
        // so sun comes from the +x +z direction (E-S of the building).
        dirSun.position.set(RW + 1.0, 3.0, RD + 2.5);
        dirSun.target.position.set(RW/2, 0.4, RD/2);
        S.group.add(dirSun.target);
        dirSun.castShadow = true;
        dirSun.shadow.mapSize.set(4096, 4096);
        dirSun.shadow.camera.left   = -3;
        dirSun.shadow.camera.right  =  3;
        dirSun.shadow.camera.top    =  3;
        dirSun.shadow.camera.bottom = -3;
        dirSun.shadow.camera.near   = 0.1;
        dirSun.shadow.camera.far    = 14;
        dirSun.shadow.bias          = -0.0005;
        dirSun.shadow.normalBias    = 0.02;
        dirSun.shadow.radius        = 4;
        S.group.add(dirSun);
        const rectW = 2.10 - 0.60, rectH = 1.75 - 0.85;
        const rectL = new THREE.RectAreaLight(0xfff4e0, 6.0, rectW, rectH);
        rectL.position.set((0.60 + 2.10)/2, (0.85 + 1.75)/2, RD + 0.05);
        rectL.lookAt(RW/2, (0.85 + 1.75)/2, RD/2);
        S.group.add(rectL);
        const dirFill = new THREE.DirectionalLight(0xede8df, 0.25);
        dirFill.position.set(RW/2, 1.6, -1.5);
        dirFill.target.position.set(RW/2, 1.0, RD/2);
        S.group.add(dirFill.target);
        S.group.add(dirFill);
        // Frosted-wall (W in compass) — sun is past west zenith at 11 AM JST,
        // so frosted-wall gets only ambient + diffuse sky. Cool tint.
        const dirFrost = new THREE.DirectionalLight(0xdde6f0, 0.4);
        dirFrost.position.set(-1.5, 1.4, RD - 0.5);
        dirFrost.target.position.set(0.5, 1.0, RD - 0.5);
        S.group.add(dirFrost.target);
        S.group.add(dirFrost);

        // Visible god-ray cone — south-facing window with direct sun.
        {
          const BEAM_LEN = 3.5;
          const beamGeom = new THREE.ConeGeometry(0.90, BEAM_LEN, 4, 1, true);
          const pos = beamGeom.attributes.position;
          const colors = new Float32Array(pos.count * 3);
          for (let i = 0; i < pos.count; i++) {
            const y = pos.getY(i);
            const t = (y + BEAM_LEN/2) / BEAM_LEN;
            const a = (Math.sin(t * Math.PI)) * 0.35;
            colors[i*3 + 0] = a; colors[i*3 + 1] = a; colors[i*3 + 2] = a;
          }
          beamGeom.setAttribute('color', new THREE.BufferAttribute(colors, 3));
          const beamMat = new THREE.MeshBasicMaterial({
            color: 0xfff4d6, vertexColors: true, transparent: true,
            opacity: 0.20, blending: THREE.AdditiveBlending,
            depthWrite: false, side: THREE.DoubleSide,
          });
          const beam = new THREE.Mesh(beamGeom, beamMat);
          const sunDir = new THREE.Vector3().subVectors(dirSun.target.position, dirSun.position).normalize();
          beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), sunDir);
          beam.position.copy(dirSun.position).addScaledVector(sunDir, BEAM_LEN/2);
          S.group.add(beam);
        }

        S.group.traverse((obj) => {
          if (!obj.isMesh) return;
          const m = obj.material;
          if (m && (m.isMeshPhysicalMaterial && m.transmission > 0)) {
            obj.castShadow = false;
            obj.receiveShadow = false;
            return;
          }
          if (m && m.isMeshBasicMaterial) {
            obj.castShadow = false;
            obj.receiveShadow = false;
            return;
          }
          obj.castShadow = true;
          obj.receiveShadow = true;
        });
        ceil.castShadow = false;
        ceil.receiveShadow = false;
      }
    },
  });

  // ---------- OrbitControls (minimal inline) ----------
  // Two-input orbit controls — drag/one-finger to look around, pinch/wheel to
  // zoom. No pan, no keyboard. Designed to work the same on Mac trackpads,
  // mice, iPhone (375 px) up through iPad Pro. Damped catch-up for a smooth
  // feel without making input feel laggy.
  class OrbitControls {
    constructor(cam, dom) {
      this.cam = cam;
      this.dom = dom;
      this.target      = new THREE.Vector3(1.8, 1.2, 2.7);
      this._targetGoal = new THREE.Vector3();
      this.sph         = new THREE.Spherical();
      this._sphGoal    = new THREE.Spherical();
      this._updateSph();
      this._sphGoal.copy(this.sph);
      this._targetGoal.copy(this.target);
      this.minRadius = 0.5;
      this.maxRadius = 40;
      this.damping   = 0.22;
      this.enabled   = true;

      this._down = false;
      this._last = { x: 0, y: 0 };
      this._dragMoved = false;
      this._lastUp = 0;

      this._touchTracking = new Map();
      this._lastPinchDist = 0;

      dom.addEventListener('mousedown',  e => this._onDown(e));
      window.addEventListener('mousemove', e => this._onMove(e));
      window.addEventListener('mouseup',   e => this._onUp(e));
      dom.addEventListener('wheel',       e => this._onWheel(e), { passive: false });
      dom.addEventListener('contextmenu', e => e.preventDefault());
      dom.addEventListener('touchstart',  e => this._onTouchStart(e), { passive: false });
      dom.addEventListener('touchmove',   e => this._onTouchMove(e),  { passive: false });
      dom.addEventListener('touchend',    e => this._onTouchEnd(e));
      dom.addEventListener('touchcancel', e => this._onTouchEnd(e));
    }

    _updateSph() {
      const off = new THREE.Vector3().copy(this.cam.position).sub(this.target);
      this.sph.setFromVector3(off);
    }

    setFrom(pos, target) {
      this.target.copy(target);
      this._targetGoal.copy(target);
      this.cam.position.copy(pos);
      this._updateSph();
      this._sphGoal.copy(this.sph);
      this.update();
    }

    // Like setFrom, but only mutates the GOAL — leaves the current state
    // alone so the per-frame damping smoothly lerps the camera toward the
    // new pose over ~half a second. Used by corner-hotspot clicks.
    flyTo(pos, target) {
      this._targetGoal.copy(target);
      const off = new THREE.Vector3().copy(pos).sub(target);
      this._sphGoal.setFromVector3(off);
    }

    _orbit(dx, dy) {
      this._sphGoal.theta -= dx * 0.005;
      this._sphGoal.phi   -= dy * 0.005;
      this._sphGoal.phi = Math.max(0.05, Math.min(Math.PI - 0.05, this._sphGoal.phi));
    }
    _zoom(factor) {
      this._sphGoal.radius = Math.max(this.minRadius, Math.min(this.maxRadius, this._sphGoal.radius * factor));
    }

    _onDown(e) {
      if (!this.enabled) return;
      this._down = true;
      this._dragMoved = false;
      this._last.x = e.clientX; this._last.y = e.clientY;
    }
    _onMove(e) {
      if (!this._down) return;
      const dx = e.clientX - this._last.x;
      const dy = e.clientY - this._last.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) this._dragMoved = true;
      this._last.x = e.clientX; this._last.y = e.clientY;
      this._orbit(dx, dy);
    }
    _onUp() {
      this._down = false;
      if (this._dragMoved) this._lastUp = performance.now();
    }

    _onWheel(e) {
      if (!this.enabled) return;
      e.preventDefault();
      // Mac/Windows trackpad pinch arrives as wheel with ctrlKey=true. Always
      // honour it — even right after a drag — so pinch-zoom feels live.
      const isPinch = e.ctrlKey;
      if (!isPinch) {
        if (this._down) return;
        if (this._lastUp && (performance.now() - this._lastUp) < 150) return;
      }
      const sens = isPinch ? 0.02 : 0.01;
      this._zoom(Math.pow(0.95, -e.deltaY * sens));
    }

    _onTouchStart(e) {
      if (!this.enabled) return;
      e.preventDefault();
      for (const t of e.changedTouches) this._touchTracking.set(t.identifier, { x: t.clientX, y: t.clientY });
      if (e.touches.length === 2) {
        const a = e.touches[0], b = e.touches[1];
        this._lastPinchDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      }
    }
    _onTouchMove(e) {
      if (!this.enabled) return;
      e.preventDefault();
      if (e.touches.length === 1) {
        const t = e.touches[0];
        const last = this._touchTracking.get(t.identifier);
        if (!last) return;
        this._orbit(t.clientX - last.x, t.clientY - last.y);
        last.x = t.clientX; last.y = t.clientY;
      } else if (e.touches.length === 2) {
        const a = e.touches[0], b = e.touches[1];
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (this._lastPinchDist > 0) this._zoom(this._lastPinchDist / dist);
        this._lastPinchDist = dist;
      }
    }
    _onTouchEnd(e) {
      for (const t of e.changedTouches) this._touchTracking.delete(t.identifier);
      if (e.touches.length < 2) this._lastPinchDist = 0;
    }

    update() {
      const k = this.damping;
      let dT = this._sphGoal.theta - this.sph.theta;
      while (dT >  Math.PI) dT -= 2 * Math.PI;
      while (dT < -Math.PI) dT += 2 * Math.PI;
      this.sph.theta  += dT * k;
      this.sph.phi    += (this._sphGoal.phi    - this.sph.phi)    * k;
      this.sph.radius += (this._sphGoal.radius - this.sph.radius) * k;
      this.target.lerp(this._targetGoal, k);
      const off = new THREE.Vector3().setFromSpherical(this.sph);
      this.cam.position.copy(this.target).add(off);
      this.cam.lookAt(this.target);
    }
  }
  const orbit = new OrbitControls(camera, renderer.domElement);

  // ---------- Corner-jump hotspots (room-1 / room-2 / room-3 / room-4) ----------

  let cornerHotspots = [];
  function rebuildCornerHotspots(sceneId) {
    cornerHotspotsLayer.innerHTML = '';
    cornerHotspots = [];
    const cfg = ROOM_CORNERS_BY_SCENE[sceneId];
    if (!cfg) return;
    for (const c of cfg.corners) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'corner-hotspot';
      btn.dataset.id = c.id;
      btn.setAttribute('aria-label', `Move camera to ${c.id}`);
      btn.innerHTML = '<span class="corner-hotspot__dot" aria-hidden="true"></span>';
      btn.addEventListener('click', () => orbit.flyTo(c.camPos, cfg.target));
      cornerHotspotsLayer.appendChild(btn);
      cornerHotspots.push({ btn, world: c.dotWorld, camPos: c.camPos });
    }
  }
  // Initial build for room-1 (default scene at load).
  rebuildCornerHotspots('room-1');
  const _cornerProjV = new THREE.Vector3();
  function updateCornerHotspots() {
    if (cornerHotspotsLayer.hidden) return;
    for (const h of cornerHotspots) {
      // Hide a dot if you're already at (or very close to) its corner.
      if (camera.position.distanceTo(h.camPos) < 0.7) {
        h.btn.style.visibility = 'hidden';
        continue;
      }
      _cornerProjV.copy(h.world).project(camera);
      const visible = _cornerProjV.z < 1;
      if (!visible) {
        h.btn.style.visibility = 'hidden';
        continue;
      }
      const x = (_cornerProjV.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-_cornerProjV.y * 0.5 + 0.5) * window.innerHeight;
      h.btn.style.transform = `translate(${x - 22}px, ${y - 22}px)`;
      h.btn.style.visibility = '';
    }
  }

  // ---------- Room label detection ----------
  function updateRoomLabel() {
    const S = scenes[activeScene];
    if (!S) { roomLabel.textContent = '—'; return; }
    const p = orbit.target;
    // Sort smallest AABB first
    const sorted = S.rooms.slice().sort((a, b) =>
      ((a.x2 - a.x1) * (a.z2 - a.z1)) - ((b.x2 - b.x1) * (b.z2 - b.z1))
    );
    for (const r of sorted) {
      const inXZ = p.x >= r.x1 && p.x <= r.x2 && p.z >= r.z1 && p.z <= r.z2;
      const inY  = (r.y1 == null) || (p.y >= r.y1 && p.y <= r.y2);
      if (inXZ && inY) {
        roomLabel.textContent = r.name;
        return;
      }
    }
    roomLabel.textContent = '—';
  }

  // ---------- QA view helpers ----------
  // Per-room inspection: top, side faces, isometric, free orbit. Hides geometry
  // above the room's ceiling for top/iso so the floor above doesn't block view.
  function getRoomBbox(S, name) {
    if (!S || !S.rooms) return null;
    const matches = S.rooms.filter(r => r.name === name);
    if (matches.length === 0) return null;
    let x1 = Infinity, x2 = -Infinity, z1 = Infinity, z2 = -Infinity;
    let y1 = Infinity, y2 = -Infinity;
    for (const r of matches) {
      x1 = Math.min(x1, r.x1); x2 = Math.max(x2, r.x2);
      z1 = Math.min(z1, r.z1); z2 = Math.max(z2, r.z2);
      if (r.y1 != null) { y1 = Math.min(y1, r.y1); y2 = Math.max(y2, r.y2); }
    }
    if (y1 === Infinity) { y1 = 0; y2 = 2.5; }
    return { name, x1, x2, z1, z2, y1, y2 };
  }
  // Returns a bbox spanning a whole floor ('1f' / '2f') or a single room.
  // Floor bboxes aggregate every room whose y1 is in the floor's range.
  function getZoneBbox(S, id) {
    if (id === '1f' || id === '2f') {
      const yLo = (id === '1f') ? 0 : 2.5;
      const yHi = (id === '1f') ? 2.5 : 5.0;
      let x1 = Infinity, x2 = -Infinity, z1 = Infinity, z2 = -Infinity;
      for (const r of (S && S.rooms) || []) {
        if (r.y1 == null) continue;
        if (r.y1 >= yLo && r.y1 < yHi) {
          x1 = Math.min(x1, r.x1); x2 = Math.max(x2, r.x2);
          z1 = Math.min(z1, r.z1); z2 = Math.max(z2, r.z2);
        }
      }
      if (x1 === Infinity) return null;
      return { name: id.toUpperCase(), x1, x2, z1, z2, y1: yLo, y2: yHi };
    }
    return getRoomBbox(S, id);
  }
  // Two independent cull tracks: _qaCulled = view-mode cull (top, iso angle),
  // _qaIsolated = zone-isolation cull (1F, kitchen, etc). _qaOrigVisible holds
  // the mesh's original visibility, set on the first cull and restored only
  // when BOTH tracks are clear.
  function clearQACull(S) {
    if (!S || !S.group) return;
    S.group.traverse(obj => {
      if (!obj.isMesh) return;
      if (obj.userData._qaCulled || obj.userData._qaIsolated) {
        obj.visible = obj.userData._qaOrigVisible;
        delete obj.userData._qaCulled;
        delete obj.userData._qaIsolated;
        delete obj.userData._qaOrigVisible;
      }
    });
  }
  function clearViewCull(S) {
    // Clear top/iso angle cull only — leave zone isolation in place.
    if (!S || !S.group) return;
    S.group.traverse(obj => {
      if (!obj.isMesh) return;
      if (obj.userData._qaCulled) {
        delete obj.userData._qaCulled;
        if (!obj.userData._qaIsolated) {
          obj.visible = obj.userData._qaOrigVisible;
          delete obj.userData._qaOrigVisible;
        }
      }
    });
  }
  function cullAboveY(S, cullY) {
    S.group.traverse(obj => {
      if (!obj.isMesh) return;
      const h = obj.geometry?.parameters?.height ?? 0;
      const bottomY = obj.position.y - h / 2;
      if (bottomY >= cullY - 0.001) {
        if (obj.userData._qaOrigVisible === undefined) {
          obj.userData._qaOrigVisible = obj.visible;
        }
        obj.userData._qaCulled = true;
        obj.visible = false;
      }
    });
  }
  // Hide every mesh whose center sits outside the bbox. Side pads keep
  // boundary walls visible. Upper Y pad is NEGATIVE so the floor slab
  // sitting at bbox.y2 (which is the next floor's underside) is hidden —
  // i.e. when isolating 1F the 2F floor doesn't cover the view from above.
  function isolateZone(S, bbox) {
    const PAD = 0.15, UPPER_Y_PAD = -0.05;
    S.group.traverse(obj => {
      if (!obj.isMesh) return;
      const p = obj.position;
      const inX = p.x >= bbox.x1 - PAD && p.x <= bbox.x2 + PAD;
      const inZ = p.z >= bbox.z1 - PAD && p.z <= bbox.z2 + PAD;
      const inY = p.y >= bbox.y1 - PAD && p.y <= bbox.y2 + UPPER_Y_PAD;
      if (!(inX && inZ && inY)) {
        if (obj.userData._qaOrigVisible === undefined) {
          obj.userData._qaOrigVisible = obj.visible;
        }
        obj.userData._qaIsolated = true;
        obj.visible = false;
      }
    });
  }
  function applyQAView(S, room, mode) {
    clearViewCull(S);
    const cx = (room.x1 + room.x2) / 2;
    const cz = (room.z1 + room.z2) / 2;
    const cy = (room.y1 + room.y2) / 2;
    const diag = Math.hypot(room.x2 - room.x1, room.y2 - room.y1, room.z2 - room.z1);
    let pos, tgt;
    switch (mode) {
      case 'top':
        pos = [cx, room.y2 + diag * 1.2, cz];
        tgt = [cx, cy, cz];
        cullAboveY(S, room.y2);
        break;
      case 'n':
        pos = [cx, cy, room.z1 + 0.3]; tgt = [cx, cy, room.z2]; break;
      case 's':
        pos = [cx, cy, room.z2 - 0.3]; tgt = [cx, cy, room.z1]; break;
      case 'e':
        pos = [room.x2 - 0.3, cy, cz]; tgt = [room.x1, cy, cz]; break;
      case 'w':
        pos = [room.x1 + 0.3, cy, cz]; tgt = [room.x2, cy, cz]; break;
      case 'iso':
        pos = [room.x2 + diag * 0.3, room.y2 + diag * 0.6, room.z1 - diag * 0.3];
        tgt = [cx, cy, cz];
        cullAboveY(S, room.y2);
        break;
      default: return;
    }
    orbit.setFrom(
      new THREE.Vector3().fromArray(pos),
      new THREE.Vector3().fromArray(tgt)
    );
  }

  // ---------- Scene switching ----------
  const viewChipsEl = document.getElementById('view-chips');
  function populateViewChips(S) {
    viewChipsEl.innerHTML = '';
    clearQACull(S);
    if (!S || !S.viewpoints || S.viewpoints.length === 0) return;

    const parents = S.viewpoints.filter(v => !v.parent);
    const childrenByParent = {};
    for (const v of S.viewpoints) {
      if (v.parent) {
        (childrenByParent[v.parent] = childrenByParent[v.parent] || []).push(v);
      }
    }

    const topRow = document.createElement('div');
    topRow.className = 'chip-row';
    const subRow = document.createElement('div');
    subRow.className = 'chip-row';
    subRow.style.display = 'none';
    const qaRow = document.createElement('div');
    qaRow.className = 'chip-row qa-row';
    qaRow.style.display = 'none';

    let activeChip = null;
    let activeQABtn = null;
    let expandedParentId = null;

    function showQARow(room, originalViewpoint) {
      qaRow.innerHTML = '';
      qaRow.style.display = '';
      activeQABtn = null;
      const modes = [
        { id: 'top',   label: 'top'   },
        { id: 'n',     label: 'N'     },
        { id: 's',     label: 'S'     },
        { id: 'e',     label: 'E'     },
        { id: 'w',     label: 'W'     },
        { id: 'iso',   label: 'iso'   },
        { id: 'orbit', label: 'orbit' },
      ];
      for (const m of modes) {
        const btn = document.createElement('div');
        btn.className = 'qa-view';
        btn.textContent = m.label;
        btn.addEventListener('click', () => {
          if (m.id === 'orbit') {
            clearViewCull(S);
            orbit.setFrom(
              new THREE.Vector3().fromArray(originalViewpoint.pos),
              new THREE.Vector3().fromArray(originalViewpoint.tgt)
            );
          } else {
            applyQAView(S, room, m.id);
          }
          if (activeQABtn) activeQABtn.classList.remove('active');
          btn.classList.add('active');
          activeQABtn = btn;
        });
        qaRow.appendChild(btn);
      }
    }

    function makeChip(v) {
      const chip = document.createElement('div');
      chip.className = 'view-chip';
      chip.textContent = v.label;
      chip.addEventListener('click', () => {
        clearQACull(S);
        orbit.setFrom(
          new THREE.Vector3().fromArray(v.pos),
          new THREE.Vector3().fromArray(v.tgt)
        );
        if (activeChip) activeChip.classList.remove('active');
        chip.classList.add('active');
        activeChip = chip;

        const room = getZoneBbox(S, v.id);
        if (room) {
          isolateZone(S, room);
          // Floor-level zones default to the open iso (top-down) view.
          if (v.id === '1f' || v.id === '2f') {
            applyQAView(S, room, 'iso');
            // Hide the floor's own ceiling so the top-down view isn't blocked.
            S.group.traverse(obj => {
              if (obj.isMesh && obj.userData._isCeiling && obj.userData._ceilingFloor === v.id) {
                if (obj.userData._qaOrigVisible === undefined) obj.userData._qaOrigVisible = obj.visible;
                obj.userData._qaIsolated = true;
                obj.visible = false;
              }
            });
          }
          showQARow(room, v);
        } else {
          qaRow.style.display = 'none';
          qaRow.innerHTML = '';
          activeQABtn = null;
        }

        if (!v.parent) {
          const kids = childrenByParent[v.id] || [];
          if (kids.length > 0) {
            expandedParentId = v.id;
            renderSubRow(v.id);
            subRow.style.display = '';
          } else {
            expandedParentId = null;
            subRow.style.display = 'none';
          }
        }
      });
      return chip;
    }

    function renderSubRow(parentId) {
      subRow.innerHTML = '';
      for (const v of (childrenByParent[parentId] || [])) {
        subRow.appendChild(makeChip(v));
      }
    }

    for (const v of parents) topRow.appendChild(makeChip(v));

    viewChipsEl.appendChild(topRow);
    viewChipsEl.appendChild(subRow);
    // Angle row (top/N/S/E/W/iso/orbit) intentionally not appended —
    // dropped to reduce UI complexity. Drag-orbit covers the use case.
  }

  // Briefly fade in the top-centre control hint pill, then fade it out
  // again. Called on every scene entry. Cancelable so a fast scene-switch
  // burst doesn't leave a half-faded element on screen.
  const entryHintEl = document.getElementById('entry-hint');
  let _entryHintTimer = 0;
  function showEntryHint() {
    if (!entryHintEl) return;
    clearTimeout(_entryHintTimer);
    entryHintEl.classList.remove('show');
    // Force a reflow so the next add re-runs the transition from opacity 0.
    void entryHintEl.offsetWidth;
    entryHintEl.classList.add('show');
    _entryHintTimer = setTimeout(() => entryHintEl.classList.remove('show'), 4500);
  }

  function switchScene(id) {
    const S = scenes[id];
    if (!S) return;
    for (const k of Object.keys(scenes)) scenes[k].group.visible = (k === id);
    activeScene = id;
    const targetFov = S.fov ?? 60;
    if (camera.fov !== targetFov) {
      camera.fov = targetFov;
      camera.updateProjectionMatrix();
    }
    orbit.setFrom(S.orbitPos, S.orbitTarget);
    // Room-1 uses a Street View photo of the actual location as the
    // through-window backdrop. Other scenes use their solid bg colour.
    if (id === 'room-1' && _room1BgTex) {
      scene.background = _room1BgTex;
    } else {
      scene.background = new THREE.Color(S.bg);
    }
    // ACES tone mapping is set globally at renderer construction.
    // The procedural PMREM env map is shared across all scenes so PBR materials
    // get realistic indirect light + reflections everywhere (was room-1-only before).
    // HDRI scene environment: assigned globally once HDRLoader resolves;
    // until then use the procedural fallback so the very first render is lit.
    if (!scene.environment) scene.environment = _envLoaded ? _room1EnvMap : buildRoom1EnvMap();
    if (id === 'room-1' || id === 'room-2' || id === 'room-3' || id === 'room-4') {
      // Standalone room sandboxes use AgX (Blender 4+ default) — preserves
      // hue at the highlight roll-off where the warm bulbs meet the shade,
      // unlike ACES which crushes oranges → yellow.
      renderer.toneMapping = THREE.AgXToneMapping;
      renderer.toneMappingExposure = 0.9;
    } else {
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
    }
    for (const chip of document.querySelectorAll('.chip[data-scene]')) {
      chip.classList.toggle('active', chip.dataset.scene === id);
    }
    // Corner-jump hotspots: rebuild for the active room sandbox (or hide).
    const hasCornerDots = ROOM_CORNERS_BY_SCENE[id] != null;
    cornerHotspotsLayer.hidden = !hasCornerDots;
    if (hasCornerDots) rebuildCornerHotspots(id);
    // Briefly surface the camera controls so the user learns them on entry.
    showEntryHint();
    // Show the "Lights" toggle only when room-1 is active.
    const lightsBtn = document.getElementById('lights-btn');
    const lightsDivider = document.getElementById('lights-divider');
    const showLights = (id === 'room-1' || id === 'room-2' || id === 'room-3' || id === 'room-4');
    lightsBtn.hidden = !showLights;
    lightsDivider.hidden = !showLights;
    if (showLights) {
      const on = S.lampsOn !== false;
      lightsBtn.classList.toggle('active', on);
      lightsBtn.setAttribute('aria-pressed', String(on));
      // Linen shade keeps a small baseline emissive even when lights are off
      // so the shade interior (visible through the open bottom from below)
      // reads as soft cream fabric instead of a black void. Real-life
      // lampshades in daylight look like soft glowing cream too.
      if (S.lampMaterial) S.lampMaterial.emissiveIntensity = on ? S.lampOnIntensity : (S.lampOffIntensity ?? 0);
      if (S.bulbMaterial) S.bulbMaterial.emissiveIntensity = on ? S.bulbOnIntensity : 0;
      if (S.lampPointLights) for (const pl of S.lampPointLights) pl.intensity = on ? S.lampPointOnIntensity : 0;
      if (_room1Bloom) _room1Bloom.enabled = on;
    }
    populateViewChips(S);
  }
  for (const chip of document.querySelectorAll('.chip[data-scene]')) {
    chip.addEventListener('click', () => switchScene(chip.dataset.scene));
  }
  // Lights toggle — flips pendant emissive on/off and disables/enables bloom.
  // Works for either room-1 or room-2 (whichever is active), since both
  // sandboxes expose S.lampMaterial / S.bulbMaterial / S.lampPointLights.
  document.getElementById('lights-btn').addEventListener('click', () => {
    const S = scenes[activeScene];
    if (!S || !S.lampMaterial) return;
    S.lampsOn = !S.lampsOn;
    S.lampMaterial.emissiveIntensity = S.lampsOn ? S.lampOnIntensity : (S.lampOffIntensity ?? 0);
    if (S.bulbMaterial) S.bulbMaterial.emissiveIntensity = S.lampsOn ? S.bulbOnIntensity : 0;
    if (S.lampPointLights) for (const pl of S.lampPointLights) pl.intensity = S.lampsOn ? S.lampPointOnIntensity : 0;
    // Bloom is room-1-only for now; room-2 doesn't have a bloom composer.
    if (activeScene === 'room-1' && _room1Bloom) _room1Bloom.enabled = S.lampsOn;
    const btn = document.getElementById('lights-btn');
    btn.classList.toggle('active', S.lampsOn);
    btn.setAttribute('aria-pressed', String(S.lampsOn));
  });

  // ---------- Time of day (mutates exterior scene's sun/sky/fill + bg) ----------
  const TOD_PRESETS = {
    day: {
      sunColor: 0xfff2dc, sunIntensity: 1.0,  sunPos: [-8, 14, 10],
      skyTop:   0xcce0ff, skyBot:       0x444438, skyIntensity: 0.5,
      fillIntensity: 0.15, bg: 0xbbccd8,
    },
    evening: {
      sunColor: 0xff9d5e, sunIntensity: 0.7,  sunPos: [-14, 4, 6],
      skyTop:   0xff8866, skyBot:       0x402015, skyIntensity: 0.55,
      fillIntensity: 0.18, bg: 0xe6a07a,
    },
    night: {
      sunColor: 0x6280b0, sunIntensity: 0.12, sunPos: [-6, 10, 8],
      skyTop:   0x303860, skyBot:       0x141622, skyIntensity: 0.45,
      fillIntensity: 0.08, bg: 0x161826,
    },
  };
  function applyTod(todId) {
    const p = TOD_PRESETS[todId];
    if (!p) return;
    const ext = scenes['exterior'];
    if (ext && ext.sun) {
      ext.sun.color.setHex(p.sunColor);
      ext.sun.intensity = p.sunIntensity;
      ext.sun.position.fromArray(p.sunPos);
    }
    if (ext && ext.sky) {
      ext.sky.color.setHex(p.skyTop);
      ext.sky.groundColor.setHex(p.skyBot);
      ext.sky.intensity = p.skyIntensity;
    }
    if (ext && ext.fill) {
      ext.fill.intensity = p.fillIntensity;
    }
    if (ext) ext.bg = p.bg;
    if (activeScene === 'exterior') {
      scene.background = new THREE.Color(p.bg);
    }
    for (const chip of document.querySelectorAll('.tod-chip')) {
      chip.classList.toggle('active', chip.dataset.tod === todId);
    }
  }
  for (const chip of document.querySelectorAll('.tod-chip')) {
    chip.addEventListener('click', () => applyTod(chip.dataset.tod));
  }

  switchScene('exterior');
  const _urlScene = new URLSearchParams(location.search).get('scene');
  if (_urlScene && _urlScene !== 'exterior') switchScene(_urlScene);
  // Journey mode camera overrides.
  if (new URLSearchParams(location.search).has('journey')) {
    if (_urlScene === 'room-1') {
      // Inside room-1: fpStart position, look at room centre (slight tilt down — user prefers this).
      orbit.setFrom(new THREE.Vector3(0.50, 1.60, 0.50), new THREE.Vector3(1.35, 1.0, 1.35));
    } else {
      // Exterior: lower camera from y=6 to eye height, level target to match.
      orbit.setFrom(new THREE.Vector3(12, 1.60, 14), new THREE.Vector3(3.15, 1.60, 3.6));
    }
  }

  // ---------- Animation loop ----------
  function animate() {
    orbit.update();
    updateRoomLabel();
    updateCornerHotspots();
    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(animate);
})();

/* ============================================================
   Glass-dock UI wiring (iOS HIG / Liquid Glass)
   - Scene segmented control lives in the dock; .seg.chip elements
     have data-scene, so the existing scene-switching JS picks them up.
   - Views button opens a popover that hosts #view-chips. The existing
     populateViewChips fills it. Button + divider auto-hide when the
     active scene has no viewpoints, so the dock collapses cleanly.
   - Popover stays open while the user explores; dismissed via outside
     click, Escape, or tapping Views again.
   ============================================================ */
(function () {
  'use strict';
  const viewsBtn     = document.getElementById('views-btn');
  const viewsPopover = document.getElementById('views-popover');
  const viewChips    = document.getElementById('view-chips');
  const dockDivider  = document.querySelector('.dock-divider');

  function setExpanded(btn, expanded) {
    btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  }
  function open(btn, pop)  { pop.hidden = false; setExpanded(btn, true); }
  function close(btn, pop) { pop.hidden = true;  setExpanded(btn, false); }

  function syncViewsBtn() {
    const hasViews = viewChips.querySelector('.view-chip') !== null;
    viewsBtn.style.display    = hasViews ? '' : 'none';
    dockDivider.style.display = hasViews ? '' : 'none';
    if (!hasViews) close(viewsBtn, viewsPopover);
  }
  new MutationObserver(syncViewsBtn).observe(viewChips, { childList: true, subtree: true });
  syncViewsBtn();

  viewsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (viewsPopover.hidden) open(viewsBtn, viewsPopover);
    else close(viewsBtn, viewsPopover);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#views-btn, #views-popover')) {
      close(viewsBtn, viewsPopover);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close(viewsBtn, viewsPopover);
  });
})();
</script>
</body>
</html>
