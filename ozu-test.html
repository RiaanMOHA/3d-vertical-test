      // ac-wall: hole at frosted window x=[0.30, 0.56], y=[0.9, 1.9]
      // ShapeGeometry on (x, y) plane, normal +z; positioned at z=RD (normal points away from room — DoubleSide makes it visible from inside too).
      const wD = new THREE.Mesh(wallShapeWithHole(RW, RH, 0.30, 0.9, 0.56, 1.9), matWall_zD);
      wD.position.set(0, 0, RD);
      S.group.add(wD);
      // wD bake UV = (world_y/RH, world_x/RW); ShapeGeometry default
      // gives (lx/RW, ly/RH). Swap so the AO texture aligns with bake.
      setUVsByLocal(wD.geometry, (lx, ly, lz) => [
        ly / RH,
        lx / RW,
      ]);

      // ── Phase D: through-window view ──
      // The view past the room is the Street View photo of the actual
      // location, set as scene.background at the top of switchScene when
      // room-1 is active. Room walls opaquely occlude it everywhere except
      // around the room silhouette, which gives the outdoor-backdrop effect.

      // baseboards + crown molding — nudged 1 mm INWARD so they don't share
      // a plane with the wall's inside face (was producing a checkerboard
      // z-fight band on WebGPU's stricter depth test).
      const ZF = 0.001;
      const bbH = 0.05, bbD = 0.01, bbColor = 0xf2f0eb, bbX = { roughness: 0.7 };
      box(bbD, bbH, RD, bbD/2 + ZF,        bbH/2, RD/2, bbColor, bbX);
      box(bbD, bbH, RD, RW - bbD/2 - ZF,   bbH/2, RD/2, bbColor, bbX);
      box(RW,  bbH, bbD, RW/2, bbH/2, bbD/2 + ZF,      bbColor, bbX);
      box(RW,  bbH, bbD, RW/2, bbH/2, RD - bbD/2 - ZF, bbColor, bbX);
      // crown molding (white line between walls and ceiling)
      const cmH = 0.06, cmD = 0.02, cmColor = 0xffffff, cmY = RH - cmH/2;
      box(cmD, cmH, RD, cmD/2 + ZF,        cmY, RD/2, cmColor, bbX);
      box(cmD, cmH, RD, RW - cmD/2 - ZF,   cmY, RD/2, cmColor, bbX);
      box(RW,  cmH, cmD, RW/2, cmY, cmD/2 + ZF,      cmColor, bbX);
      box(RW,  cmH, cmD, RW/2, cmY, RD - cmD/2 - ZF, cmColor, bbX);

      // sliding window on x=W (window-wall per April 22 v4 layout)
      feat('x', RW, -1, { a1: 0.405, a2: 1.595, b1: 0.85, b2: 1.75 }, matGlassR1);
      winFrame('x', RW, -1, 0.405, 1.595, 0.85, 1.75, matFrameR1);
      // central vertical mullion — meeting point of the two hikichigai panels.
      feat('x', RW, -1, { a1: 0.98, a2: 1.02, b1: 0.85, b2: 1.75 }, matFrameR1);
      // curtains on window-wall — gathered + tieback at both sides of the sliding window.
      // Fluted vertical pleats so each column reads as folded fabric instead
      // of a smooth pole. Different mechanism from the previous "7-fold
      // bunched" attempt that was rejected as lumpy: the silhouette stays
      // close to the original cylinder, but the surface gets 6 pairs of
      // ridges + valleys carved into it so directional light + the fabric
      // weave normal map both read as drape pleats.
      {
        const matCurt = new THREE.MeshStandardMaterial({ color: 0xddd2c0, roughness: 1 });
        const matBand = new THREE.MeshStandardMaterial({ color: 0xc7bba2, roughness: 0.95 });
        applyClothShader(matCurt);
        applyFabricWeave(matCurt, 8, 24, 0.30);
        function flutedColumn(rTop, rBot, height, ridges, depth) {
          const geom = new THREE.CylinderGeometry(rTop, rBot, height, 64, 1, false);
          const pos = geom.attributes.position;
          for (let i = 0; i < pos.count; i++) {
            const x = pos.getX(i), z = pos.getZ(i);
            const r = Math.hypot(x, z);
            if (r < 1e-6) continue;
            const theta = Math.atan2(z, x);
            // Per-pleat jitter (±15 %) so they don't read as a lathed-perfect
            // pattern — real drape pleats vary in depth.
            const jitter = 0.85 + 0.15 * Math.sin(ridges * theta * 1.5 + 1.7);
            // 0 at the ridges, 1 at the valleys.
            const valley = (1 - Math.cos(ridges * theta)) * 0.5 * jitter;
            const newR = r - depth * valley;
            pos.setX(i, x * newR / r);
            pos.setZ(i, z * newR / r);
          }
          pos.needsUpdate = true;
          geom.computeVertexNormals();
          return geom;
        }
        const cTop = 1.85, cX = RW - 0.10;
        const SHELF_TOP_Y = 1.27;
        function bunch(zPos, yBot, yTie) {
          const fullH = cTop - yBot;
          const col = new THREE.Mesh(
            // 8 vertical pleats, 25 mm deep — deeper than the previous 6×14 mm
            // attempt because that read as a smooth pole. Top narrower than
            // bottom (0.058 → 0.080) so the drape pools into a wider hem.
            flutedColumn(0.058, 0.080, fullH, 8, 0.025),
            matCurt
          );
          col.position.set(cX, (cTop + yBot) / 2, zPos);
          S.group.add(col);
          // Tieback radius widened from 0.092 → 0.098 so its inner edge sits
          // outside the column's ridge max and doesn't clip the pleats.
          const band = new THREE.Mesh(
            new THREE.TorusGeometry(0.098, 0.012, 10, 28),
            matBand
          );
          band.position.set(cX, yTie, zPos);
          band.rotation.y = Math.PI / 2;
          S.group.add(band);
        }
        // Shelf-side bunch (z near 0): bottom rests on shelf top.
        bunch(0.36, SHELF_TOP_Y, 1.55);
        // Far-side bunch (z near D): bottom hangs to floor.
        bunch(1.64, 0.10, 1.30);
      }

      // doorway + casing on z=0
      // Doorway-fill is shrunk 5 mm on each side from the 0.8 × 2.0 doorway
      // opening so its right/left/top/bottom faces are NOT coplanar with the
      // door panel's faces (door is x=[0,0.8], y=[0,2.0]). Coplanar coincident
      // faces caused a vertical z-fighting line on the door edges (door's
      // white +x face flickering against doorway-fill's near-black +x face).
      feat('z', 0, +1, { a1: 0.005, a2: 0.795, b1: 0.005, b2: 1.995 }, COL.doorway);
      // Architrave moulding around the doorway — deeper + slightly wider
      // than the previous 1.5 cm flush casing so it actually reads as a
      // profile around the frame.
      const cD2 = 0.025, cW2 = 0.07, cZ2 = cD2/2 + BIAS;
      box(0.8 + cW2 * 2, cW2, cD2, 0.4, 2.0 + cW2/2, cZ2, 0xfafafa, { roughness: 0.55 });
      box(cW2, 2.0 + cW2, cD2, -cW2/2,        (2.0 + cW2)/2, cZ2, 0xfafafa, { roughness: 0.55 });
      box(cW2, 2.0 + cW2, cD2, 0.8 + cW2/2,   (2.0 + cW2)/2, cZ2, 0xfafafa, { roughness: 0.55 });
      // closed white door panel + round chrome knob (per photo).
      box(0.8, 2.0, 0.04, 0.4, 1.0, 0.025, 0xffffff, { roughness: 0.55 });
      // Hinges — three short chrome barrels on the door's left edge (x=0)
      // so the door reads as hinged rather than a floating panel. Cylinder
      // default axis is +y (vertical), which is correct for a real hinge pin.
      {
        const matHinge = new THREE.MeshStandardMaterial({ color: 0xa8a8a8, metalness: 1.0, roughness: 0.30 });
        const hingeGeom = new THREE.CylinderGeometry(0.012, 0.012, 0.07, 14);
        for (const hy of [0.30, 1.00, 1.70]) {
          const h = new THREE.Mesh(hingeGeom, matHinge);
          h.position.set(0.005, hy, 0.045);    // at the door's room-facing edge, just past x=0
          S.group.add(h);
        }
      }
      {
        const matKnob = new THREE.MeshStandardMaterial({ color: 0xc8c8c8, metalness: 1.0, roughness: 0.18 });
        const esc = new THREE.Mesh(new THREE.CylinderGeometry(0.028, 0.028, 0.003, 18), matKnob);
        esc.position.set(0.68, 1.02, 0.046);
        esc.rotation.x = Math.PI / 2;
        S.group.add(esc);
        const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.04, 12), matKnob);
        stem.position.set(0.68, 1.02, 0.067);
        stem.rotation.x = Math.PI / 2;
        S.group.add(stem);
        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.022, 16, 12), matKnob);
        knob.position.set(0.68, 1.02, 0.092);
        S.group.add(knob);
      }
      // light switch panel on entrance-wall, just past the door frame (latch side).
      {
        // Plastic switch plate is satin-matte, not glossy. Bumping roughness so
        // the highlight from the sunbeam on this wall reads as plastic, not painted ceramic.
        const matSwPlate = new THREE.MeshStandardMaterial({ color: 0xf2f0eb, roughness: 0.6 });
        const matSwBtn   = new THREE.MeshStandardMaterial({ color: 0xfafaf6, roughness: 0.55 });
        const swX = 0.95, swY = 1.15, swZ = BIAS + 0.0025;
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.12, 0.005), matSwPlate);
        plate.position.set(swX, swY, swZ); S.group.add(plate);
        const btn = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.07, 0.008), matSwBtn);
        btn.position.set(swX, swY, swZ + 0.005); S.group.add(btn);
      }

      // closet on x=0 — flush against ac-wall (z=D corner). Height runs all
      // the way up to just under the crown moulding so there's no strip of
      // wall paint visible above the closet (matches a typical Japanese
      // rental floor-to-ceiling wardrobe).
      feat('x', 0, +1, { a1: 1.50, a2: 2.70, b1: 0, b2: 2.45 }, matCloset);
      const seamZ = (1.50 + 2.70) / 2;
      feat('x', 0, +1, { a1: seamZ - 0.0025, a2: seamZ + 0.0025, b1: 0, b2: 2.45 }, matSeam);
      // Round chrome knobs on each bi-fold leaf — short stem + ball, like
      // the entrance-door knob. Closet panel's room-facing face is at
      // x = 0.003 + FEAT/2 = 0.023, so the knobs need to sit forward of
      // that to actually stick out into the room. (The previous single pin
      // handle was at x=0.009 — fully buried inside the closet panel and
      // therefore invisible.)
      {
        // Match the entrance-door knob's chrome treatment for visual consistency
        // (was 0.85/0.25 — closet read slightly less polished than the door knob 30 cm away).
        const matCabKnob = new THREE.MeshStandardMaterial({ color: 0xc6c6c6, metalness: 1.0, roughness: 0.18 });
        const stemGeom = new THREE.CylinderGeometry(0.006, 0.006, 0.03, 12);
        const knobGeom = new THREE.SphereGeometry(0.018, 16, 12);
        for (const dz of [-0.06, 0.06]) {
          const stem = new THREE.Mesh(stemGeom, matCabKnob);
          stem.position.set(0.038, 1.05, seamZ + dz);
          stem.rotation.z = Math.PI / 2;       // stem axis along x, sticking out
          S.group.add(stem);
          const knob = new THREE.Mesh(knobGeom, matCabKnob);
          knob.position.set(0.060, 1.05, seamZ + dz);
          S.group.add(knob);
        }
      }
      // coat hook rail on cabinet-wall, entrance-wall side (z near 0).
      // Whitewashed/distressed wood plank with two black peg hooks.
      {
        const matRail = new THREE.MeshStandardMaterial({ color: 0xe6dfd2, roughness: 0.85 });
        const matHook = new THREE.MeshStandardMaterial({ color: 0x1a1715, roughness: 0.5, metalness: 0.4 });
        const railZ = 0.30, railY = 1.70, railLen = 0.50, railH = 0.10, railT = 0.018;
        const rail = new THREE.Mesh(new THREE.BoxGeometry(railT, railH, railLen), matRail);
        rail.position.set(BIAS + railT/2, railY, railZ); S.group.add(rail);
        // 2 hook pegs sticking ~5 cm into the room.
        const pegGeom = new THREE.CylinderGeometry(0.008, 0.008, 0.05, 12);
        for (const dz of [-0.12, 0.12]) {
          const peg = new THREE.Mesh(pegGeom, matHook);
          peg.position.set(BIAS + railT + 0.025, railY - 0.01, railZ + dz);
          peg.rotation.z = Math.PI / 2; // lay along x (sticking out from wall)
          S.group.add(peg);
          // small ball cap on the end of each peg
          const cap = new THREE.Mesh(new THREE.SphereGeometry(0.012, 12, 8), matHook);
          cap.position.set(BIAS + railT + 0.052, railY - 0.01, railZ + dz);
          S.group.add(cap);
        }
      }

      // AC unit on z=D (ac-wall) — split-system look:
      // body + bottom louver flap + recessed grille + vent slit + LED
      {
        const acCx = 2.1, acCy = 2.27;
        const acW = 0.82, acH = 0.26, acD = 0.18;
        const acBackZ  = RD - BIAS;            // back face (against wall)
        const acFrontZ = acBackZ - acD;        // front face (into room)
        // main body — matte ABS plastic, NOT glossy. 0.45 was reading as wet/painted
        // under the new RectAreaLight; bumping to 0.7 settles the body into matte plastic.
        box(acW, acH, acD, acCx, acCy, acFrontZ + acD/2, 0xf6f6f4, { roughness: 0.7 });
        // bottom louver flap — hangs slightly below body and forward,
        // creates the visible "bottom edge" of a real AC
        box(acW * 0.94, 0.04, acD * 0.6, acCx, acCy - acH/2 - 0.01, acFrontZ + acD * 0.45,
            0xeceae6, { roughness: 0.7 });
        // front grille (slightly recessed, slightly darker)
        box(acW * 0.86, acH * 0.55, 0.003, acCx, acCy + 0.02, acFrontZ - 0.002,
            0xc6c3bd, { roughness: 0.7 });
        // dark vent slit just above the bottom flap
        box(acW * 0.92, 0.02, 0.006, acCx, acCy - acH/2 + 0.02, acFrontZ - 0.003,
            0x252525, { roughness: 0.4 });
      }
      feat('z', RD, -1, { a1: 0.30, a2: 0.56, b1: 0.9, b2: 1.9 }, matFrosted);
      winFrame('z', RD, -1, 0.30, 0.56, 0.9, 1.9, matFrameR1);
      // intercom / call panel on ac-wall — small white plate below the AC.
      {
        // Plate is matte plastic; button is a small darker push-button (kept slightly
        // glossier so the eye picks it out as the actual control).
        const matPanel = new THREE.MeshStandardMaterial({ color: 0xf2f0eb, roughness: 0.65 });
        const matBtn   = new THREE.MeshStandardMaterial({ color: 0x4d5052, roughness: 0.35 });
        const px = 1.55, py = 1.65, pz = RD - 0.004;
        const plate = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.12, 0.008), matPanel);
        plate.position.set(px, py, pz); S.group.add(plate);
        const btn = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.02, 0.003), matBtn);
        btn.position.set(px, py - 0.025, pz - 0.006); S.group.add(btn);
      }

      // bed — April 22 v4: along ac-wall (z=D); head at corner-ac-window (x=W), foot at corner-ac-entrance (x=0.7)
      // Pulled back 3 cm from both walls so posts (radius 24 mm) don't poke
      // through the ac-wall and the mattress doesn't z-fight at the surface.
      aabb({ x1: 0.7, x2: 2.67, z1: 1.7, z2: 2.67, y1: 0.1, y2: 0.5 }, COL.mattress);
      // Pipe-style headboard / footboard, matching the photo reference at
      //   ozu-test/interior-images/room-1/corner-cabinet-window/
      //     room-1-corner-cabinet-window-08.webp
      // Cylindrical rails + bars (was square bars), end posts extend ABOVE
      // the top rail by 8 cm with two decorative collar rings + a small ball
      // cap on top. Replaces the previous separate "ball finials" block —
      // caps are now integral to the frame so they always touch the post.
      const IRON = { roughness: 0.45, metalness: 0.6 };
      const ironMat = new THREE.MeshStandardMaterial({ color: COL.ironDark, ...IRON });
      function pipeFrame(panel, topRail, botRail, nBars) {
        const w = panel.x2 - panel.x1, d = panel.z2 - panel.z1;
        const cx = (panel.x1 + panel.x2) / 2, cz = (panel.z1 + panel.z2) / 2;
        const isLongZ = d > w;
        const length = isLongZ ? d : w;

        // Horizontal rails — cylinders along the long axis.
        function rail(yCenter, thickness) {
          const r = thickness / 2;
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, length, 16),
            ironMat,
          );
          if (isLongZ) m.rotation.x = Math.PI / 2;
          else         m.rotation.z = Math.PI / 2;
          m.position.set(cx, yCenter, cz);
          S.group.add(m);
        }
        rail((topRail.y1 + topRail.y2) / 2, topRail.y2 - topRail.y1);
        rail((botRail.y1 + botRail.y2) / 2, botRail.y2 - botRail.y1);

        // Vertical bars + end posts. End posts are slightly thicker and rise
        // 8 cm above the top rail to host the collar bands + cap.
        const barR  = 0.020;
        const postR = 0.024;
        const barH  = topRail.y1 - botRail.y2;
        const barCy = (topRail.y1 + botRail.y2) / 2;
        const POST_RISE = 0.08;
        const postH    = barH + POST_RISE;
        const postCy   = botRail.y2 + postH / 2;
        const postTopY = botRail.y2 + postH;

        for (let i = 0; i < nBars; i++) {
          const t = nBars === 1 ? 0.5 : i / (nBars - 1);
          const isEnd = (i === 0 || i === nBars - 1);
          const r = isEnd ? postR : barR;
          const h = isEnd ? postH : barH;
          const cy = isEnd ? postCy : barCy;
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, h, 16),
            ironMat,
          );
          if (isLongZ) m.position.set(cx, cy, panel.z1 + d * t);
          else         m.position.set(panel.x1 + w * t, cy, cz);
          S.group.add(m);
        }

        // End-post detail: 2 collar bands + small ball cap on top.
        const collarR    = postR + 0.006;
        const collarTube = 0.005;
        const collarGeom = new THREE.TorusGeometry(collarR, collarTube, 8, 22);
        const capGeom    = new THREE.SphereGeometry(postR + 0.004, 16, 12);
        for (const i of [0, nBars - 1]) {
          const t = i / (nBars - 1);
          const x = isLongZ ? cx : panel.x1 + w * t;
          const z = isLongZ ? panel.z1 + d * t : cz;
          for (const yOff of [0.025, 0.050]) {
            const c = new THREE.Mesh(collarGeom, ironMat);
            c.position.set(x, postTopY - yOff, z);
            c.rotation.x = Math.PI / 2;   // torus axis aligned to +Y
            S.group.add(c);
          }
          const cap = new THREE.Mesh(capGeom, ironMat);
          // Sphere bottom sits 5 mm below post top so it reads as welded on.
          cap.position.set(x, postTopY - 0.005 + (postR + 0.004), z);
          S.group.add(cap);
        }
      }
      // Footboard — simple pipe frame, matches corner-cabinet-window-08.
      // z2 pulled back 3 cm from ac-wall so the corner post (radius 24 mm) sits inside.
      pipeFrame({ x1: 0.7,  x2: 0.75, z1: 1.7, z2: 2.67 }, { y1: 0.68, y2: 0.7 }, { y1: 0, y2: 0.02 }, 3);

      // Headboard — distinct construction from the footboard. Reference:
      //   ozu-test/interior-images/room-1/corner-ac-window/
      //     room-1-corner-ac-window-{01,02}.webp
      // Two-section design: lower half is a stained-wood inset panel between
      // bottom rail (at mattress level) and middle rail, with black bracket
      // plates hugging both side edges; upper half is a short row of vertical
      // bars between middle rail and top rail. Corner posts run full-height
      // and end in collar bands + ball cap.
      {
        // Headboard pulled back 3 cm from window-wall (x) and ac-wall (z) so the
        // corner posts (radius 24 mm) don't protrude through either wall.
        const head = { x1: 2.62, x2: 2.67, z1: 1.7, z2: 2.67 };
        const w = head.x2 - head.x1, d = head.z2 - head.z1;
        const cx = (head.x1 + head.x2) / 2, cz = (head.z1 + head.z2) / 2;
        const Y_TOP = 1.0, Y_MID = 0.85, Y_BOT = 0.50;
        const POST_R = 0.024, POST_RISE = 0.08;
        const POST_TOP_Y = Y_TOP + POST_RISE;

        // Corner posts (full height; cap zone above the top rail)
        for (const z of [head.z1, head.z2]) {
          const post = new THREE.Mesh(
            new THREE.CylinderGeometry(POST_R, POST_R, POST_TOP_Y, 16),
            ironMat,
          );
          post.position.set(cx, POST_TOP_Y / 2, z);
          S.group.add(post);
        }

        // Three horizontal rails along z (top, middle, bottom).
        function headRail(yC, thickness) {
          const r = thickness / 2;
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(r, r, d, 16),
            ironMat,
          );
          m.rotation.x = Math.PI / 2;
          m.position.set(cx, yC, cz);
          S.group.add(m);
        }
        headRail(Y_TOP, 0.02);
        headRail(Y_MID, 0.02);
        headRail(Y_BOT, 0.02);

        // Upper section: 5 short vertical bars between middle and top rails.
        const UPPER_BARS = 5;
        const barR = 0.020;
        const upperH = Y_TOP - Y_MID;
        const upperCy = (Y_TOP + Y_MID) / 2;
        for (let i = 0; i < UPPER_BARS; i++) {
          const t = (i + 0.5) / UPPER_BARS; // centred between the corner posts
          const z = head.z1 + 0.06 + (d - 0.12) * t;
          const bar = new THREE.Mesh(
            new THREE.CylinderGeometry(barR, barR, upperH, 14),
            ironMat,
          );
          bar.position.set(cx, upperCy, z);
          S.group.add(bar);
        }

        // Wood inset panel — 3 horizontal stained-wood planks between bottom
        // and middle rails. Same dark_wood texture as the desk + shelf tiers
        // so the room reads as one furniture set.
        const woodMat = pbrMatR1('dark_wood', 1.2, 0.4, { roughness: 0.65, color: 0xffe2c8 });
        const PLANK_COUNT = 3;
        const wpInset = 0.07; // pulled in from corner posts so the brackets fit between
        const wpZ1 = head.z1 + wpInset, wpZ2 = head.z2 - wpInset;
        const wpZSpan = wpZ2 - wpZ1;
        const totalH = Y_MID - Y_BOT;
        const plankH = totalH / PLANK_COUNT;
        const plankT = 0.045;
        for (let i = 0; i < PLANK_COUNT; i++) {
          const cy = Y_BOT + (i + 0.5) * plankH;
          const plank = new THREE.Mesh(
            new THREE.BoxGeometry(plankT, plankH * 0.96, wpZSpan),
            woodMat,
          );
          plank.position.set(cx, cy, cz);
          S.group.add(plank);
        }

        // Side brackets — flat black plates hugging both z edges of the wood
        // panel. Approximates the stepped industrial bracket detail visible
        // in the photo without modelling each rivet.
        const brW = 0.05, brT = 0.05;
        for (const z of [wpZ1 - brT / 2, wpZ2 + brT / 2]) {
          const br = new THREE.Mesh(
            new THREE.BoxGeometry(brW, totalH, brT),
            ironMat,
          );
          br.position.set(cx, (Y_BOT + Y_MID) / 2, z);
          S.group.add(br);
          // Three horizontal rivet bands across each bracket — approximates
          // the visible "screw" pattern on real industrial gussets.
          for (let k = 0; k < 3; k++) {
            const t = (k + 0.5) / 3;
            const ribY = Y_BOT + t * totalH;
            const rib = new THREE.Mesh(
              new THREE.BoxGeometry(brW * 1.15, 0.008, brT * 1.15),
              ironMat,
            );
            rib.position.set(cx, ribY, z);
            S.group.add(rib);
          }
        }

        // Corner-post detail: 2 collar bands + small ball cap on top.
        const collarR = POST_R + 0.006;
        const collarTube = 0.005;
        const collarGeom = new THREE.TorusGeometry(collarR, collarTube, 8, 22);
        const capGeom = new THREE.SphereGeometry(POST_R + 0.004, 16, 12);
        for (const z of [head.z1, head.z2]) {
          for (const yOff of [0.025, 0.050]) {
            const c = new THREE.Mesh(collarGeom, ironMat);
            c.position.set(cx, POST_TOP_Y - yOff, z);
            c.rotation.x = Math.PI / 2;
            S.group.add(c);
          }
          const cap = new THREE.Mesh(capGeom, ironMat);
          cap.position.set(cx, POST_TOP_Y - 0.005 + (POST_R + 0.004), z);
          S.group.add(cap);
        }
      }
      // bedding — white fitted sheet, white pillow, dark accent pillow.
      {
        const matSheet = new THREE.MeshStandardMaterial({ color: 0xf6f3ec, roughness: 0.95 });
        const matPillowWhite = new THREE.MeshStandardMaterial({ color: 0xfafaf4, roughness: 0.95 });
        const matPillowAccent = new THREE.MeshStandardMaterial({ color: 0x4d534f, roughness: 0.95 });
        applyClothShader(matSheet);
        applyClothShader(matPillowWhite);
        applyClothShader(matPillowAccent);
        applyFabricWeave(matSheet, 24, 12, 0.25);
        applyFabricWeave(matPillowWhite, 6, 4, 0.30);
        applyFabricWeave(matPillowAccent, 6, 4, 0.30);
        // sheet — flat slab over the mattress, slightly oversized so it drapes.
        const sheet = new THREE.Mesh(new THREE.BoxGeometry(2.04, 0.04, 1.04), matSheet);
        sheet.position.set(1.7, 0.52, 2.2); S.group.add(sheet);
        // Scaled sphere geometry for soft pillow shapes (BoxGeometry reads as
        // cubes, not cushions).
        const pillowGeom = new THREE.SphereGeometry(0.5, 24, 16);
        // white sleeping pillow at headboard end, lying long-axis across the bed.
        const wPillow = new THREE.Mesh(pillowGeom, matPillowWhite);
        wPillow.scale.set(0.40, 0.14, 0.55);
        wPillow.position.set(2.42, 0.57, 2.20); S.group.add(wPillow);
        // dark grey accent cushion sitting in front of the white pillow.
        const aPillow = new THREE.Mesh(pillowGeom, matPillowAccent);
        aPillow.scale.set(0.34, 0.20, 0.32);
        aPillow.position.set(2.08, 0.60, 2.20); S.group.add(aPillow);
      }

      // desk — against window-wall (x=W), under sliding window. Shortened
      // from v4 z=0.4..1.6 to 0.4..1.4 to leave breathing room before the bed.
      {
        const f = { x1: 2.1, x2: 2.7, z1: 0.4, z2: 1.4 };
        const w = f.x2 - f.x1, d = f.z2 - f.z1;
        const cx = (f.x1+f.x2)/2, cz = (f.z1+f.z2)/2;
        const topY = 0.75, topT = 0.05, legT = 0.04;
        const matDesk = pbrMatR1('dark_wood', 1.2, 0.6, { roughness: 0.65, color: 0xffe2c8 });
        const top = new THREE.Mesh(new THREE.BoxGeometry(w, topT, d), matDesk);
        top.position.set(cx, topY - topT/2, cz); S.group.add(top);
        const legH = topY - topT;
        const BMET = { roughness: 0.5, metalness: 0.6 };
        for (const lx of [f.x1 + legT/2, f.x2 - legT/2])
          for (const lz of [f.z1 + legT/2, f.z2 - legT/2])
            box(legT, legH, legT, lx, legH/2, lz, COL.blackMet, BMET);
      }

      // shelf with x-bracing — April 22 v4: at corner-entrance-window (x=W × z=0), L-shape with desk
      {
        const f = { x1: 2.1, x2: 2.7, z1: 0, z2: 0.4 };
        const w = f.x2 - f.x1, d = f.z2 - f.z1;
        const cx = (f.x1+f.x2)/2, cz = (f.z1+f.z2)/2;
        const sH = 1.3, postT = 0.03, tierT = 0.025;
        const tierYs = [0.05, 0.47, 0.89, 1.27];
        const BMET = { roughness: 0.5, metalness: 0.6 };
        for (const px of [f.x1 + postT/2, f.x2 - postT/2])
          for (const pz of [f.z1 + postT/2, f.z2 - postT/2])
            box(postT, sH, postT, px, sH/2, pz, COL.blackMet, BMET);
        const matTier = pbrMatR1('dark_wood', 0.4, 0.4, { roughness: 0.65, color: 0xffe2c8 });
        // Tier shelves sit BETWEEN the corner posts, not flush with them.
        // Previously the tier and post outer faces shared the same plane at
        // every corner, which caused per-pixel z-fighting between the wood
        // texture and the post's black metal — the user saw wood/metal
        // randomly switching at the corners. Photo reference confirms the
        // wood shelves are inset, ending at the posts' inner faces.
        const tierW = w - 2 * postT;
        const tierD = d - 2 * postT;
        for (const y of tierYs) {
          const tier = new THREE.Mesh(new THREE.BoxGeometry(tierW, tierT, tierD), matTier);
          tier.position.set(cx, y, cz); S.group.add(tier);
        }
        function rod(start, end) {
          const dir = new THREE.Vector3().subVectors(end, start);
          const len = dir.length();
          const m = new THREE.Mesh(
            new THREE.CylinderGeometry(0.005, 0.005, len, 8),
            new THREE.MeshStandardMaterial({ color: COL.blackMet, metalness: 0.6, roughness: 0.5 })
          );
          m.position.copy(start).add(dir.clone().multiplyScalar(0.5));
          m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
          S.group.add(m);
        }
        const yLo = tierYs[0], yHi = tierYs[3];
        const xLo = f.x1 + postT/2, xHi = f.x2 - postT/2;
        for (const fz of [f.z1, f.z2]) {
          rod(new THREE.Vector3(xLo, yLo, fz), new THREE.Vector3(xHi, yHi, fz));
          rod(new THREE.Vector3(xLo, yHi, fz), new THREE.Vector3(xHi, yLo, fz));
        }
      }

      // chair — distressed grey-leather office chair with studded back, on a
      // cylinder pedestal + 5-arm spider base + caster wheels.
      // Photo references:
      //   corner-ac-window-02 (visible 5-spoke caster base + cylinder)
      //   corner-cabinet-window-01 (back-edge studs + grey leather)
      //   corner-cabinet-window-{02,03} (cross-checks)
      // Merges the right base from the first rebuild with the right
      // upholstery from the second.
      {
        const f = { x1: 1.95, x2: 2.4, z1: 0.7, z2: 1.15 };
        const w = f.x2 - f.x1, d = f.z2 - f.z1;
        const cx = (f.x1 + f.x2) / 2, cz = (f.z1 + f.z2) / 2;
        const seatY = 0.45, seatT = 0.06;
        const backW = 0.36, backH = 0.55, backT = 0.05;
        const baseT = 0.018, casterR = 0.022;

        const matLeather = new THREE.MeshStandardMaterial({
          color: 0x9a948e, roughness: 0.62, metalness: 0.0,
        });
        const matBlackMet = new THREE.MeshStandardMaterial({
          color: 0x141414, roughness: 0.5, metalness: 0.5,
        });
        const matCaster = new THREE.MeshStandardMaterial({
          color: 0x222226, roughness: 0.55,
        });
        const matStud = new THREE.MeshStandardMaterial({
          color: 0xc8c8c8, metalness: 0.95, roughness: 0.25,
        });

        // Seat — leather slab.
        const seat = new THREE.Mesh(
          new THREE.BoxGeometry(w * 0.92, seatT, d * 0.88),
          matLeather,
        );
        seat.position.set(cx, seatY - seatT / 2, cz);
        S.group.add(seat);

        // Back assembly: panel + nailhead studs in a single tilted group, so
        // when the back leans, the studs lean with it.
        const backGroup = new THREE.Group();
        const backPanel = new THREE.Mesh(
          new THREE.BoxGeometry(backT, backH, backW),
          matLeather,
        );
        backPanel.position.set(0, backH / 2, 0);
        backGroup.add(backPanel);
        const studR = 0.005;
        const studGeom = new THREE.SphereGeometry(studR, 8, 6);
        const STUD_COUNT = 9;
        for (let i = 0; i < STUD_COUNT; i++) {
          const t = i / (STUD_COUNT - 1);
          const studY = 0.04 + t * (backH - 0.08);
          for (const dz of [-backW / 2 + 0.012, backW / 2 - 0.012]) {
            const stud = new THREE.Mesh(studGeom, matStud);
            stud.position.set(backT / 2 + 0.003, studY, dz);
            backGroup.add(stud);
          }
        }
        backGroup.position.set(f.x1 + 0.04 + backT / 2, seatY, cz);
        // Tilt the top of the back slightly toward −x (away from desk).
        backGroup.rotation.z = 0.10;
        S.group.add(backGroup);

        // Cylinder pedestal from the spider base up to the seat underside.
        const pedR = 0.030;
        const pedH = (seatY - seatT) - baseT;
        const ped = new THREE.Mesh(
          new THREE.CylinderGeometry(pedR, pedR, pedH, 18),
          matBlackMet,
        );
        ped.position.set(cx, baseT + pedH / 2, cz);
        S.group.add(ped);

        // 5-arm spider base + caster wheel at each tip.
        const SPOKES = 5;
        const spokeLen = 0.25, spokeT = 0.026;
        const spokeGeom = new THREE.BoxGeometry(spokeLen, baseT, spokeT);
        const casterGeom = new THREE.SphereGeometry(casterR, 12, 8);
        for (let i = 0; i < SPOKES; i++) {
          const ang = (Math.PI / 2) + i * (Math.PI * 2 / SPOKES);
          const dx = Math.cos(ang), dz = Math.sin(ang);
          const spoke = new THREE.Mesh(spokeGeom, matBlackMet);
          spoke.position.set(cx + dx * spokeLen / 2, baseT / 2, cz + dz * spokeLen / 2);
          // +Y rotation in three.js sends local +X to (cos θ, 0, −sin θ);
          // so to point local +X at (cos ang, 0, sin ang) we set θ = −ang.
          spoke.rotation.y = -ang;
          S.group.add(spoke);
          const caster = new THREE.Mesh(casterGeom, matCaster);
          caster.position.set(cx + dx * spokeLen, casterR, cz + dz * spokeLen);
          S.group.add(caster);
        }
      }

      // pendant lights (4 emissive cylinder shades hanging from a wood cross)
      {
        const cx = 1.35, cz = 1.35, fY = 2.5, barL = 0.3, barT = 0.03;
        const sBotY = 2.1, sDia = 0.15, sH = 0.3, sOff = 0.1;
        box(barL, barT, barT, cx, fY - barT/2, cz, COL.pendantWood);
        box(barT, barT, barL, cx, fY - barT/2, cz, COL.pendantWood);
        // brass central hub where the two cross beams meet.
        {
          const matBrass = new THREE.MeshStandardMaterial({ color: 0xc7a347, metalness: 0.85, roughness: 0.35 });
          const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.045, 20), matBrass);
          hub.position.set(cx, fY - 0.0225, cz);
          S.group.add(hub);
        }
        // Linen-weave texture for fabric shades (woven warp/weft threads).
        const linenTex = (() => {
          const cvs = document.createElement('canvas');
          cvs.width = 256; cvs.height = 256;
          const ctx = cvs.getContext('2d');
          ctx.fillStyle = '#f0dfb8';
          ctx.fillRect(0, 0, 256, 256);
          let s = 17;
          const rnd = () => { s = (s * 9301 + 49297) % 233280; return s / 233280; };
          ctx.lineWidth = 1;
          for (let y = 0; y < 256; y += 2) {
            ctx.strokeStyle = `rgba(150,118,72,${0.10 + (y % 6 === 0 ? 0.06 : 0)})`;
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(256, y); ctx.stroke();
          }
          for (let x = 0; x < 256; x += 2) {
            ctx.strokeStyle = `rgba(150,118,72,${0.08 + (x % 6 === 0 ? 0.05 : 0)})`;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 256); ctx.stroke();
          }
          for (let i = 0; i < 700; i++) {
            ctx.fillStyle = `rgba(120,95,55,${rnd() * 0.10})`;
            ctx.fillRect(rnd() * 256, rnd() * 256, 1, 1);
          }
          const t = new THREE.CanvasTexture(cvs);
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(2, 3);
          t.anisotropy = renderer.capabilities.getMaxAnisotropy();
          t.minFilter = THREE.LinearMipmapLinearFilter;
          t.magFilter = THREE.LinearFilter;
          return t;
        })();
        const matShade = new THREE.MeshStandardMaterial({
          color: COL.pendantShade, map: linenTex,
          emissive: COL.pendantShade, emissiveMap: linenTex,
          emissiveIntensity: 0, roughness: 0.85,
          side: THREE.DoubleSide, // visible from inside (bulb side) too
        });
        const matBulb = new THREE.MeshStandardMaterial({
          color: 0xfff0d8, emissive: 0xffb16e, emissiveIntensity: 0, roughness: 1.0,
        });
        // Expose so the on/off "lights" toggle in the UI can mutate both.
        // Emissive values calibrated for WebGPU + AgX tone mapping (research
        // 2026-05-08): visible bulbs sit at 1.0–2.0, fabric shades at 0.3–0.6.
        // Higher numbers blow out to flat white before bloom even kicks in.
        S.lampMaterial   = matShade;
        S.bulbMaterial   = matBulb;
        S.lampOnIntensity = 0.4;
        S.bulbOnIntensity = 1.5;
        S.lampsOn        = false;
        // open-ended cylinder so the bulb is visible from below.
        const shadeGeom = new THREE.CylinderGeometry(sDia/2, sDia/2, sH, 20, 1, true);
        const bulbGeom  = new THREE.SphereGeometry(0.038, 16, 12);
        S.lampPointLights = [];
        for (const dx of [-sOff, sOff])
          for (const dz of [-sOff, sOff]) {
            const sh = new THREE.Mesh(shadeGeom, matShade);
            sh.position.set(cx + dx, sBotY + sH/2, cz + dz);
            S.group.add(sh);
            const bulb = new THREE.Mesh(bulbGeom, matBulb);
            bulb.position.set(cx + dx, sBotY + 0.05, cz + dz);
            S.group.add(bulb);
            // Real point light at each bulb. distance=0 = unbounded inverse-square
            // fall-off (correct for r155+ physical units). Colour 0xffb16e = real
            // 2700 K warm-white (sRGB). Intensity in candela; ~30 cd/bulb × 4 bulbs
            // ≈ 1500 lumens total — a small Japanese pendant cluster.
            const pl = new THREE.PointLight(0xffb16e, 0, 0, 2);
            pl.position.set(cx + dx, sBotY + 0.05, cz + dz);
            S.group.add(pl);
            S.lampPointLights.push(pl);
          }
        S.lampPointOnIntensity = 30;
      }

      // lighting — sunlight through window-wall (x=W) casting shadows.
      // Two sources working together (Phase 2a of cutting-edge plan):
      //   • DirectionalLight as the parallel sun at infinity — provides the
      //     hard cast shadow on the floor and a directional warm key.
      //   • RectAreaLight matching the sliding-window pane (1.19 m × 0.9 m)
      //     just outside x=W — soft area-light contribution that gives a
      //     window-shaped highlight on whatever the beam actually lands on
      //     and avoids the "single point of sun" feel.
      // Directional intensity is halved (1.6 → 0.8) so the total light isn't
      // doubled when the rect light is added.
      S.group.add(new THREE.AmbientLight(0xffffff, 0.25));
      const dir1 = new THREE.DirectionalLight(0xfff4e0, 0.8);
      dir1.position.set(6.5, 4.5, 1.35);
      dir1.target.position.set(1.0, 0.6, 1.35);
      dir1.castShadow = true;
      dir1.shadow.mapSize.set(4096, 4096);
      dir1.shadow.camera.left = -3;
      dir1.shadow.camera.right = 3;
      dir1.shadow.camera.top = 3;
      dir1.shadow.camera.bottom = -3;
      dir1.shadow.camera.near = 0.1;
      dir1.shadow.camera.far = 12;
      dir1.shadow.bias = -0.0005;
      dir1.shadow.normalBias = 0.02;
      dir1.shadow.radius = 4;            // narrower than the thinnest geometry so shadows don't bleed through bedposts/mullion
      S.group.add(dir1);
      S.group.add(dir1.target);
      // Window-shaped sunbeam — RectAreaLight matched to the sliding-window
      // pane (window hole spans x=RW, z=0.405..1.595, y=0.85..1.75 → 1.19 m
      // wide × 0.90 m tall). Positioned just OUTSIDE the wall and pointed
      // toward the room interior so its surface acts as if daylight is
      // streaming in through the glass. RectAreaLight in three.js does NOT
      // cast shadows — that's intentional: the DirectionalLight above is
      // what casts the floor shadow, the rect light is the area contribution.
      {
        const rectW = 1.19, rectH = 0.90;
        const rectCx = RW + 0.05;            // 5 cm outside the window plane
        const rectCy = (0.85 + 1.75) / 2;    // window vertical centre
        const rectCz = (0.405 + 1.595) / 2;  // window horizontal centre
        const sun = new THREE.RectAreaLight(0xfff4e0, 6.0, rectW, rectH);
        sun.position.set(rectCx, rectCy, rectCz);
        // RectAreaLight emits from its +z face by default. Aim its emission
        // direction toward the room interior centre.
        sun.lookAt(rectCx - 1, rectCy, rectCz);
        S.group.add(sun);
      }
      // Visible god-ray cone — soft additive light shaft so you SEE the
      // beam in the air, not just the patch on the floor. 4-sided cone
      // (square cross-section) roughly matches the window. Vertex-colour
      // alpha gradient peaks ~30% along the length and fades to 0 at the
      // window-plane base and at the apex, so it has no hard edges.
      {
        const BEAM_LEN = 3.0;
        const beamGeom = new THREE.ConeGeometry(0.75, BEAM_LEN, 4, 1, true);
        const posAttr = beamGeom.attributes.position;
        const cols = new Float32Array(posAttr.count * 4);
        for (let i = 0; i < posAttr.count; i++) {
          const y = posAttr.getY(i);
          const t = (y + BEAM_LEN / 2) / BEAM_LEN; // 0 at base → 1 at apex
          const peak = 0.30;
          const a = t < peak ? (t / peak) : Math.max(0, 1 - (t - peak) / (1 - peak));
          cols[i * 4 + 0] = 1;
          cols[i * 4 + 1] = 1;
          cols[i * 4 + 2] = 1;
          cols[i * 4 + 3] = a;
        }
        beamGeom.setAttribute('color', new THREE.BufferAttribute(cols, 4));
        const beamMat = new THREE.MeshBasicMaterial({
          color: 0xfff4d6,
          vertexColors: true,
          transparent: true,
          opacity: 0.18,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        const beam = new THREE.Mesh(beamGeom, beamMat);
        beam.castShadow = false;
        beam.receiveShadow = false;
        // Sun-ray direction: dir1 sits at (6.5, 4.5, 1.35) aimed at
        // (1.0, 0.6, 1.35) so rays travel (−5.5, −3.9, 0).
        const sunDir = new THREE.Vector3(1.0 - 6.5, 0.6 - 4.5, 0).normalize();
        const baseCentre = new THREE.Vector3(RW + 0.001, 1.30, 1.00);
        const centre = baseCentre.clone().addScaledVector(sunDir, BEAM_LEN / 2);
        beam.position.copy(centre);
        beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), sunDir);
        S.group.add(beam);
      }
      // Fill light from the cabinet-wall side — fills the dark corners softly
      // without doubling the cast shadow. Originally a cool 0xc8d4e8 sky-tint,
      // but that shifted the window-wall (the only face it directly hits) off
      // the #afa299 paint colour into a noticeably cooler shade. Now using a
      // near-neutral very-slightly-warm fill so all four walls render at the
      // paint colour while the fill still does its corner-lifting job.
      const fill = new THREE.DirectionalLight(0xede8df, 0.22);
      fill.position.set(-2, 3, 1.35);
      fill.target.position.set(1.35, 0.5, 1.35);
      fill.castShadow = false;
      S.group.add(fill);
      S.group.add(fill.target);
      // Enable cast/receive shadow on every mesh in the room.
      // Glass (transmission > 0) skips casting so it doesn't drop a hard
      // shadow as if it were opaque. Backdrop planes (MeshBasicMaterial) skip
      // both since they're outside the room and would otherwise block sun.
      S.group.traverse(obj => {
        if (!obj.isMesh) return;
        const isGlass = obj.material && obj.material.transmission > 0;
        const isBackdrop = obj.material && obj.material.isMeshBasicMaterial;
        obj.castShadow = !isGlass && !isBackdrop;
        obj.receiveShadow = !isBackdrop;
      });
      // Walls + ceiling do NOT participate in shadowing AT ALL.
      // They neither cast shadows nor receive them. The walls are very thin
      // (0.02 m) and were otherwise picking up shadows of interior
      // furniture and projecting them onto their outside faces — i.e. the
      // room would look like an X-ray box from outside. Floor still
      // receives shadows so the sun beam still lands on it inside.
      for (const m of [wA, wC, ceil, wB, wD]) {
        m.castShadow = false;
        m.receiveShadow = false;
      }
    }
  });

  // ---------- OrbitControls (minimal inline) ----------
  // Two-input orbit controls — drag/one-finger to look around, pinch/wheel to
  // zoom. No pan, no keyboard. Designed to work the same on Mac trackpads,
  // mice, iPhone (375 px) up through iPad Pro. Damped catch-up for a smooth
  // feel without making input feel laggy.
  class OrbitControls {
    constructor(cam, dom) {
      this.cam = cam;
      this.dom = dom;
      this.target      = new THREE.Vector3(1.8, 1.2, 2.7);
      this._targetGoal = new THREE.Vector3();
      this.sph         = new THREE.Spherical();
      this._sphGoal    = new THREE.Spherical();
      this._updateSph();
      this._sphGoal.copy(this.sph);
      this._targetGoal.copy(this.target);
      this.minRadius = 0.5;
      this.maxRadius = 40;
      this.damping   = 0.22;
      this.enabled   = true;

      this._down = false;
      this._last = { x: 0, y: 0 };
      this._dragMoved = false;
      this._lastUp = 0;

      this._touchTracking = new Map();
      this._lastPinchDist = 0;

      dom.addEventListener('mousedown',  e => this._onDown(e));
      window.addEventListener('mousemove', e => this._onMove(e));
      window.addEventListener('mouseup',   e => this._onUp(e));
      dom.addEventListener('wheel',       e => this._onWheel(e), { passive: false });
      dom.addEventListener('contextmenu', e => e.preventDefault());
      dom.addEventListener('touchstart',  e => this._onTouchStart(e), { passive: false });
      dom.addEventListener('touchmove',   e => this._onTouchMove(e),  { passive: false });
      dom.addEventListener('touchend',    e => this._onTouchEnd(e));
      dom.addEventListener('touchcancel', e => this._onTouchEnd(e));
    }

    _updateSph() {
      const off = new THREE.Vector3().copy(this.cam.position).sub(this.target);
      this.sph.setFromVector3(off);
    }

    setFrom(pos, target) {
      this.target.copy(target);
      this._targetGoal.copy(target);
      this.cam.position.copy(pos);
      this._updateSph();
      this._sphGoal.copy(this.sph);
      this.update();
    }

    // Like setFrom, but only mutates the GOAL — leaves the current state
    // alone so the per-frame damping smoothly lerps the camera toward the
    // new pose over ~half a second. Used by corner-hotspot clicks.
    flyTo(pos, target) {
      this._targetGoal.copy(target);
      const off = new THREE.Vector3().copy(pos).sub(target);
      this._sphGoal.setFromVector3(off);
    }

    _orbit(dx, dy) {
      this._sphGoal.theta -= dx * 0.005;
      this._sphGoal.phi   -= dy * 0.005;
      this._sphGoal.phi = Math.max(0.05, Math.min(Math.PI - 0.05, this._sphGoal.phi));
    }
    _zoom(factor) {
      this._sphGoal.radius = Math.max(this.minRadius, Math.min(this.maxRadius, this._sphGoal.radius * factor));
    }

    _onDown(e) {
      if (!this.enabled) return;
      this._down = true;
      this._dragMoved = false;
      this._last.x = e.clientX; this._last.y = e.clientY;
    }
    _onMove(e) {
      if (!this._down) return;
      const dx = e.clientX - this._last.x;
      const dy = e.clientY - this._last.y;
      if (Math.abs(dx) + Math.abs(dy) > 2) this._dragMoved = true;
      this._last.x = e.clientX; this._last.y = e.clientY;
      this._orbit(dx, dy);
    }
    _onUp() {
      this._down = false;
      if (this._dragMoved) this._lastUp = performance.now();
    }

    _onWheel(e) {
      if (!this.enabled) return;
      e.preventDefault();
      // Mac/Windows trackpad pinch arrives as wheel with ctrlKey=true. Always
      // honour it — even right after a drag — so pinch-zoom feels live.
      const isPinch = e.ctrlKey;
      if (!isPinch) {
        if (this._down) return;
        if (this._lastUp && (performance.now() - this._lastUp) < 150) return;
      }
      const sens = isPinch ? 0.02 : 0.01;
      this._zoom(Math.pow(0.95, -e.deltaY * sens));
    }

    _onTouchStart(e) {
      if (!this.enabled) return;
      e.preventDefault();
      for (const t of e.changedTouches) this._touchTracking.set(t.identifier, { x: t.clientX, y: t.clientY });
      if (e.touches.length === 2) {
        const a = e.touches[0], b = e.touches[1];
        this._lastPinchDist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
      }
    }
    _onTouchMove(e) {
      if (!this.enabled) return;
      e.preventDefault();
      if (e.touches.length === 1) {
        const t = e.touches[0];
        const last = this._touchTracking.get(t.identifier);
        if (!last) return;
        this._orbit(t.clientX - last.x, t.clientY - last.y);
        last.x = t.clientX; last.y = t.clientY;
      } else if (e.touches.length === 2) {
        const a = e.touches[0], b = e.touches[1];
        const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
        if (this._lastPinchDist > 0) this._zoom(this._lastPinchDist / dist);
        this._lastPinchDist = dist;
      }
    }
    _onTouchEnd(e) {
      for (const t of e.changedTouches) this._touchTracking.delete(t.identifier);
      if (e.touches.length < 2) this._lastPinchDist = 0;
    }

    update() {
      const k = this.damping;
      let dT = this._sphGoal.theta - this.sph.theta;
      while (dT >  Math.PI) dT -= 2 * Math.PI;
      while (dT < -Math.PI) dT += 2 * Math.PI;
      this.sph.theta  += dT * k;
      this.sph.phi    += (this._sphGoal.phi    - this.sph.phi)    * k;
      this.sph.radius += (this._sphGoal.radius - this.sph.radius) * k;
      this.target.lerp(this._targetGoal, k);
      const off = new THREE.Vector3().setFromSpherical(this.sph);
      this.cam.position.copy(this.target).add(off);
      this.cam.lookAt(this.target);
    }
  }
  const orbit = new OrbitControls(camera, renderer.domElement);

  // ---------- Corner-jump hotspots (room-1 only) ----------
  // Four floating dots, one in each corner of room-1 at eye level. Click a
  // dot → camera flies to that corner, looking at the room centre. Layer is
  // hidden unless room-1 is the active scene; an individual dot is hidden
  // when the camera is < 0.7 m from its target so the dot you just clicked
  // doesn't sit in your face.
  const cornerHotspotsLayer = document.getElementById('corner-hotspots-layer');
  const ROOM1_TARGET = new THREE.Vector3(1.35, 1.0, 1.35);
  const ROOM1_CORNERS = [
    { id: 'corner-cabinet-entrance', dotWorld: new THREE.Vector3(0.05, 1.5, 0.05), camPos: new THREE.Vector3(0.30, 1.55, 0.30) },
    { id: 'corner-cabinet-window',   dotWorld: new THREE.Vector3(2.65, 1.5, 0.05), camPos: new THREE.Vector3(2.40, 1.55, 0.30) },
    { id: 'corner-ac-window',        dotWorld: new THREE.Vector3(2.65, 1.5, 2.65), camPos: new THREE.Vector3(2.40, 1.55, 2.40) },
    { id: 'corner-ac-entrance',      dotWorld: new THREE.Vector3(0.05, 1.5, 2.65), camPos: new THREE.Vector3(0.30, 1.55, 2.40) },
  ];
  const cornerHotspots = [];
  for (const c of ROOM1_CORNERS) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'corner-hotspot';
    btn.dataset.id = c.id;
    btn.setAttribute('aria-label', `Move camera to ${c.id}`);
    btn.innerHTML = '<span class="corner-hotspot__dot" aria-hidden="true"></span>';
    btn.addEventListener('click', () => orbit.flyTo(c.camPos, ROOM1_TARGET));
    cornerHotspotsLayer.appendChild(btn);
    cornerHotspots.push({ btn, world: c.dotWorld, camPos: c.camPos });
  }
  const _cornerProjV = new THREE.Vector3();
  function updateCornerHotspots() {
    if (cornerHotspotsLayer.hidden) return;
    for (const h of cornerHotspots) {
      // Hide a dot if you're already at (or very close to) its corner.
      if (camera.position.distanceTo(h.camPos) < 0.7) {
        h.btn.style.visibility = 'hidden';
        continue;
      }
      _cornerProjV.copy(h.world).project(camera);
      const visible = _cornerProjV.z < 1;
      if (!visible) {
        h.btn.style.visibility = 'hidden';
        continue;
      }
      const x = (_cornerProjV.x * 0.5 + 0.5) * window.innerWidth;
      const y = (-_cornerProjV.y * 0.5 + 0.5) * window.innerHeight;
      h.btn.style.transform = `translate(${x - 22}px, ${y - 22}px)`;
      h.btn.style.visibility = '';
    }
  }

  // ---------- Room label detection ----------
  function updateRoomLabel() {
    const S = scenes[activeScene];
    if (!S) { roomLabel.textContent = '—'; return; }
    const p = orbit.target;
    // Sort smallest AABB first
    const sorted = S.rooms.slice().sort((a, b) =>
      ((a.x2 - a.x1) * (a.z2 - a.z1)) - ((b.x2 - b.x1) * (b.z2 - b.z1))
    );
    for (const r of sorted) {
      const inXZ = p.x >= r.x1 && p.x <= r.x2 && p.z >= r.z1 && p.z <= r.z2;
      const inY  = (r.y1 == null) || (p.y >= r.y1 && p.y <= r.y2);
      if (inXZ && inY) {
        roomLabel.textContent = r.name;
        return;
      }
    }
    roomLabel.textContent = '—';
  }

  // ---------- QA view helpers ----------
  // Per-room inspection: top, side faces, isometric, free orbit. Hides geometry
  // above the room's ceiling for top/iso so the floor above doesn't block view.
  function getRoomBbox(S, name) {
    if (!S || !S.rooms) return null;
    const matches = S.rooms.filter(r => r.name === name);
    if (matches.length === 0) return null;
    let x1 = Infinity, x2 = -Infinity, z1 = Infinity, z2 = -Infinity;
    let y1 = Infinity, y2 = -Infinity;
    for (const r of matches) {
      x1 = Math.min(x1, r.x1); x2 = Math.max(x2, r.x2);
      z1 = Math.min(z1, r.z1); z2 = Math.max(z2, r.z2);
      if (r.y1 != null) { y1 = Math.min(y1, r.y1); y2 = Math.max(y2, r.y2); }
    }
    if (y1 === Infinity) { y1 = 0; y2 = 2.5; }
    return { name, x1, x2, z1, z2, y1, y2 };
  }
  // Returns a bbox spanning a whole floor ('1f' / '2f') or a single room.
  // Floor bboxes aggregate every room whose y1 is in the floor's range.
  function getZoneBbox(S, id) {
    if (id === '1f' || id === '2f') {
      const yLo = (id === '1f') ? 0 : 2.5;
      const yHi = (id === '1f') ? 2.5 : 5.0;
      let x1 = Infinity, x2 = -Infinity, z1 = Infinity, z2 = -Infinity;
      for (const r of (S && S.rooms) || []) {
        if (r.y1 == null) continue;
        if (r.y1 >= yLo && r.y1 < yHi) {
          x1 = Math.min(x1, r.x1); x2 = Math.max(x2, r.x2);
          z1 = Math.min(z1, r.z1); z2 = Math.max(z2, r.z2);
        }
      }
      if (x1 === Infinity) return null;
      return { name: id.toUpperCase(), x1, x2, z1, z2, y1: yLo, y2: yHi };
    }
    return getRoomBbox(S, id);
  }
  // Two independent cull tracks: _qaCulled = view-mode cull (top, iso angle),
  // _qaIsolated = zone-isolation cull (1F, kitchen, etc). _qaOrigVisible holds
  // the mesh's original visibility, set on the first cull and restored only
  // when BOTH tracks are clear.
  function clearQACull(S) {
    if (!S || !S.group) return;
    S.group.traverse(obj => {
      if (!obj.isMesh) return;
      if (obj.userData._qaCulled || obj.userData._qaIsolated) {
        obj.visible = obj.userData._qaOrigVisible;
        delete obj.userData._qaCulled;
        delete obj.userData._qaIsolated;
        delete obj.userData._qaOrigVisible;
      }
    });
  }
  function clearViewCull(S) {
    // Clear top/iso angle cull only — leave zone isolation in place.
    if (!S || !S.group) return;
    S.group.traverse(obj => {
      if (!obj.isMesh) return;
      if (obj.userData._qaCulled) {
        delete obj.userData._qaCulled;
        if (!obj.userData._qaIsolated) {
          obj.visible = obj.userData._qaOrigVisible;
          delete obj.userData._qaOrigVisible;
        }
      }
    });
  }
  function cullAboveY(S, cullY) {
    S.group.traverse(obj => {
      if (!obj.isMesh) return;
      const h = obj.geometry?.parameters?.height ?? 0;
      const bottomY = obj.position.y - h / 2;
      if (bottomY >= cullY - 0.001) {
        if (obj.userData._qaOrigVisible === undefined) {
          obj.userData._qaOrigVisible = obj.visible;
        }
        obj.userData._qaCulled = true;
        obj.visible = false;
      }
    });
  }
  // Hide every mesh whose center sits outside the bbox. Side pads keep
  // boundary walls visible. Upper Y pad is NEGATIVE so the floor slab
  // sitting at bbox.y2 (which is the next floor's underside) is hidden —
  // i.e. when isolating 1F the 2F floor doesn't cover the view from above.
  function isolateZone(S, bbox) {
    const PAD = 0.15, UPPER_Y_PAD = -0.05;
    S.group.traverse(obj => {
      if (!obj.isMesh) return;
      const p = obj.position;
      const inX = p.x >= bbox.x1 - PAD && p.x <= bbox.x2 + PAD;
      const inZ = p.z >= bbox.z1 - PAD && p.z <= bbox.z2 + PAD;
      const inY = p.y >= bbox.y1 - PAD && p.y <= bbox.y2 + UPPER_Y_PAD;
      if (!(inX && inZ && inY)) {
        if (obj.userData._qaOrigVisible === undefined) {
          obj.userData._qaOrigVisible = obj.visible;
        }
        obj.userData._qaIsolated = true;
        obj.visible = false;
      }
    });
  }
  function applyQAView(S, room, mode) {
    clearViewCull(S);
    const cx = (room.x1 + room.x2) / 2;
    const cz = (room.z1 + room.z2) / 2;
    const cy = (room.y1 + room.y2) / 2;
    const diag = Math.hypot(room.x2 - room.x1, room.y2 - room.y1, room.z2 - room.z1);
    let pos, tgt;
    switch (mode) {
      case 'top':
        pos = [cx, room.y2 + diag * 1.2, cz];
        tgt = [cx, cy, cz];
        cullAboveY(S, room.y2);
        break;
      case 'n':
        pos = [cx, cy, room.z1 + 0.3]; tgt = [cx, cy, room.z2]; break;
      case 's':
        pos = [cx, cy, room.z2 - 0.3]; tgt = [cx, cy, room.z1]; break;
      case 'e':
        pos = [room.x2 - 0.3, cy, cz]; tgt = [room.x1, cy, cz]; break;
      case 'w':
        pos = [room.x1 + 0.3, cy, cz]; tgt = [room.x2, cy, cz]; break;
      case 'iso':
        pos = [room.x2 + diag * 0.3, room.y2 + diag * 0.6, room.z1 - diag * 0.3];
        tgt = [cx, cy, cz];
        cullAboveY(S, room.y2);
        break;
      default: return;
    }
    orbit.setFrom(
      new THREE.Vector3().fromArray(pos),
      new THREE.Vector3().fromArray(tgt)
    );
  }

  // ---------- Scene switching ----------
  const viewChipsEl = document.getElementById('view-chips');
  function populateViewChips(S) {
    viewChipsEl.innerHTML = '';
    clearQACull(S);
    if (!S || !S.viewpoints || S.viewpoints.length === 0) return;

    const parents = S.viewpoints.filter(v => !v.parent);
    const childrenByParent = {};
    for (const v of S.viewpoints) {
      if (v.parent) {
        (childrenByParent[v.parent] = childrenByParent[v.parent] || []).push(v);
      }
    }

    const topRow = document.createElement('div');
    topRow.className = 'chip-row';
    const subRow = document.createElement('div');
    subRow.className = 'chip-row';
    subRow.style.display = 'none';
    const qaRow = document.createElement('div');
    qaRow.className = 'chip-row qa-row';
    qaRow.style.display = 'none';

    let activeChip = null;
    let activeQABtn = null;
    let expandedParentId = null;

    function showQARow(room, originalViewpoint) {
      qaRow.innerHTML = '';
      qaRow.style.display = '';
      activeQABtn = null;
      const modes = [
        { id: 'top',   label: 'top'   },
        { id: 'n',     label: 'N'     },
        { id: 's',     label: 'S'     },
        { id: 'e',     label: 'E'     },
        { id: 'w',     label: 'W'     },
        { id: 'iso',   label: 'iso'   },
        { id: 'orbit', label: 'orbit' },
      ];
      for (const m of modes) {
        const btn = document.createElement('div');
        btn.className = 'qa-view';
        btn.textContent = m.label;
        btn.addEventListener('click', () => {
          if (m.id === 'orbit') {
            clearViewCull(S);
            orbit.setFrom(
              new THREE.Vector3().fromArray(originalViewpoint.pos),
              new THREE.Vector3().fromArray(originalViewpoint.tgt)
            );
          } else {
            applyQAView(S, room, m.id);
          }
          if (activeQABtn) activeQABtn.classList.remove('active');
          btn.classList.add('active');
          activeQABtn = btn;
        });
        qaRow.appendChild(btn);
      }
    }

    function makeChip(v) {
      const chip = document.createElement('div');
      chip.className = 'view-chip';
      chip.textContent = v.label;
      chip.addEventListener('click', () => {
        clearQACull(S);
        orbit.setFrom(
          new THREE.Vector3().fromArray(v.pos),
          new THREE.Vector3().fromArray(v.tgt)
        );
        if (activeChip) activeChip.classList.remove('active');
        chip.classList.add('active');
        activeChip = chip;

        const room = getZoneBbox(S, v.id);
        if (room) {
          isolateZone(S, room);
          // Floor-level zones default to the open iso (top-down) view.
          if (v.id === '1f' || v.id === '2f') {
            applyQAView(S, room, 'iso');
            // Hide the floor's own ceiling so the top-down view isn't blocked.
            S.group.traverse(obj => {
              if (obj.isMesh && obj.userData._isCeiling && obj.userData._ceilingFloor === v.id) {
                if (obj.userData._qaOrigVisible === undefined) obj.userData._qaOrigVisible = obj.visible;
                obj.userData._qaIsolated = true;
                obj.visible = false;
              }
            });
          }
          showQARow(room, v);
        } else {
          qaRow.style.display = 'none';
          qaRow.innerHTML = '';
          activeQABtn = null;
        }

        if (!v.parent) {
          const kids = childrenByParent[v.id] || [];
          if (kids.length > 0) {
            expandedParentId = v.id;
            renderSubRow(v.id);
            subRow.style.display = '';
          } else {
            expandedParentId = null;
            subRow.style.display = 'none';
          }
        }
      });
      return chip;
    }

    function renderSubRow(parentId) {
      subRow.innerHTML = '';
      for (const v of (childrenByParent[parentId] || [])) {
        subRow.appendChild(makeChip(v));
      }
    }

    for (const v of parents) topRow.appendChild(makeChip(v));

    viewChipsEl.appendChild(topRow);
    viewChipsEl.appendChild(subRow);
    // Angle row (top/N/S/E/W/iso/orbit) intentionally not appended —
    // dropped to reduce UI complexity. Drag-orbit covers the use case.
  }

  // Briefly fade in the top-centre control hint pill, then fade it out
  // again. Called on every scene entry. Cancelable so a fast scene-switch
  // burst doesn't leave a half-faded element on screen.
  const entryHintEl = document.getElementById('entry-hint');
  let _entryHintTimer = 0;
  function showEntryHint() {
    if (!entryHintEl) return;
    clearTimeout(_entryHintTimer);
    entryHintEl.classList.remove('show');
    // Force a reflow so the next add re-runs the transition from opacity 0.
    void entryHintEl.offsetWidth;
    entryHintEl.classList.add('show');
    _entryHintTimer = setTimeout(() => entryHintEl.classList.remove('show'), 4500);
  }

  function switchScene(id) {
    const S = scenes[id];
    if (!S) return;
    for (const k of Object.keys(scenes)) scenes[k].group.visible = (k === id);
    activeScene = id;
    const targetFov = S.fov ?? 60;
    if (camera.fov !== targetFov) {
      camera.fov = targetFov;
      camera.updateProjectionMatrix();
    }
    orbit.setFrom(S.orbitPos, S.orbitTarget);
    // Room-1 uses a Street View photo of the actual location as the
    // through-window backdrop. Other scenes use their solid bg colour.
    if (id === 'room-1' && _room1BgTex) {
      scene.background = _room1BgTex;
    } else {
      scene.background = new THREE.Color(S.bg);
    }
    // ACES tone mapping is set globally at renderer construction.
    // The procedural PMREM env map is shared across all scenes so PBR materials
    // get realistic indirect light + reflections everywhere (was room-1-only before).
    // HDRI scene environment: assigned globally once HDRLoader resolves;
    // until then use the procedural fallback so the very first render is lit.
    if (!scene.environment) scene.environment = _envLoaded ? _room1EnvMap : buildRoom1EnvMap();
    if (id === 'room-1') {
      // room-1 cinematic sandbox uses AgX (Blender 4+ default) — preserves
      // hue at the highlight roll-off where the warm bulbs meet the shade,
      // unlike ACES which crushes oranges → yellow.
      renderer.toneMapping = THREE.AgXToneMapping;
      renderer.toneMappingExposure = 0.9;
    } else {
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;
    }
    for (const chip of document.querySelectorAll('.chip[data-scene]')) {
      chip.classList.toggle('active', chip.dataset.scene === id);
    }
    // Corner-jump hotspots are room-1 only.
    cornerHotspotsLayer.hidden = (id !== 'room-1');
    // Briefly surface the camera controls so the user learns them on entry.
    showEntryHint();
    // Show the "Lights" toggle only when room-1 is active.
    const lightsBtn = document.getElementById('lights-btn');
    const lightsDivider = document.getElementById('lights-divider');
    const showLights = (id === 'room-1');
    lightsBtn.hidden = !showLights;
    lightsDivider.hidden = !showLights;
    if (showLights) {
      const on = S.lampsOn !== false;
      lightsBtn.classList.toggle('active', on);
      lightsBtn.setAttribute('aria-pressed', String(on));
      if (S.lampMaterial) S.lampMaterial.emissiveIntensity = on ? S.lampOnIntensity : 0;
      if (S.bulbMaterial) S.bulbMaterial.emissiveIntensity = on ? S.bulbOnIntensity : 0;
      if (S.lampPointLights) for (const pl of S.lampPointLights) pl.intensity = on ? S.lampPointOnIntensity : 0;
      if (_room1Bloom) _room1Bloom.enabled = on;
    }
    populateViewChips(S);
  }
  for (const chip of document.querySelectorAll('.chip[data-scene]')) {
    chip.addEventListener('click', () => switchScene(chip.dataset.scene));
  }
  // Lights toggle — flips pendant emissive on/off and disables/enables bloom.
  document.getElementById('lights-btn').addEventListener('click', () => {
    const S = scenes['room-1'];
    if (!S || !S.lampMaterial) return;
    S.lampsOn = !S.lampsOn;
    S.lampMaterial.emissiveIntensity = S.lampsOn ? S.lampOnIntensity : 0;
    if (S.bulbMaterial) S.bulbMaterial.emissiveIntensity = S.lampsOn ? S.bulbOnIntensity : 0;
    if (S.lampPointLights) for (const pl of S.lampPointLights) pl.intensity = S.lampsOn ? S.lampPointOnIntensity : 0;
    if (_room1Bloom) _room1Bloom.enabled = S.lampsOn;
    const btn = document.getElementById('lights-btn');
    btn.classList.toggle('active', S.lampsOn);
    btn.setAttribute('aria-pressed', String(S.lampsOn));
  });

  // ---------- Time of day (mutates exterior scene's sun/sky/fill + bg) ----------
  const TOD_PRESETS = {
    day: {
      sunColor: 0xfff2dc, sunIntensity: 1.0,  sunPos: [-8, 14, 10],
      skyTop:   0xcce0ff, skyBot:       0x444438, skyIntensity: 0.5,
      fillIntensity: 0.15, bg: 0xbbccd8,
    },
    evening: {
      sunColor: 0xff9d5e, sunIntensity: 0.7,  sunPos: [-14, 4, 6],
      skyTop:   0xff8866, skyBot:       0x402015, skyIntensity: 0.55,
      fillIntensity: 0.18, bg: 0xe6a07a,
    },
    night: {
      sunColor: 0x6280b0, sunIntensity: 0.12, sunPos: [-6, 10, 8],
      skyTop:   0x303860, skyBot:       0x141622, skyIntensity: 0.45,
      fillIntensity: 0.08, bg: 0x161826,
    },
  };
  function applyTod(todId) {
    const p = TOD_PRESETS[todId];
    if (!p) return;
    const ext = scenes['exterior'];
    if (ext && ext.sun) {
      ext.sun.color.setHex(p.sunColor);
      ext.sun.intensity = p.sunIntensity;
      ext.sun.position.fromArray(p.sunPos);
    }
    if (ext && ext.sky) {
      ext.sky.color.setHex(p.skyTop);
      ext.sky.groundColor.setHex(p.skyBot);
      ext.sky.intensity = p.skyIntensity;
    }
    if (ext && ext.fill) {
      ext.fill.intensity = p.fillIntensity;
    }
    if (ext) ext.bg = p.bg;
    if (activeScene === 'exterior') {
      scene.background = new THREE.Color(p.bg);
    }
    for (const chip of document.querySelectorAll('.tod-chip')) {
      chip.classList.toggle('active', chip.dataset.tod === todId);
    }
  }
  for (const chip of document.querySelectorAll('.tod-chip')) {
    chip.addEventListener('click', () => applyTod(chip.dataset.tod));
  }

  switchScene('exterior');

  // ---------- Animation loop ----------
  function animate() {
    orbit.update();
    updateRoomLabel();
    updateCornerHotspots();
    renderer.render(scene, camera);
  }
  renderer.setAnimationLoop(animate);
})();

/* ============================================================
   Glass-dock UI wiring (iOS HIG / Liquid Glass)
   - Scene segmented control lives in the dock; .seg.chip elements
     have data-scene, so the existing scene-switching JS picks them up.
   - Views button opens a popover that hosts #view-chips. The existing
     populateViewChips fills it. Button + divider auto-hide when the
     active scene has no viewpoints, so the dock collapses cleanly.
   - Popover stays open while the user explores; dismissed via outside
     click, Escape, or tapping Views again.
   ============================================================ */
(function () {
  'use strict';
  const viewsBtn     = document.getElementById('views-btn');
  const viewsPopover = document.getElementById('views-popover');
  const viewChips    = document.getElementById('view-chips');
  const dockDivider  = document.querySelector('.dock-divider');

  function setExpanded(btn, expanded) {
    btn.setAttribute('aria-expanded', expanded ? 'true' : 'false');
  }
  function open(btn, pop)  { pop.hidden = false; setExpanded(btn, true); }
  function close(btn, pop) { pop.hidden = true;  setExpanded(btn, false); }

  function syncViewsBtn() {
    const hasViews = viewChips.querySelector('.view-chip') !== null;
    viewsBtn.style.display    = hasViews ? '' : 'none';
    dockDivider.style.display = hasViews ? '' : 'none';
    if (!hasViews) close(viewsBtn, viewsPopover);
  }
  new MutationObserver(syncViewsBtn).observe(viewChips, { childList: true, subtree: true });
  syncViewsBtn();

  viewsBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (viewsPopover.hidden) open(viewsBtn, viewsPopover);
    else close(viewsBtn, viewsPopover);
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#views-btn, #views-popover')) {
      close(viewsBtn, viewsPopover);
    }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close(viewsBtn, viewsPopover);
  });
})();
</script>
</body>
</html>
