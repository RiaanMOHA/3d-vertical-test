<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ozu-test — 3D projects</title>
<style>
  /* === Liquid Glass tokens (iOS 26 / visionOS 26) ===
     Tuned for WCAG AA: white text on --glass-bg yields ≥4.5:1 over
     bright scenes (exterior day) and ≥7:1 over dark scenes (interior). */
  :root {
    --glass-bg: rgba(28,28,30,0.78);
    --glass-bg-hover: rgba(44,44,46,0.85);
    --glass-bg-prominent: rgba(255,255,255,0.95);
    --glass-stroke: rgba(255,255,255,0.16);
    --glass-stroke-prominent: rgba(255,255,255,0.65);
    --glass-blur: none;
    --glass-highlight: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 38%);
    --glass-inner-shadow: inset 0 -1px 0 rgba(0,0,0,0.18);
    --glass-elevation: 0 8px 24px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.12);
    --text-on-glass: #fff;
    --text-on-prominent: #111;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; color: #fff; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  /* Photographic vignette overlay — only active for the room-1 sandbox.
     Soft radial darkening at the corners gives the render a cinematic
     "viewed through a lens" feel without touching the EffectComposer. */
  #app::after {
    content: '';
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.45) 100%);
    opacity: 0;
    transition: opacity 200ms ease;
  }
  #app.vignette::after { opacity: 1; }
  .ui { position: absolute; pointer-events: none; user-select: none; font-size: 13px; letter-spacing: 0.02em; }

  /* === Hide legacy chip wrappers — JS still uses them for state === */
  #chips, #tod-chips, #project-badge, #hints, #room-label { display: none !important; }

  /* === Top-leading: glass back button (icon-only, 44pt) === */
  #back-link {
    position: absolute;
    top: calc(14px + var(--safe-top));
    left: calc(14px + var(--safe-left));
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 999px;
    background: var(--glass-bg);
    background-image: var(--glass-highlight);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-inner-shadow), var(--glass-elevation);
    color: var(--text-on-glass);
    text-decoration: none;
    font-size: 18px; line-height: 1; font-weight: 500;
    pointer-events: auto;
    transition: background 0.18s ease, transform 0.12s ease;
  }
  #back-link:hover { background: var(--glass-bg-hover); }
  #back-link:active { transform: scale(0.96); }

  /* === Bottom-center dock: glass capsule hosting scene segments + views === */
  #dock {
    position: absolute;
    left: 50%;
    bottom: calc(20px + var(--safe-bottom));
    transform: translateX(-50%);
    display: inline-flex; align-items: center;
    height: 56px; padding: 6px;
    border-radius: 999px;
    background: var(--glass-bg);
    background-image: var(--glass-highlight);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-inner-shadow), var(--glass-elevation);
    pointer-events: auto;
    max-width: calc(100vw - 28px - var(--safe-left) - var(--safe-right));
  }
  .dock-divider {
    width: 1px; align-self: stretch; margin: 6px 6px;
    background: rgba(255,255,255,0.16);
    border-radius: 1px;
  }

  /* === Scene segmented control inside the dock === */
  #scene-segment {
    display: inline-flex; gap: 2px;
    padding: 2px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
  }
  #scene-segment .seg {
    pointer-events: auto;
    height: 40px; padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-on-glass);
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer; white-space: nowrap;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
  }
  #scene-segment .seg:hover { background: var(--glass-bg-hover); }
  #scene-segment .seg:active { transform: scale(0.96); }
  #scene-segment .seg.active {
    background: var(--glass-bg-prominent);
    border-color: var(--glass-stroke-prominent);
    color: var(--text-on-prominent);
  }

  /* === Direct dock buttons (Views, Lights, any future control) ===
     Targets every <button> placed directly inside #dock so new controls
     inherit the iOS Liquid Glass pill styling without a CSS edit. */
  #dock > button {
    pointer-events: auto;
    height: 40px; padding: 0 14px;
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-on-glass);
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer; white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
  }
  #dock > button:hover { background: var(--glass-bg-hover); }
  #dock > button:active { transform: scale(0.96); }
  #dock > button .caret { font-size: 11px; opacity: 0.75; }
  #dock > button.active {
    background: var(--glass-bg-prominent);
    border-color: var(--glass-stroke-prominent);
    color: var(--text-on-prominent);
  }
  /* Honour the HTML hidden attribute — without this, our display:inline-flex
     above wins over the browser default and the button stays visible even
     when JS marks it hidden. Generic so any future dock button benefits. */
  #dock > button[hidden] { display: none; }

  /* === Popovers — visually distinct from the dock === */
  .popover {
    position: absolute;
    z-index: 50;
    padding: 8px;
    border-radius: 14px;
    background: #2c2c2e;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    pointer-events: auto;
    min-width: 180px;
  }
  .popover[hidden] { display: none; }
  #views-popover {
    bottom: calc(20px + var(--safe-bottom) + 56px + 32px);
    left: 50%;
    transform: translateX(-50%);
    max-width: 360px;
    width: max-content;
    max-height: calc(100vh - var(--safe-top) - var(--safe-bottom) - 20px - 56px - 32px - 24px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /* === Views popover hosts #view-chips (existing JS populates it) === */
  #views-popover #view-chips {
    position: static;
    top: auto; left: auto; transform: none;
    display: flex; flex-direction: column; gap: 6px;
    align-items: stretch;
    pointer-events: auto;
  }
  #views-popover .chip-row {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  .view-chip {
    pointer-events: auto;
    height: 32px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-stroke);
    color: var(--text-on-glass);
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer; white-space: nowrap;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    transition: background 0.18s ease, transform 0.12s ease;
  }
  .view-chip:hover { background: rgba(255,255,255,0.16); }
  .view-chip:active { transform: scale(0.96); }
  .view-chip.active {
    background: var(--glass-bg-prominent);
    border-color: var(--glass-stroke-prominent);
    color: var(--text-on-prominent);
  }
  .qa-view {
    pointer-events: auto;
    height: 28px; padding: 0 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-stroke);
    color: var(--text-on-glass);
    font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .qa-view:hover { background: rgba(255,255,255,0.14); }
  .qa-view.active {
    background: var(--glass-bg-prominent);
    color: var(--text-on-prominent);
    border-color: var(--glass-stroke-prominent);
  }

  kbd { display: inline-block; padding: 1px 6px; background: rgba(255,255,255,0.15); border-radius: 3px; font-family: inherit; font-size: 12px; }

  /* === Responsive breakpoints === */
  @media (max-width: 480px) {
    #dock { height: 52px; padding: 5px; }
    #scene-segment .seg { height: 38px; padding: 0 11px; font-size: 13px; }
    #dock > button { height: 38px; padding: 0 11px; font-size: 13px; }
    #back-link { width: 40px; height: 40px; font-size: 17px; }
    #views-popover {
      bottom: calc(20px + var(--safe-bottom) + 52px + 24px);
      max-height: calc(100vh - var(--safe-top) - var(--safe-bottom) - 20px - 52px - 24px - 16px);
      max-width: calc(100vw - 28px - var(--safe-left) - var(--safe-right));
    }
    .popover { min-width: 160px; }
  }
  @media (min-width: 768px) {
    #dock { height: 60px; padding: 8px; }
    #scene-segment .seg, #dock > button { height: 42px; }
  }
  @media (min-width: 1024px) {
    #dock { max-width: 720px; }
    #views-popover { max-width: 540px; }
  }
  @media (prefers-reduced-motion: reduce) {
    #back-link, #scene-segment .seg, #views-btn, .view-chip {
      transition: background 0.12s ease;
    }
    #back-link:active, #scene-segment .seg:active, #views-btn:active, .view-chip:active {
      transform: none;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- Top-leading: glass back button (icon only) -->
<a id="back-link" href="http://localhost:8080/index.html" aria-label="Back to projects">‹</a>

<!-- Bottom-center: glass dock with scene segmented control + views button -->
<div id="dock" role="toolbar" aria-label="Scene controls">
  <div id="scene-segment" role="group" aria-label="Scene">
    <button class="seg chip active" type="button" data-scene="exterior">Exterior</button>
    <button class="seg chip" type="button" data-scene="room-1">Room 1</button>
    <button class="seg chip" type="button" data-scene="interior">Interior</button>
  </div>
  <div class="dock-divider" aria-hidden="true"></div>
  <button id="views-btn" type="button" aria-haspopup="menu" aria-expanded="false">
    <span>Views</span>
    <span class="caret" aria-hidden="true">▴</span>
  </button>
  <div id="lights-divider" class="dock-divider" aria-hidden="true" hidden></div>
  <button id="lights-btn" type="button" aria-pressed="false" hidden>Lights</button>
</div>

<!-- Views popover (existing populateViewChips fills #view-chips) -->
<div id="views-popover" class="popover" role="menu" hidden>
  <div id="view-chips"></div>
</div>

<!-- Legacy elements kept for JS compatibility (hidden via CSS) -->
<div id="project-badge">ozu-test</div>
<div id="room-label" class="ui">—</div>

<!-- Import map so example modules (HDRLoader etc.) can resolve `from 'three'` -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.min.js"
  }
}
</script>

<script type="module">
// Three.js r184 (May 2026) loaded as ESM from local vendor folder.
// Works offline once vendor/ + ozu-test/hdri/ are populated.
import * as THREE from 'three';
import { HDRLoader } from './vendor/three/examples/jsm/loaders/HDRLoader.js';
import { RectAreaLightUniformsLib } from './vendor/three/examples/jsm/lights/RectAreaLightUniformsLib.js';

(function() {
  'use strict';

  const container = document.getElementById('app');
  const roomLabel = document.getElementById('room-label');

  // ---------- Renderer / camera / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  // RectAreaLight needs its uniforms LUT initialised exactly once, after the
  // renderer exists but before any material that the light touches is built
  // (Phase 2a of room-1-ONLY-cutting-edge-plan.md — the order fix that the
  // previous attempt got wrong).
  RectAreaLightUniformsLib.init();
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef2f6);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 200);
  camera.position.set(5, 6, 5);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ---------- Constants ----------
  const WT = 0.105;        // wall thickness
  const CH = 2.4;          // ceiling height

  // ---------- Materials (shared) ----------
  const matExt       = new THREE.MeshStandardMaterial({ color: 0xd8d2c5, roughness: 0.9 });
  const matInt       = new THREE.MeshStandardMaterial({ color: 0xe8e2d5, roughness: 0.95 });
  const matFloor     = new THREE.MeshStandardMaterial({ color: 0xc9a67a, roughness: 0.85 });
  const matFloorTile = new THREE.MeshStandardMaterial({ color: 0xdcdcd6, roughness: 0.9 });
  const matCeil      = new THREE.MeshStandardMaterial({ color: 0xf1ede4, roughness: 0.95 });
  const matCeilHatch = new THREE.MeshStandardMaterial({ color: 0xb8b2a5, roughness: 0.95 });
  const matStair     = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.8 });
  const matMetal     = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.5, metalness: 0.6 });
  const matAC        = new THREE.MeshStandardMaterial({ color: 0xf4f4f0, roughness: 0.6 });
  const matToilet    = new THREE.MeshPhysicalMaterial({ color: 0xfafaf6, roughness: 0.35, clearcoat: 1.0, clearcoatRoughness: 0.05 });

  // Interior-room materials
  const matWall      = new THREE.MeshStandardMaterial({ color: 0xb5a99a, roughness: 0.95 });
  const matTrimWhite = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.7 });
  const matTrimCrown = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.7 });
  const matCurtain   = new THREE.MeshStandardMaterial({ color: 0xd5cec3, roughness: 1, side: THREE.DoubleSide });
  const matDesk      = new THREE.MeshStandardMaterial({ color: 0x6b3a2a, roughness: 0.55 });
  const matShelfWood = new THREE.MeshStandardMaterial({ color: 0x5c3525, roughness: 0.6 });
  const matBlackMet  = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.5 });
  const matChair     = new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.6 });
  const matMattress  = new THREE.MeshStandardMaterial({ color: 0xf4eddf, roughness: 0.9 });
  const matPillow    = new THREE.MeshStandardMaterial({ color: 0x3a3530, roughness: 0.85 });
  const matLampWood  = new THREE.MeshStandardMaterial({ color: 0xb07840, roughness: 0.6 });
  const matLampShade = new THREE.MeshStandardMaterial({ color: 0xe8d8b8, roughness: 0.7, emissive: 0xffd888, emissiveIntensity: 0.45 });

  // ---------- Procedural plank texture ----------
  function plankTex(baseHex, plankCount, seed) {
    const cvs = document.createElement('canvas');
    cvs.width = 512; cvs.height = 512;
    const ctx = cvs.getContext('2d');
    // base fill
    ctx.fillStyle = '#' + baseHex.toString(16).padStart(6, '0');
    ctx.fillRect(0, 0, 512, 512);
    let s = seed || 1;
    function rnd() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
    const plankH = 512 / plankCount;
    const baseR = (baseHex >> 16) & 0xff;
    const baseG = (baseHex >> 8) & 0xff;
    const baseB = baseHex & 0xff;
    for (let i = 0; i < plankCount; i++) {
      const shade = (rnd() - 0.5) * 32;
      const r = Math.max(0, Math.min(255, baseR + shade));
      const g = Math.max(0, Math.min(255, baseG + shade));
      const b = Math.max(0, Math.min(255, baseB + shade));
      ctx.fillStyle = `rgb(${r|0}, ${g|0}, ${b|0})`;
      ctx.fillRect(0, i * plankH, 512, plankH);
      // gap line
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, i * plankH, 512, 1);
      // grain strokes
      ctx.strokeStyle = `rgba(0,0,0,${0.04 + rnd() * 0.04})`;
      ctx.lineWidth = 1;
      for (let j = 0; j < 24; j++) {
        const y = i * plankH + rnd() * plankH;
        const x1 = rnd() * 512;
        const x2 = x1 + 30 + rnd() * 120;
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y + (rnd() - 0.5) * 2);
        ctx.stroke();
      }
    }
    const tex = new THREE.CanvasTexture(cvs);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 8;
    return tex;
  }

  // ---------- Post-processing pipeline (room-1 standalone only) ----------
  // EffectComposer with SSAO (corner darkness), UnrealBloom (light glow),
  // Post-processing pipeline (room-1 standalone only). Exterior + interior
  // render through the plain renderer.render path unchanged.
  // Post-processing composer was bypassed for AA quality reasons; r184 plain
  // renderer.render() with browser-native antialias is used everywhere now.
  // Keep these as nulls so the lights-toggle code can guard with `if (_room1Bloom)`.
  let _room1Composer = null;
  let _room1Bloom = null;

  // ---------- Real HDRI environment ----------
  // Loads a Poly Haven CC0 HDRI (suburban afternoon sky) via three.js HDRLoader,
  // PMREMs it, and assigns to scene.environment. Used by every scene so PBR
  // materials get real indirect light + reflections. Procedural cube fallback
  // remains in `_buildFallbackEnvMap` in case the HDRI fails to load.
  let _room1EnvMap = null;
  let _envLoaded = false;
  const _pmrem = new THREE.PMREMGenerator(renderer);
  _pmrem.compileEquirectangularShader();
  function _buildFallbackEnvMap() {
    const envScene = new THREE.Scene();
    const r = 5;
    const mk = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide });
    // Cool blue afternoon-sky palette so the procedural fallback matches the kloppenheim
    // HDRI tone — the env swap on load is now invisible instead of warm→cool flash.
    // Order: [+X right, -X left, +Y top, -Y bottom, +Z front, -Z back]
    const mats = [
      mk(0xc8d4e0), mk(0xc8d4e0), mk(0xb8d0e8),
      mk(0x8a8478), mk(0xc8d4e0), mk(0xc8d4e0),
    ];
    const cube = new THREE.Mesh(new THREE.BoxGeometry(r*2, r*2, r*2), mats);
    envScene.add(cube);
    const fallback = _pmrem.fromScene(envScene, 0.04).texture;
    return fallback;
  }
  function buildRoom1EnvMap() { return _room1EnvMap || _buildFallbackEnvMap(); }
  // Kick off the HDRI load. Once it lands, replace scene.environment globally.
  new HDRLoader().load(
    'ozu-test/hdri/kloppenheim_06_puresky_2k.hdr',
    (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      const envMap = _pmrem.fromEquirectangular(texture).texture;
      _room1EnvMap = envMap;
      _envLoaded = true;
      texture.dispose();
      // If a scene is already active, swap its environment immediately.
      if (scene && scene.environment !== envMap) scene.environment = envMap;
    },
    undefined,
    (err) => { console.warn('HDRI load failed, using procedural fallback:', err); }
  );

  // ---------- Scene registry ----------
  const scenes = {};
  let activeScene = null;

  function registerScene(id, cfg) {
    const group = new THREE.Group();
    group.visible = false;
    scene.add(group);
    const S = {
      id, group,
      rooms: cfg.rooms || [],
      orbitTarget: cfg.orbitTarget,
      orbitPos: cfg.orbitPos,
      bg: cfg.bg || 0xeef2f6,
      build: cfg.build,
      viewpoints: cfg.viewpoints || [],
      fov: cfg.fov,
    };
    scenes[id] = S;
    cfg.build(S);
  }

  // ---------- Wall helper ----------
  function addWall(S, x1, z1, x2, z2, y1, y2, exterior) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    if (len < 0.001) return null;
    const h = y2 - y1;
    const mat = exterior ? matExt : matInt;
    const geom = new THREE.BoxGeometry(len, h, WT);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    mesh.rotation.y = -Math.atan2(dz, dx);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    S.group.add(mesh);
    return mesh;
  }

  function addWallMat(S, x1, z1, x2, z2, y1, y2, mat) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    if (len < 0.001) return null;
    const h = y2 - y1;
    const geom = new THREE.BoxGeometry(len, h, WT);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    mesh.rotation.y = -Math.atan2(dz, dx);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    S.group.add(mesh);
    return mesh;
  }

  // ---------- OZU-TEST EXTERIOR SCENE ----------
  registerScene('exterior', {
    orbitPos: new THREE.Vector3(12, 6, 14),
    orbitTarget: new THREE.Vector3(3.15, 2.5, 3.6),
    bg: 0xbbccd8,
    rooms: [
      { name: 'Ozu — exterior', x1: -10, z1: -10, x2: 16.3, z2: 17.2 },
    ],
    build: function(S) {
      const W = 6.3;        // building width (X)
      const D = 7.2;        // building depth (Z)
      const F1H = 2.5;      // 1F height
      const F2H = 2.5;      // 2F height
      const EAVE = 0.35;    // roof overhang
      const WT  = 0.15;     // wall thickness

      // ---------- materials ----------
      const matLower  = new THREE.MeshStandardMaterial({ color: 0x5a4838, roughness: 0.88 });   // dark brown siding
      const matUpper  = new THREE.MeshStandardMaterial({ color: 0xe8e3d9, roughness: 0.92 });   // off-white panels
      const matTrim   = new THREE.MeshStandardMaterial({ color: 0x262626, roughness: 0.7 });    // dark window frame
      const matGlass  = new THREE.MeshPhysicalMaterial({ color: 0xeaf0f4, roughness: 0.12, metalness: 0.0, transmission: 0.82, thickness: 0.01, ior: 1.52 });
      const matRoof   = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });
      const matDoor   = new THREE.MeshStandardMaterial({ color: 0x2a1e14, roughness: 0.55 });
      const matPorch  = new THREE.MeshStandardMaterial({ color: 0xc8c0b0, roughness: 0.95 });
      const matStep   = new THREE.MeshStandardMaterial({ color: 0x8a8275, roughness: 0.95 });
      const matAsphalt = new THREE.MeshStandardMaterial({ color: 0x3e3e3e, roughness: 0.95 });
      const matConcrete = new THREE.MeshStandardMaterial({ color: 0xaaa8a0, roughness: 0.95 });
      const matGround  = new THREE.MeshStandardMaterial({ color: 0x7a7a6a, roughness: 1.0 });
      const matCurb    = new THREE.MeshStandardMaterial({ color: 0xbbbbb0, roughness: 0.9 });

      // ---------- ground / asphalt / parking ----------
      {
        const g = new THREE.PlaneGeometry(60, 60);
        const m = new THREE.Mesh(g, matGround);
        m.rotation.x = -Math.PI/2;
        m.position.set(W/2, -0.02, D/2);
        m.receiveShadow = true;
        S.group.add(m);
      }
      // Street / front asphalt
      {
        const g = new THREE.BoxGeometry(W + 4, 0.03, 4);
        const m = new THREE.Mesh(g, matAsphalt);
        m.position.set(W/2, 0, D + 3);
        m.receiveShadow = true;
        S.group.add(m);
      }
      // Parking pad (concrete) in front of house
      {
        const g = new THREE.BoxGeometry(W, 0.04, 2.6);
        const m = new THREE.Mesh(g, matConcrete);
        m.position.set(W/2, 0.01, D + 1.3);
        m.receiveShadow = true;
        S.group.add(m);
      }
      // Low curb between parking & asphalt
      {
        const g = new THREE.BoxGeometry(W + 0.3, 0.08, 0.08);
        const m = new THREE.Mesh(g, matCurb);
        m.position.set(W/2, 0.04, D + 2.55);
        S.group.add(m);
      }

      // ---------- wall helpers ----------
      function solidWall(x1, z1, x2, z2, y1, y2, mat) {
        const dx = x2-x1, dz = z2-z1, len = Math.hypot(dx,dz);
        if (len < 0.01) return null;
        const h = y2 - y1;
        const g = new THREE.BoxGeometry(len, h, WT);
        const m = new THREE.Mesh(g, mat);
        m.position.set((x1+x2)/2, (y1+y2)/2, (z1+z2)/2);
        m.rotation.y = -Math.atan2(dz, dx);
        m.castShadow = true;
        m.receiveShadow = true;
        S.group.add(m);
        return m;
      }

      // ---------- outer walls with openings ----------
      // Window/door positions match the interior scene's F1_WIN/F2_WIN arrays so the same
      // building reads consistently from both scenes. Cladding split confirmed against
      // exterior-images/ozu-1-test-exterior-primary-{1..4}.webp:
      //   front 1F LEFT (x=0..4.50, wet rooms) = brown panel
      //   front 1F RIGHT (x=4.50..W, genkan/entry) = cream panel
      //   2F + back + sides = cream throughout

      // -- FRONT (Z = D) — brown panel inset on the wet-room side, cream everywhere else --
      // Brown panel: x=0..4.50 (wet rooms), y=0..2.10 (does NOT reach 1F ceiling). 3 small windows inside.
      const BROWN_X1 = 4.50, BROWN_Y1 = 2.10;
      // Brown wall around windows, up to BROWN_Y1
      solidWall(0,    D, 0.60, D, 0,    BROWN_Y1, matLower);
      solidWall(0.60, D, 1.20, D, 0,    1.50, matLower);          // laundry 横すべり 06003 sill
      solidWall(0.60, D, 1.20, D, 1.80, BROWN_Y1, matLower);      // laundry lintel
      solidWall(1.20, D, 2.57, D, 0,    BROWN_Y1, matLower);
      solidWall(2.57, D, 2.83, D, 0,    1.10, matLower);          // bath 縦すべり 02607 sill
      solidWall(2.57, D, 2.83, D, 1.80, BROWN_Y1, matLower);      // bath lintel
      solidWall(2.83, D, 3.87, D, 0,    BROWN_Y1, matLower);
      solidWall(3.87, D, 4.23, D, 0,    1.50, matLower);          // toilet 横すべり 03603 sill
      solidWall(3.87, D, 4.23, D, 1.80, BROWN_Y1, matLower);      // toilet lintel
      solidWall(4.23, D, BROWN_X1, D, 0, BROWN_Y1, matLower);
      // Brown panel vertical board seams — thin shadow strips on the exterior face every
      // ~0.15 m, skipping window x ranges. Reads as ~150 mm vertical-board cladding.
      {
        const seamMat = new THREE.MeshStandardMaterial({ color: 0x3a2820, roughness: 0.85 });
        const seamW = 0.006, seamD = 0.010;
        const winRanges = [[0.60, 1.20], [2.57, 2.83], [3.87, 4.23]];
        const inWindow = (x) => winRanges.some(([a, b]) => x > a - 0.04 && x < b + 0.04);
        for (let x = 0.15; x <= BROWN_X1 - 0.10; x += 0.15) {
          if (inWindow(x)) continue;
          const seam = new THREE.Mesh(new THREE.BoxGeometry(seamW, BROWN_Y1, seamD), seamMat);
          seam.position.set(x, BROWN_Y1 / 2, D + WT / 2 + seamD / 2);
          seam.castShadow = true;
          S.group.add(seam);
        }
      }
      // Cream above brown panel (x=0..BROWN_X1, y=BROWN_Y1..F1H)
      solidWall(0, D, BROWN_X1, D, BROWN_Y1, F1H, matUpper);
      // Cream right of brown panel (x=BROWN_X1..W, full F1H, with entry door gap at x=4.95..5.85)
      solidWall(BROWN_X1, D, 4.95, D, 0,    F1H, matUpper);
      solidWall(4.95,     D, 5.85, D, 2.05, F1H, matUpper);       // door header
      solidWall(5.85,     D, W,    D, 0,    F1H, matUpper);
      // 2F front (cream, full width) — room-2 wide + 2F toilet narrow + room-1 wide
      solidWall(0,     D, 0.505, D, F1H, F1H+F2H, matUpper);
      solidWall(0.505, D, 2.195, D, F1H, F1H+1.10, matUpper);     // room-2 引違 11909 sill
      solidWall(0.505, D, 2.195, D, F1H+2.00, F1H+F2H, matUpper); // room-2 header
      solidWall(2.195, D, 3.020, D, F1H, F1H+F2H, matUpper);
      solidWall(3.020, D, 3.280, D, F1H, F1H+1.10, matUpper);     // 2F toilet 縦すべり 02609 sill
      solidWall(3.020, D, 3.280, D, F1H+2.00, F1H+F2H, matUpper); // 2F toilet header
      solidWall(3.280, D, 4.105, D, F1H, F1H+F2H, matUpper);
      solidWall(4.105, D, 5.795, D, F1H, F1H+1.10, matUpper);     // room-1 引違 11909 sill
      solidWall(4.105, D, 5.795, D, F1H+2.00, F1H+F2H, matUpper); // room-1 header
      solidWall(5.795, D, W,     D, F1H, F1H+F2H, matUpper);

      // -- BACK (Z = 0) — all cream (garden side) --
      // 1F: LDK secondary window (引違 16009) only — garden door removed.
      solidWall(0,    0, 3.20, 0, 0,    F1H, matUpper);     // solid wall west of secondary window
      solidWall(3.20, 0, 4.80, 0, 0,    1.00, matUpper);    // LDK secondary sill
      solidWall(3.20, 0, 4.80, 0, 1.90, F1H, matUpper);     // LDK secondary header
      solidWall(4.80, 0, W,    0, 0,    F1H, matUpper);
      // 2F: room-3 wide + room-4 wide
      solidWall(0,     0, 0.600, 0, F1H, F1H+F2H, matUpper);
      solidWall(0.600, 0, 2.100, 0, F1H, F1H+1.10, matUpper);     // room-3 引違 15009 sill
      solidWall(0.600, 0, 2.100, 0, F1H+2.00, F1H+F2H, matUpper); // room-3 header
      solidWall(2.100, 0, 4.200, 0, F1H, F1H+F2H, matUpper);
      solidWall(4.200, 0, 5.700, 0, F1H, F1H+1.10, matUpper);     // room-4 引違 15009 sill
      solidWall(4.200, 0, 5.700, 0, F1H+2.00, F1H+F2H, matUpper); // room-4 header
      solidWall(5.700, 0, W,     0, F1H, F1H+F2H, matUpper);

      // -- LEFT (X = 0) — all cream --
      // 1F: 2 LDK casements (縦すべり 02609 narrow vertical, paired)
      solidWall(0, 0,    0, 1.20, 0,    F1H, matUpper);
      solidWall(0, 1.20, 0, 1.46, 0,    1.00, matUpper);    // LDK lower casement sill
      solidWall(0, 1.20, 0, 1.46, 1.90, F1H, matUpper);     // header
      solidWall(0, 1.46, 0, 3.30, 0,    F1H, matUpper);
      solidWall(0, 3.30, 0, 3.56, 0,    1.00, matUpper);    // LDK upper casement sill
      solidWall(0, 3.30, 0, 3.56, 1.90, F1H, matUpper);     // header
      solidWall(0, 3.56, 0, D,    0,    F1H, matUpper);
      // 2F: room-3 narrow vertical + room-2 narrow vertical (縦すべり 02609 each)
      solidWall(0, 0,     0, 1.670, F1H, F1H+F2H, matUpper);
      solidWall(0, 1.670, 0, 1.930, F1H, F1H+1.10, matUpper);
      solidWall(0, 1.670, 0, 1.930, F1H+2.00, F1H+F2H, matUpper);
      solidWall(0, 1.930, 0, 5.720, F1H, F1H+F2H, matUpper);
      solidWall(0, 5.720, 0, 5.980, F1H, F1H+1.10, matUpper);
      solidWall(0, 5.720, 0, 5.980, F1H+2.00, F1H+F2H, matUpper);
      solidWall(0, 5.980, 0, D,     F1H, F1H+F2H, matUpper);

      // -- RIGHT (X = W, real-world WEST) — cream, with room-4 + room-1 frosted privacy windows on 2F --
      solidWall(W, 0, W, D, 0,    F1H, matUpper);
      solidWall(W, 0,     W, 1.670, F1H, F1H+F2H, matUpper);
      solidWall(W, 1.670, W, 1.930, F1H, F1H+1.10, matUpper);     // room-4 縦すべり 02609 sill
      solidWall(W, 1.670, W, 1.930, F1H+2.00, F1H+F2H, matUpper); // room-4 header
      solidWall(W, 1.930, W, 5.720, F1H, F1H+F2H, matUpper);
      solidWall(W, 5.720, W, 5.980, F1H, F1H+1.10, matUpper);     // room-1 縦すべり 02609 sill
      solidWall(W, 5.720, W, 5.980, F1H+2.00, F1H+F2H, matUpper); // room-1 header
      solidWall(W, 5.980, W, D,     F1H, F1H+F2H, matUpper);

      // ---------- window glass + frames (thin panes sitting in the openings) ----------
      function paneFront(x1, x2, y1, y2, z) {
        const w = x2 - x1, h = y2 - y1;
        const gG = new THREE.BoxGeometry(w, h, 0.02);
        const gM = new THREE.Mesh(gG, matGlass);
        gM.position.set((x1+x2)/2, (y1+y2)/2, z);
        S.group.add(gM);
        const tG = new THREE.BoxGeometry(w + 0.12, h + 0.12, 0.06);
        const tM = new THREE.Mesh(tG, matTrim);
        tM.position.set((x1+x2)/2, (y1+y2)/2, z);
        S.group.add(tM);
      }
      function paneSide(z1, z2, y1, y2, x) {
        const w = z2 - z1, h = y2 - y1;
        const gG = new THREE.BoxGeometry(0.02, h, w);
        const gM = new THREE.Mesh(gG, matGlass);
        gM.position.set(x, (y1+y2)/2, (z1+z2)/2);
        S.group.add(gM);
        const tG = new THREE.BoxGeometry(0.06, h + 0.12, w + 0.12);
        const tM = new THREE.Mesh(tG, matTrim);
        tM.position.set(x, (y1+y2)/2, (z1+z2)/2);
        S.group.add(tM);
      }

      // Front 1F panes
      paneFront(0.60, 1.20, 1.50, 1.80, D);                     // laundry 横すべり 06003
      paneFront(2.57, 2.83, 1.10, 1.80, D);                     // bath 縦すべり 02607
      paneFront(3.87, 4.23, 1.50, 1.80, D);                     // toilet 横すべり 03603
      // Front 2F panes
      paneFront(0.505, 2.195, F1H+1.10, F1H+2.00, D);           // room-2 引違 11909
      paneFront(3.020, 3.280, F1H+1.10, F1H+2.00, D);           // 2F toilet 縦すべり 02609
      paneFront(4.105, 5.795, F1H+1.10, F1H+2.00, D);           // room-1 引違 11909
      // Back 1F panes
      paneFront(3.20, 4.80, 1.00, 1.90, 0);                     // LDK secondary 引違 16009
      // Back 2F panes
      paneFront(0.600, 2.100, F1H+1.10, F1H+2.00, 0);           // room-3 引違 15009
      paneFront(4.200, 5.700, F1H+1.10, F1H+2.00, 0);           // room-4 引違 15009
      // Left 1F panes
      paneSide(1.20, 1.46, 1.00, 1.90, 0);                      // LDK lower casement
      paneSide(3.30, 3.56, 1.00, 1.90, 0);                      // LDK upper casement
      // Left 2F panes
      paneSide(1.670, 1.930, F1H+1.10, F1H+2.00, 0);            // room-3 縦すべり 02609
      paneSide(5.720, 5.980, F1H+1.10, F1H+2.00, 0);            // room-2 縦すべり 02609
      // Right 2F panes
      paneSide(1.670, 1.930, F1H+1.10, F1H+2.00, W);            // room-4 縦すべり 02609
      paneSide(5.720, 5.980, F1H+1.10, F1H+2.00, W);            // room-1 縦すべり 02609

      // ---------- front door ----------
      {
        const g = new THREE.BoxGeometry(0.9, 2.05, 0.08);
        const m = new THREE.Mesh(g, matDoor);
        m.position.set(5.40, 1.025, D + 0.02);
        S.group.add(m);
        // door handle
        const hG = new THREE.BoxGeometry(0.04, 0.04, 0.05);
        const hM = new THREE.Mesh(hG, matTrim);
        hM.position.set(5.77, 1.05, D + 0.08);
        S.group.add(hM);
      }

      // ---------- porch step at front door ----------
      {
        const g = new THREE.BoxGeometry(1.4, 0.1, 0.6);
        const m = new THREE.Mesh(g, matPorch);
        m.position.set(5.40, 0.05, D + 0.35);
        m.castShadow = true;
        m.receiveShadow = true;
        S.group.add(m);
      }
      // porch step 2 (lower)
      {
        const g = new THREE.BoxGeometry(1.6, 0.08, 0.3);
        const m = new THREE.Mesh(g, matStep);
        m.position.set(5.40, 0.04, D + 0.85);
        m.receiveShadow = true;
        S.group.add(m);
      }

      // ---------- floor slab (between 1F and 2F visually) ----------
      {
        const g = new THREE.BoxGeometry(W + 0.01, 0.08, D + 0.01);
        const m = new THREE.Mesh(g, matUpper);
        m.position.set(W/2, F1H, D/2);
        m.castShadow = true;
        m.receiveShadow = true;
        S.group.add(m);
      }

      // ---------- roof (flat with slight overhang) ----------
      {
        const g = new THREE.BoxGeometry(W + EAVE*2, 0.15, D + EAVE*2);
        const m = new THREE.Mesh(g, matRoof);
        m.position.set(W/2, F1H + F2H + 0.075, D/2);
        m.castShadow = true;
        m.receiveShadow = true;
        S.group.add(m);
      }

      // ---------- entry porch overhang ----------
      {
        const g = new THREE.BoxGeometry(1.8, 0.08, 0.9);
        const m = new THREE.Mesh(g, matRoof);
        m.position.set(5.40, 2.25, D + 0.35);
        m.castShadow = true;
        m.receiveShadow = true;
        S.group.add(m);
      }

      // ---------- site context: fences, neighbours, streetlight ----------
      // Property fences on 3 sides (back, left, right). Front opens onto parking.
      {
        const matFence = new THREE.MeshStandardMaterial({ color: 0xb0a08c, roughness: 0.85 });
        const FH = 0.85, FT = 0.06;
        // back fence (z = -0.2, full property width)
        const back = new THREE.Mesh(new THREE.BoxGeometry(W + 0.6, FH, FT), matFence);
        back.position.set(W / 2, FH / 2, -0.2);
        back.castShadow = true; back.receiveShadow = true;
        S.group.add(back);
        // left/right side fences (run from back to start of parking pad)
        for (const sx of [-0.2, W + 0.2]) {
          const side = new THREE.Mesh(new THREE.BoxGeometry(FT, FH, D + 0.4), matFence);
          side.position.set(sx, FH / 2, D / 2 - 0.1);
          side.castShadow = true; side.receiveShadow = true;
          S.group.add(side);
        }
      }
      // Two neighbour-house shells (faceless 2-storey blocks on either side).
      {
        const matNLow = new THREE.MeshStandardMaterial({ color: 0xa39685, roughness: 0.92 });
        const matNUp  = new THREE.MeshStandardMaterial({ color: 0xc7bdac, roughness: 0.92 });
        const matNRf  = new THREE.MeshStandardMaterial({ color: 0x3a3a3a, roughness: 0.9 });
        function neighbour(cx, cz) {
          const NW = 4.0, ND = 6.0, N1 = 2.5, N2 = 2.4;
          const lo = new THREE.Mesh(new THREE.BoxGeometry(NW, N1, ND), matNLow);
          lo.position.set(cx, N1 / 2, cz);
          lo.castShadow = true; lo.receiveShadow = true;
          S.group.add(lo);
          const up = new THREE.Mesh(new THREE.BoxGeometry(NW, N2, ND), matNUp);
          up.position.set(cx, N1 + N2 / 2, cz);
          up.castShadow = true; up.receiveShadow = true;
          S.group.add(up);
          const rf = new THREE.Mesh(new THREE.BoxGeometry(NW + 0.5, 0.15, ND + 0.5), matNRf);
          rf.position.set(cx, N1 + N2 + 0.075, cz);
          rf.castShadow = true; rf.receiveShadow = true;
          S.group.add(rf);
        }
        neighbour(-4.0,    D / 2);   // west neighbour
        neighbour(W + 4.0, D / 2);   // east neighbour
      }
      // Streetlight across the road
      {
        const matPole = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, metalness: 0.4, roughness: 0.6 });
        const matLamp = new THREE.MeshStandardMaterial({
          color: 0xfff2c8, emissive: 0xffeaa8, emissiveIntensity: 0.4, roughness: 0.5,
        });
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 4.0, 10), matPole);
        pole.position.set(W + 1.5, 2.0, D + 4.5);
        pole.castShadow = true;
        S.group.add(pole);
        const arm = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.06, 0.06), matPole);
        arm.position.set(W + 1.2, 4.0, D + 4.5);
        S.group.add(arm);
        const lamp = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.10, 0.30), matLamp);
        lamp.position.set(W + 0.92, 3.95, D + 4.5);
        S.group.add(lamp);
      }

      // ---------- lighting ----------
      const sun = new THREE.DirectionalLight(0xfff2dc, 1.0);
      sun.position.set(-8, 14, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      sun.shadow.camera.left = -18;
      sun.shadow.camera.right = 18;
      sun.shadow.camera.top = 18;
      sun.shadow.camera.bottom = -18;
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far = 60;
      sun.shadow.bias = -0.0005;
      S.group.add(sun);
      S.sun = sun;

      const sky = new THREE.HemisphereLight(0xcce0ff, 0x444438, 0.5);
      S.group.add(sky);
      S.sky = sky;

      const fill = new THREE.AmbientLight(0xffffff, 0.15);
      S.group.add(fill);
      S.fill = fill;
    }
  });

  // ---------- OZU-TEST INTERIOR SCENE ----------
  // Floor plan per ozu-1-blueprint.pdf, X-MIRROR convention (page-LEFT → code RIGHT).

  // L-shape stair: lower flight (5 steps, 1F shaft), upper flight (6 steps, 2F mid band),
  // 90° turn at the L-landing between the two flights.
  registerScene('interior', {
    orbitPos: new THREE.Vector3(11, 9, 12),
    orbitTarget: new THREE.Vector3(3.15, 2.5, 3.6),
    bg: 0xbbccd8,
    rooms: [
      // 1F (y=0..2.5) — carve-outs listed BEFORE living-dining bbox so they win the iteration
      { name: 'kitchen',       x1: 0,    z1: 2.40, x2: 2.55, z2: 4.50, y1: 0,   y2: 2.5 }, // NE carve-out of LDK
      { name: 'stairs',        x1: 5.40, z1: 2.90, x2: 6.30, z2: 4.50, y1: 0,   y2: 2.5 }, // NW carve-out of LDK (1F shaft footprint)
      { name: 'living-dining', x1: 0,    z1: 0,    x2: 6.30, z2: 4.50, y1: 0,   y2: 2.5 },
      { name: 'laundry',       x1: 0,    z1: 4.50, x2: 1.80, z2: 7.20, y1: 0,   y2: 2.5 },
      { name: 'washroom',      x1: 1.80, z1: 5.40, x2: 3.60, z2: 7.20, y1: 0,   y2: 2.5 },
      { name: 'toilet-1-f',    x1: 3.60, z1: 5.40, x2: 4.50, z2: 7.20, y1: 0,   y2: 2.5 },
      { name: 'corridor-1',    x1: 4.50, z1: 4.50, x2: 6.30, z2: 6.30, y1: 0,   y2: 2.5 },
      { name: 'corridor-1',    x1: 4.50, z1: 6.30, x2: 6.30, z2: 7.20, y1: 0,   y2: 2.5 }, // genkan zone (part of corridor-1 folder)
      { name: 'corridor-1',    x1: 3.60, z1: 4.50, x2: 4.50, z2: 5.40, y1: 0,   y2: 2.5 }, // east-arm connector strip (south of toilet, west of main shaft)
      { name: 'corridor-1',    x1: 1.80, z1: 4.50, x2: 3.60, z2: 5.40, y1: 0,   y2: 2.5 }, // washroom-approach strip (south of washroom door)
      // 2F (y=2.5..5.0)
      { name: 'stairs',                x1: 4.725, z1: 3.60, x2: 6.30, z2: 4.50, y1: 2.5, y2: 5.0 }, // 2F shaft footprint (L-bend turns west)
      { name: 'room-3',                x1: 0,    z1: 0,    x2: 2.70, z2: 3.60, y1: 2.5, y2: 5.0 },
      { name: 'room-1',                x1: 3.60, z1: 4.50, x2: 6.30, z2: 7.20, y1: 2.5, y2: 5.0 },
      { name: 'room-2',                x1: 0,    z1: 4.50, x2: 2.70, z2: 7.20, y1: 2.5, y2: 5.0 },
      { name: 'room-4',                x1: 3.60, z1: 0,    x2: 6.30, z2: 3.60, y1: 2.5, y2: 5.0 },
      { name: 'corridor-2-toilet-2-f', x1: 2.70, z1: 5.85, x2: 3.60, z2: 7.20, y1: 2.5, y2: 5.0 }, // toilet zone
      { name: 'corridor-2-toilet-2-f', x1: 2.70, z1: 3.60, x2: 4.725, z2: 4.50, y1: 2.5, y2: 5.0 }, // corridor main strip
      { name: 'corridor-2-toilet-2-f', x1: 2.70, z1: 4.50, x2: 3.60,  z2: 5.85, y1: 2.5, y2: 5.0 }, // corridor north arm to toilet door
    ],
    viewpoints: [
      // overview = external orbit of full building (only viewpoint that stays outside)
      { id: 'overview',              label: 'overview',              pos: [11, 9, 12], tgt: [3.15, 2.5, 3.60] },
      // 1F + 2F overviews position camera INSIDE the largest open zone of each floor
      { id: '1f',                    label: '1F',                    pos: [5.5, 1.6, 0.5], tgt: [1.0, 1.0, 3.5] },
      { id: '2f',                    label: '2F',                    pos: [3.5, 4.1, 4.0], tgt: [3.0, 4.0, 6.5] },
      { id: 'stairs',                label: 'stairs',                pos: [5.85, 1.0, 3.5], tgt: [5.85, 2.0, 4.4] },
      // 1F rooms — camera INSIDE each room at human eye height (y=1.6)
      { id: 'living-dining',         label: 'living-dining',         parent: '1f', pos: [5.5, 1.6, 0.4], tgt: [1.0, 1.0, 3.5] },
      { id: 'kitchen',               label: 'kitchen',               parent: '1f', pos: [2.3, 1.6, 4.3], tgt: [0.5, 0.8, 2.7] },
      { id: 'washroom',              label: 'washroom',              parent: '1f', pos: [3.4, 1.6, 6.9], tgt: [2.0, 1.0, 5.5] },
      { id: 'laundry',               label: 'laundry',               parent: '1f', pos: [1.6, 1.6, 7.0], tgt: [0.3, 1.2, 4.7] },
      { id: 'toilet-1-f',            label: 'toilet-1-f',            parent: '1f', pos: [4.3, 1.6, 6.9], tgt: [3.7, 0.8, 5.5] },
      { id: 'corridor-1',            label: 'corridor-1',            parent: '1f', pos: [5.5, 1.6, 4.6], tgt: [5.0, 1.6, 7.0] },
      // 2F rooms — camera INSIDE each room at human eye height (y=F1H+1.6=4.1)
      { id: 'room-1',                label: 'room-1',                parent: '2f', pos: [5.8, 4.1, 4.7], tgt: [4.0, 3.5, 7.0] },
      { id: 'room-2',                label: 'room-2',                parent: '2f', pos: [2.4, 4.1, 4.7], tgt: [0.5, 3.5, 7.0] },
      { id: 'room-3',                label: 'room-3',                parent: '2f', pos: [2.4, 4.1, 0.3], tgt: [0.5, 3.5, 3.4] },
      { id: 'room-4',                label: 'room-4',                parent: '2f', pos: [5.8, 4.1, 0.3], tgt: [4.0, 3.5, 3.4] },
      { id: 'corridor-2-toilet-2-f', label: 'corridor-2-toilet-2-f', parent: '2f', pos: [3.5, 4.1, 4.0], tgt: [3.0, 4.0, 6.5] },
    ],
    build: function(S) {
      const W = 6.30, D = 7.20;
      const F1H = 2.50, F2H = 2.50;       // match exterior floor heights
      const WT = 0.10, FLOOR_T = 0.05;

      // Floor colours
      const CLR = {
        wall: 0xeeeae3,
        floor_ldk: 0xc9b89a,
        floor_genkan: 0x8a7a66,
        floor_corridor: 0xd6c9b6,
        floor_stairs: 0xa68a64,
        floor_bath: 0x9bb5c2,
        floor_washroom: 0xc7d6df,
        floor_toilet: 0xc4a888,
        floor_storage: 0xb8b8b0,
        floor_room4: 0xc4b29c,
        floor_room: 0xd0bfa6,
        floor_closet: 0xa89e90,
      };
      const wallMat = new THREE.MeshStandardMaterial({ color: CLR.wall, roughness: 0.95 });
      // Outer-wall cladding (matches exterior scene + photos)
      const matLowerExt = new THREE.MeshStandardMaterial({ color: 0x5a4838, roughness: 0.88 });   // dark brown panel
      const matUpperExt = new THREE.MeshStandardMaterial({ color: 0xe8e3d9, roughness: 0.92 });   // off-white cream
      const doorMat = new THREE.MeshStandardMaterial({ color: 0xb89878, roughness: 0.6 });
      const closetDoorMat = new THREE.MeshStandardMaterial({ color: 0xe8dfd0, roughness: 0.6 });
      const doorHandleMat = new THREE.MeshStandardMaterial({ color: 0xc8cdd2, metalness: 0.85, roughness: 0.18 });
      // Painted-trim material: door casings (architrave), baseboards (巾木), crown molding (回り縁).
      // Modern JP residential trim is typically a clean off-white, slightly whiter than the wall paint.
      const trimMat = new THREE.MeshStandardMaterial({ color: 0xfafaf6, roughness: 0.8 });

      // Procedural wood-plank textures per floor type (uses the global plankTex helper).
      // Each entry: a base CanvasTexture + a density (cycles per metre) used to set repeat.
      const FLOORS = {
        ldk:      { tex: plankTex(CLR.floor_ldk,      8, 17), density: 0.5, rough: 0.85 },
        corridor: { tex: plankTex(CLR.floor_corridor, 8, 23), density: 0.5, rough: 0.85 },
        stairs:   { tex: plankTex(CLR.floor_stairs,   8, 31), density: 0.6, rough: 0.8  },
        room4:    { tex: plankTex(CLR.floor_room4,    8, 41), density: 0.5, rough: 0.85 },
        room:     { tex: plankTex(CLR.floor_room,     8, 53), density: 0.5, rough: 0.85 },
        toilet:   { tex: plankTex(CLR.floor_toilet,   8, 67), density: 0.6, rough: 0.85 },
      };

      // Wall builders, parameterised by yBase (1F at y=0, 2F at y=F1H).
      // colorOrSpec is either a hex number (flat colour) or a {tex, density, rough}
      // object — in which case the texture is cloned and its repeat is set to
      // (dx * density, dz * density) so larger floors get more cycles, not bigger planks.
      function makeFloor(x0, z0, x1, z1, colorOrSpec, yBase) {
        const dx = x1 - x0, dz = z1 - z0;
        if (dx <= 0 || dz <= 0) return;
        let mat;
        if (typeof colorOrSpec === 'number') {
          mat = new THREE.MeshStandardMaterial({ color: colorOrSpec, roughness: 0.9 });
        } else {
          const t = colorOrSpec.tex.clone();
          t.needsUpdate = true;
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(dx * colorOrSpec.density, dz * colorOrSpec.density);
          mat = new THREE.MeshStandardMaterial({ map: t, roughness: colorOrSpec.rough ?? 0.85 });
        }
        const m = new THREE.Mesh(new THREE.BoxGeometry(dx, FLOOR_T, dz), mat);
        m.position.set((x0 + x1) / 2, yBase - FLOOR_T / 2, (z0 + z1) / 2);
        S.group.add(m);
      }
      function makeWall(x0, z0, x1, z1, height, yBase, mat, outerSign) {
        const dx = x1 - x0, dz = z1 - z0;
        const len = Math.hypot(dx, dz);
        if (len < 0.001) return;
        const midX = (x0 + x1) / 2, midY = yBase + height / 2, midZ = (z0 + z1) / 2;
        const yaw = -Math.atan2(dz, dx);
        if (outerSign && mat && mat !== wallMat) {
          // 2-layer outer wall: outer slab (mat = cladding) + inner slab (wallMat), each WT/2 thick.
          // Outward unit vector in world coords = local +Z rotated by yaw, scaled by outerSign.
          const nx = -dz / len * outerSign, nz = dx / len * outerSign;
          const off = WT / 4;
          const outerBox = new THREE.Mesh(new THREE.BoxGeometry(len, height, WT / 2), mat);
          outerBox.position.set(midX + nx * off, midY, midZ + nz * off);
          outerBox.rotation.y = yaw;
          S.group.add(outerBox);
          const innerBox = new THREE.Mesh(new THREE.BoxGeometry(len, height, WT / 2), wallMat);
          innerBox.position.set(midX - nx * off, midY, midZ - nz * off);
          innerBox.rotation.y = yaw;
          S.group.add(innerBox);
        } else {
          const m = new THREE.Mesh(new THREE.BoxGeometry(len, height, WT), mat || wallMat);
          m.position.set(midX, midY, midZ);
          m.rotation.y = yaw;
          S.group.add(m);
        }
      }
      function wallX(z, a, b, gaps, height, yBase, mat, outerSign) {
        let cur = a;
        const sorted = [...(gaps || [])].sort((p, q) => p[0] - q[0]);
        for (const [g0, g1] of sorted) {
          if (g0 > cur) makeWall(cur, z, g0, z, height, yBase, mat, outerSign);
          cur = Math.max(cur, g1);
        }
        if (cur < b) makeWall(cur, z, b, z, height, yBase, mat, outerSign);
      }

      // Ceiling — whitewashed wood-plank look (matches photos in LDK + bedrooms + 2F toilet).
      const CEIL_T = 0.04;
      const ceilTex = plankTex(0xeae3d6, 14, 47);
      ceilTex.repeat.set(2.0, 1.0);
      const matCeiling = new THREE.MeshStandardMaterial({ color: 0xf3efe6, roughness: 0.92, map: ceilTex });
      function makeCeiling(x0, z0, x1, z1, yTop) {
        const dx = x1 - x0, dz = z1 - z0;
        if (dx <= 0 || dz <= 0) return;
        const m = new THREE.Mesh(new THREE.BoxGeometry(dx, CEIL_T, dz), matCeiling);
        m.position.set((x0 + x1) / 2, yTop - CEIL_T / 2, (z0 + z1) / 2);
        m.userData._isCeiling = true;
        m.userData._ceilingFloor = (yTop > F1H + 0.1) ? '2f' : '1f';
        S.group.add(m);
      }
      function wallZ(x, a, b, gaps, height, yBase, mat, outerSign) {
        let cur = a;
        const sorted = [...(gaps || [])].sort((p, q) => p[0] - q[0]);
        for (const [g0, g1] of sorted) {
          if (g0 > cur) makeWall(x, cur, x, g0, height, yBase, mat, outerSign);
          cur = Math.max(cur, g1);
        }
        if (cur < b) makeWall(x, cur, x, b, height, yBase, mat, outerSign);
      }

      // ───────────────── 1F ─────────────────
      // LDK base layer + room paint-overs (yOffset 0.001 to avoid z-fighting)
      const F1_ROOMS = [
        { id: 'ldk',      mat: FLOORS.ldk,           x0: 0,    z0: 0,    x1: W,    z1: D    },
        { id: 'washroom', mat: CLR.floor_washroom,   x0: 0,    z0: 4.50, x1: 1.80, z1: D    },
        { id: 'bath',     mat: CLR.floor_bath,       x0: 1.80, z0: 4.80, x1: 3.60, z1: D    },
        { id: 'toilet',   mat: FLOORS.toilet,        x0: 3.60, z0: 5.40, x1: 4.50, z1: D    },
        { id: 'genkan',   mat: CLR.floor_genkan,     x0: 4.50, z0: 6.30, x1: W,    z1: D    },
        { id: 'corridor', mat: FLOORS.corridor,      x0: 4.50, z0: 4.50, x1: W,    z1: 6.30 },
        { id: 'storage',  mat: CLR.floor_storage,    x0: 3.60, z0: 3.60, x1: 4.50, z1: 4.50 },
        { id: 'stairs',   mat: FLOORS.stairs,        x0: 5.40, z0: 2.90, x1: W,    z1: 4.50 },
      ];
      for (const r of F1_ROOMS) {
        // Genkan 土間 sits 150 mm below the interior floor — universal in JP detached houses.
        // Everything else: ldk at y=0 (LDK is the base layer), other zones at y=0.001 to win the z-fight.
        const y = (r.id === 'genkan') ? -0.15 : ((r.id === 'ldk') ? 0 : 0.001);
        makeFloor(r.x0, r.z0, r.x1, r.z1, r.mat, y);
      }
      // 上がり框 (agarikamachi) — wood-stained lip step where the corridor floor meets the
      // sunk genkan tile. Runs across the full genkan width at z=6.30, 30 mm tall × 90 mm deep.
      {
        const matKamachi = new THREE.MeshStandardMaterial({ color: 0x6b4a2e, roughness: 0.55 });
        const kamachi = new THREE.Mesh(new THREE.BoxGeometry(W - 4.50, 0.18, 0.09), matKamachi);
        kamachi.position.set((4.50 + W) / 2, -0.07, 6.30 + 0.045);
        S.group.add(kamachi);
        // Vertical face of the step (between corridor floor at y=0 and genkan tile at y=-0.15)
        const matKamachiFace = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.7 });
        const kamachiFace = new THREE.Mesh(new THREE.BoxGeometry(W - 4.50, 0.15, 0.01), matKamachiFace);
        kamachiFace.position.set((4.50 + W) / 2, -0.075, 6.30);
        S.group.add(kamachiFace);
      }

      // 1F ceilings — flat plaster. The hole only covers the UPPER-flight footprint
      // (x=[4.725, W], z=[3.60, 4.50]) where stair elements rise above the ceiling level.
      // The lower flight's south portion (x=[5.40, W], z=[2.90, 3.60]) gets ceiling back —
      // otherwise room-4's 2F-floor underside (tan wood-plank) shows through to the LDK
      // as a visible tan strip. Headroom on lower treads i=0..2 stays at ≥1.82 m which is
      // tight but acceptable for the bottom three steps.
      const F1_CEIL = [
        { x0: 0,    z0: 0,    x1: W,     z1: 2.90 },   // south of stair shaft (full width)
        { x0: 0,    z0: 2.90, x1: W,     z1: 3.60 },   // covers lower-flight south + LDK
        { x0: 0,    z0: 3.60, x1: 4.725, z1: 4.50 },   // west of upper-flight zone
        { x0: 0,    z0: 4.50, x1: W,     z1: D    },   // north of stair shaft (full width)
      ];
      for (const c of F1_CEIL) makeCeiling(c.x0, c.z0, c.x1, c.z1, F1H - FLOOR_T);

      // ── WINDOWS — shared helper + glass material (used by 1F and 2F) ──
      const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xeaf0f4, roughness: 0.12, metalness: 0.0, transmission: 0.82, thickness: 0.01, ior: 1.52 });
      // axis 'X' → window's span runs along x (used for z=const walls); 'Z' → span runs along z (x=const walls).
      function addWinFlex(axis, axisCoord, w, yBase, totalH, frameMat) {
        const span = w.b - w.a, mid = (w.a + w.b) / 2;
        const sillH = w.y0, lintelH = totalH - w.y1, glassH = w.y1 - w.y0;
        const xy = (axis === 'X');
        const dimX = xy ? span : WT;
        const dimZ = xy ? WT   : span;
        const px = xy ? mid : axisCoord;
        const pz = xy ? axisCoord : mid;
        // 2-layer skin when frameMat is exterior cladding (not wallMat).
        const use2Layer = frameMat && frameMat !== wallMat;
        let outerSign = 0;
        if (use2Layer) {
          if (xy) outerSign = (axisCoord >= D / 2) ? +1 : -1;
          else    outerSign = (axisCoord >= W / 2) ? +1 : -1;
        }
        function placeFrame(h, yCenter) {
          if (use2Layer) {
            const slabDimX = xy ? span : WT / 2;
            const slabDimZ = xy ? WT / 2 : span;
            const off = WT / 4;
            const dxOff = xy ? 0 : outerSign * off;
            const dzOff = xy ? outerSign * off : 0;
            const outerSlab = new THREE.Mesh(new THREE.BoxGeometry(slabDimX, h, slabDimZ), frameMat);
            outerSlab.position.set(px + dxOff, yCenter, pz + dzOff);
            S.group.add(outerSlab);
            const innerSlab = new THREE.Mesh(new THREE.BoxGeometry(slabDimX, h, slabDimZ), wallMat);
            innerSlab.position.set(px - dxOff, yCenter, pz - dzOff);
            S.group.add(innerSlab);
          } else {
            const box = new THREE.Mesh(new THREE.BoxGeometry(dimX, h, dimZ), frameMat || wallMat);
            box.position.set(px, yCenter, pz);
            S.group.add(box);
          }
        }
        if (sillH > 0) placeFrame(sillH, yBase + sillH / 2);
        if (lintelH > 0) placeFrame(lintelH, yBase + w.y1 + lintelH / 2);
        const gx = xy ? span : 0.04;
        const gz = xy ? 0.04 : span;
        const glass = new THREE.Mesh(new THREE.BoxGeometry(gx, glassH, gz), glassMat);
        glass.position.set(px, yBase + (w.y0 + w.y1) / 2, pz);
        S.group.add(glass);
      }

      // ── DOOR helper: closed panel filling a wall gap, with lever handles on both faces.
      // axis 'X' = panel sits in a z=const wall (panel normal along Z).
      // axis 'Z' = panel sits in a x=const wall (panel normal along X).
      // Adds a transom (wall-coloured fill) above the door up to ceiling.
      function addDoor(axis, axisCoord, a, b, yBase, ceilH, mat, type) {
        type = type || 'hinged';
        const w = b - a, mid = (a + b) / 2;
        const DH = 2.0, DT = 0.04;
        const xy = (axis === 'X');
        const dimX = xy ? w  : DT;
        const dimZ = xy ? DT : w;
        const px = xy ? mid : axisCoord;
        const pz = xy ? axisCoord : mid;
        const panel = new THREE.Mesh(new THREE.BoxGeometry(dimX, DH, dimZ), mat);
        panel.position.set(px, yBase + DH / 2, pz);
        S.group.add(panel);
        // Transom panel above door (matches wall thickness/colour)
        const tH = ceilH - DH;
        if (tH > 0.001) {
          const tDimX = xy ? w  : WT;
          const tDimZ = xy ? WT : w;
          const transom = new THREE.Mesh(new THREE.BoxGeometry(tDimX, tH, tDimZ), wallMat);
          transom.position.set(px, yBase + DH + tH / 2, pz);
          S.group.add(transom);
        }
        // Architrave (door casing) — thin painted-trim strips framing the door opening on each
        // wall face. JP residential casing is typically ~70 mm wide, sticking ~12 mm proud of the wall.
        const casW = 0.07, casD = 0.012;
        for (const sign of [-1, +1]) {
          const off = sign * (WT / 2 + casD / 2);
          // Two vertical jambs (one each side of opening)
          for (const edge of [a - casW / 2, b + casW / 2]) {
            const lx = xy ? edge : axisCoord + off;
            const lz = xy ? axisCoord + off : edge;
            const lDimX = xy ? casW : casD;
            const lDimZ = xy ? casD : casW;
            const jamb = new THREE.Mesh(new THREE.BoxGeometry(lDimX, DH + casW, lDimZ), trimMat);
            jamb.position.set(lx, yBase + (DH + casW) / 2, lz);
            S.group.add(jamb);
          }
          // Top header
          const hx = xy ? mid : axisCoord + off;
          const hz = xy ? axisCoord + off : mid;
          const hDimX = xy ? (w + 2 * casW) : casD;
          const hDimZ = xy ? casD : (w + 2 * casW);
          const head = new THREE.Mesh(new THREE.BoxGeometry(hDimX, casW, hDimZ), trimMat);
          head.position.set(hx, yBase + DH + casW / 2, hz);
          S.group.add(head);
        }
        if (type === 'bi-fold') {
          // Vertical center seam — slightly darker recessed-look strip suggesting the fold line.
          const seamMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.85 });
          const seamW = 0.015;
          const sDimX = xy ? seamW : DT + 0.006;
          const sDimZ = xy ? DT + 0.006 : seamW;
          const seam = new THREE.Mesh(new THREE.BoxGeometry(sDimX, DH * 0.96, sDimZ), seamMat);
          seam.position.set(px, yBase + DH / 2, pz);
          S.group.add(seam);
          // Two thin vertical finger-pulls per face, one each side of the seam, near the top.
          const pullW = 0.012, pullH = 0.18, pullD = 0.012;
          for (const sign of [-1, +1]) {
            for (const pSide of [-1, +1]) {
              const offset = pSide * (w * 0.18);
              const hx = xy ? mid + offset : axisCoord + sign * (DT / 2 + pullD);
              const hz = xy ? axisCoord + sign * (DT / 2 + pullD) : mid + offset;
              const hDimX = xy ? pullW : pullD;
              const hDimZ = xy ? pullD : pullW;
              const pull = new THREE.Mesh(new THREE.BoxGeometry(hDimX, pullH, hDimZ), doorHandleMat);
              pull.position.set(hx, yBase + DH * 0.85, hz);
              S.group.add(pull);
            }
          }
        } else if (type === 'hinged' || !type) {
          // Hinged: lever handles + 3 hinge cubes on the opposite edge.
          const hW = 0.10, hH = 0.025, hD = 0.05;
          const handlePos = a + w * 0.75;
          for (const sign of [-1, +1]) {
            const hx = xy ? handlePos : axisCoord + sign * (DT / 2 + hD / 2);
            const hz = xy ? axisCoord + sign * (DT / 2 + hD / 2) : handlePos;
            const hDimX = xy ? hW : hD;
            const hDimZ = xy ? hD : hW;
            const handle = new THREE.Mesh(new THREE.BoxGeometry(hDimX, hH, hDimZ), doorHandleMat);
            handle.position.set(hx, yBase + 1.0, hz);
            S.group.add(handle);
          }
          const hingeMat = new THREE.MeshStandardMaterial({ color: 0x5c5c5c, metalness: 0.6, roughness: 0.4 });
          const hgW = 0.025, hgH = 0.08, hgD = DT + 0.008;
          const hingeEdge = a + 0.03;
          const hingeYs = [yBase + 0.28, yBase + DH * 0.5, yBase + DH - 0.28];
          for (const hy of hingeYs) {
            const hgx = xy ? hingeEdge : axisCoord;
            const hgz = xy ? axisCoord : hingeEdge;
            const hgDimX = xy ? hgW : hgD;
            const hgDimZ = xy ? hgD : hgW;
            const hinge = new THREE.Mesh(new THREE.BoxGeometry(hgDimX, hgH, hgDimZ), hingeMat);
            hinge.position.set(hgx, hy, hgz);
            S.group.add(hinge);
          }
        } else if (type === 'sliding') {
          // Sliding door — thin top track + recessed finger pulls on each face. Panel itself
          // already drawn above as a flat rectangle covering the opening.
          const trackMat = new THREE.MeshStandardMaterial({ color: 0xb0b0b0, roughness: 0.4, metalness: 0.4 });
          const tDimX = xy ? w  : 0.02;
          const tDimZ = xy ? 0.02 : w;
          const track = new THREE.Mesh(new THREE.BoxGeometry(tDimX, 0.025, tDimZ), trackMat);
          track.position.set(px, yBase + DH + 0.01, pz);
          S.group.add(track);
          for (const sign of [-1, +1]) {
            const fx = xy ? a + w * 0.78 : axisCoord + sign * (DT / 2 + 0.003);
            const fz = xy ? axisCoord + sign * (DT / 2 + 0.003) : a + w * 0.78;
            const fDimX = xy ? 0.10 : 0.006;
            const fDimZ = xy ? 0.006 : 0.10;
