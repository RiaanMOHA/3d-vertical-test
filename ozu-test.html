<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>if(new URLSearchParams(location.search).has('journey'))document.documentElement.classList.add('journey-mode');</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1a1a1a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="ozu-1" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="180x180" href="/apple-touch-icon.png" />
<title>ozu-test — 3D projects</title>
<style>
  /* journey-mode: hide own nav when embedded in value-add-journey.html */
  .journey-mode #dock,
  .journey-mode #back-link,
  .journey-mode #entry-hint,
  .journey-mode #views-popover,
  .journey-mode #corner-hotspots-layer,
  .journey-mode #lights-btn,
  .journey-mode #lights-divider { display: none !important; }

  /* === Liquid Glass tokens (iOS 26 / visionOS 26) ===
     Tuned for WCAG AA: white text on --glass-bg yields ≥4.5:1 over
     bright scenes (exterior day) and ≥7:1 over dark scenes (interior). */
  :root {
    --glass-bg: rgba(28,28,30,0.78);
    --glass-bg-hover: rgba(44,44,46,0.85);
    --glass-bg-prominent: rgba(255,255,255,0.95);
    --glass-stroke: rgba(255,255,255,0.16);
    --glass-stroke-prominent: rgba(255,255,255,0.65);
    --glass-blur: none;
    --glass-highlight: linear-gradient(180deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0) 38%);
    --glass-inner-shadow: inset 0 -1px 0 rgba(0,0,0,0.18);
    --glass-elevation: 0 8px 24px rgba(0,0,0,0.18), 0 1px 2px rgba(0,0,0,0.12);
    --text-on-glass: #fff;
    --text-on-prominent: #111;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --safe-left: env(safe-area-inset-left, 0px);
    --safe-right: env(safe-area-inset-right, 0px);
  }

  html { -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100svh; overflow: hidden;
    overscroll-behavior: none;
    background: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    color: #fff;
  }
  #app { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .ui { position: absolute; pointer-events: none; user-select: none; font-size: 13px; letter-spacing: 0.02em; }

  /* === Hide legacy chip wrappers — JS still uses them for state === */
  #chips, #tod-chips, #project-badge, #hints, #room-label { display: none !important; }

  /* === Corner-jump hotspots ===
     Floating dots in each corner of room-1 the user can click to teleport
     the camera there. Screen-overlay only — projected from world-space each
     frame in JS. Visible regardless of wall occlusion so they stay
     discoverable from the default "outside the room" orbit framing. */
  #corner-hotspots-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 40;
  }
  .corner-hotspot {
    position: absolute;
    left: 0; top: 0;
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; margin: 0; border: 0;
    background: transparent;
    cursor: pointer;
    pointer-events: auto;
    will-change: transform;
  }
  .corner-hotspot__dot {
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.95);
    box-shadow:
      0 0 0 3px rgba(0, 0, 0, 0.22),
      0 2px 6px rgba(0, 0, 0, 0.40);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    animation: corner-pulse 2.6s ease-in-out infinite;
  }
  .corner-hotspot:hover  .corner-hotspot__dot,
  .corner-hotspot:focus-visible .corner-hotspot__dot {
    transform: scale(1.25);
    box-shadow:
      0 0 0 3px rgba(0, 122, 255, 0.95),
      0 2px 8px rgba(0, 0, 0, 0.45);
  }
  .corner-hotspot:focus-visible {
    outline: 2px solid #007AFF;
    outline-offset: 2px;
    border-radius: 50%;
  }
  @keyframes corner-pulse {
    0%, 100% { opacity: 0.85; }
    50%      { opacity: 1.00; }
  }
  @media (prefers-reduced-motion: reduce) {
    .corner-hotspot__dot { animation: none; }
  }

  /* === Top-center: entry hint pill ===
     Briefly shown after each scene switch so users learn the controls
     without us having to print them anywhere permanent. Glass styling
     matches dock + back-link. Sized for iPhone SE (375 px) up; clears the
     back button on the leading side via centred max-width. */
  .entry-hint {
    position: absolute;
    top: calc(14px + var(--safe-top));
    left: 50%;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--glass-bg);
    background-image: var(--glass-highlight);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-inner-shadow), var(--glass-elevation);
    color: var(--text-on-glass);
    font-size: 13px; line-height: 1.3; font-weight: 500;
    letter-spacing: 0.01em;
    white-space: nowrap;
    pointer-events: none;
    user-select: none;
    z-index: 50;
    /* Reserve 72 px on each side for the back-link (left) + matching gutter
       (right). Falls back to ellipsis on the smallest phones if the text is
       ever longer than the available pill width. */
    max-width: calc(100vw - 144px - var(--safe-left) - var(--safe-right));
    overflow: hidden;
    text-overflow: ellipsis;
    opacity: 0;
    transform: translate(-50%, -8px);
    transition: opacity 220ms ease, transform 220ms ease;
  }
  .entry-hint.show {
    opacity: 1;
    transform: translate(-50%, 0);
  }
  @media (max-width: 420px) {
    .entry-hint { font-size: 12px; padding: 7px 14px; }
  }

  /* === Top-leading: glass back button (icon-only, 44pt) === */
  #back-link {
    position: absolute;
    top: calc(14px + var(--safe-top));
    left: calc(14px + var(--safe-left));
    width: 44px; height: 44px;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 0; border-radius: 999px;
    background: var(--glass-bg);
    background-image: var(--glass-highlight);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-inner-shadow), var(--glass-elevation);
    color: var(--text-on-glass);
    text-decoration: none;
    font-size: 18px; line-height: 1; font-weight: 500;
    pointer-events: auto;
    transition: background 0.18s ease, transform 0.12s ease;
  }
  #back-link:hover { background: var(--glass-bg-hover); }
  #back-link:active { transform: scale(0.96); }

  /* === Bottom-center dock: glass capsule hosting scene segments + views === */
  #dock {
    position: absolute;
    left: 50%;
    bottom: calc(20px + var(--safe-bottom));
    transform: translateX(-50%);
    display: inline-flex; align-items: center;
    height: 56px; padding: 6px;
    border-radius: 999px;
    background: var(--glass-bg);
    background-image: var(--glass-highlight);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-stroke);
    box-shadow: var(--glass-inner-shadow), var(--glass-elevation);
    pointer-events: auto;
    max-width: calc(100vw - 28px - var(--safe-left) - var(--safe-right));
  }
  .dock-divider {
    width: 1px; align-self: stretch; margin: 6px 6px;
    background: rgba(255,255,255,0.16);
    border-radius: 1px;
  }

  /* === Scene segmented control inside the dock === */
  #scene-segment {
    display: inline-flex; gap: 2px;
    padding: 2px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
  }
  #scene-segment .seg {
    pointer-events: auto;
    height: 40px; padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-on-glass);
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer; white-space: nowrap;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
  }
  #scene-segment .seg:hover { background: var(--glass-bg-hover); }
  #scene-segment .seg:active { transform: scale(0.96); }
  #scene-segment .seg.active {
    background: var(--glass-bg-prominent);
    border-color: var(--glass-stroke-prominent);
    color: var(--text-on-prominent);
  }

  /* === Direct dock buttons (Views, Lights, any future control) ===
     Targets every <button> placed directly inside #dock so new controls
     inherit the iOS Liquid Glass pill styling without a CSS edit. */
  #dock > button {
    pointer-events: auto;
    height: 40px; padding: 0 14px;
    display: inline-flex; align-items: center; gap: 6px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text-on-glass);
    font: inherit; font-size: 14px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer; white-space: nowrap;
    transition: background 0.18s ease, color 0.18s ease, transform 0.12s ease;
  }
  #dock > button:hover { background: var(--glass-bg-hover); }
  #dock > button:active { transform: scale(0.96); }
  #dock > button .caret { font-size: 11px; opacity: 0.75; }
  #dock > button.active {
    background: var(--glass-bg-prominent);
    border-color: var(--glass-stroke-prominent);
    color: var(--text-on-prominent);
  }
  /* Honour the HTML hidden attribute — without this, our display:inline-flex
     above wins over the browser default and the button stays visible even
     when JS marks it hidden. Generic so any future dock button benefits. */
  #dock > button[hidden] { display: none; }

  /* === Popovers — visually distinct from the dock === */
  .popover {
    position: absolute;
    z-index: 50;
    padding: 8px;
    border-radius: 14px;
    background: #2c2c2e;
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 12px 32px rgba(0,0,0,0.45);
    pointer-events: auto;
    min-width: 180px;
  }
  .popover[hidden] { display: none; }
  #views-popover {
    bottom: calc(20px + var(--safe-bottom) + 56px + 32px);
    left: 50%;
    transform: translateX(-50%);
    max-width: 360px;
    width: max-content;
    max-height: calc(100svh - var(--safe-top) - var(--safe-bottom) - 20px - 56px - 32px - 24px);
    overflow-y: auto;
    overscroll-behavior: contain;
  }

  /* === Views popover hosts #view-chips (existing JS populates it) === */
  #views-popover #view-chips {
    position: static;
    top: auto; left: auto; transform: none;
    display: flex; flex-direction: column; gap: 6px;
    align-items: stretch;
    pointer-events: auto;
  }
  #views-popover .chip-row {
    display: flex; flex-wrap: wrap; gap: 6px; justify-content: center;
  }
  .view-chip {
    pointer-events: auto;
    height: 32px; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    border: 1px solid var(--glass-stroke);
    color: var(--text-on-glass);
    font: inherit; font-size: 13px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer; white-space: nowrap;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
    transition: background 0.18s ease, transform 0.12s ease;
  }
  .view-chip:hover { background: rgba(255,255,255,0.16); }
  .view-chip:active { transform: scale(0.96); }
  .view-chip.active {
    background: var(--glass-bg-prominent);
    border-color: var(--glass-stroke-prominent);
    color: var(--text-on-prominent);
  }
  .qa-view {
    pointer-events: auto;
    height: 28px; padding: 0 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--glass-stroke);
    color: var(--text-on-glass);
    font: inherit; font-size: 11px; font-weight: 600; letter-spacing: 0.01em;
    cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .qa-view:hover { background: rgba(255,255,255,0.14); }
  .qa-view.active {
    background: var(--glass-bg-prominent);
    color: var(--text-on-prominent);
    border-color: var(--glass-stroke-prominent);
  }

  kbd { display: inline-block; padding: 1px 6px; background: rgba(255,255,255,0.15); border-radius: 3px; font-family: inherit; font-size: 12px; }

  /* === Responsive breakpoints === */
  @media (max-width: 480px) {
    #dock { height: 52px; padding: 5px; }
    #scene-segment .seg { height: 38px; padding: 0 11px; font-size: 13px; }
    #dock > button { height: 38px; padding: 0 11px; font-size: 13px; }
    #back-link { width: 40px; height: 40px; font-size: 17px; }
    #views-popover {
      bottom: calc(20px + var(--safe-bottom) + 52px + 24px);
      max-height: calc(100svh - var(--safe-top) - var(--safe-bottom) - 20px - 52px - 24px - 16px);
      max-width: calc(100vw - 28px - var(--safe-left) - var(--safe-right));
    }
    .popover { min-width: 160px; }
  }
  @media (min-width: 768px) {
    #dock { height: 60px; padding: 8px; }
    #scene-segment .seg, #dock > button { height: 44px; }
    #back-link { width: 60px; height: 60px; font-size: 22px; }
  }
  @media (min-width: 1024px) {
    #dock { max-width: 720px; }
    #views-popover { max-width: 540px; }
  }
  #back-link:focus-visible,
  #scene-segment .seg:focus-visible,
  #dock > button:focus-visible,
  .view-chip:focus-visible,
  .qa-view:focus-visible {
    outline: 2px solid #0A84FF;
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    #back-link, #scene-segment .seg, #views-btn, .view-chip {
      transition: none;
    }
    #back-link:active, #scene-segment .seg:active, #views-btn:active, .view-chip:active {
      transform: none;
    }
  }
</style>
</head>
<body>
<div id="app"></div>

<!-- Top-leading: glass back button (icon only) -->
<a id="back-link" href="index.html" aria-label="Back to projects">←</a>

<!-- Top-center: brief on-entry control hint. Shown after each scene switch,
     auto-fades so it doesn't sit permanently in the user's view. -->
<div id="entry-hint" class="entry-hint" aria-live="polite">drag to look · pinch to zoom</div>

<!-- Corner-jump hotspots — populated by JS. Hidden unless room-1 is active. -->
<div id="corner-hotspots-layer" hidden></div>

<!-- Bottom-center: glass dock with scene segmented control + views button -->
<div id="dock" role="toolbar" aria-label="Scene controls">
  <div id="scene-segment" role="group" aria-label="Scene">
    <button class="seg chip active" type="button" data-scene="exterior">exterior</button>
    <button class="seg chip" type="button" data-scene="room-1">room 1</button>
    <button class="seg chip" type="button" data-scene="room-2">room 2</button>
    <button class="seg chip" type="button" data-scene="room-3">room 3</button>
    <button class="seg chip" type="button" data-scene="room-4">room 4</button>
    <button class="seg chip" type="button" data-scene="interior">interior</button>
  </div>
  <div class="dock-divider" aria-hidden="true"></div>
  <button id="views-btn" type="button" aria-haspopup="menu" aria-expanded="false">
    <span>views</span>
    <span class="caret" aria-hidden="true">▴</span>
  </button>
  <div id="lights-divider" class="dock-divider" aria-hidden="true" hidden></div>
  <button id="lights-btn" type="button" aria-pressed="false" hidden>lights</button>
</div>

<!-- Views popover (existing populateViewChips fills #view-chips) -->
<div id="views-popover" class="popover" role="menu" hidden>
  <div id="view-chips"></div>
</div>

<!-- Legacy elements kept for JS compatibility (hidden via CSS) -->
<div id="project-badge" aria-hidden="true">ozu-test</div>
<div id="room-label" class="ui" aria-hidden="true">—</div>

<!-- Import map so example modules (HDRLoader etc.) can resolve `from 'three'` -->
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.min.js"
  }
}
</script>

<script type="module">
// Three.js r184 (May 2026) loaded as ESM from local vendor folder.
// Works offline once vendor/ + ozu-test/hdri/ are populated.
import * as THREE from 'three';
import { HDRLoader } from './vendor/three/examples/jsm/loaders/HDRLoader.js';
import { RoundedBoxGeometry } from './vendor/three/examples/jsm/geometries/RoundedBoxGeometry.js';
// Note: GLTFLoader is NOT imported here because the project's vendored
// three bundle is `three.module.min.js`, which is the minimal WebGL core
// and does not re-export the ~75 symbols GLTFLoader pulls in (Bone,
// AnimationClip, FileLoader, etc.). Adding the import halted the whole
// module. A glb pipeline for the cloth-simmed sheet is still desirable
// (textures live at ozu-test/room-1-textures/bedding/sheet/sheet.glb) —
// when we vendor a fuller bundle (e.g. swap to three.webgpu.js which
// exports the full surface), we can re-enable the GLTFLoader import and
// switch the sheet to load that mesh.
// RectAreaLight LTC: WebGPU path (RectAreaLightTexturesLib) is disabled here
// because we render via WebGLRenderer below. The WebGL counterpart
// (RectAreaLightUniformsLib) needs UniformsLib which the minified bundle
// drops, so it can't be initialised either. Result: any RectAreaLight in the
// scene falls back to default un-LUT'd behaviour (slightly dimmer, less
// physically accurate). Acceptable trade-off until a non-minified build is
// vendored.

(function() {
  'use strict';

  const container = document.getElementById('app');
  const roomLabel = document.getElementById('room-label');

  // ---------- Renderer / camera / scene ----------
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xeef2f6);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 200);
  camera.position.set(5, 6, 5);

  const onResize = () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  };
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', () => setTimeout(onResize, 100));

  // ---------- Constants ----------
  const WT = 0.105;        // wall thickness
  const CH = 2.4;          // ceiling height

  // ---------- Materials (shared) ----------
  const matExt       = new THREE.MeshStandardMaterial({ color: 0xd8d2c5, roughness: 0.9 });
  const matInt       = new THREE.MeshStandardMaterial({ color: 0xe8e2d5, roughness: 0.95 });
  const matFloor     = new THREE.MeshStandardMaterial({ color: 0xc9a67a, roughness: 0.85 });
  const matFloorTile = new THREE.MeshStandardMaterial({ color: 0xdcdcd6, roughness: 0.9 });
  const matCeil      = new THREE.MeshStandardMaterial({ color: 0xf1ede4, roughness: 0.95 });
  const matCeilHatch = new THREE.MeshStandardMaterial({ color: 0xb8b2a5, roughness: 0.95 });
  const matStair     = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 0.8 });
  const matMetal     = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.5, metalness: 0.6 });
  const matAC        = new THREE.MeshStandardMaterial({ color: 0xf4f4f0, roughness: 0.6 });
  const matToilet    = new THREE.MeshPhysicalMaterial({ color: 0xfafaf6, roughness: 0.35, clearcoat: 1.0, clearcoatRoughness: 0.05 });

  // Interior-room materials
  const matWall      = new THREE.MeshStandardMaterial({ color: 0xb5a99a, roughness: 0.95 });
  const matTrimWhite = new THREE.MeshStandardMaterial({ color: 0xf5f5f5, roughness: 0.7 });
  const matTrimCrown = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, roughness: 0.7 });
  const matCurtain   = new THREE.MeshStandardMaterial({ color: 0xd5cec3, roughness: 1, side: THREE.DoubleSide });
  const matDesk      = new THREE.MeshStandardMaterial({ color: 0x6b3a2a, roughness: 0.55 });
  const matShelfWood = new THREE.MeshStandardMaterial({ color: 0x5c3525, roughness: 0.6 });
  const matBlackMet  = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.5, metalness: 0.5 });
  const matChair     = new THREE.MeshStandardMaterial({ color: 0x5c3d2e, roughness: 0.6 });
  const matMattress  = new THREE.MeshStandardMaterial({ color: 0xf4eddf, roughness: 0.9 });
  const matPillow    = new THREE.MeshStandardMaterial({ color: 0x3a3530, roughness: 0.85 });
  const matLampWood  = new THREE.MeshStandardMaterial({ color: 0xb07840, roughness: 0.6 });
  const matLampShade = new THREE.MeshStandardMaterial({ color: 0xe8d8b8, roughness: 0.7, emissive: 0xffd888, emissiveIntensity: 0.45 });

  // ---------- Procedural plank texture ----------
  function plankTex(baseHex, plankCount, seed) {
    const cvs = document.createElement('canvas');
    cvs.width = 512; cvs.height = 512;
    const ctx = cvs.getContext('2d');
    // base fill
    ctx.fillStyle = '#' + baseHex.toString(16).padStart(6, '0');
    ctx.fillRect(0, 0, 512, 512);
    let s = seed || 1;
    function rnd() { s = (s * 9301 + 49297) % 233280; return s / 233280; }
    const plankH = 512 / plankCount;
    const baseR = (baseHex >> 16) & 0xff;
    const baseG = (baseHex >> 8) & 0xff;
    const baseB = baseHex & 0xff;
    for (let i = 0; i < plankCount; i++) {
      const shade = (rnd() - 0.5) * 32;
      const r = Math.max(0, Math.min(255, baseR + shade));
      const g = Math.max(0, Math.min(255, baseG + shade));
      const b = Math.max(0, Math.min(255, baseB + shade));
      ctx.fillStyle = `rgb(${r|0}, ${g|0}, ${b|0})`;
      ctx.fillRect(0, i * plankH, 512, plankH);
      // gap line
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.fillRect(0, i * plankH, 512, 1);
      // grain strokes
      ctx.strokeStyle = `rgba(0,0,0,${0.04 + rnd() * 0.04})`;
      ctx.lineWidth = 1;
      for (let j = 0; j < 24; j++) {
        const y = i * plankH + rnd() * plankH;
        const x1 = rnd() * 512;
        const x2 = x1 + 30 + rnd() * 120;
        ctx.beginPath();
        ctx.moveTo(x1, y);
        ctx.lineTo(x2, y + (rnd() - 0.5) * 2);
        ctx.stroke();
      }
    }
    const tex = new THREE.CanvasTexture(cvs);
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 8;
    return tex;
  }

  // ---------- Post-processing pipeline (room-1 standalone only) ----------
  // EffectComposer with SSAO (corner darkness), UnrealBloom (light glow),
  // Post-processing pipeline (room-1 standalone only). Exterior + interior
  // render through the plain renderer.render path unchanged.
  // Post-processing composer was bypassed for AA quality reasons; r184 plain
  // renderer.render() with browser-native antialias is used everywhere now.
  // Keep these as nulls so the lights-toggle code can guard with `if (_room1Bloom)`.
  let _room1Composer = null;
  let _room1Bloom = null;

  // ---------- Real HDRI environment ----------
  // Loads a Poly Haven CC0 HDRI (suburban afternoon sky) via three.js HDRLoader,
  // PMREMs it, and assigns to scene.environment. Used by every scene so PBR
  // materials get real indirect light + reflections. Procedural cube fallback
  // remains in `_buildFallbackEnvMap` in case the HDRI fails to load.
  let _room1EnvMap = null;
  let _envLoaded = false;
  const _pmrem = new THREE.PMREMGenerator(renderer);
  _pmrem.compileEquirectangularShader();
  function _buildFallbackEnvMap() {
    const envScene = new THREE.Scene();
    const r = 5;
    const mk = c => new THREE.MeshBasicMaterial({ color: c, side: THREE.BackSide });
    // Cool blue afternoon-sky palette so the procedural fallback matches the kloppenheim
    // HDRI tone — the env swap on load is now invisible instead of warm→cool flash.
    // Order: [+X right, -X left, +Y top, -Y bottom, +Z front, -Z back]
    const mats = [
      mk(0xc8d4e0), mk(0xc8d4e0), mk(0xb8d0e8),
      mk(0x8a8478), mk(0xc8d4e0), mk(0xc8d4e0),
    ];
    const cube = new THREE.Mesh(new THREE.BoxGeometry(r*2, r*2, r*2), mats);
    envScene.add(cube);
    const fallback = _pmrem.fromScene(envScene, 0.04).texture;
    return fallback;
  }
  function buildRoom1EnvMap() { return _room1EnvMap || _buildFallbackEnvMap(); }
  // Kick off the HDRI load. Once it lands, replace scene.environment globally.
  new HDRLoader().load(
    'ozu-test/hdri/kloppenheim_06_puresky_2k.hdr',
    (texture) => {
      texture.mapping = THREE.EquirectangularReflectionMapping;
      const envMap = _pmrem.fromEquirectangular(texture).texture;
      _room1EnvMap = envMap;
      _envLoaded = true;
      texture.dispose();
      // If a scene is already active, swap its environment immediately.
      if (scene && scene.environment !== envMap) scene.environment = envMap;
    },
    undefined,
    (err) => { console.warn('HDRI load failed, using procedural fallback:', err); }
  );

  // Phase D — through-window backdrop. Was the kloppenheim_06_2k HDRI (German
  // village); now a cropped Google Street View screenshot of the actual
  // location: Ozu, Kumamoto, 32°54'53.0"N 130°51'00.9"E. Loaded as a regular
  // 2D texture and assigned to scene.background only when room-1 is active —
  // three.js renders it as a screen-fitted backdrop visible behind the room
  // geometry (same role the HDRI had, minus the 360° rotation tracking, which
  // a rectilinear photo can't provide anyway). The puresky HDRI above is
  // still used for IBL lighting on PBR materials.
  let _room1BgTex = null;
  new THREE.TextureLoader().load(
    'ozu-test/streetview/driveway-backdrop.jpg',
    (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      _room1BgTex = texture;
      if (scene && activeScene === 'room-1') scene.background = texture;
    },
    undefined,
    (err) => { console.warn('Room-1 background photo failed to load:', err); }
  );

  // ---------- Procedural cream-siding texture (subtle horizontal courses) ----------
  // Builds a small canvas with a cream base + a thin darker line every ~40 mm. Applied
  // globally to the exterior cladding materials. Wall heights are uniform (2.50 m per
  // floor) so the per-mesh course count stays consistent.
  function creamSidingTex() {
    const cvs = document.createElement('canvas');
    cvs.width = 64; cvs.height = 256;
    const ctx = cvs.getContext('2d');
    ctx.fillStyle = '#e8e3d9';
    ctx.fillRect(0, 0, 64, 256);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.10)';
    for (let y = 32; y < 256; y += 32) {
      ctx.fillRect(0, y, 64, 1);
    }
    const tex = new THREE.CanvasTexture(cvs);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.anisotropy = 8;
    tex.colorSpace = THREE.SRGBColorSpace;
    // Canvas physical span: 256 px = 0.32 m (8 courses × 40 mm). Most walls are 2.50 m
    // tall × ~3 m wide, so default repeat ~ (9, 8). Caller can override via tex.clone().
    tex.repeat.set(9, 8);
    return tex;
  }

  // ---------- PBR texture helper (Poly Haven CC0 sets in ozu-test/room-1-textures/) ----------
  // Loads diff + normal + rough maps for the given slug, sets per-mesh repeat, returns a
  // MeshStandardMaterial. Available slugs locally: wood_floor, dark_wood. Each call clones
  // textures (browser caches the underlying file) so each mesh has its own UV repeat.
  function pbrMat(slug, repU, repV, extras = {}) {
    const loader = new THREE.TextureLoader();
    const base = `ozu-test/room-1-textures/${slug}/${slug}`;
    const map = loader.load(`${base}_diff.jpg`);
    map.colorSpace = THREE.SRGBColorSpace;
    const normalMap = loader.load(`${base}_nor_gl.jpg`);
    const roughnessMap = loader.load(`${base}_rough.jpg`);
    const aniso = renderer.capabilities.getMaxAnisotropy();
    for (const t of [map, normalMap, roughnessMap]) {
      t.wrapS = THREE.RepeatWrapping;
      t.wrapT = THREE.RepeatWrapping;
      t.repeat.set(repU, repV);
      t.anisotropy = aniso;
    }
    return new THREE.MeshStandardMaterial({ map, normalMap, roughnessMap, ...extras });
  }

  // ---------- Scene registry ----------
  const scenes = {};
  let activeScene = null;

  function registerScene(id, cfg) {
    const group = new THREE.Group();
    group.visible = false;
    scene.add(group);
    const S = {
      id, group,
      rooms: cfg.rooms || [],
      orbitTarget: cfg.orbitTarget,
      orbitPos: cfg.orbitPos,
      bg: cfg.bg || 0xeef2f6,
      build: cfg.build,
      viewpoints: cfg.viewpoints || [],
      fov: cfg.fov,
    };
    scenes[id] = S;
    cfg.build(S);
  }

  // ---------- Wall helper ----------
  function addWall(S, x1, z1, x2, z2, y1, y2, exterior) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    if (len < 0.001) return null;
    const h = y2 - y1;
    const mat = exterior ? matExt : matInt;
    const geom = new THREE.BoxGeometry(len, h, WT);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    mesh.rotation.y = -Math.atan2(dz, dx);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    S.group.add(mesh);
    return mesh;
  }

  function addWallMat(S, x1, z1, x2, z2, y1, y2, mat) {
    const dx = x2 - x1, dz = z2 - z1;
    const len = Math.hypot(dx, dz);
    if (len < 0.001) return null;
    const h = y2 - y1;
    const geom = new THREE.BoxGeometry(len, h, WT);
    const mesh = new THREE.Mesh(geom, mat);
    mesh.position.set((x1 + x2) / 2, (y1 + y2) / 2, (z1 + z2) / 2);
    mesh.rotation.y = -Math.atan2(dz, dx);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    S.group.add(mesh);
    return mesh;
  }

  // ---------- OZU-TEST EXTERIOR SCENE ----------
  registerScene('exterior', {
    orbitPos: new THREE.Vector3(12, 6, 14),
    orbitTarget: new THREE.Vector3(3.15, 2.5, 3.6),
    bg: 0xbbccd8,
    rooms: [
      { name: 'Ozu — exterior', x1: -10, z1: -10, x2: 16.3, z2: 17.2 },
    ],
    build: function(S) {
      const W = 6.3;        // building width (X)
      const D = 7.2;        // building depth (Z)
      const F1H = 2.5;      // 1F height
      const F2H = 2.5;      // 2F height
      const EAVE = 0.35;    // roof overhang
      const WT  = 0.15;     // wall thickness

      // ---------- materials ----------
      const matLower  = new THREE.MeshStandardMaterial({ color: 0x5a4838, roughness: 0.88 });   // dark brown siding
      const matUpper  = new THREE.MeshStandardMaterial({ map: creamSidingTex(), roughness: 0.92 });   // off-white panels with horizontal courses
      const matTrim   = new THREE.MeshStandardMaterial({ color: 0x262626, roughness: 0.7 });    // dark window frame
      const matGlass  = new THREE.MeshPhysicalMaterial({ color: 0xeaf0f4, roughness: 0.12, metalness: 0.0, transmission: 0.82, thickness: 0.01, ior: 1.52 });
      const matRoof   = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.9 });
      const matDoor   = new THREE.MeshStandardMaterial({ color: 0x2a1e14, roughness: 0.55 });
      const matPorch  = new THREE.MeshStandardMaterial({ color: 0xc8c0b0, roughness: 0.95 });
      const matStep   = new THREE.MeshStandardMaterial({ color: 0x8a8275, roughness: 0.95 });
      const matAsphalt = new THREE.MeshStandardMaterial({ color: 0x3e3e3e, roughness: 0.95 });
      const matConcrete = new THREE.MeshStandardMaterial({ color: 0xaaa8a0, roughness: 0.95 });
      const matGround  = new THREE.MeshStandardMaterial({ color: 0x7a7a6a, roughness: 1.0 });
      const matCurb    = new THREE.MeshStandardMaterial({ color: 0xbbbbb0, roughness: 0.9 });

      // ---------- ground / asphalt / parking ----------
      {
        const g = new THREE.PlaneGeometry(60, 60);
        const m = new THREE.Mesh(g, matGround);
        m.rotation.x = -Math.PI/2;

      // ---------- wall helpers ----------
      function solidWall(x1, z1, x2, z2, y1, y2, mat) {
        const dx = x2-x1, dz = z2-z1, len = Math.hypot(dx,dz);
        if (len < 0.01) return null;

        m.receiveShadow = true;

      // ---------- outer walls with openings ----------

      solidWall(0,    D, 0.60, D, 0,    BROWN_Y1, matLower);

      solidWall(0.60, D, 1.20, D, 1.80, BROWN_Y1, matLower);      // laundry lintel
      solidWall(1.20, D, 2.57, D, 0,    BROWN_Y1, matLower);
      solidWall(2.57, D, 2.83, D, 0,    1.10, matLower);          // bath 縦すべり 02607 sill
      solidWall(2.57, D, 2.83, D, 1.80, BROWN_Y1, matLower);      // bath lintel
      solidWall(2.83, D, 3.87, D, 0,    BROWN_Y1, matLower);
      solidWall(3.87, D, 4.23, D, 0,    1.50, matLower);          // toilet 横すべり 03603 sill
      solidWall(3.87, D, 4.23, D, 1.80, BROWN_Y1, matLower);      // toilet lintel
      solidWall(4.23, D, BROWN_X1, D, 0, BROWN_Y1, matLower);
      // Brown panel vertical board seams — thin shadow strips on the exterior face every
      // ~0.15 m, skipping window x ranges. Reads as ~150 mm vertical-board cladding.
      {
        const seamMat = new THREE.MeshStandardMaterial({ color: 0x3a2820, roughness: 0.85 });
        const seamW = 0.006, seamD = 0.010;

        for (let x = 0.15; x <= BROWN_X1 - 0.10; x += 0.15) {

          seam.position.set(x, BROWN_Y1 / 2, D + WT / 2 + seamD / 2);

      solidWall(0.505, D, 2.195, D, F1H+2.00, F1H+F2H, matUpper); // room-2 header
      solidWall(2.195, D, 3.020, D, F1H, F1H+F2H, matUpper);
      solidWall(3.020, D, 3.280, D, F1H, F1H+1.10, matUpper);     // 2F toilet 縦すべり 02609 sill
      solidWall(3.020, D, 3.280, D, F1H+2.00, F1H+F2H, matUpper); // 2F toilet header

      solidWall(0,    0, 3.20, 0, 0,    F1H, matUpper);     // solid wall west of secondary window

      // ---------- window glass + frames (thin panes sitting in the openings) ----------
      function paneFront(x1, x2, y1, y2, z) {

      // Front 1F panes
      paneFront(0.60, 1.20, 1.50, 1.80, D);                     // laundry 横すべり 06003
      paneFront(2.57, 2.83, 1.10, 1.80, D);                     // bath 縦すべり 02607

      // Back 2F panes
      paneFront(0.600, 2.100, F1H+1.10, F1H+2.00, 0);           // room-3 引違 15009
      paneFront(4.200, 5.700, F1H+1.10, F1H+2.00, 0);           // room-4 引違 15009
      // Left 1F panes
      paneSide(1.20, 1.46, 1.00, 1.90, 0);                      // LDK lower casement
      paneSide(3.30, 3.56, 1.00, 1.90, 0);                      // LDK upper casement
      // Left 2F panes
      paneSide(1.670, 1.930, F1H+1.10, F1H+2.00, 0);            // room-3 縦すべり 02609
      paneSide(5.720, 5.980, F1H+1.10, F1H+2.00, 0);            // room-2 縦すべり 02609
      // Right 2F panes
      paneSide(1.670, 1.930, F1H+1.10, F1H+2.00, W);            // room-4 縦すべり 02609
      paneSide(5.720, 5.980, F1H+1.10, F1H+2.00, W);            // room-1 縦すべり 02609

      // ---------- front door ----------
      {
        const g = new THREE.BoxGeometry(0.9, 2.05, 0.08);
        const m = new THREE.Mesh(g, matDoor);
        m.position.set(5.40, 1.025, D + 0.02);
        S.group.add(m);
        // door handle
        const hG = new THREE.BoxGeometry(0.04, 0.04, 0.05);

      { id: 'corridor-1',            label: 'corridor-1',            parent: '1f', pos: [5.5, 1.6, 4.6], tgt: [5.0, 1.6, 7.0] },

      { id: 'corridor-2-toilet-2-f', label: 'corridor-2-toilet-2-f', parent: '2f', pos: [3.5, 4.1, 4.0], tgt: [3.0, 4.0, 6.5] },
    ],
    build: function(S) {
      const W = 6.30, D = 7.20;
      const F1H = 2.50, F2H = 2.50;       // match exterior floor heights
      const WT = 0.10, FLOOR_T = 0.05;

      // Floor colours
      const CLR = {
        wall: 0xeeeae3,
        floor_ldk: 0xc9b89a,
        floor_genkan: 0x8a7a66,
        floor_corridor: 0xd6c9b6,
        floor_stairs: 0xa68a64,
        floor_bath: 0x9bb5c2,
        floor_washroom: 0xc7d6df,
        floor_toilet: 0xc4a888,

        floor_closet: 0xa89e90,
      };
      const DEBUG_2F_LINES = false;
      const wallMat = new THREE.MeshStandardMaterial({ color: DEBUG_2F_LINES ? 0xff0000 : CLR.wall, roughness: 0.95 });
      // Outer-wall cladding (matches exterior scene + photos)
      const matLowerExt = new THREE.MeshStandardMaterial({ color: 0x5a4838, roughness: 0.88 });   // dark brown panel
      const matUpperExt = new THREE.MeshStandardMaterial({ map: creamSidingTex(), roughness: 0.92 });   // off-white cream with horizontal courses

      const closetDoorMat = new THREE.MeshStandardMaterial({ color: 0xe8dfd0, roughness: 0.6 });
      const doorHandleMat = new THREE.MeshStandardMaterial({ color: 0xc8cdd2, metalness: 0.85, roughness: 0.18 });
      // Painted-trim material: door casings (architrave), baseboards (巾木), crown molding (回り縁).
      // Modern JP residential trim is typically a clean off-white, slightly whiter than the wall paint.
      // NO polygonOffset — earlier versions had `polygonOffset: -1, -1` to suppress wall z-fight
      // where trim sits flush with the wall inner face, but that bias was strong enough to make
      // the trim WIN the z-test against the 2F floor at the baseboard / door-jamb intersections,
      // producing thin white lines on the bedroom floors in top-down views. Confirmed empirically:
      // toggling polygonOffset off (via the dbg materials) makes the lines disappear.
      const trimMat = new THREE.MeshStandardMaterial({
        color: DEBUG_2F_LINES ? 0x00ff00 : 0xfafaf6, roughness: 0.8
      });
      // Per-use-site trim debug materials. When DEBUG_2F_LINES is true each
      // trim caller renders in its own color so one screenshot identifies the
      // exact source of the 2F white lines. When DEBUG is off all of these
      // collapse back to plain trimMat (off-white).
      const matBaseDbg    = DEBUG_2F_LINES ? new THREE.MeshStandardMaterial({ color: 0xff00ff, roughness: 0.8 }) : trimMat;  // magenta  — bedroom baseboards
      const matCrownDbg   = DEBUG_2F_LINES ? new THREE.MeshStandardMaterial({ color: 0x00ffff, roughness: 0.8 }) : trimMat;  // cyan     — bedroom crowns
      const matJambDbg    = DEBUG_2F_LINES ? new THREE.MeshStandardMaterial({ color: 0xff8800, roughness: 0.8 }) : trimMat;  // orange   — door jambs
      const matHeaderDbg  = DEBUG_2F_LINES ? new THREE.MeshStandardMaterial({ color: 0x88ff00, roughness: 0.8 }) : trimMat;  // y-green  — door headers
      const matLdkTrimDbg = DEBUG_2F_LINES ? new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.8 }) : trimMat;  // white    — 1F LDK / corridor trim

      // PBR wood-floor textures (Poly Haven CC0 wood_floor set), tinted per room. The
      // browser caches the texture files; each mesh clones the textures for its own UV repeat.
      const FLOORS = {
        ldk:      { slug: 'wood_floor', density: 0.5, rough: 0.7,  color: CLR.floor_ldk },
        corridor: { slug: 'wood_floor', density: 0.5, rough: 0.75, color: CLR.floor_corridor },
        stairs:   { slug: 'wood_floor', density: 0.6, rough: 0.7,  color: CLR.floor_stairs },
        room4:    { slug: 'wood_floor', density: 0.5, rough: 0.75, color: CLR.floor_room4 },
        room:     { slug: 'wood_floor', density: 0.5, rough: 0.75, color: CLR.floor_room },
        toilet:   { slug: 'wood_floor', density: 0.6, rough: 0.8,  color: CLR.floor_toilet },
      };

      // Wall builders, parameterised by yBase (1F at y=0, 2F at y=F1H).
      // colorOrSpec is either a hex number (flat colour), a procedural {tex, density, rough}
      // entry (cloned per mesh), or a PBR {slug, density, rough, color} entry that loads
      // diff + normal + rough maps via the top-level pbrMat helper.
      function makeFloor(x0, z0, x1, z1, colorOrSpec, yBase, thickness) {
        const dx = x1 - x0, dz = z1 - z0;
        if (dx <= 0 || dz <= 0) return;
        let mat;
        if (typeof colorOrSpec === 'number') {
          mat = new THREE.MeshStandardMaterial({ color: colorOrSpec, roughness: 0.9 });
        } else if (colorOrSpec.slug) {
          const extras = { roughness: colorOrSpec.rough ?? 0.85 };
          if (colorOrSpec.color !== undefined) extras.color = colorOrSpec.color;
          mat = pbrMat(colorOrSpec.slug, dx * colorOrSpec.density, dz * colorOrSpec.density, extras);
        } else {
          const t = colorOrSpec.tex.clone();
          t.needsUpdate = true;
          t.wrapS = THREE.RepeatWrapping;
          t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(dx * colorOrSpec.density, dz * colorOrSpec.density);
          mat = new THREE.MeshStandardMaterial({ map: t, roughness: colorOrSpec.rough ?? 0.85 });
        }
        const t = thickness ?? FLOOR_T;
        const m = new THREE.Mesh(new THREE.BoxGeometry(dx, t, dz), mat);
        m.position.set((x0 + x1) / 2, yBase - t / 2, (z0 + z1) / 2);
        S.group.add(m);
      }
      function makeWall(x0, z0, x1, z1, height, yBase, mat, outerSign) {
        const dx = x1 - x0, dz = z1 - z0;
        const len = Math.hypot(dx, dz);
        if (len < 0.001) return;
        const midX = (x0 + x1) / 2, midY = yBase + height / 2, midZ = (z0 + z1) / 2;
        const yaw = -Math.atan2(dz, dx);
        if (outerSign && mat && mat !== wallMat) {
          // 2-layer outer wall: outer slab (mat = cladding) + inner slab (wallMat), each WT/2 thick.
          // Outward unit vector in world coords = local +Z rotated by yaw, scaled by outerSign.
          const nx = -dz / len * outerSign, nz = dx / len * outerSign;
          const off = WT / 4;
          const outerBox = new THREE.Mesh(new THREE.BoxGeometry(len, height, WT / 2), mat);
          outerBox.position.set(midX + nx * off, midY, midZ + nz * off);
          outerBox.rotation.y = yaw;
          S.group.add(outerBox);
          const innerBox = new THREE.Mesh(new THREE.BoxGeometry(len, height, WT / 2), wallMat);
          innerBox.position.set(midX - nx * off, midY, midZ - nz * off);
          innerBox.rotation.y = yaw;
          S.group.add(innerBox);
        } else {
          const m = new THREE.Mesh(new THREE.BoxGeometry(len, height, WT), mat || wallMat);
          m.position.set(midX, midY, midZ);
          m.rotation.y = yaw;
          S.group.add(m);
        }
      }
      function wallX(z, a, b, gaps, height, yBase, mat, outerSign) {
        let cur = a;
        const sorted = [...(gaps || [])].sort((p, q) => p[0] - q[0]);
        for (const [g0, g1] of sorted) {
          if (g0 > cur) makeWall(cur, z, g0, z, height, yBase, mat, outerSign);
          cur = Math.max(cur, g1);
        }
        if (cur < b) makeWall(cur, z, b, z, height, yBase, mat, outerSign);
      }

      // Ceilings — most rooms are plain warm off-white plaster. The wood-plank accent is
      // localized to the recess above the stair shaft upper flight. Color stays cream/whitewash
      // (NOT photo-accurate brown — visible from above where there's no roof, looked wrong).
      // White perimeter trim frames the panel (added separately).
      const CEIL_T = 0.04;
      const matCeiling = new THREE.MeshStandardMaterial({ color: DEBUG_2F_LINES ? 0xffff00 : 0xf3efe6, roughness: 0.92 });
      const ceilPlankTex = plankTex(0xeae3d6, 14, 47);
      ceilPlankTex.repeat.set(2.0, 1.0);
      const matPlankCeiling = new THREE.MeshStandardMaterial({ color: 0xf3efe6, roughness: 0.92, map: ceilPlankTex });
      function makeCeiling(x0, z0, x1, z1, yTop, mat) {
        const dx = x1 - x0, dz = z1 - z0;
        if (dx <= 0 || dz <= 0) return;
        const m = new THREE.Mesh(new THREE.BoxGeometry(dx, CEIL_T, dz), mat || matCeiling);
        m.position.set((x0 + x1) / 2, yTop - CEIL_T / 2, (z0 + z1) / 2);
        m.userData._isCeiling = true;
        m.userData._ceilingFloor = (yTop > F1H + 0.1) ? '2f' : '1f';
        S.group.add(m);
      }
      function wallZ(x, a, b, gaps, height, yBase, mat, outerSign) {
        let cur = a;
        const sorted = [...(gaps || [])].sort((p, q) => p[0] - q[0]);
        for (const [g0, g1] of sorted) {
          if (g0 > cur) makeWall(x, cur, x, g0, height, yBase, mat, outerSign);
          cur = Math.max(cur, g1);
        }
        if (cur < b) makeWall(x, cur, x, b, height, yBase, mat, outerSign);
      }

      // ───────────────── 1F ─────────────────
      // Each room owns its own footprint, no overlapping base layer. LDK is decomposed
      // into 7 rectangles that fit AROUND the kitchen / stairs / storage / wet-room /
      // corridor / genkan carve-outs so it doesn't underlie any of them. Everyone sits
      // at y=0 (genkan steps down to y=-0.15). Replaces the prior "LDK full-footprint
      // base + everyone else 1mm above" pattern that z-fought from top-down view.
      const F1_ROOMS = [
        // LDK (L-shape, 7 pieces)
        { id: 'ldk',      mat: FLOORS.ldk,           x0: 0,    z0: 0,    x1: W,    z1: 2.40 },  // bottom strip (full width)
        { id: 'ldk',      mat: FLOORS.ldk,           x0: 2.55, z0: 2.40, x1: W,    z1: 2.90 },  // right of kitchen
        { id: 'ldk',      mat: FLOORS.ldk,           x0: 2.55, z0: 2.90, x1: 5.40, z1: 3.60 },  // between kitchen and stairs
        { id: 'ldk',      mat: FLOORS.ldk,           x0: 2.55, z0: 3.60, x1: 3.60, z1: 4.50 },  // left of storage
        { id: 'ldk',      mat: FLOORS.ldk,           x0: 4.50, z0: 3.60, x1: 5.40, z1: 4.50 },  // right of storage, left of stairs
        { id: 'ldk',      mat: FLOORS.ldk,           x0: 1.80, z0: 4.50, x1: 4.50, z1: 4.80 },  // washroom-approach strip (north of LDK)
        { id: 'ldk',      mat: FLOORS.ldk,           x0: 3.60, z0: 4.80, x1: 4.50, z1: 5.40 },  // toilet-approach strip
        // Kitchen interior — continues the LDK light oak plank per kitchen/room-map.md.
        // Sits in the carve-out left by the LDK clip (x=0..2.55, z=2.40..4.50).
        { id: 'kitchen',  mat: FLOORS.ldk,           x0: 0,    z0: 2.40, x1: 2.55, z1: 4.50 },
        // Other rooms (each owns its footprint)
        { id: 'washroom', mat: CLR.floor_washroom,   x0: 0,    z0: 4.50, x1: 1.80, z1: D    },
        { id: 'bath',     mat: CLR.floor_bath,       x0: 1.80, z0: 4.80, x1: 3.60, z1: D    },
        { id: 'toilet',   mat: FLOORS.toilet,        x0: 3.60, z0: 5.40, x1: 4.50, z1: D    },
        { id: 'genkan',   mat: CLR.floor_genkan,     x0: 4.50, z0: 6.30, x1: W,    z1: D    },
        { id: 'corridor', mat: FLOORS.corridor,      x0: 4.50, z0: 4.50, x1: W,    z1: 6.30 },
        { id: 'storage',  mat: CLR.floor_storage,    x0: 3.60, z0: 3.60, x1: 4.50, z1: 4.50 },
        { id: 'stairs',   mat: FLOORS.stairs,        x0: 5.40, z0: 2.90, x1: W,    z1: 4.50 },
      ];
      for (const r of F1_ROOMS) {
        // Genkan 土間 sits 150 mm below the interior floor — universal in JP detached houses.
        // Everyone else flat at y=0 — no overlapping base, no 1mm z-fight from top view.
        const y = (r.id === 'genkan') ? -0.15 : 0;
        makeFloor(r.x0, r.z0, r.x1, r.z1, r.mat, y);
      }
      // 上がり框 (agarikamachi) — wood-stained lip step where the corridor floor meets the
      // sunk genkan tile. Runs across the full genkan width at z=6.30, 30 mm tall × 90 mm deep.
      {
        const matKamachi = new THREE.MeshStandardMaterial({ color: 0x6b4a2e, roughness: 0.55 });
        const kamachi = new THREE.Mesh(new THREE.BoxGeometry(W - 4.50, 0.18, 0.09), matKamachi);
        kamachi.position.set((4.50 + W) / 2, -0.07, 6.30 + 0.045);
        S.group.add(kamachi);
        // Vertical face of the step (between corridor floor at y=0 and genkan tile at y=-0.15)
        const matKamachiFace = new THREE.MeshStandardMaterial({ color: 0x4a3520, roughness: 0.7 });
        const kamachiFace = new THREE.Mesh(new THREE.BoxGeometry(W - 4.50, 0.15, 0.01), matKamachiFace);
        kamachiFace.position.set((4.50 + W) / 2, -0.075, 6.30);
        S.group.add(kamachiFace);
      }

      // 1F ceilings — flat plaster. The hole only covers the UPPER-flight footprint
      // (x=[4.05, W], z=[3.60, 4.50]) where stair elements rise above the ceiling level.
      // The lower flight's south portion (x=[5.40, W], z=[2.90, 3.60]) gets ceiling back —
      // otherwise room-4's 2F-floor underside (tan wood-plank) shows through to the LDK
      // as a visible tan strip. Headroom on lower treads i=0..2 stays at ≥1.82 m which is
      // tight but acceptable for the bottom three steps.
      // Kitchen (x=0..2.55, z=2.40..4.50) gets the whitewashed wood-plank ceiling
      // that continues from the LDK. The rest stays plain plaster. Strips below
      // are split around the kitchen so no two ceiling boxes overlap.
      const F1_CEIL = [
        { x0: 0,    z0: 0,    x1: W,     z1: 2.40, mat: matCeiling      },  // full width south of kitchen
        { x0: 0,    z0: 2.40, x1: 2.55,  z1: 4.50, mat: matPlankCeiling },  // KITCHEN — plank
        { x0: 2.55, z0: 2.40, x1: W,     z1: 2.90, mat: matCeiling      },  // right of kitchen, south band
        { x0: 2.55, z0: 2.90, x1: W,     z1: 3.60, mat: matCeiling      },  // right of kitchen, middle band (covers lower-flight south)
        { x0: 2.55, z0: 3.60, x1: 4.05,  z1: 4.50, mat: matCeiling      },  // right of kitchen, west of upper-flight zone (shaft east edge moved 4.725→4.05 for 3+4+6 stair)
        { x0: 0,    z0: 4.50, x1: W,     z1: D,    mat: matCeiling      },  // full width north of stair shaft
      ];
      for (const c of F1_CEIL) makeCeiling(c.x0, c.z0, c.x1, c.z1, F1H - FLOOR_T, c.mat);

      // ── WINDOWS — shared helper + glass material (used by 1F and 2F) ──
      const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xeaf0f4, roughness: 0.12, metalness: 0.0, transmission: 0.82, thickness: 0.01, ior: 1.52 });
      // axis 'X' → window's span runs along x (used for z=const walls); 'Z' → span runs along z (x=const walls).
      function addWinFlex(axis, axisCoord, w, yBase, totalH, frameMat) {
        const span = w.b - w.a, mid = (w.a + w.b) / 2;
        const sillH = w.y0, lintelH = totalH - w.y1, glassH = w.y1 - w.y0;
        const xy = (axis === 'X');
        const dimX = xy ? span : WT;
        const dimZ = xy ? WT   : span;
        const px = xy ? mid : axisCoord;
        const pz = xy ? axisCoord : mid;
        // 2-layer skin when frameMat is exterior cladding (not wallMat).
        const use2Layer = frameMat && frameMat !== wallMat;
        let outerSign = 0;
        if (use2Layer) {
          if (xy) outerSign = (axisCoord >= D / 2) ? +1 : -1;
          else    outerSign = (axisCoord >= W / 2) ? +1 : -1;
        }
        function placeFrame(h, yCenter) {
          if (use2Layer) {
            const slabDimX = xy ? span : WT / 2;
            const slabDimZ = xy ? WT / 2 : span;
            const off = WT / 4;
            const dxOff = xy ? 0 : outerSign * off;
            const dzOff = xy ? outerSign * off : 0;
            const outerSlab = new THREE.Mesh(new THREE.BoxGeometry(slabDimX, h, slabDimZ), frameMat);
            outerSlab.position.set(px + dxOff, yCenter, pz + dzOff);
            S.group.add(outerSlab);
            const innerSlab = new THREE.Mesh(new THREE.BoxGeometry(slabDimX, h, slabDimZ), wallMat);
            innerSlab.position.set(px - dxOff, yCenter, pz - dzOff);
            S.group.add(innerSlab);
          } else {
            const box = new THREE.Mesh(new THREE.BoxGeometry(dimX, h, dimZ), frameMat || wallMat);
            box.position.set(px, yCenter, pz);
            S.group.add(box);
          }
        }
        if (sillH > 0) placeFrame(sillH, yBase + sillH / 2);
        if (lintelH > 0) placeFrame(lintelH, yBase + w.y1 + lintelH / 2);
        const gx = xy ? span : 0.04;
        const gz = xy ? 0.04 : span;
        const glass = new THREE.Mesh(new THREE.BoxGeometry(gx, glassH, gz), glassMat);
        glass.position.set(px, yBase + (w.y0 + w.y1) / 2, pz);
        S.group.add(glass);
      }

      // ── DOOR helper: closed panel filling a wall gap, with lever handles on both faces.
      // axis 'X' = panel sits in a z=const wall (panel normal along Z).
      // axis 'Z' = panel sits in a x=const wall (panel normal along X).
      // Adds a transom (wall-coloured fill) above the door up to ceiling.
      function addDoor(axis, axisCoord, a, b, yBase, ceilH, mat, type) {
        type = type || 'hinged';
        const w = b - a, mid = (a + b) / 2;
        const DH = 2.0, DT = 0.04;
        const xy = (axis === 'X');
        const dimX = xy ? w  : DT;
        const dimZ = xy ? DT : w;
        const px = xy ? mid : axisCoord;
        const pz = xy ? axisCoord : mid;
        const panel = new THREE.Mesh(new THREE.BoxGeometry(dimX, DH, dimZ), mat);
        panel.position.set(px, yBase + DH / 2, pz);
        S.group.add(panel);
        // Transom panel above door (matches wall thickness/colour)
        const tH = ceilH - DH;
        if (tH > 0.001) {
          const tDimX = xy ? w  : WT;
          const tDimZ = xy ? WT : w;
          const transom = new THREE.Mesh(new THREE.BoxGeometry(tDimX, tH, tDimZ), wallMat);
          transom.position.set(px, yBase + DH + tH / 2, pz);
          S.group.add(transom);
        }
        // Architrave (door casing) — thin painted-trim strips framing the door opening on each
        // wall face. JP residential casing is typically ~70 mm wide, sticking ~12 mm proud of the wall.
        // Jamb bottom is lifted by F2_LIFT on 2F doors so the trim sits on top of the lifted
        // 2F floor instead of piercing it (trimMat's polygonOffset would otherwise win the
        // z-test at the intersection and the jamb would bleed through the floor from above).
        const casW = 0.07, casD = 0.012;
        const jambLift = (yBase >= F1H) ? F2_LIFT : 0;
        const jambH = DH + casW - jambLift;
        for (const sign of [-1, +1]) {
          const off = sign * (WT / 2 + casD / 2);
          // Two vertical jambs (one each side of opening)
          for (const edge of [a - casW / 2, b + casW / 2]) {
            const lx = xy ? edge : axisCoord + off;
            const lz = xy ? axisCoord + off : edge;
            const lDimX = xy ? casW : casD;
            const lDimZ = xy ? casD : casW;
            const jamb = new THREE.Mesh(new THREE.BoxGeometry(lDimX, jambH, lDimZ), matJambDbg);
            jamb.position.set(lx, yBase + jambLift + jambH / 2, lz);
            S.group.add(jamb);
          }
          // Top header
          const hx = xy ? mid : axisCoord + off;
          const hz = xy ? axisCoord + off : mid;
          const hDimX = xy ? (w + 2 * casW) : casD;
          const hDimZ = xy ? casD : (w + 2 * casW);
          const head = new THREE.Mesh(new THREE.BoxGeometry(hDimX, casW, hDimZ), matHeaderDbg);
          head.position.set(hx, yBase + DH + casW / 2, hz);
          S.group.add(head);
        }
        if (type === 'bi-fold') {
          // Vertical center seam — slightly darker recessed-look strip suggesting the fold line.
          const seamMat = new THREE.MeshStandardMaterial({ color: 0x4a4a4a, roughness: 0.85 });
          const seamW = 0.015;
          const sDimX = xy ? seamW : DT + 0.006;
          const sDimZ = xy ? DT + 0.006 : seamW;
          const seam = new THREE.Mesh(new THREE.BoxGeometry(sDimX, DH * 0.96, sDimZ), seamMat);
          seam.position.set(px, yBase + DH / 2, pz);
          S.group.add(seam);
          // Two thin vertical finger-pulls per face, one each side of the seam, near the top.
          const pullW = 0.012, pullH = 0.18, pullD = 0.012;
          for (const sign of [-1, +1]) {
            for (const pSide of [-1, +1]) {
              const offset = pSide * (w * 0.18);
              const hx = xy ? mid + offset : axisCoord + sign * (DT / 2 + pullD);
              const hz = xy ? axisCoord + sign * (DT / 2 + pullD) : mid + offset;
              const hDimX = xy ? pullW : pullD;
              const hDimZ = xy ? pullD : pullW;
              const pull = new THREE.Mesh(new THREE.BoxGeometry(hDimX, pullH, hDimZ), doorHandleMat);
              pull.position.set(hx, yBase + DH * 0.85, hz);
              S.group.add(pull);
            }
          }
        } else if (type === 'hinged' || !type) {
          // Hinged: lever handles + 3 hinge cubes on the opposite edge.
          const hW = 0.10, hH = 0.025, hD = 0.05;
          const handlePos = a + w * 0.75;
          for (const sign of [-1, +1]) {
            const hx = xy ? handlePos : axisCoord + sign * (DT / 2 + hD / 2);
            const hz = xy ? axisCoord + sign * (DT / 2 + hD / 2) : handlePos;
            const hDimX = xy ? hW : hD;
            const hDimZ = xy ? hD : hW;
            const handle = new THREE.Mesh(new THREE.BoxGeometry(hDimX, hH, hDimZ), doorHandleMat);
            handle.position.set(hx, yBase + 1.0, hz);
            S.group.add(handle);
          }
          const hingeMat = new THREE.MeshStandardMaterial({ color: 0x5c5c5c, metalness: 0.6, roughness: 0.4 });
          const hgW = 0.025, hgH = 0.08, hgD = DT + 0.008;
          const hingeEdge = a + 0.03;
          const hingeYs = [yBase + 0.28, yBase + DH * 0.5, yBase + DH - 0.28];
          for (const hy of hingeYs) {
            const hgx = xy ? hingeEdge : axisCoord;
            const hgz = xy ? axisCoord : hingeEdge;
            const hgDimX = xy ? hgW : hgD;
            const hgDimZ = xy ? hgD : hgW;
            const hinge = new THREE.Mesh(new THREE.BoxGeometry(hgDimX, hgH, hgDimZ), hingeMat);
            hinge.position.set(hgx, hy, hgz);
            S.group.add(hinge);
          }
        } else if (type === 'sliding') {
          // Sliding door — thin top track + recessed finger pulls on each face. Panel itself
          // already drawn above as a flat rectangle covering the opening.
          const trackMat = new THREE.MeshStandardMaterial({ color: 0xb0b0b0, roughness: 0.4, metalness: 0.4 });
          const tDimX = xy ? w  : 0.02;
          const tDimZ = xy ? 0.02 : w;
          const track = new THREE.Mesh(new THREE.BoxGeometry(tDimX, 0.025, tDimZ), trackMat);
          track.position.set(px, yBase + DH + 0.01, pz);
          S.group.add(track);
          for (const sign of [-1, +1]) {
            const fx = xy ? a + w * 0.78 : axisCoord + sign * (DT / 2 + 0.003);
            const fz = xy ? axisCoord + sign * (DT / 2 + 0.003) : a + w * 0.78;
            const fDimX = xy ? 0.10 : 0.006;
            const fDimZ = xy ? 0.006 : 0.10;
            const finger = new THREE.Mesh(new THREE.BoxGeometry(fDimX, 0.05, fDimZ), doorHandleMat);
            finger.position.set(fx, yBase + 1.0, fz);
            S.group.add(finger);
          }
        } else if (type === 'archway') {
          // Open passage — no hardware. The panel mesh built at the top of this function
          // is still drawn (filling the gap as a closed door); a future refactor should
          // skip the panel when type === 'archway' to leave the opening genuinely open.
          console.warn('addDoor: archway type renders as a closed panel until panel-skip refactor lands');
        } else {
          console.warn('addDoor: unknown door type "' + type + '" — pass "hinged" | "bi-fold" | "sliding" | "archway".');
        }
      }

      // ── 1F WINDOWS ── (per ozu-1-blueprint.pdf 1F panel; X-mirrored)
      const F1_WIN_FRONT = [   // z=D wall (page-top in blueprint = front face)
        { a: 0.60, b: 1.20, y0: 1.50, y1: 1.80 },  // washroom 横すべり 06003 (FL+1800, 0.30 tall)
        { a: 2.57, b: 2.83, y0: 1.10, y1: 1.80 },  // bath 縦すべり 02607 (FL+1800, 0.70 tall)
        { a: 3.87, b: 4.23, y0: 1.50, y1: 1.80 },  // toilet 横すべり 03603 (FL+1800, 0.30 tall)
      ];
      const F1_WIN_BACK = [    // z=0 wall (page-bottom = back face) — LDK
        { a: 3.20, b: 4.80, y0: 1.00, y1: 1.90 },  // LDK 引違 16009 (FL+1900, 0.90 tall)
      ];
      const F1_WIN_LEFT = [    // x=0 wall (page-right after mirror = code-LEFT) — LDK casements
        { a: 1.20, b: 1.46, y0: 1.00, y1: 1.90 },  // LDK 縦すべり 02609 lower (FL+1900)
        { a: 3.30, b: 3.56, y0: 1.00, y1: 1.90 },  // LDK 縦すべり 02609 upper (FL+1900)
      ];

      // 1F outer walls (door + window x-gaps merged) — with photo-matched cladding:
      //   front 1F LEFT (x=0..4.95, wet rooms) = brown panel
      //   front 1F RIGHT (x=4.95..W, genkan/entry) = cream
      //   back, left, right + 2F throughout = cream
      // Back, sides — all cream (2-layer: cladding outside, wallMat inside)
      wallX(0, 0, W, F1_WIN_BACK.map(w => [w.a, w.b]), F1H, 0, matUpperExt, -1);
      wallZ(0, 0, D, F1_WIN_LEFT.map(w => [w.a, w.b]), F1H, 0, matUpperExt, +1);
      wallZ(W, 0, D, [], F1H, 0, matUpperExt, -1);
      // FRONT 1F: brown panel inset (x=0..4.50, y=0..2.10) with 3 small windows + cream wrapping
      const BROWN_X1 = 4.50, BROWN_Y1 = 2.10;
      wallX(D, 0, BROWN_X1, F1_WIN_FRONT.map(w => [w.a, w.b]), BROWN_Y1, 0, matLowerExt, +1);   // brown panel
      wallX(D, 0, BROWN_X1, [], F1H - BROWN_Y1, BROWN_Y1, matUpperExt, +1);                     // cream above brown
      wallX(D, BROWN_X1, W, [[4.95, 5.85]], F1H, 0, matUpperExt, +1);                           // cream right of brown, door gap
      makeWall(4.95, D, 5.85, D, F1H - 2.05, 2.05, matUpperExt, +1);                            // door header
      // Window frames: brown for front 1F (sill+lintel up to BROWN_Y1), cream elsewhere
      for (const w of F1_WIN_FRONT) addWinFlex('X', D, w, 0, BROWN_Y1, matLowerExt);
      for (const w of F1_WIN_BACK)  addWinFlex('X', 0, w, 0, F1H, matUpperExt);
      for (const w of F1_WIN_LEFT)  addWinFlex('Z', 0, w, 0, F1H, matUpperExt);

      wallZ(1.80, 4.50, 5.40, [], F1H, 0);                            // laundry east wall along corridor approach strip
      wallZ(1.80, 5.40, D,    [[5.50, 6.10]], F1H, 0);                 // laundry ↔ washroom (door)
      wallZ(3.60, 3.60, 4.50, [], F1H, 0);
      wallZ(3.60, 5.40, D,    [], F1H, 0);                             // washroom ↔ toilet partition
      // x=4.50 wall, z=[3.60, 4.50] — step 12 riser sits at x=4.50; lowest overhead is
      // step 11 tread bottom at 11*F1H/13-0.04 = 2.075 m. Stair-shaped height.
      wallZ(4.50, 3.60, 4.50, [], 11 * F1H / 13 - 0.04, 0);
      wallZ(4.50, 5.40, 6.30, [[5.65, 6.30]], F1H, 0);
      wallZ(4.50, 6.30, D,    [], F1H, 0);
      // 1F shaft east wall at x=5.40 — merged to F1H across full z=[2.90, 4.50].
      // Step 8 riser sits at x=5.40; only its 25 mm nosing clips the wall at y≈1.50 m — negligible.
      wallZ(5.40, 2.90, 4.50, [], F1H, 0);
      wallX(2.90, 5.40, W,    [], F1H, 0);
      // z=3.60 wall, x=[3.60, 4.50] — stair-shaped heights. Step 13 (x=[4.05, 4.275]):
      // tread bottom at F1H-0.04 = 2.46 m. Step 12 (x=[4.275, 4.50]): tread bottom at
      // 12*F1H/13-0.04 = 2.27 m. West of upper-flight x range: full height.
      wallX(3.60, 3.60, 4.05, [], F1H, 0);               // west of upper-flight x range: full height
      wallX(3.60, 4.05, 4.275, [], F1H - 0.04, 0);       // step 13 zone: up to tread bottom
      wallX(3.60, 4.275, 4.50, [], 12 * F1H / 13 - 0.04, 0); // step 12 zone: up to tread bottom
      wallX(4.50, 0,    1.80, [[0.75, 1.35]], F1H, 0);                 // kitchen ↔ laundry (door)
      wallX(4.50, 1.80, 3.60, [], F1H, 0);                             // kitchen fridge-wall (east) + LDK ↔ corridor-1 washroom-approach
      wallX(4.50, 3.60, 4.50, [], F1H, 0);                             // LDK ↔ corridor-1 east-arm
      wallX(4.50, 4.50, 5.40, [], F1H, 0);                             // LDK ↔ corridor-1 main strip (west of archway)
      wallX(4.50, 5.40, W,    [[5.40, 6.10]], F1H, 0);                 // LDK ↔ corridor (open archway)
      wallX(5.40, 1.80, 4.50, [[2.70, 3.30], [3.80, 4.40]], F1H, 0);   // washroom + toilet-1-f south walls, doors each
      wallX(6.30, 4.50, W,    [[5.10, 5.80]], F1H, 0);

      // ───────────────── 2F ─────────────────
      // Stair shaft hole on 2F: x=4.05..W, z=3.60..4.50 (upper flight rises through; east
      // edge moved from 4.725→4.05 for 3+4+6 stair with TREAD=0.225m, 6 × 0.225 = 1.35m run).
      const SX0 = 4.05, SX1 = W, SZ0 = 3.60, SZ1 = 4.50;
      const F2_ROOMS = [
        { mat: FLOORS.room,        x0: 3.60,  z0: 4.50,  x1: W,    z1: D     }, // room-1
        { mat: FLOORS.toilet,      x0: 2.70,  z0: 5.85,  x1: 3.60, z1: D     }, // toilet
        { mat: FLOORS.room,        x0: 0,     z0: 4.50,  x1: 2.70, z1: D     }, // room-2
        { mat: FLOORS.corridor,    x0: 2.70,  z0: 4.50,  x1: 3.60, z1: 5.85  }, // corridor_n stub
        { mat: FLOORS.corridor,    x0: 2.70,  z0: 3.60,  x1: SX0,  z1: 4.50  }, // mid corridor (x=2.70..stair, after closets carved out)
        { mat: CLR.floor_closet,   x0: 0,     z0: 3.60,  x1: 2.70, z1: 4.50  }, // mid-band closet (west+east merged) — room-3's
        { mat: FLOORS.room4,       x0: 3.60,  z0: 0,     x1: W,    z1: 3.60  }, // room-4
        { mat: CLR.floor_closet,   x0: 2.70,  z0: 0,     x1: 3.60, z1: 3.60  }, // closet_a+b merged (single column)
        { mat: FLOORS.room,        x0: 0,     z0: 0,     x1: 2.70, z1: 3.60  }, // room-3
      ];
      // 2F floors lifted 5 mm above F1H (top at y=2.505) AND made 2 mm thin
      // (slab spans 2.503..2.505). This puts the 2F floor entirely ABOVE every
      // 1F surface — the 1F interior wall tops at y=2.500 used to poke up
      // INTO the standard 50 mm-thick 2F floor slab, intersecting solid-with-
      // solid and producing thin white flickering lines on the bedroom floors
      // in top-down QA views. With the slab thinner than the lift, no 1F mesh
      // intersects the 2F floor anywhere.
      const F2_LIFT = 0.005;
      const F2_FLOOR_T = 0.002;
      for (const r of F2_ROOMS) makeFloor(r.x0, r.z0, r.x1, r.z1, r.mat, F1H + F2_LIFT, F2_FLOOR_T);

      // 2F floor-material thresholds (見切り材 / saddle bars). At every place where
      // two different floor materials meet on 2F, a thin wood strip sits on top of
      // the floor and covers any hairline gap as deliberate architecture — modern
      // JP houses have these at every floor-material change. 30 mm wide × 3 mm
      // proud. No base slab, no box extends, each room keeps its exact footprint.
      // 12 different-material boundary segments collapse onto 6 axis-aligned strips.
      {
        const matThreshold = new THREE.MeshStandardMaterial({ color: DEBUG_2F_LINES ? 0x0000ff : 0x8a6a44, roughness: 0.55 });
        const TW = 0.030, TH = 0.003;
        const yT = F1H + F2_LIFT + TH / 2;
        const thresholdX = (x, z0, z1) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(TW, TH, z1 - z0), matThreshold);
          m.position.set(x, yT, (z0 + z1) / 2);
          S.group.add(m);
        };
        const thresholdZ = (z, x0, x1) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, TH, TW), matThreshold);
          m.position.set((x0 + x1) / 2, yT, z);
          S.group.add(m);
        };
        thresholdX(2.70, 0,    D   );  // room-3↔closet, closet↔corridor, room-2↔corridor_n, room-2↔toilet
        thresholdX(3.60, 0,    3.60);  // room-4 ↔ closet_a+b
        thresholdX(3.60, 4.50, D   );  // room-1 ↔ corridor_n_stub, room-1 ↔ toilet
        thresholdZ(3.60, 0,    SX0 );  // room-3↔closet, closet↔corridor, room-4↔corridor
        thresholdZ(4.50, 0,    2.70);  // closet ↔ room-2
        thresholdZ(4.50, 3.60, SX0 );  // room-1 ↔ mid-corridor
      }

      // 2F ceilings — flat plaster everywhere except the stair shaft, which gets a
      // whitewashed wood-plank accent ceiling (visible from the upper flight in stairs-1, 2, 22, 24).
      makeCeiling(0,    0,    W,     3.60, F1H + F2H);                   // south of stair shaft
      makeCeiling(0,    3.60, 4.05,  4.50, F1H + F2H);                   // west of stair shaft
      makeCeiling(0,    4.50, W,     D,    F1H + F2H);                   // north of stair shaft
      // Stair shaft (wood-plank accent). Built manually instead of via makeCeiling so the
      // top face uses plain matCeiling — the interior scene has no roof, and from an orbit
      // camera above you'd otherwise see the plank pattern bleeding through to the top.
      // BoxGeometry face order: [+X, -X, +Y, -Y, +Z, -Z]; index 2 = top, index 3 = bottom.
      {
        const dx = W - 4.05, dz = 4.50 - 3.60;
        const mats = [matPlankCeiling, matPlankCeiling, matCeiling, matPlankCeiling, matPlankCeiling, matPlankCeiling];
        const m = new THREE.Mesh(new THREE.BoxGeometry(dx, CEIL_T, dz), mats);
        m.position.set((4.05 + W) / 2, F1H + F2H - CEIL_T / 2, (3.60 + 4.50) / 2);
        m.userData._isCeiling = true;
        m.userData._ceilingFloor = '2f';
        S.group.add(m);
      }
      // White perimeter trim framing the plank panel — clean painted reveal between the plank
      // accent and the surrounding plain plaster ceilings (visible in stairs-1, 2, 10, 13, 14,
      // 20, 22, 23, 24). 50 mm wide × 15 mm proud, sits flush below the plank ceiling underside.
      {
        const trimMat = new THREE.MeshStandardMaterial({ color: 0xfafaf6, roughness: 0.85 });
        const trimW = 0.05, trimT = 0.015;
        const px0 = 4.05,  px1 = W, pz0 = 3.60, pz1 = 4.50;
        const yTrim = F1H + F2H - CEIL_T - trimT / 2;
        // South + north edges (run in x)
        for (const z of [pz0 + trimW / 2, pz1 - trimW / 2]) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(px1 - px0, trimT, trimW), trimMat);
          m.position.set((px0 + px1) / 2, yTrim, z);
          S.group.add(m);
        }
        // West + east edges (run in z)
        for (const x of [px0 + trimW / 2, px1 - trimW / 2]) {
          const m = new THREE.Mesh(new THREE.BoxGeometry(trimW, trimT, pz1 - pz0), trimMat);
          m.position.set(x, yTrim, (pz0 + pz1) / 2);
          S.group.add(m);
        }
      }

      // Smoke detectors (住宅用火災警報器) — mandatory in every bedroom + stair-top per 消防法.
      // Small white disc with a tiny red emissive LED, flush to the 2F ceiling underside.
      {
        const matDetector = new THREE.MeshStandardMaterial({ color: 0xf2efe8, roughness: 0.7 });
        const matLED = new THREE.MeshStandardMaterial({ color: 0x882020, emissive: 0xff2020, emissiveIntensity: 0.6 });
        const ceilY = F1H + F2H - 0.04 - 0.001;
        const detectors = [
          { x: 4.95, z: 5.85 }, // room-1 (NW)
          { x: 1.35, z: 5.85 }, // room-2 (NE)
          { x: 1.35, z: 1.80 }, // room-3 (SE)
          { x: 4.95, z: 1.80 }, // room-4 (SW)
          { x: 5.10, z: 4.05 }, // 2F corridor at top of stair
        ];
        for (const d of detectors) {
          const body = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 0.018, 20), matDetector);
          body.position.set(d.x, ceilY - 0.009, d.z);
          S.group.add(body);
          const led = new THREE.Mesh(new THREE.SphereGeometry(0.005, 8, 8), matLED);
          // LED hangs just below the detector body; ceilY-0.018 is the body's bottom face,
          // so place the sphere center 7mm further down to clear the cylinder face plane.
          led.position.set(d.x + 0.025, ceilY - 0.025, d.z);
          S.group.add(led);
        }
      }

      // ── 2F WINDOWS ── 7 windows; all FL+2000 at top (= y=4.50 abs), 0.90 m tall (y=3.60..4.50).
      // y0/y1 below are RELATIVE to F1H (the 2F floor level).
      const F2_WIN_FRONT = [   // z=D wall (front face)
        { a: 0.505, b: 2.195, y0: 1.10, y1: 2.00 },  // room-2 引違 11909
        { a: 3.020, b: 3.280, y0: 1.10, y1: 2.00 },  // toilet 縦すべり 02609
        { a: 4.105, b: 5.795, y0: 1.10, y1: 2.00 },  // room-1 引違 11909
      ];
      const F2_WIN_BACK = [    // z=0 wall (back face)
        { a: 0.600, b: 2.100, y0: 1.10, y1: 2.00 },  // room-3 引違 15009
        { a: 4.200, b: 5.700, y0: 1.10, y1: 2.00 },  // room-4 引違 15009
      ];
      const F2_WIN_LEFT = [    // x=0 wall (left face) — z range
        { a: 1.670, b: 1.930, y0: 1.10, y1: 2.00 },  // room-3 縦すべり 02609
        { a: 5.720, b: 5.980, y0: 1.10, y1: 2.00 },  // room-2 縦すべり 02609
      ];
      const F2_WIN_RIGHT = [   // x=W wall (right face, real-world WEST) — z range
        { a: 1.670, b: 1.930, y0: 1.10, y1: 2.00 },  // room-4 縦すべり 02609
        { a: 5.720, b: 5.980, y0: 1.10, y1: 2.00 },  // room-1 縦すべり 02609 (NW bedroom)
      ];

      // 2F outer walls — all cream cladding (2-layer: cladding outside, wallMat inside)
      wallX(0, 0, W, F2_WIN_BACK.map(w => [w.a, w.b]),  F2H, F1H, matUpperExt, -1);
      wallX(D, 0, W, F2_WIN_FRONT.map(w => [w.a, w.b]), F2H, F1H, matUpperExt, +1);
      wallZ(0, 0, D, F2_WIN_LEFT.map(w => [w.a, w.b]),  F2H, F1H, matUpperExt, +1);
      wallZ(W, 0, D, F2_WIN_RIGHT.map(w => [w.a, w.b]), F2H, F1H, matUpperExt, -1);
      for (const w of F2_WIN_FRONT) addWinFlex('X', D, w, F1H, F2H, matUpperExt);
      for (const w of F2_WIN_BACK)  addWinFlex('X', 0, w, F1H, F2H, matUpperExt);
      for (const w of F2_WIN_LEFT)  addWinFlex('Z', 0, w, F1H, F2H, matUpperExt);
      for (const w of F2_WIN_RIGHT) addWinFlex('Z', W, w, F1H, F2H, matUpperExt);

      // ── 2F interior walls ──
      wallZ(2.70, 0,    3.60, [[1.20, 1.80]], F2H, F1H);  // room-3 east wall, closet_a bi-fold
      wallZ(2.70, 3.60, 4.50, [], F2H, F1H);              // closet column south edge (no door)
      wallZ(2.70, 4.50, D,    [[5.10, 5.70]], F2H, F1H);  // room-2 east wall, closet bi-fold
      wallZ(3.60, 0,    3.60, [[2.10, 2.70]], F2H, F1H);  // room-4 west wall, closet_b bi-fold
      wallZ(3.60, 4.50, D,    [[4.65, 5.25]], F2H, F1H);  // room-1 west wall, closet bi-fold
      wallZ(1.35, 3.60, 4.50, [], F2H, F1H);              // wall between west and east mid-band closets
      wallX(3.60, 0,    2.70, [[1.55, 2.15]], F2H, F1H);  // room-3 north wall, corridor entrance
      wallX(3.60, 2.70, 3.60, [], F2H, F1H);
      wallX(3.60, 3.60, W,    [[4.50, 5.20]], F2H, F1H);  // room-4 north wall, corridor entrance
      wallX(4.50, 0,    2.70, [[1.10, 1.70]], F2H, F1H);  // room-2 south wall, corridor entrance
      wallX(4.50, 3.60, 4.50, [[3.80, 4.40]], F2H, F1H);  // room-1 south wall, corridor entrance
      wallX(4.50, 4.50, W,    [], F2H, F1H);
      wallX(5.85, 2.70, 3.60, [[2.85, 3.45]], F2H, F1H);  // 2F toilet south wall, corridor entrance

      // ───────────────── DOORS ─────────────────
      // Closed-door panels fill the gaps left by wallX/wallZ.
      // The genkan front door is built separately below with two-tone steel detail.
      const F1_DOORS = [
        { axis: 'X', c: 4.50, a: 0.75, b: 1.35, mat: doorMat },          // kitchen ↔ laundry
        { axis: 'Z', c: 1.80, a: 5.50, b: 6.10, mat: closetDoorMat, type: 'bi-fold' },  // laundry ↔ washroom (white folding/accordion door)
        { axis: 'X', c: 5.40, a: 2.70, b: 3.30, mat: doorMat },          // corridor ↔ bath (door x in bath x-range [1.80, 3.60])
        { axis: 'X', c: 5.40, a: 3.80, b: 4.40, mat: doorMat },          // corridor ↔ toilet-1-f
      ];
      for (const d of F1_DOORS) addDoor(d.axis, d.c, d.a, d.b, 0, F1H, d.mat, d.type);

      // Custom genkan front door — two-tone steel (charcoal upper / dark brown lower) with
      // a vertical glass slit, chrome grip pull, brushed kickplate, and mail slot. Replaces
      // the generic single-panel addDoor that this entry would have produced.
      {
        const FD_X0 = 4.95, FD_X1 = 5.85, FD_Z = D, FD_W = FD_X1 - FD_X0;
        const FD_DT = 0.04, FD_H = 2.0;
        const FD_MID_X = (FD_X0 + FD_X1) / 2;
        // Materials
        const matSteelDark   = new THREE.MeshStandardMaterial({ color: 0x363636, roughness: 0.55, metalness: 0.35 });
        const matWoodLower   = new THREE.MeshStandardMaterial({ color: 0x6a4a2e, roughness: 0.55 });
        const matFrontSlit   = new THREE.MeshPhysicalMaterial({ color: 0xeaf0f4, roughness: 0.10, metalness: 0.0, transmission: 0.85, thickness: 0.005, ior: 1.52 });
        const matChromePull  = new THREE.MeshStandardMaterial({ color: 0xc8cdd2, roughness: 0.18, metalness: 0.9 });
        const matKick        = new THREE.MeshStandardMaterial({ color: 0x8a8a8a, roughness: 0.35, metalness: 0.4 });
        const matMailSlot    = new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness: 0.5, metalness: 0.5 });
        // Door split: vertical glass slit near the right (handle) edge. Main panel left of slit, narrow panel right.
        const splitY = 1.0;            // horizontal two-tone split height
        const slitW  = 0.08;           // glass slit width
        const slitInset = 0.18;        // distance from right edge to slit center
        const slitX = FD_X1 - slitInset;
        const mainW  = (slitX - slitW / 2) - FD_X0;
        const rightW = FD_X1 - (slitX + slitW / 2);
        // Main panel — brown bottom + charcoal top
        const lowerMain = new THREE.Mesh(new THREE.BoxGeometry(mainW, splitY, FD_DT), matWoodLower);
        lowerMain.position.set(FD_X0 + mainW / 2, splitY / 2, FD_Z);
        S.group.add(lowerMain);
        const upperMain = new THREE.Mesh(new THREE.BoxGeometry(mainW, FD_H - splitY, FD_DT), matSteelDark);
        upperMain.position.set(FD_X0 + mainW / 2, (splitY + FD_H) / 2, FD_Z);
        S.group.add(upperMain);
        // Vertical glass slit
        const slit = new THREE.Mesh(new THREE.BoxGeometry(slitW, FD_H, FD_DT * 0.5), matFrontSlit);
        slit.position.set(slitX, FD_H / 2, FD_Z);
        S.group.add(slit);
        // Right narrow panel — same two-tone split
        if (rightW > 0.001) {
          const rightLower = new THREE.Mesh(new THREE.BoxGeometry(rightW, splitY, FD_DT), matWoodLower);
          rightLower.position.set(slitX + slitW / 2 + rightW / 2, splitY / 2, FD_Z);
          S.group.add(rightLower);
          const rightUpper = new THREE.Mesh(new THREE.BoxGeometry(rightW, FD_H - splitY, FD_DT), matSteelDark);
          rightUpper.position.set(slitX + slitW / 2 + rightW / 2, (splitY + FD_H) / 2, FD_Z);
          S.group.add(rightUpper);
        }
        // Vertical chrome grip pull on the exterior face, near the left (hinge-side) edge
        const gripX = FD_X0 + 0.12;
        const gripCenterY = 1.0;
        const gripLen = 0.85;
        const gripBar = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, gripLen, 12), matChromePull);
        gripBar.position.set(gripX, gripCenterY, FD_Z + FD_DT / 2 + 0.045);
        S.group.add(gripBar);
        const mountGeom = new THREE.BoxGeometry(0.03, 0.03, 0.045);
        for (const dy of [-1, +1]) {
          const mount = new THREE.Mesh(mountGeom, matChromePull);
          mount.position.set(gripX, gripCenterY + dy * (gripLen / 2 - 0.015), FD_Z + FD_DT / 2 + 0.0225);
          S.group.add(mount);
        }
        // Brushed metal kickplate at the bottom (exterior side)
        const kickplate = new THREE.Mesh(
          new THREE.BoxGeometry(FD_W - 0.02, 0.20, 0.005),
          matKick
        );
        kickplate.position.set(FD_MID_X, 0.11, FD_Z + FD_DT / 2 + 0.003);
        S.group.add(kickplate);
        // Mail slot (yūbinguchi) at chest height, between grip pull and glass slit
        const slot = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.04, FD_DT * 0.6), matMailSlot);
        slot.position.set(FD_X0 + 0.32, 1.15, FD_Z);
        S.group.add(slot);
        // Transom panel above door — wallMat cream filling y=[FD_H, F1H]
        const transomH = F1H - FD_H;
        if (transomH > 0.001) {
          const transom = new THREE.Mesh(new THREE.BoxGeometry(FD_W, transomH, WT), wallMat);
          transom.position.set(FD_MID_X, FD_H + transomH / 2, FD_Z);
          S.group.add(transom);
        }
        // Architrave (door casing) — matches the trim added to every other door
        const casW = 0.07, casD = 0.012;
        for (const sign of [-1, +1]) {
          const off = sign * (WT / 2 + casD / 2);
