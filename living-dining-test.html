/* PHASE 7c — Dining-zone furniture: table + 6 mixed-shell chairs         */
/*                                                                         */
/* Photos: dining/c/08 + dining/b/01 + living/a/01 — rustic plank-top     */
/* dining table in warm caramel wood (visible end-grain striping) with    */
/* thin black metal X-frame legs, surrounded by mixed Eames-style         */
/* moulded plastic shell chairs in tan leather, navy, dark grey, dark     */
/* brown, etc., on thin black metal legs.                                 */
/* ====================================================================== */

/* Rustic plank top — warm caramel with strong wood-grain bands */
const matDiningTop = (() => {
  const c = makeCanvas(512, 256);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#a06535';
  ctx.fillRect(0, 0, 512, 256);
  /* Plank seams — 5 horizontal planks across V */
  for (let p = 0; p < 5; p++) {
    const y = p * (256 / 5);
    ctx.fillStyle = 'rgba(40,22,10,0.65)';
    ctx.fillRect(0, y, 512, 1);
  }
  /* Long warm-grain streaks running along U */
  for (let i = 0; i < 90; i++) {
    const sy = Math.random() * 256;
    const sx = Math.random() * 512;
    const sw = 60 + Math.random() * 220;
    const v  = -22 + Math.random() * 50;
    const r = Math.max(0, Math.min(255, 130 + v));
    const g = Math.max(0, Math.min(255, 78 + v));
    const b = Math.max(0, Math.min(255, 38 + v));
    ctx.fillStyle = `rgba(${r},${g},${b},${0.20 + Math.random() * 0.20})`;
    ctx.fillRect(sx, sy, sw, 1 + Math.random() * 2);
  }
  /* Knots */
  for (let i = 0; i < 4; i++) {
    const kx = Math.random() * 512;
    const ky = Math.random() * 256;
    const kr = 6 + Math.random() * 12;
    const grad = ctx.createRadialGradient(kx, ky, 0, kx, ky, kr);
    grad.addColorStop(0, 'rgba(35,18,8,0.75)');
    grad.addColorStop(1, 'rgba(35,18,8,0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(kx, ky, kr, 0, Math.PI * 2); ctx.fill();
  }
  const tex = texFromCanvas(c, { repeat: [1, 1] });
  const nor = deriveNormalFromCanvas(c, 0.7);
  return new THREE.MeshPhysicalMaterial({
    map: tex,
    normalMap: cloneTex(nor, 1, 1),
    normalScale: new THREE.Vector2(0.30, 0.30),
    color: 0xffffff,
    roughness: 0.55, metalness: 0.0,
    clearcoat: 0.18, clearcoatRoughness: 0.45,
    envMapIntensity: 0.40,
  });
})();

const matBlackMetal = new THREE.MeshPhysicalMaterial({
  color: 0x14171b, roughness: 0.45, metalness: 0.85,
  clearcoat: 0.20, clearcoatRoughness: 0.30,
  envMapIntensity: 0.35,
});

/* === Dining table === */
const DT_W = 1.60, DT_D = 0.85, DT_H = 0.74;
const DT_TOP_T = 0.040;
const DT_CX = 4.70, DT_CZ = 2.05;

function buildDiningTable(cx, cz) {
  const g = new THREE.Group();
  /* Top plank slab */
  const top = new THREE.Mesh(
    new RoundedBoxGeometry(DT_W, DT_TOP_T, DT_D, 4, 0.012),
    matDiningTop
  );
  top.position.set(0, DT_H - DT_TOP_T / 2, 0);
  top.castShadow = true; top.receiveShadow = true;
  g.add(top);

  /* X-frame legs at each end — two crossed flat bars */
  for (const sx of [-1, 1]) {
    const ex = sx * (DT_W / 2 - 0.10);
    const xf = new THREE.Group();
    /* Forward-leaning bar */
    const bar1 = new THREE.Mesh(
      new THREE.BoxGeometry(0.025, DT_H - DT_TOP_T - 0.010, 0.030),
      matBlackMetal
    );
    bar1.rotation.x = Math.atan2(DT_D - 0.20, DT_H - DT_TOP_T) * 0;  /* keep vertical for now */
    /* Use a real X — two angled bars meeting in centre */
    const halfH = (DT_H - DT_TOP_T - 0.010) / 2;
    const halfD = (DT_D - 0.18) / 2;
    const len = Math.sqrt(halfH * halfH + halfD * halfD) * 2;
    const ang = Math.atan2(halfD, halfH);

    const barA = new THREE.Mesh(
      new THREE.BoxGeometry(0.025, len, 0.025),
      matBlackMetal
    );
    barA.rotation.x = ang;
    barA.position.set(0, halfH + 0.005, 0);
    barA.castShadow = true;

    const barB = new THREE.Mesh(
      new THREE.BoxGeometry(0.025, len, 0.025),
      matBlackMetal
    );
    barB.rotation.x = -ang;
    barB.position.set(0, halfH + 0.005, 0);
    barB.castShadow = true;

    /* Foot rail at the bottom */
    const footRail = new THREE.Mesh(
      new THREE.BoxGeometry(0.025, 0.025, DT_D - 0.18),
      matBlackMetal
    );
    footRail.position.set(0, 0.0125, 0);
    footRail.castShadow = true;

    xf.add(barA, barB, footRail);
    xf.position.set(ex, 0, 0);
    g.add(xf);
  }

  /* Top stretcher under the table connecting both X-frames */
  const stretcher = new THREE.Mesh(
    new THREE.BoxGeometry(DT_W - 0.30, 0.025, 0.025),
    matBlackMetal
  );
  stretcher.position.set(0, DT_H - DT_TOP_T - 0.020, 0);
  stretcher.castShadow = true;
  g.add(stretcher);

  g.position.set(cx, 0, cz);
  return g;
}
scene.add(buildDiningTable(DT_CX, DT_CZ));

/* === 6 dining chairs around the table — Eames-shell style ===
 * 3 along the south side (facing N toward table), 3 along the north
 * side (facing S). Shell colours mix per photo evidence. */

/* Upholstered leather/fabric — soft sheen, slight padded look.
 * Per photos (dining/c/12, living/b/37, dining/c/5) the dining chairs are
 * NOT moulded plastic shells — they're leather-upholstered chairs with a
 * tall curved back, padded seat, and 4 thin black metal legs. */
function makeShellMaterial(hex) {
  return new THREE.MeshPhysicalMaterial({
    color: hex, roughness: 0.62, metalness: 0.0,
    clearcoat: 0.25, clearcoatRoughness: 0.40,
    envMapIntensity: 0.25,
  });
}

function buildShellChair(cx, cz, facing /* +1 = chair faces +Z, -1 = faces -Z */, shellHex) {
  const g = new THREE.Group();

  const SH_W      = 0.46;         // chair width
  const SH_D      = 0.46;         // seat depth
  const SEAT_T    = 0.060;        // padded seat thickness
  const SEAT_TOP  = 0.46;         // seat-top height
  const BACK_W    = 0.40;         // back width (slightly narrower than seat — visible taper in photos)
  const BACK_H    = 0.46;         // back height above seat
  const BACK_T    = 0.055;        // padded back thickness
  const BACK_TILT = Math.PI / 22; // ~8° rearward tilt

  const shellMat = makeShellMaterial(shellHex);

  /* Padded seat — rounded box with generous edge radius. */
  const seat = new THREE.Mesh(
    new RoundedBoxGeometry(SH_W, SEAT_T, SH_D, 5, 0.025),
    shellMat,
  );
  seat.position.set(0, SEAT_TOP - SEAT_T / 2, 0);
  seat.castShadow = true; seat.receiveShadow = true;
  g.add(seat);

  /* Padded back — simple thick rounded slab rising from the rear edge of
   * the seat. Tilted ~8° rearward. Photos (dining/c/12, living/b/37) show
   * a relatively flat back with rounded top corners, NOT a deep wraparound. */
  const back = new THREE.Mesh(
    new RoundedBoxGeometry(BACK_W, BACK_H, BACK_T, 5, 0.025),
    shellMat,
  );
  /* Place back-pad just inside the rear edge of the seat. */
  const rearEdgeZ = -facing * SH_D / 2;                  // -SH_D/2 for facing=+1, +SH_D/2 for facing=-1
  const backCenterZ = rearEdgeZ + facing * BACK_T / 2;   // pad just inside the edge
  back.position.set(0, SEAT_TOP + BACK_H / 2 - 0.020, backCenterZ);
  back.rotation.x = -facing * BACK_TILT;                  // top of back tilts away from sitter
  back.castShadow = true; back.receiveShadow = true;
  g.add(back);

  /* Slight upper "shoulder" curl — two small rounded blocks angled inward
   * at the top corners of the back, hinting at the gentle wraparound seen
   * in the photos without overdoing it. */
  for (const sx of [-1, 1]) {
    const shoulder = new THREE.Mesh(
      new RoundedBoxGeometry(0.060, BACK_H * 0.55, BACK_T, 4, 0.020),
      shellMat,
    );
    shoulder.position.set(
      sx * (BACK_W / 2 + 0.010),
      SEAT_TOP + BACK_H * 0.65 - 0.020,
      backCenterZ + facing * 0.020,
    );
    shoulder.rotation.y = -sx * 0.18;                      // angled forward (toward sitter)
    shoulder.rotation.x = -facing * BACK_TILT;
    shoulder.castShadow = true;
    g.add(shoulder);
  }

  /* 4 thin black metal legs — round-tube, slight outward splay */
  const legH = SEAT_TOP - SEAT_T;
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const leg = new THREE.Mesh(
      new THREE.CylinderGeometry(0.011, 0.009, legH, 12),
      matBlackMetal,
    );
    const inset = 0.060;
    leg.position.set(
      sx * (SH_W / 2 - inset),
      legH / 2,
      sz * (SH_D / 2 - inset),
    );
    leg.rotation.z = -sx * 0.040;
    leg.rotation.x =  sz * 0.040;
    leg.castShadow = true;
    g.add(leg);
  }

  g.position.set(cx, 0, cz);
  return g;
}

/* === Two chandelier-style pendants — wrought-iron arms + cream tulip
 * shades — one over the dining table, one over the living area.
 * Per Kumamoto rule we let the visible bulbs READ as on (low emissive)
 * but do NOT add SpotLights; daylight from the south sliders dominates. */
const matIron = new THREE.MeshPhysicalMaterial({
  color: 0x16181c, roughness: 0.55, metalness: 0.55,
  clearcoat: 0.20, clearcoatRoughness: 0.30,
  envMapIntensity: 0.30,
});
const matBulbShade = new THREE.MeshPhysicalMaterial({
  color: 0xfaf2dc, roughness: 0.50, metalness: 0.0,
  clearcoat: 0.10, clearcoatRoughness: 0.40,
  envMapIntensity: 0.45,
  transmission: 0.25, ior: 1.45, thickness: 0.005,   // milky glass shade
});
const matBulbGlow = new THREE.MeshStandardMaterial({
  color: 0xffe4b0, emissive: 0xffd28c, emissiveIntensity: 0.55,
  roughness: 0.40, metalness: 0.0,
});

function buildChandelier(cx, cz, dropToY) {
  /* dropToY = world Y of the BOTTOM of the chandelier body */
  const g = new THREE.Group();

  /* Ceiling cap — small disc flush with ceiling */
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(0.060, 0.060, 0.012, 18),
    matIron
  );
  cap.position.set(0, ROOM_H - 0.006, 0);
  g.add(cap);

  /* Vertical stem from cap down to body top */
  const stemTop = ROOM_H - 0.012;
  const bodyTop = dropToY + 0.20;
  const stemH = stemTop - bodyTop;
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.011, 0.011, stemH, 12),
    matIron
  );
  stem.position.set(0, (stemTop + bodyTop) / 2, 0);
  g.add(stem);

  /* Central body — small ornamental cluster */
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.045, 16, 12),
    matIron
  );
  body.position.set(0, bodyTop, 0);
  g.add(body);

  /* 5 curved arms with tulip shades + bulbs */
  for (let i = 0; i < 5; i++) {
    const a = (i / 5) * Math.PI * 2;
    const armLen = 0.20;
    const armEndX = Math.cos(a) * armLen;
    const armEndZ = Math.sin(a) * armLen;

    /* Arm — thin curved tube approximated as a cylinder from body to shade */
    const armDx = armEndX, armDz = armEndZ, armDy = -0.05;
    const armLength = Math.sqrt(armDx * armDx + armDy * armDy + armDz * armDz);
    const arm = new THREE.Mesh(
      new THREE.CylinderGeometry(0.007, 0.007, armLength, 10),
      matIron
    );
    arm.position.set(armEndX / 2, bodyTop + armDy / 2, armEndZ / 2);
    /* Orient arm along (dx, dy, dz) */
    arm.lookAt(armEndX, bodyTop + armDy, armEndZ);
    arm.rotateX(Math.PI / 2);
    g.add(arm);

    /* Small cup at arm end */
    const cup = new THREE.Mesh(
      new THREE.CylinderGeometry(0.022, 0.018, 0.020, 14),
      matIron
    );
    cup.position.set(armEndX, bodyTop + armDy, armEndZ);
    g.add(cup);

    /* Tulip shade — pointing UP (open top), narrow base */
    const shade = new THREE.Mesh(
      new THREE.CylinderGeometry(0.060, 0.030, 0.085, 16, 1, true),
      matBulbShade
    );
    shade.position.set(armEndX, bodyTop + armDy + 0.052, armEndZ);
    shade.castShadow = false;
    g.add(shade);

    /* Bulb — small glowing sphere inside the shade */
    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.018, 12, 10),
      matBulbGlow
    );
    bulb.position.set(armEndX, bodyTop + armDy + 0.058, armEndZ);
    g.add(bulb);
  }

  g.position.set(cx, 0, cz);
  return g;
}
/* Pendant over dining */

/* === Antique double-faced station-clock on wrought-iron bracket ===
 * Per living/a/01 + living/c/20 photos: mounted on the kitchen-wall
 * just above/east of the corridor entry (the corridor entry sits on
 * the west end of the kitchen-wall; the clock arm reaches out into
 * the LDK so both faces are visible from the living + dining sides). */
{
  const matClockBody = new THREE.MeshPhysicalMaterial({
    color: 0x161616, roughness: 0.55, metalness: 0.45,
    clearcoat: 0.25, clearcoatRoughness: 0.25,
    envMapIntensity: 0.30,
  });
  const matClockBezel = new THREE.MeshPhysicalMaterial({
    color: 0x252525, roughness: 0.50, metalness: 0.55,
    clearcoat: 0.30, clearcoatRoughness: 0.20,
    envMapIntensity: 0.30,
  });

  /* Clock face canvas — Roman-numeral dial */
  const clockFaceCanvas = (() => {
    const c = makeCanvas(256, 256);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#f3ead2';
    ctx.beginPath(); ctx.arc(128, 128, 122, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(128, 128, 122, 0, Math.PI * 2); ctx.stroke();
    /* Hour ticks */
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 3;
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
      const r0 = 105, r1 = 118;
      ctx.beginPath();
      ctx.moveTo(128 + Math.cos(a) * r0, 128 + Math.sin(a) * r0);
      ctx.lineTo(128 + Math.cos(a) * r1, 128 + Math.sin(a) * r1);
      ctx.stroke();
    }
    /* Roman numerals at 12 / 3 / 6 / 9 */
    ctx.fillStyle = '#1a1a1a';
    ctx.font = 'bold 22px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('XII', 128, 50);
    ctx.fillText('III', 200, 128);
    ctx.fillText('VI',  128, 206);
    ctx.fillText('IX',  56,  128);
    /* Hands — 11:00 frozen */
    ctx.lineWidth = 6; ctx.lineCap = 'round';
    /* Hour hand → 11 */
    ctx.beginPath();
    ctx.moveTo(128, 128);
    const ha = (-Math.PI / 2) + (-1 / 6) * Math.PI;
    ctx.lineTo(128 + Math.cos(ha) * 60, 128 + Math.sin(ha) * 60);
    ctx.stroke();
    /* Minute hand → 12 */
    ctx.beginPath();
    ctx.moveTo(128, 128);
    ctx.lineTo(128, 50);
    ctx.stroke();
    /* Centre dot */
    ctx.fillStyle = '#1a1a1a';
    ctx.beginPath(); ctx.arc(128, 128, 8, 0, Math.PI * 2); ctx.fill();
    return c;
  })();
  const matClockFace = new THREE.MeshStandardMaterial({
    map: texFromCanvas(clockFaceCanvas, { repeat: [1, 1] }),
    roughness: 0.50, metalness: 0.0, side: THREE.DoubleSide,
  });

  /* Mount position on the kitchen-wall — centred ABOVE the corridor
   * entry door (door at x=[COR_X0, COR_X1], head y=COR_HEAD=2.05).
   * The clock arm extends INTO the LDK so both faces are visible from
   * the living + dining sides. */
  const CLK_X = (COR_X0 + COR_X1) / 2;   // 1.50 — centred above corridor
  const CLK_Y = 2.22;                     // above door head with clearance
  const CLK_Z = ROOM_D - 0.01;            // against kitchen-wall

  const clockGroup = new THREE.Group();

  /* Wall plate */
  const plate = new THREE.Mesh(
    new THREE.BoxGeometry(0.04, 0.060, 0.040),
    matClockBody
  );
  plate.position.set(0, 0, -0.020);
  clockGroup.add(plate);

  /* Horizontal bracket arm — extends INTO the room (-Z) */
  const armLen = 0.26;
  const arm = new THREE.Mesh(
    new THREE.BoxGeometry(0.012, 0.012, armLen),
    matClockBody
  );
  arm.position.set(0, 0, -armLen / 2 - 0.020);
  clockGroup.add(arm);

  /* Decorative finial on top of arm join (small fleur-de-lis-ish blob) */
  const finial = new THREE.Mesh(
    new THREE.ConeGeometry(0.018, 0.040, 12),
    matClockBody
  );
  finial.position.set(0, 0.045, -0.020);
  clockGroup.add(finial);

  /* Clock head — thick disc with two faces. Z-axis aligned (faces ±X) */
  const headR = 0.090;
  const headT = 0.040;
  const head = new THREE.Mesh(
    new THREE.CylinderGeometry(headR, headR, headT, 32),
    matClockBezel
  );
  head.rotation.z = Math.PI / 2;
  head.position.set(0, 0, -armLen - 0.020);
  clockGroup.add(head);

  /* East face (+X) */
  const faceE = new THREE.Mesh(
    new THREE.CircleGeometry(headR - 0.005, 32),
    matClockFace
  );
  faceE.rotation.y = Math.PI / 2;
  faceE.position.set(headT / 2 + 0.001, 0, -armLen - 0.020);
  clockGroup.add(faceE);

  /* West face (-X) */
  const faceW = new THREE.Mesh(
    new THREE.CircleGeometry(headR - 0.005, 32),
    matClockFace
  );
  faceW.rotation.y = -Math.PI / 2;
  faceW.position.set(-headT / 2 - 0.001, 0, -armLen - 0.020);
  clockGroup.add(faceW);

  /* Top hanger fleur — small loop above the head */
  const top = new THREE.Mesh(
    new THREE.CylinderGeometry(0.010, 0.010, 0.060, 12),
    matClockBody
  );
  top.position.set(0, headR + 0.030, -armLen - 0.020);
  clockGroup.add(top);

  clockGroup.position.set(CLK_X, CLK_Y, CLK_Z);
  scene.add(clockGroup);
}

  const lip = new THREE.Mesh(
    new THREE.CylinderGeometry(0.025, 0.030, 0.010, 14),
    matJarGlass
  );
  lip.position.set(cx, tableTopY + 0.065, cz);
  scene.add(lip);

  /* 5 short stems with small flower clusters at top */
  const stems = [
    [+0.000, +0.000, 0.085],
    [+0.012, -0.005, 0.075],
    [-0.010, -0.008, 0.080],
    [-0.005, +0.010, 0.090],
    [+0.008, +0.012, 0.072],
  ];
  for (let i = 0; i < stems.length; i++) {
    const [dx, dz, hgt] = stems[i];
    const stem = new THREE.Mesh(
      new THREE.CylinderGeometry(0.0010, 0.0014, hgt, 6),
      matStemSmall
    );
    stem.position.set(cx + dx, tableTopY + 0.065 + hgt / 2, cz + dz);
    scene.add(stem);

    /* Small flower head — alternate pink + white, 4-5 tiny petals */
    const headMat = (i % 2 === 0) ? matPetalPink : matPetalWhite;
    for (let p = 0; p < 5; p++) {
      const ang = (p / 5) * Math.PI * 2;
      const petalR = 0.006;
      const petal = new THREE.Mesh(
        new THREE.SphereGeometry(petalR, 8, 6),
        headMat
      );
      petal.position.set(
        cx + dx + Math.cos(ang) * 0.005,
        tableTopY + 0.065 + hgt + 0.001,
        cz + dz + Math.sin(ang) * 0.005,
      );
      scene.add(petal);
    }
    /* Tiny yellow center */
    const center = new THREE.Mesh(
      new THREE.SphereGeometry(0.0025, 8, 6),
      new THREE.MeshStandardMaterial({ color: 0xf2d878, roughness: 0.6 }),
    );
    center.position.set(cx + dx, tableTopY + 0.065 + hgt + 0.001, cz + dz);
    scene.add(center);
  }
}

/* === Floor-level wall outlets ===
 * White double-socket plates (~70 mm wide × 110 mm tall, ~10 mm proud).
 * Positioned at Japanese standard height (~250 mm above floor) on a
 * few visible LDK walls. */
{
  const matOutletPlate = new THREE.MeshPhysicalMaterial({
    color: 0xf6f1e2, roughness: 0.55, metalness: 0.0,
    clearcoat: 0.20, clearcoatRoughness: 0.30,
    envMapIntensity: 0.30,
  });
  const matSocket = new THREE.MeshStandardMaterial({
    color: 0x18181a, roughness: 0.85,
  });

  function addOutlet(wallAxis, x, y, z, facing) {
    /* wallAxis: 'z' for outlet on N or S wall (plate normal ±Z),
     *           'x' for outlet on E or W wall (plate normal ±X).
     * facing: +1 means plate faces +axis, -1 means -axis */
    const w = 0.070, h = 0.110, d = 0.010;
    const g = new THREE.Group();
    /* Plate */
    let plateGeom;
    if (wallAxis === 'z') {
      plateGeom = new THREE.BoxGeometry(w, h, d);
    } else {
      plateGeom = new THREE.BoxGeometry(d, h, w);
    }
    const plate = new THREE.Mesh(plateGeom, matOutletPlate);
    g.add(plate);
    /* Two socket recesses — small dark slits */
    for (const sy of [-0.015, +0.015]) {
      const slit1 = new THREE.Mesh(
        wallAxis === 'z'
          ? new THREE.BoxGeometry(0.005, 0.014, 0.003)
          : new THREE.BoxGeometry(0.003, 0.014, 0.005),
        matSocket
      );
      const slit2 = new THREE.Mesh(slit1.geometry, matSocket);
      if (wallAxis === 'z') {
        slit1.position.set(-0.008, sy, facing * (d / 2 + 0.001));
        slit2.position.set(+0.008, sy, facing * (d / 2 + 0.001));
      } else {
        slit1.position.set(facing * (d / 2 + 0.001), sy, -0.008);
        slit2.position.set(facing * (d / 2 + 0.001), sy, +0.008);
      }
      g.add(slit1, slit2);
    }
    g.position.set(x, y, z);
    scene.add(g);
  }

  /* Only ONE wall outlet is visible in photos — on the stairs-wall (west)
   * near the sofa, per living/a/01. Removed the other 3 invented ones. */
  addOutlet('x', 0.012, 0.25, 1.20, +1);
}

/* ====================================================================== */
/* HOTSPOTS — Phase 6 wires the BRAVIA hotspot.                           */
/* ====================================================================== */
const PRODUCTS = {
  'tv-001': {
    name: 'Sony BRAVIA FW-65BZ30J/BZ',
    meta: '65" 4K HDR business display · processor X1',
    spec: [
      ['Display width',    '146.2 cm (without stand)'],
      ['Display height',   '84.2 cm (without stand)'],
      ['Display depth',    '7.1 cm'],
      ['With stand',       '146.2 × 91.2 × 33.8 cm'],
      ['Active screen',    '142.8 × 80.4 cm (≈ 64.5")'],
      ['VESA mount',       '300 × 300 mm'],
      ['Power (operating)', '230 W'],
      ['Weight',           '21.6 kg (without stand)'],
    ],
    refUrl: 'https://www.sony.jp/bravia-biz/products/FW-BZ30J_BZ/spec.html',
    pos: TV_HOTSPOT,
  },
};

const hotspotsLayer = document.getElementById('hotspots-layer');
const hotspots = [];
for (const [id, p] of Object.entries(PRODUCTS)) {
  const btn = document.createElement('button');
  btn.className = 'hotspot';
  btn.setAttribute('data-id', id);
  btn.innerHTML = '<span class="hotspot__dot" aria-hidden="true"></span>';
  btn.addEventListener('click', () => openPopover(id));
  hotspotsLayer.appendChild(btn);
  hotspots.push({ id, btn, world: new THREE.Vector3().fromArray(p.pos) });
}

const popover = document.getElementById('popover');
const popoverScrim = document.getElementById('popover-scrim');
const pvName = document.getElementById('pv-name');
const pvMeta = document.getElementById('pv-meta');
const pvSpec = document.getElementById('pv-spec');
const pvRef  = document.getElementById('pv-ref');
const pvClose = document.getElementById('pv-close');

function openPopover(id) {
  const p = PRODUCTS[id];
  if (!p) return;
  pvName.textContent = p.name;
  pvMeta.textContent = p.meta;
  pvSpec.innerHTML = '';
  for (const [k, v] of p.spec) {
    const dt = document.createElement('dt'); dt.textContent = k;
    const dd = document.createElement('dd'); dd.textContent = v;
    pvSpec.append(dt, dd);
  }
  pvRef.href = p.refUrl;
  popover.classList.add('open');
  popoverScrim.classList.add('open');
}
function closePopover() {
  popover.classList.remove('open');
  popoverScrim.classList.remove('open');
}
pvClose.addEventListener('click', closePopover);
popoverScrim.addEventListener('click', closePopover);

/* ====================================================================== */
/* Postprocessing — recipe defaults (bloom strength 0.16, threshold 1.0). */
/* ====================================================================== */
const composer = new EffectComposer(renderer);
composer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
composer.setSize(window.innerWidth, window.innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  /* strength */ 0.16,
  /* radius   */ 0.70,
  /* threshold*/ 1.00
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ====================================================================== */
/* Render loop                                                             */
/* ====================================================================== */
function projectHotspots() {
  for (const h of hotspots) {
    const v = h.world.clone().project(camera);
    const x = (v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
    const visible = v.z < 1 && v.x > -1 && v.x < 1 && v.y > -1 && v.y < 1;
    h.btn.style.transform = `translate(${x - 22}px, ${y - 22}px)`;
    h.btn.style.display = visible ? 'inline-flex' : 'none';
  }
}

function tick() {
  composer.render();
  projectHotspots();
  requestAnimationFrame(tick);
}
tick();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
  bloom.setSize(window.innerWidth, window.innerHeight);
});
</script>
